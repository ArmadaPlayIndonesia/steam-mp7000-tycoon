<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Steam MP 7000 Tycoon</title>
<style>
  /* === RESET & BASE === */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }
  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: #f7f8fa;
    color: #1a1a2e;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* === BACKGROUND === */
  .bg {
    position: fixed;
    inset: 0;
    background: linear-gradient(160deg, #fefefe 0%, #f0f2f5 40%, #e8ebf0 100%);
    z-index: -2;
  }
  /* Awan tipis bergerak */
  .cloud {
    position: fixed;
    background: radial-gradient(ellipse at center, rgba(200,210,220,0.18) 0%, rgba(200,210,220,0) 70%);
    border-radius: 50%;
    z-index: -1;
    pointer-events: none;
  }
  .cloud.c1 { width: 320px; height: 120px; top: 12%; left: -320px; animation: cloudMove 42s linear infinite; }
  .cloud.c2 { width: 260px; height: 100px; top: 42%; left: -260px; animation: cloudMove 58s linear infinite 8s; }
  .cloud.c3 { width: 400px; height: 150px; top: 72%; left: -400px; animation: cloudMove 70s linear infinite 18s; }
  @keyframes cloudMove {
    from { transform: translateX(0); }
    to { transform: translateX(calc(100vw + 500px)); }
  }

  /* === CONTAINER === */
  .page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px 32px;
    position: relative;
    z-index: 1;
  }
  .wrap {
    width: 100%;
    max-width: 400px;
    animation: fadeUp 0.5s ease-out;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* === BRAND === */
  .brand {
    text-align: center;
    margin-bottom: 28px;
  }
  .logo {
    width: 68px;
    height: 68px;
    margin: 0 auto 12px;
    background: linear-gradient(135deg, #c0392b 0%, #a93226 100%);
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    box-shadow: 0 6px 20px rgba(192,57,43,0.22);
  }
  .brand h1 {
    font-size: 20px;
    font-weight: 700;
    color: #1a1a2e;
    letter-spacing: -0.3px;
  }
  .brand p {
    font-size: 13px;
    color: #7a8194;
    margin-top: 4px;
  }

  /* === CARD === */
  .card {
    background: #ffffff;
    border-radius: 18px;
    padding: 24px 20px;
    box-shadow: 0 4px 24px rgba(26,26,46,0.07), 0 1px 3px rgba(26,26,46,0.05);
    border: 1px solid rgba(26,26,46,0.04);
  }

  /* === TABS === */
  .tabs {
    display: flex;
    background: #f0f2f5;
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
  }
  .tab {
    flex: 1;
    padding: 10px;
    border: none;
    background: transparent;
    border-radius: 9px;
    font-size: 13px;
    font-weight: 600;
    color: #7a8194;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }
  .tab.active {
    background: #ffffff;
    color: #c0392b;
    box-shadow: 0 1px 4px rgba(26,26,46,0.08);
  }

  /* === FORM === */
  .field {
    margin-bottom: 16px;
  }
  .field label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: #4a5162;
    margin-bottom: 6px;
  }
  .field input {
    width: 100%;
    padding: 13px 14px;
    background: #f7f8fa;
    border: 1.5px solid #e2e5eb;
    border-radius: 11px;
    font-size: 15px;
    font-family: inherit;
    color: #1a1a2e;
    transition: border-color 0.2s, background 0.2s;
    outline: none;
  }
  .field input:focus {
    border-color: #c0392b;
    background: #ffffff;
  }
  .field input::placeholder {
    color: #b0b6c3;
  }
  .field input.err {
    border-color: #e74c3c;
    background: #fef5f5;
  }
  .err-msg {
    font-size: 12px;
    color: #e74c3c;
    margin-top: 5px;
    display: none;
    font-weight: 500;
  }
  .err-msg.show { display: block; }

  /* === BUTTON === */
  .btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn-primary {
    background: linear-gradient(135deg, #c0392b 0%, #a93226 100%);
    color: #ffffff;
    box-shadow: 0 4px 14px rgba(192,57,43,0.28);
  }
  .btn-primary:active:not(:disabled) {
    transform: scale(0.98);
    box-shadow: 0 2px 8px rgba(192,57,43,0.24);
  }
  .btn:disabled {
    opacity: 0.55;
    cursor: not-allowed;
    box-shadow: none;
  }
  .spin {
    width: 16px;
    height: 16px;
    border: 2px solid rgba(255,255,255,0.35);
    border-top-color: #ffffff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: none;
  }
  .btn.loading .spin { display: block; }
  .btn.loading .label { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .switch-text {
    text-align: center;
    font-size: 13px;
    color: #7a8194;
    margin-top: 16px;
  }
  .switch-text a {
    color: #c0392b;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
  }

  /* === FOOTER === */
  .footer {
    text-align: center;
    font-size: 11px;
    color: #b0b6c3;
    margin-top: 24px;
  }

  /* === ADMIN FAB === */
  .admin-fab {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: #ffffff;
    border: 1.5px solid #e2e5eb;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(26,26,46,0.12);
    z-index: 50;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .admin-fab:active {
    transform: scale(0.92);
  }

  /* === OVERLAY / MODAL === */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(26,26,46,0.5);
    backdrop-filter: blur(3px);
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    animation: fadeIn 0.2s;
  }
  .overlay.show { display: flex; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: #ffffff;
    border-radius: 18px;
    padding: 24px 20px;
    width: 100%;
    max-width: 360px;
    box-shadow: 0 20px 50px rgba(26,26,46,0.25);
    animation: modalIn 0.25s ease-out;
    position: relative;
  }
  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.94); }
    to { opacity: 1; transform: scale(1); }
  }
  .modal-x {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 30px;
    height: 30px;
    border: none;
    background: #f0f2f5;
    border-radius: 8px;
    font-size: 16px;
    color: #7a8194;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .modal h3 {
    font-size: 16px;
    font-weight: 700;
    color: #1a1a2e;
    margin-bottom: 18px;
    text-align: center;
  }

  /* === TOAST === */
  .toasts {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 200;
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: calc(100% - 32px);
    max-width: 380px;
    pointer-events: none;
  }
  .toast {
    padding: 13px 18px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 600;
    color: #ffffff;
    text-align: center;
    box-shadow: 0 6px 20px rgba(26,26,46,0.18);
    animation: toastIn 0.3s ease-out;
    pointer-events: auto;
  }
  .toast.ok { background: #27ae60; }
  .toast.no { background: #e74c3c; }
  @keyframes toastIn {
    from { opacity: 0; transform: translateY(-16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .toast.out { animation: toastOut 0.25s ease-in forwards; }
  @keyframes toastOut {
    to { opacity: 0; transform: translateY(-16px); }
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>

  <div class="page">
    <div class="wrap">
      <div class="brand">
        <div class="logo">🚗</div>
        <h1>Steam MP 7000</h1>
        <p>Cuci Mobil Jadi Sultan</p>
      </div>

      <div class="card">
        <div class="tabs">
          <button class="tab active" id="tabLogin" onclick="switchTab('login')">Masuk</button>
          <button class="tab" id="tabRegister" onclick="switchTab('register')">Daftar</button>
        </div>

        <!-- LOGIN -->
        <form id="formLogin" onsubmit="doLogin(event)">
          <div class="field">
            <label>Nomor HP</label>
            <input type="tel" id="loginPhone" placeholder="08xxxxxxxxxx" maxlength="13" inputmode="numeric" autocomplete="tel">
            <div class="err-msg" id="loginPhoneErr"></div>
          </div>
          <div class="field">
            <label>Password</label>
            <input type="password" id="loginPass" placeholder="Minimal 6 karakter" autocomplete="current-password">
            <div class="err-msg" id="loginPassErr"></div>
          </div>
          <button type="submit" class="btn btn-primary" id="btnLogin">
            <span class="spin"></span>
            <span class="label">Masuk</span>
          </button>
          <div class="switch-text">
            Belum punya akun? <a onclick="switchTab('register')">Daftar</a>
          </div>
        </form>

        <!-- REGISTER -->
        <form id="formRegister" style="display:none" onsubmit="doRegister(event)">
          <div class="field">
            <label>Nama</label>
            <input type="text" id="regName" placeholder="Nama kamu" maxlength="20" autocomplete="name">
            <div class="err-msg" id="regNameErr"></div>
          </div>
          <div class="field">
            <label>Nomor HP</label>
            <input type="tel" id="regPhone" placeholder="08xxxxxxxxxx" maxlength="13" inputmode="numeric" autocomplete="tel">
            <div class="err-msg" id="regPhoneErr"></div>
          </div>
          <div class="field">
            <label>Password</label>
            <input type="password" id="regPass" placeholder="Minimal 6 karakter" autocomplete="new-password">
            <div class="err-msg" id="regPassErr"></div>
          </div>
          <button type="submit" class="btn btn-primary" id="btnRegister">
            <span class="spin"></span>
            <span class="label">Daftar</span>
          </button>
          <div class="switch-text">
            Sudah punya akun? <a onclick="switchTab('login')">Masuk</a>
          </div>
        </form>
      </div>

      <div class="footer">© 2024 Steam MP 7000 Tycoon</div>
    </div>
  </div>

  <!-- Tombol Admin -->
  <div class="admin-fab" onclick="openAdmin()" title="Admin">🔐</div>

  <!-- Modal Admin -->
  <div class="overlay" id="adminOverlay">
    <div class="modal">
      <button class="modal-x" onclick="closeAdmin()">✕</button>
      <h3>Login Admin</h3>
      <form onsubmit="doAdminLogin(event)">
        <div class="field">
          <label>ID Admin</label>
          <input type="text" id="adminId" placeholder="ID Admin" inputmode="numeric">
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="adminPass" placeholder="Password admin">
        </div>
        <button type="submit" class="btn btn-primary" id="btnAdmin">
          <span class="spin"></span>
          <span class="label">Masuk Admin</span>
        </button>
      </form>
    </div>
  </div>

  <div class="toasts" id="toasts"></div>

  <script>
    // =============================================
    // KONFIGURASI
    // =============================================
    var API = 'https://script.google.com/macros/s/AKfycbyp04EZaT8vhi5gDmTeSw1ovDVDVh-cF-EkdcQohxu2ys3MwGrJm8yZg6A02qrPHujO6g/exec';

    // =============================================
    // HELPERS
    // =============================================
    function toast(msg, ok) {
      var box = document.getElementById('toasts');
      var el = document.createElement('div');
      el.className = 'toast ' + (ok ? 'ok' : 'no');
      el.textContent = msg;
      box.appendChild(el);
      setTimeout(function() {
        el.classList.add('out');
        setTimeout(function() { el.remove(); }, 250);
      }, 2800);
    }

    function getDevice() {
      var d = localStorage.getItem('smp7k_device');
      if (d) return d;
      d = 'dev_' + Math.random().toString(36).slice(2, 14) + Date.now().toString(36).slice(-4);
      localStorage.setItem('smp7k_device', d);
      return d;
    }

    async function api(action, data, token) {
      try {
        var body = { action: action, token: token || null, data: data || {} };
        var res = await fetch(API, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(body)
        });
        if (!res.ok) return { ok: false, message: 'Server tidak merespons' };
        var text = await res.text();
        try {
          return JSON.parse(text);
        } catch (e) {
          return { ok: false, message: 'Server tidak merespons' };
        }
      } catch (e) {
        return { ok: false, message: 'Koneksi gagal, coba lagi' };
      }
    }

    function validPhone(p) {
      return /^08\d{8,11}$/.test(p);
    }

    function showErr(id, msg) {
      var el = document.getElementById(id);
      if (!el) return;
      el.textContent = msg;
      el.classList.add('show');
      var input = el.parentElement.querySelector('input');
      if (input) input.classList.add('err');
    }

    function clearErr(id) {
      var el = document.getElementById(id);
      if (!el) return;
      el.textContent = '';
      el.classList.remove('show');
      var input = el.parentElement.querySelector('input');
      if (input) input.classList.remove('err');
    }

    function clearAll(formId) {
      var form = document.getElementById(formId);
      form.querySelectorAll('.err-msg').forEach(function(e) {
        e.textContent = '';
        e.classList.remove('show');
      });
      form.querySelectorAll('input').forEach(function(i) {
        i.classList.remove('err');
      });
    }

    function setLoading(btnId, on) {
      var b = document.getElementById(btnId);
      if (!b) return;
      b.disabled = on;
      if (on) b.classList.add('loading');
      else b.classList.remove('loading');
    }

    // =============================================
    // TAB
    // =============================================
    function switchTab(t) {
      var tl = document.getElementById('tabLogin');
      var tr = document.getElementById('tabRegister');
      var fl = document.getElementById('formLogin');
      var fr = document.getElementById('formRegister');
      if (t === 'login') {
        tl.classList.add('active');
        tr.classList.remove('active');
        fl.style.display = 'block';
        fr.style.display = 'none';
        setTimeout(function() { document.getElementById('loginPhone').focus(); }, 100);
      } else {
        tr.classList.add('active');
        tl.classList.remove('active');
        fr.style.display = 'block';
        fl.style.display = 'none';
        setTimeout(function() { document.getElementById('regName').focus(); }, 100);
      }
    }

    // =============================================
    // LOGIN PEMAIN
    // =============================================
    async function doLogin(e) {
      e.preventDefault();
      clearAll('formLogin');
      var phone = document.getElementById('loginPhone').value.trim().replace(/\s+/g, '');
      var pass = document.getElementById('loginPass').value;
      var ok = true;

      if (!validPhone(phone)) {
        showErr('loginPhoneErr', 'Nomor HP harus diawali 08, 10-13 digit');
        ok = false;
      }
      if (pass.length < 6) {
        showErr('loginPassErr', 'Password minimal 6 karakter');
        ok = false;
      }
      if (!ok) return;

      setLoading('btnLogin', true);
      var r = await api('login', { nomor: phone, password: pass, device_id: getDevice() });
      setLoading('btnLogin', false);

      if (r.ok && r.data && r.data.token) {
        localStorage.setItem('smp7k_token', r.data.token);
        if (r.data.user) localStorage.setItem('smp7k_user', JSON.stringify(r.data.user));
        toast('Login berhasil!', true);
        setTimeout(function() { window.location.href = 'dashboard.html'; }, 600);
      } else {
        toast(r.message || 'Login gagal', false);
      }
    }

    // =============================================
    // REGISTER
    // =============================================
    async function doRegister(e) {
      e.preventDefault();
      clearAll('formRegister');
      var name = document.getElementById('regName').value.trim();
      var phone = document.getElementById('regPhone').value.trim().replace(/\s+/g, '');
      var pass = document.getElementById('regPass').value;
      var ok = true;

      if (!name) {
        showErr('regNameErr', 'Nama tidak boleh kosong');
        ok = false;
      }
      if (!validPhone(phone)) {
        showErr('regPhoneErr', 'Nomor HP harus diawali 08, 10-13 digit');
        ok = false;
      }
      if (pass.length < 6) {
        showErr('regPassErr', 'Password minimal 6 karakter');
        ok = false;
      }
      if (!ok) return;

      setLoading('btnRegister', true);
      var r = await api('register', { nama: name, nomor: phone, password: pass, device_id: getDevice() });
      setLoading('btnRegister', false);

      if (r.ok && r.data && r.data.token) {
        localStorage.setItem('smp7k_token', r.data.token);
        if (r.data.user) localStorage.setItem('smp7k_user', JSON.stringify(r.data.user));
        toast('Registrasi berhasil!', true);
        setTimeout(function() { window.location.href = 'dashboard.html'; }, 600);
      } else if (r.ok && r.data && !r.data.token) {
        // Registrasi sukses tapi tidak ada token → auto login manual
        var lr = await api('login', { nomor: phone, password: pass, device_id: getDevice() });
        if (lr.ok && lr.data && lr.data.token) {
          localStorage.setItem('smp7k_token', lr.data.token);
          if (lr.data.user) localStorage.setItem('smp7k_user', JSON.stringify(lr.data.user));
          toast('Registrasi berhasil!', true);
          setTimeout(function() { window.location.href = 'dashboard.html'; }, 600);
        } else {
          toast('Registrasi sukses, silakan login', true);
          switchTab('login');
        }
      } else {
        var msg = r.message || 'Registrasi gagal';
        if (msg.toLowerCase().indexOf('sudah') !== -1 || msg.toLowerCase().indexOf('terdaftar') !== -1) {
          msg = 'Nomor sudah terdaftar, silakan login';
        }
        toast(msg, false);
      }
    }

    // =============================================
    // ADMIN
    // =============================================
    function openAdmin() {
      document.getElementById('adminOverlay').classList.add('show');
      setTimeout(function() { document.getElementById('adminId').focus(); }, 100);
    }
    function closeAdmin() {
      document.getElementById('adminOverlay').classList.remove('show');
      document.getElementById('adminId').value = '';
      document.getElementById('adminPass').value = '';
    }

    async function doAdminLogin(e) {
      e.preventDefault();
      var id = document.getElementById('adminId').value.trim();
      var pass = document.getElementById('adminPass').value;
      if (!id || !pass) {
        toast('Isi ID dan Password admin', false);
        return;
      }
      setLoading('btnAdmin', true);
      var r = await api('adminLogin', { admin_id: id, password: pass });
      setLoading('btnAdmin', false);

      if (r.ok && r.data && r.data.token) {
        localStorage.setItem('smp7k_token', r.data.token);
        localStorage.setItem('smp7k_admin', '1');
        toast('Login admin berhasil!', true);
        setTimeout(function() { window.location.href = 'dashboard.html?admin=1'; }, 600);
      } else {
        toast(r.message || 'Login admin gagal', false);
      }
    }

    // Tutup modal klik overlay & ESC
    document.getElementById('adminOverlay').addEventListener('click', function(e) {
      if (e.target === this) closeAdmin();
    });
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeAdmin();
    });

    // =============================================
    // AUTO REDIRECT
    // =============================================
    (function() {
      var t = localStorage.getItem('smp7k_token');
      var isAdmin = localStorage.getItem('smp7k_admin') === '1';
      if (t) {
        window.location.href = isAdmin ? 'dashboard.html?admin=1' : 'dashboard.html';
      }
    })();

    // Enter di input → submit form
    document.getElementById('loginPhone').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') { e.preventDefault(); document.getElementById('formLogin').requestSubmit(); }
    });
    document.getElementById('loginPass').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') { e.preventDefault(); document.getElementById('formLogin').requestSubmit(); }
    });
    document.getElementById('regPhone').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') { e.preventDefault(); document.getElementById('formRegister').requestSubmit(); }
    });
  </script>
</body>
</html>
