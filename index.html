<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Steam MP 7000 Tycoon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(145deg, #8B0000 0%, #C8102E 30%, #FAFAFA 70%, #FFFFFF 100%);
      background-attachment: fixed;
      overflow-x: hidden;
    }

    #app {
      position: relative;
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #hujanCanvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .login-wrap {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 420px;
      padding: 20px 18px 30px;
      margin: 0 auto;
    }

    .brand {
      text-align: center;
      margin-bottom: 22px;
    }

    .logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 12px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #E63946, #C8102E 60%, #8B0000);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 800;
      color: #F59E0B;
      text-shadow: 0 0 18px rgba(245, 158, 11, 0.8);
      box-shadow: 0 0 30px rgba(200, 16, 46, 0.6), 0 0 60px rgba(200, 16, 46, 0.35), inset 0 -4px 10px rgba(0,0,0,0.25);
      border: 3px solid #F59E0B;
      user-select: none;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      letter-spacing: 1px;
    }

    .logo:active {
      transform: scale(0.95);
    }

    .brand h1 {
      font-size: 22px;
      font-weight: 700;
      color: #FFFFFF;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6), 0 0 20px rgba(200, 16, 46, 0.5);
      letter-spacing: 0.5px;
    }

    .tagline {
      font-size: 11px;
      font-weight: 500;
      color: #F59E0B;
      text-shadow: 0 1px 4px rgba(0,0,0,0.5);
      margin-top: 4px;
      letter-spacing: 0.3px;
    }

    .kartu {
      background: #FAFAFA;
      border-radius: 18px;
      padding: 24px 20px 22px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.35), 0 2px 8px rgba(200,16,46,0.2);
      border: 1.5px solid rgba(245, 158, 11, 0.5);
    }

    .toggle {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      background: #F0F0F0;
      border-radius: 12px;
      padding: 4px;
    }

    .toggle button {
      flex: 1;
      padding: 10px 8px;
      border: none;
      border-radius: 10px;
      font-family: 'Poppins', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      background: transparent;
      color: #666;
    }

    .toggle button.aktif {
      background: linear-gradient(135deg, #C8102E, #8B0000);
      color: #FFFFFF;
      box-shadow: 0 3px 10px rgba(200,16,46,0.4);
    }

    .toggle button:not(.aktif):hover {
      background: #E5E5E5;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #DDD;
      border-radius: 10px;
      font-family: 'Poppins', sans-serif;
      font-size: 14px;
      background: #FFFFFF;
      color: #333;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }

    input:focus {
      border-color: #C8102E;
      box-shadow: 0 0 0 3px rgba(200, 16, 46, 0.12);
    }

    input::placeholder {
      color: #AAA;
      font-size: 13px;
    }

    .input-pw {
      position: relative;
      width: 100%;
    }

    .input-pw input {
      padding-right: 44px;
    }

    .toggle-pw {
      position: absolute;
      right: 4px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      padding: 8px 10px;
      line-height: 1;
      color: #888;
      transition: color 0.2s;
      user-select: none;
    }

    .toggle-pw:hover {
      color: #C8102E;
    }

    .btn-primary {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #C8102E 0%, #8B0000 100%);
      color: #FFFFFF;
      font-family: 'Poppins', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.25s, opacity 0.2s;
      box-shadow: 0 4px 14px rgba(200,16,46,0.4);
      margin-top: 4px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 48px;
    }

    .btn-primary:hover {
      box-shadow: 0 6px 22px rgba(200,16,46,0.55);
      transform: translateY(-1px);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-primary:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .btn-outline {
      padding: 11px 18px;
      border: 1.5px solid #CCC;
      border-radius: 10px;
      background: #FFFFFF;
      color: #555;
      font-family: 'Poppins', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-outline:hover {
      background: #F5F5F5;
      border-color: #AAA;
    }

    .pesan-error {
      margin-top: 14px;
      padding: 10px 14px;
      border-radius: 8px;
      background: #FEF2F2;
      border: 1.5px solid #DC2626;
      color: #DC2626;
      font-size: 12.5px;
      font-weight: 500;
      line-height: 1.4;
      display: none;
      word-break: break-word;
    }

    .pesan-error.tampil {
      display: block;
      animation: shakeIn 0.3s ease;
    }

    @keyframes shakeIn {
      0% { transform: translateX(-6px); opacity: 0; }
      25% { transform: translateX(5px); }
      50% { transform: translateX(-3px); }
      75% { transform: translateX(2px); }
      100% { transform: translateX(0); opacity: 1; }
    }

    .btn-musik {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 50;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid #F59E0B;
      background: rgba(200, 16, 46, 0.85);
      color: #FFFFFF;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(0,0,0,0.3);
      transition: transform 0.2s, background 0.2s;
      backdrop-filter: blur(4px);
      user-select: none;
    }

    .btn-musik:hover {
      transform: scale(1.08);
      background: rgba(200, 16, 46, 1);
    }

    .btn-musik.mati {
      background: rgba(120, 120, 120, 0.7);
      border-color: #999;
    }

    #toastBox {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 92%;
      max-width: 400px;
      pointer-events: none;
    }

    .toast {
      padding: 12px 18px;
      border-radius: 12px;
      color: #FFFFFF;
      font-size: 13.5px;
      font-weight: 600;
      text-align: center;
      box-shadow: 0 6px 24px rgba(0,0,0,0.3);
      animation: toastIn 0.35s cubic-bezier(0.21, 1.02, 0.73, 1);
      pointer-events: auto;
      word-break: break-word;
      line-height: 1.35;
    }

    .toast.sukses { background: #059669; }
    .toast.error { background: #DC2626; }
    .toast.warning { background: #D97706; }
    .toast.info { background: #2563EB; }

    @keyframes toastIn {
      0% { transform: translateY(-20px) scale(0.9); opacity: 0; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }

    .toast.keluar {
      animation: toastOut 0.3s ease forwards;
    }

    @keyframes toastOut {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-16px); opacity: 0; }
    }

    #modalAdmin {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(0,0,0,0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      backdrop-filter: blur(3px);
    }

    .modal {
      background: #FAFAFA;
      border-radius: 18px;
      padding: 26px 22px 22px;
      width: 100%;
      max-width: 340px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      border: 1.5px solid #F59E0B;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal h3 {
      text-align: center;
      color: #C8102E;
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .modal input {
      padding: 11px 14px;
      font-size: 14px;
    }

    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 6px;
    }

    .btn-row .btn-outline,
    .btn-row .btn-primary {
      flex: 1;
      min-height: 44px;
      font-size: 14px;
      padding: 11px;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2.5px solid rgba(255,255,255,0.3);
      border-top-color: #FFFFFF;
      border-radius: 50%;
      animation: spin 0.65s linear infinite;
      display: inline-block;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 380px) {
      .brand h1 { font-size: 19px; }
      .tagline { font-size: 10px; }
      .kartu { padding: 20px 16px 18px; }
      .logo { width: 68px; height: 68px; font-size: 24px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="hujanCanvas"></canvas>

    <div class="login-wrap">
      <div class="brand">
        <div class="logo" id="logoMP">MP</div>
        <h1>Steam MP 7000 Tycoon</h1>
        <div class="tagline">Jujur • Disiplin • Tanggung Jawab • Harga Mati</div>
      </div>

      <div class="kartu">
        <div class="toggle">
          <button data-mode="login" class="aktif" id="btnModeLogin">Masuk</button>
          <button data-mode="register" id="btnModeRegister">Daftar</button>
        </div>

        <form id="formLogin">
          <input id="loginNomor" placeholder="Nomor HP (08xxxxxxxxxx)" inputmode="numeric" autocomplete="off" maxlength="13">
          <div class="input-pw">
            <input id="loginPassword" type="password" placeholder="Password" autocomplete="off">
            <button type="button" class="toggle-pw" data-target="loginPassword">👁</button>
          </div>
          <button type="submit" class="btn-primary" id="btnLogin">MASUK</button>
        </form>

        <form id="formRegister" style="display:none">
          <input id="regNama" placeholder="Nama lengkap" autocomplete="off">
          <input id="regNomor" placeholder="Nomor HP (08xxxxxxxxxx)" inputmode="numeric" autocomplete="off" maxlength="13">
          <div class="input-pw">
            <input id="regPassword" type="password" placeholder="Password (min 6)" autocomplete="off">
            <button type="button" class="toggle-pw" data-target="regPassword">👁</button>
          </div>
          <button type="submit" class="btn-primary" id="btnRegister">DAFTAR</button>
        </form>

        <div id="pesanError" class="pesan-error"></div>
      </div>
    </div>

    <button id="btnMusik" class="btn-musik">🎵</button>

    <div id="toastBox"></div>

    <div id="modalAdmin" style="display:none">
      <div class="modal">
        <h3>🔐 Login Admin</h3>
        <input id="adminId" placeholder="Admin ID" autocomplete="off">
        <input id="adminPassword" type="password" placeholder="Password" autocomplete="off">
        <div class="btn-row">
          <button type="button" id="btnAdminBatal" class="btn-outline">Batal</button>
          <button type="button" id="btnAdminLogin" class="btn-primary">Masuk</button>
        </div>
      </div>
    </div>

    <audio id="musik" src="assets/musik-latar.mp3" loop preload="auto"></audio>
  </div>

  <script>
    (function() {
      'use strict';

      // ==================== KONFIGURASI ====================
      const BACKEND_URL = 'https://script.google.com/macros/s/AKfycbxANi_x0tXyAqC2a6L10p5Uu4TNGvhQV4UsI8k-7rogvuzSl_o4TuECRsDCOXDjcvIA/exec';
      const TOKEN = 'steam-mp-7000-2026';

      // ==================== DEVICE ID ====================
      function getDeviceId() {
        let dev = localStorage.getItem('smp7k_device');
        if (!dev) {
          const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
          let rand = '';
          for (let i = 0; i < 16; i++) {
            rand += chars.charAt(Math.floor(Math.random() * chars.length));
          }
          dev = 'dev_' + rand;
          localStorage.setItem('smp7k_device', dev);
        }
        return dev;
      }

      // ==================== FETCH HELPER ====================
      function apiCall(payload) {
        return fetch(BACKEND_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify(Object.assign({ token: TOKEN }, payload)),
          redirect: 'follow'
        })
        .then(function(r) { return r.text(); })
        .then(function(t) {
          try { return JSON.parse(t); }
          catch(e) { return { ok: false, pesan: 'Respons tidak valid' }; }
        })
        .catch(function(e) { return { ok: false, pesan: 'Gagal terhubung ke server' }; });
      }

      // ==================== TOAST ====================
      const toastBox = document.getElementById('toastBox');

      function toast(pesan, tipe) {
        tipe = tipe || 'info';
        const el = document.createElement('div');
        el.className = 'toast ' + tipe;
        el.textContent = pesan;
        toastBox.appendChild(el);
        setTimeout(function() {
          el.classList.add('keluar');
          setTimeout(function() { el.remove(); }, 350);
        }, 3000);
      }

      // ==================== ERROR MESSAGE ====================
      const pesanError = document.getElementById('pesanError');

      function tampilError(msg) {
        pesanError.textContent = msg;
        pesanError.classList.add('tampil');
      }

      function sembunyiError() {
        pesanError.textContent = '';
        pesanError.classList.remove('tampil');
      }

      // ==================== LOADING STATE ====================
      function setLoading(btn, loading) {
        if (!btn) return;
        if (loading) {
          btn.disabled = true;
          btn.dataset.original = btn.innerHTML;
          btn.innerHTML = '<span class="spinner"></span> Memproses...';
        } else {
          btn.disabled = false;
          if (btn.dataset.original) {
            btn.innerHTML = btn.dataset.original;
            delete btn.dataset.original;
          }
        }
      }

      // ==================== VALIDASI ====================
      function validasiNomor(nomor) {
        if (!/^08[0-9]{8,11}$/.test(nomor)) {
          return 'Nomor HP harus diawali 08, 10-13 digit';
        }
        return null;
      }

      function validasiPassword(pw) {
        if (pw.length < 6) {
          return 'Password minimal 6 karakter';
        }
        return null;
      }

      function validasiNama(nama) {
        if (!nama || nama.trim() === '') {
          return 'Nama tidak boleh kosong';
        }
        return null;
      }

      // ==================== FORMAT TANGGAL ====================
      function tanggalHariIni() {
        const d = new Date();
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return y + '-' + m + '-' + day;
      }

      function sekarangISO() {
        return new Date().toISOString();
      }

      function expiredISO() {
        const d = new Date();
        d.setDate(d.getDate() + 7);
        return d.toISOString();
      }

      // ==================== GENERATE TOKEN ====================
      function generateToken(length) {
        length = length || 32;
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
        let token = '';
        for (let i = 0; i < length; i++) {
          token += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        return token;
      }

      // ==================== GENERATE ID MP7000 ====================
      function generateIdMP(users) {
        let maxNum = 0;
        let prefix = 'MP7000-';
        for (let i = 0; i < users.length; i++) {
          const id = String(users[i].id || '');
          if (id.indexOf(prefix) === 0) {
            const num = parseInt(id.replace(prefix, ''), 10);
            if (!isNaN(num) && num > maxNum) maxNum = num;
          }
        }
        const next = maxNum + 1;
        return prefix + String(next).padStart(4, '0');
      }

      // ==================== SESSION & USER STORAGE ====================
      function simpanSession(token, userId, expiresAt) {
        localStorage.setItem('smp7k_session', JSON.stringify({
          token: token,
          user_id: userId,
          expires_at: expiresAt
        }));
      }

      function simpanUser(user) {
        localStorage.setItem('smp7k_user', JSON.stringify({
          id: user.id,
          nama: user.nama,
          nomor: user.nomor,
          saldo_koin: user.saldo_koin || 0,
          saldo_rupiah: user.saldo_rupiah || 0,
          kristal: user.kristal || 0,
          level: user.level || 1,
          cabang_aktif: user.cabang_aktif || 1,
          story_unlocked: user.story_unlocked || 0
        }));
      }

      // ==================== REGISTER ====================
      function prosesRegister(nama, nomor, password, btn) {
        const deviceId = getDeviceId();

        setLoading(btn, true);
        sembunyiError();

        apiCall({ action: 'baca', sheet: 'Users' })
          .then(function(res) {
            if (!res.ok || !res.data) {
              throw new Error(res.pesan || 'Gagal membaca data user');
            }

            const users = res.data;
            const nomorBersih = String(nomor).trim();

            // Cek nomor sudah terdaftar
            for (let i = 0; i < users.length; i++) {
              if (String(users[i].nomor).trim() === nomorBersih) {
                throw new Error('Nomor sudah terdaftar, silakan login');
              }
            }

            // Cek device sudah terdaftar
            for (let i = 0; i < users.length; i++) {
              if (String(users[i].device_id).trim() === deviceId) {
                throw new Error('Device ini sudah terdaftar');
              }
            }

            // Generate ID
            const newId = generateIdMP(users);

            const dataBaru = {
              id: newId,
              nama: nama.trim(),
              nomor: nomorBersih,
              password: password,
              device_id: deviceId,
              saldo_koin: 0,
              saldo_rupiah: 0,
              kristal: 0,
              level: 1,
              cabang_aktif: 1,
              status: 'aktif',
              last_login: '',
              last_sync: '',
              tanggal_daftar: tanggalHariIni(),
              story_unlocked: 0
            };

            return apiCall({ action: 'tulis', sheet: 'Users', data: dataBaru });
          })
          .then(function(res) {
            if (!res.ok) {
              throw new Error(res.pesan || 'Gagal mendaftar');
            }
            toast('Pendaftaran berhasil! Silakan login...', 'sukses');
            // Auto login
            setTimeout(function() {
              prosesLogin(nomor, password, document.getElementById('btnLogin'));
            }, 600);
          })
          .catch(function(err) {
            tampilError(err.message || 'Terjadi kesalahan');
            toast(err.message || 'Gagal mendaftar', 'error');
          })
          .finally(function() {
            setLoading(btn, false);
          });
      }

      // ==================== LOGIN ====================
      function prosesLogin(nomor, password, btn) {
        const deviceId = getDeviceId();

        setLoading(btn, true);
        sembunyiError();

        apiCall({ action: 'baca', sheet: 'Users' })
          .then(function(res) {
            if (!res.ok || !res.data) {
              throw new Error(res.pesan || 'Gagal membaca data user');
            }

            const users = res.data;
            const nomorBersih = String(nomor).trim();

            let userDitemukan = null;
            let nomorAda = false;
            let passwordSalah = false;
            let deviceSalah = false;
            let banned = false;

            for (let i = 0; i < users.length; i++) {
              const u = users[i];
              if (String(u.nomor).trim() === nomorBersih) {
                nomorAda = true;
                if (String(u.password) === String(password)) {
                  if (String(u.device_id).trim() === deviceId) {
                    if (String(u.status) !== 'banned') {
                      userDitemukan = u;
                      break;
                    } else {
                      banned = true;
                    }
                  } else {
                    deviceSalah = true;
                  }
                } else {
                  passwordSalah = true;
                }
              }
            }

            if (userDitemukan) {
              // Buat session
              const sessionToken = generateToken(32);
              const expiresAt = expiredISO();
              const now = sekarangISO();

              const sessionData = {
                token: sessionToken,
                user_id: userDitemukan.id,
                is_admin: false,
                expires_at: expiresAt,
                created_at: now
              };

              // Tulis session
              return apiCall({ action: 'tulis', sheet: 'Sessions', data: sessionData })
                .then(function(sessRes) {
                  if (!sessRes.ok) {
                    throw new Error('Gagal membuat session');
                  }

                  // Update last_login
                  return apiCall({
                    action: 'update',
                    sheet: 'Users',
                    row: userDitemukan._row,
                    data: { last_login: now }
                  });
                })
                .then(function(updRes) {
                  // Simpan localStorage
                  simpanSession(sessionToken, userDitemukan.id, expiresAt);
                  simpanUser(userDitemukan);

                  toast('Login berhasil! Mengalihkan...', 'sukses');
                  setTimeout(function() {
                    window.location.href = 'dashboard.html';
                  }, 700);
                });
            } else {
              // Tentukan error
              if (!nomorAda) throw new Error('Nomor belum terdaftar');
              if (banned) throw new Error('Akun diblokir');
              if (passwordSalah) throw new Error('Password salah');
              if (deviceSalah) throw new Error('Device tidak cocok');
              throw new Error('Login gagal, periksa kembali data Anda');
            }
          })
          .catch(function(err) {
            tampilError(err.message || 'Terjadi kesalahan');
            toast(err.message || 'Login gagal', 'error');
          })
          .finally(function() {
            setLoading(btn, false);
          });
      }

      // ==================== LOGIN ADMIN ====================
      function prosesLoginAdmin(adminId, password, btn) {
        setLoading(btn, true);

        apiCall({ action: 'baca', sheet: 'Users' })
          .then(function(res) {
            if (!res.ok || !res.data) {
              throw new Error(res.pesan || 'Gagal membaca data');
            }

            const users = res.data;
            let adminUser = null;

            for (let i = 0; i < users.length; i++) {
              if (String(users[i].id).trim() === String(adminId).trim()) {
                adminUser = users[i];
                break;
              }
            }

            if (!adminUser) {
              throw new Error('Admin ID atau password salah');
            }

            // Cek apakah id 1001 (admin)
            if (String(adminUser.id).trim() !== '1001') {
              throw new Error('Admin ID atau password salah');
            }

            if (String(adminUser.password) !== String(password)) {
              throw new Error('Admin ID atau password salah');
            }

            // Buat session admin
            const sessionToken = generateToken(32);
            const expiresAt = expiredISO();
            const now = sekarangISO();

            const sessionData = {
              token: sessionToken,
              user_id: '1001',
              is_admin: true,
              expires_at: expiresAt,
              created_at: now
            };

            return apiCall({ action: 'tulis', sheet: 'Sessions', data: sessionData })
              .then(function(sessRes) {
                if (!sessRes.ok) {
                  throw new Error('Gagal membuat session admin');
                }

                localStorage.setItem('smp7k_admin', JSON.stringify({
                  token: sessionToken,
                  user_id: '1001'
                }));

                toast('Login Admin berhasil!', 'sukses');
                setTimeout(function() {
                  window.location.href = 'dashboard.html?admin=1';
                }, 700);
              });
          })
          .catch(function(err) {
            toast(err.message || 'Login admin gagal', 'error');
          })
          .finally(function() {
            setLoading(btn, false);
          });
      }

      // ==================== INISIALISASI UI ====================
      document.addEventListener('DOMContentLoaded', function() {
        // ----- Device ID -----
        getDeviceId();

        // ----- Toggle Mode Login/Register -----
        const btnModeLogin = document.getElementById('btnModeLogin');
        const btnModeRegister = document.getElementById('btnModeRegister');
        const formLogin = document.getElementById('formLogin');
        const formRegister = document.getElementById('formRegister');

        btnModeLogin.addEventListener('click', function() {
          btnModeLogin.classList.add('aktif');
          btnModeRegister.classList.remove('aktif');
          formLogin.style.display = 'flex';
          formRegister.style.display = 'none';
          sembunyiError();
        });

        btnModeRegister.addEventListener('click', function() {
          btnModeRegister.classList.add('aktif');
          btnModeLogin.classList.remove('aktif');
          formLogin.style.display = 'none';
          formRegister.style.display = 'flex';
          sembunyiError();
        });

        // ----- Toggle Password Visibility -----
        document.querySelectorAll('.toggle-pw').forEach(function(btn) {
          btn.addEventListener('click', function() {
            const targetId = this.dataset.target;
            const input = document.getElementById(targetId);
            if (!input) return;
            if (input.type === 'password') {
              input.type = 'text';
              this.textContent = '🙈';
            } else {
              input.type = 'password';
              this.textContent = '👁';
            }
          });
        });

        // ----- Form Login Submit -----
        formLogin.addEventListener('submit', function(e) {
          e.preventDefault();
          const nomor = document.getElementById('loginNomor').value.trim();
          const password = document.getElementById('loginPassword').value;

          const errNomor = validasiNomor(nomor);
          if (errNomor) { tampilError(errNomor); toast(errNomor, 'warning'); return; }
          const errPw = validasiPassword(password);
          if (errPw) { tampilError(errPw); toast(errPw, 'warning'); return; }

          prosesLogin(nomor, password, document.getElementById('btnLogin'));
        });

        // ----- Form Register Submit -----
        formRegister.addEventListener('submit', function(e) {
          e.preventDefault();
          const nama = document.getElementById('regNama').value.trim();
          const nomor = document.getElementById('regNomor').value.trim();
          const password = document.getElementById('regPassword').value;

          const errNama = validasiNama(nama);
          if (errNama) { tampilError(errNama); toast(errNama, 'warning'); return; }
          const errNomor = validasiNomor(nomor);
          if (errNomor) { tampilError(errNomor); toast(errNomor, 'warning'); return; }
          const errPw = validasiPassword(password);
          if (errPw) { tampilError(errPw); toast(errPw, 'warning'); return; }

          prosesRegister(nama, nomor, password, document.getElementById('btnRegister'));
        });

        // ----- LOGO MP TAP 5x (ADMIN) -----
        const logoMP = document.getElementById('logoMP');
        let tapCount = 0;
        let tapTimer = null;
        const modalAdmin = document.getElementById('modalAdmin');

        logoMP.addEventListener('click', function() {
          tapCount++;
          if (tapTimer) clearTimeout(tapTimer);

          if (tapCount >= 5) {
            tapCount = 0;
            modalAdmin.style.display = 'flex';
            document.getElementById('adminId').value = '';
            document.getElementById('adminPassword').value = '';
            document.getElementById('adminId').focus();
          } else {
            tapTimer = setTimeout(function() {
              tapCount = 0;
            }, 3000);
          }
        });

        // ----- Modal Admin Batal -----
        document.getElementById('btnAdminBatal').addEventListener('click', function() {
          modalAdmin.style.display = 'none';
        });

        // ----- Modal Admin Login -----
        document.getElementById('btnAdminLogin').addEventListener('click', function() {
          const adminId = document.getElementById('adminId').value.trim();
          const password = document.getElementById('adminPassword').value;

          if (!adminId || !password) {
            toast('Isi Admin ID dan password', 'warning');
            return;
          }

          prosesLoginAdmin(adminId, password, this);
        });

        // ----- MODAL ADMIN: Enter key -----
        document.getElementById('adminPassword').addEventListener('keydown', function(e) {
          if (e.key === 'Enter') {
            e.preventDefault();
            document.getElementById('btnAdminLogin').click();
          }
        });

        // ----- MUSIK -----
        const musik = document.getElementById('musik');
        const btnMusik = document.getElementById('btnMusik');
        let musikTersedia = true;

        musik.addEventListener('error', function() {
          musikTersedia = false;
          btnMusik.style.display = 'none';
          console.log('File musik tidak ditemukan, tombol musik disembunyikan');
        });

        // Cek preferensi musik
        const musikPref = localStorage.getItem('smp7k_music');
        if (musikPref === 'off') {
          musik.pause();
          btnMusik.textContent = '🔇';
          btnMusik.classList.add('mati');
        }

        btnMusik.addEventListener('click', function() {
          if (!musikTersedia) return;

          if (musik.paused) {
            musik.play().then(function() {
              btnMusik.textContent = '🎵';
              btnMusik.classList.remove('mati');
              localStorage.setItem('smp7k_music', 'on');
            }).catch(function() {
              // Autoplay diblokir
              toast('Klik sekali lagi untuk memutar musik', 'info');
            });
          } else {
            musik.pause();
            btnMusik.textContent = '🔇';
            btnMusik.classList.add('mati');
            localStorage.setItem('smp7k_music', 'off');
          }
        });

        // Autoplay attempt
        if (musikPref !== 'off') {
          const playPromise = musik.play();
          if (playPromise !== undefined) {
            playPromise.then(function() {
              btnMusik.textContent = '🎵';
            }).catch(function() {
              // Autoplay diblokir browser, tunggu interaksi user
              console.log('Autoplay diblokir, menunggu interaksi user');
            });
          }
        }

        // ----- CANVAS HUJAN -----
        const canvas = document.getElementById('hujanCanvas');
        const ctx = canvas.getContext('2d');

        let W, H;
        let hujan = [];
        let riak = [];
        let awan = [];
        let kilatAlpha = 0;
        let lastKilat = Date.now();
        const KILAT_INTERVAL = 30000; // 30 detik

        function resizeCanvas() {
          W = canvas.width = window.innerWidth;
          H = canvas.height = window.innerHeight;
          initHujan();
          initAwan();
        }

        function initHujan() {
          hujan = [];
          const jumlah = Math.floor(W / 12);
          for (let i = 0; i < jumlah; i++) {
            hujan.push({
              x: Math.random() * W,
              y: Math.random() * H,
              panjang: 8 + Math.random() * 14,
              kecepatan: 0.8 + Math.random() * 1.2,
              opacity: 0.08 + Math.random() * 0.15,
              lebar: 0.5 + Math.random() * 1.2
            });
          }
        }

        function initAwan() {
          awan = [];
          const jumlahAwan = 5;
          for (let i = 0; i < jumlahAwan; i++) {
            awan.push({
              x: Math.random() * W,
              y: -40 + Math.random() * 100,
              lebar: 180 + Math.random() * 260,
              tinggi: 50 + Math.random() * 70,
              kecepatan: 0.08 + Math.random() * 0.15,
              opacity: 0.06 + Math.random() * 0.1
            });
          }
        }

        function gambarHujan() {
          ctx.clearRect(0, 0, W, H);

          // Awan gelap
          for (let i = 0; i < awan.length; i++) {
            const a = awan[i];
            ctx.beginPath();
            ctx.ellipse(a.x, a.y, a.lebar / 2, a.tinggi / 2, 0, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(40, 40, 50, ' + a.opacity + ')';
            ctx.fill();
            a.x += a.kecepatan;
            if (a.x - a.lebar > W) {
              a.x = -a.lebar;
              a.y = -40 + Math.random() * 100;
            }
          }

          // Kilat
          const now = Date.now();
          if (now - lastKilat > KILAT_INTERVAL) {
            kilatAlpha = 0.6;
            lastKilat = now;
            setTimeout(function() { kilatAlpha = 0; }, 200);
          }
          if (kilatAlpha > 0) {
            ctx.fillStyle = 'rgba(255, 255, 240, ' + kilatAlpha * 0.35 + ')';
            ctx.fillRect(0, 0, W, H);
            kilatAlpha *= 0.85;
          }

          // Titik air hujan
          for (let i = 0; i < hujan.length; i++) {
            const t = hujan[i];
            ctx.beginPath();
            ctx.moveTo(t.x, t.y);
            ctx.lineTo(t.x, t.y + t.panjang);
            ctx.strokeStyle = 'rgba(200, 210, 230, ' + t.opacity + ')';
            ctx.lineWidth = t.lebar;
            ctx.lineCap = 'round';
            ctx.stroke();

            t.y += t.kecepatan;

            if (t.y > H) {
              // Buat riak di bawah
              if (Math.random() < 0.3) {
                riak.push({
                  x: t.x,
                  y: H - 2 - Math.random() * 15,
                  radius: 1,
                  maxRadius: 8 + Math.random() * 14,
                  opacity: 0.15 + Math.random() * 0.1
                });
              }
              t.y = -t.panjang;
              t.x = Math.random() * W;
            }
          }

          // Riak air
          for (let i = riak.length - 1; i >= 0; i--) {
            const r = riak[i];
            ctx.beginPath();
            ctx.ellipse(r.x, r.y, r.radius, r.radius * 0.35, 0, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(180, 200, 220, ' + r.opacity + ')';
            ctx.lineWidth = 1.2;
            ctx.stroke();

            r.radius += 0.25;
            r.opacity -= 0.004;

            if (r.radius > r.maxRadius || r.opacity <= 0) {
              riak.splice(i, 1);
            }
          }
        }

        function loop() {
          gambarHujan();
          requestAnimationFrame(loop);
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        loop();

        // ----- CEK SESSION (jika sudah login, redirect) -----
        const session = localStorage.getItem('smp7k_session');
        const adminSession = localStorage.getItem('smp7k_admin');
        if (session || adminSession) {
          try {
            if (session) {
              const s = JSON.parse(session);
              if (s && s.expires_at && new Date(s.expires_at) > new Date()) {
                window.location.href = 'dashboard.html';
                return;
              }
            }
            if (adminSession) {
              const a = JSON.parse(adminSession);
              if (a && a.token) {
                window.location.href = 'dashboard.html?admin=1';
                return;
              }
            }
          } catch(e) {
            // ignore
          }
        }

        // ----- PING test (optional) -----
        console.log('Steam MP 7000 Tycoon v0.04 siap.');
        console.log('Device ID:', getDeviceId());
      });
    })();
  </script>
