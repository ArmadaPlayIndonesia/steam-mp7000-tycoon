<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Steam MP 7000 Tycoon — Masuk</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:'Poppins',sans-serif;background:#14121a}
#rainCanvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.overlay{position:fixed;inset:0;background:linear-gradient(160deg,rgba(200,16,46,.10),rgba(10,10,20,.60));z-index:1;pointer-events:none}
.container{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px 18px;overflow-y:auto}
.logo-wrap{text-align:center;margin-bottom:16px}
.logo-mp{width:78px;height:78px;border-radius:22px;background:linear-gradient(145deg,#C8102E,#8B0A1F);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;box-shadow:0 0 30px rgba(200,16,46,.7),0 0 70px rgba(200,16,46,.35);animation:glowPulse 3s ease-in-out infinite}
@keyframes glowPulse{0%,100%{box-shadow:0 0 30px rgba(200,16,46,.7),0 0 70px rgba(200,16,46,.35)}50%{box-shadow:0 0 45px rgba(200,16,46,.95),0 0 100px rgba(200,16,46,.5)}}
.logo-mp span{font-size:32px;font-weight:800;color:#FAFAFA;letter-spacing:-1px;text-shadow:0 2px 8px rgba(0,0,0,.4)}
.app-title{font-size:21px;font-weight:700;color:#FAFAFA;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.app-sub{font-size:11px;color:#F59E0B;font-weight:500;margin-top:4px;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.card{width:100%;max-width:400px;background:rgba(250,250,250,.97);border-radius:24px;padding:26px 22px 24px;box-shadow:0 18px 50px rgba(0,0,0,.35);animation:cardIn .55s cubic-bezier(.22,1,.36,1)}
@keyframes cardIn{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.toggle-row{display:flex;background:#f0ece6;border-radius:14px;padding:4px;margin-bottom:22px}
.toggle-btn{flex:1;padding:11px 0;border:none;background:transparent;font-family:'Poppins',sans-serif;font-size:14px;font-weight:600;color:#999;border-radius:11px;cursor:pointer;transition:all .3s}
.toggle-btn.active{color:#C8102E;background:#fff;box-shadow:0 2px 10px rgba(200,16,46,.15)}
.form-group{margin-bottom:15px}
.form-group label{display:block;font-size:12px;font-weight:600;color:#555;margin-bottom:6px}
.form-group input{width:100%;padding:13px 15px;border:1.8px solid #e8e3dc;border-radius:13px;font-family:'Poppins',sans-serif;font-size:14px;color:#2d2d2d;background:#fdfcfa;outline:none;transition:all .25s}
.form-group input:focus{border-color:#C8102E;background:#fff;box-shadow:0 0 0 4px rgba(200,16,46,.08)}
.err-msg{font-size:11px;color:#e74c3c;margin-top:4px;font-weight:500;display:none}
.err-msg.show{display:block}
.btn-primary{width:100%;padding:15px;border:none;border-radius:14px;background:linear-gradient(145deg,#C8102E,#A00D25);color:#FAFAFA;font-family:'Poppins',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:all .25s;box-shadow:0 6px 22px rgba(200,16,46,.35);margin-top:6px;position:relative}
.btn-primary:active{transform:scale(.97)}
.btn-primary:disabled{opacity:.6;cursor:not-allowed}
.btn-primary .spinner{display:none;width:18px;height:18px;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto}
.btn-primary.loading .btn-text{display:none}
.btn-primary.loading .spinner{display:block}
@keyframes spin{to{transform:rotate(360deg)}}
.admin-link{position:fixed;bottom:16px;right:16px;z-index:10;background:rgba(30,30,40,.75);backdrop-filter:blur(8px);color:#F59E0B;font-size:11px;font-weight:600;padding:9px 16px;border-radius:22px;border:1px solid rgba(245,158,11,.35);cursor:pointer;font-family:'Poppins',sans-serif}
.admin-link:active{transform:scale(.94);background:rgba(200,16,46,.85);color:#fff}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(3px)}
.modal-bg.show{display:flex}
.modal-card{width:100%;max-width:360px;background:#FAFAFA;border-radius:22px;padding:26px 22px;box-shadow:0 20px 60px rgba(0,0,0,.4);animation:cardIn .4s}
.modal-card h3{font-size:17px;font-weight:700;color:#C8102E;text-align:center;margin-bottom:18px}
.toast-container{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:200;width:90%;max-width:380px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{padding:13px 18px;border-radius:14px;font-size:13px;font-weight:600;color:#fff;box-shadow:0 8px 28px rgba(0,0,0,.3);animation:toastIn .4s;display:flex;align-items:center;gap:8px;pointer-events:auto}
.toast.sukses{background:linear-gradient(135deg,#27ae60,#1e8449)}
.toast.error{background:linear-gradient(135deg,#e74c3c,#c0392b)}
.toast.warning{background:linear-gradient(135deg,#f39c12,#d68910)}
.toast.info{background:linear-gradient(135deg,#2980b9,#1a5276)}
@keyframes toastIn{from{opacity:0;transform:translateY(-16px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
.toast.hilang{animation:toastOut .35s forwards}
@keyframes toastOut{to{opacity:0;transform:translateY(-12px) scale(.95)}}
</style>
</head>
<body>
<canvas id="rainCanvas"></canvas>
<div class="overlay"></div>

<div class="container">
  <div class="logo-wrap">
    <div class="logo-mp"><span>MP</span></div>
    <div class="app-title">Steam MP 7000 Tycoon</div>
    <div class="app-sub">Jujur • Disiplin • Tanggung Jawab • Harga Mati</div>
  </div>

  <div class="card">
    <div class="toggle-row">
      <button class="toggle-btn active" id="tabMasuk" onclick="switchTab('masuk')">Masuk</button>
      <button class="toggle-btn" id="tabDaftar" onclick="switchTab('daftar')">Daftar</button>
    </div>

    <div id="formMasuk">
      <div class="form-group">
        <label>Nomor HP</label>
        <input type="tel" id="loginNomor" placeholder="08xxxxxxxxxx" maxlength="13" inputmode="numeric">
        <div class="err-msg" id="errLoginNomor">Nomor HP tidak valid (08, 10-13 digit)</div>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="Minimal 6 karakter" maxlength="50">
        <div class="err-msg" id="errLoginPassword">Password minimal 6 karakter</div>
      </div>
      <button class="btn-primary" id="btnMasuk" onclick="prosesMasuk()">
        <span class="btn-text">Masuk</span>
        <div class="spinner"></div>
      </button>
    </div>

    <div id="formDaftar" style="display:none">
      <div class="form-group">
        <label>Nama Lengkap</label>
        <input type="text" id="regNama" placeholder="Nama kamu" maxlength="40">
        <div class="err-msg" id="errRegNama">Nama minimal 2 karakter</div>
      </div>
      <div class="form-group">
        <label>Nomor HP</label>
        <input type="tel" id="regNomor" placeholder="08xxxxxxxxxx" maxlength="13" inputmode="numeric">
        <div class="err-msg" id="errRegNomor">Nomor HP tidak valid (08, 10-13 digit)</div>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="regPassword" placeholder="Minimal 6 karakter" maxlength="50">
        <div class="err-msg" id="errRegPassword">Password minimal 6 karakter</div>
      </div>
      <button class="btn-primary" id="btnDaftar" onclick="prosesDaftar()">
        <span class="btn-text">Daftar Sekarang</span>
        <div class="spinner"></div>
      </button>
    </div>
  </div>
</div>

<button class="admin-link" onclick="bukaAdmin()">🔐 Admin</button>

<div class="modal-bg" id="modalAdmin">
  <div class="modal-card">
    <h3>🔐 Login Admin</h3>
    <div class="form-group">
      <label>Admin ID</label>
      <input type="text" id="adminId" placeholder="1001" value="1001">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="adminPassword" placeholder="••••••" value="123456">
    </div>
    <button class="btn-primary" id="btnAdminLogin" onclick="prosesAdminLogin()">
      <span class="btn-text">Masuk Admin</span>
      <div class="spinner"></div>
    </button>
    <button class="btn-primary" style="background:#999;margin-top:10px;box-shadow:none" onclick="tutupAdmin()">Batal</button>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
const BACKEND_URL='https://script.google.com/macros/s/AKfycbwzGuEXQt7aEOHNx-dlEja6FpQJVnUF9YIrv5F-lONXDChqWzRzyzGyMtHK32apPeVCbQ/exec';
const TOKEN='steam-mp-7000-2026';

function getDeviceId(){let d=localStorage.getItem('smp7k_device');if(!d){d='dev_'+Math.random().toString(36).substring(2,12)+Date.now().toString(36);localStorage.setItem('smp7k_device',d)}return d}

async function apiCall(payload){
  try{
    const res=await fetch(BACKEND_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(payload),redirect:'follow'});
    const text=await res.text();
    try{return JSON.parse(text)}catch(e){return{ok:false,pesan:'Respons tidak valid dari server'}}
  }catch(e){return{ok:false,pesan:'Gagal terhubung ke server'}}
}

function validNomor(n){return /^08\d{8,11}$/.test(n)}
function validPassword(p){return p&&p.length>=6}
function validNama(n){return n&&n.trim().length>=2}

function switchTab(t){
  const tm=document.getElementById('tabMasuk'),td=document.getElementById('tabDaftar');
  const fm=document.getElementById('formMasuk'),fd=document.getElementById('formDaftar');
  if(t==='masuk'){tm.classList.add('active');td.classList.remove('active');fm.style.display='block';fd.style.display='none'}
  else{td.classList.add('active');tm.classList.remove('active');fm.style.display='none';fd.style.display='block'}
}

function toast(p,t='info'){
  const c=document.getElementById('toastContainer');
  const el=document.createElement('div');
  el.className='toast '+t;
  const ic={sukses:'✅',error:'❌',warning:'⚠️',info:'ℹ️'};
  el.innerHTML='<span>'+(ic[t]||'ℹ️')+'</span><span>'+p+'</span>';
  c.appendChild(el);
  setTimeout(()=>{el.classList.add('hilang');setTimeout(()=>el.remove(),400)},3200);
}

function setLoading(id,on){
  const b=document.getElementById(id);if(!b)return;
  if(on){b.classList.add('loading');b.disabled=true}else{b.classList.remove('loading');b.disabled=false}
}

function showErr(id,s){const e=document.getElementById(id);if(e)e.classList.toggle('show',s)}

async function prosesMasuk(){
  const nomor=document.getElementById('loginNomor').value.trim();
  const password=document.getElementById('loginPassword').value;
  let ok=true;
  if(!validNomor(nomor)){showErr('errLoginNomor',true);ok=false}else showErr('errLoginNomor',false);
  if(!validPassword(password)){showErr('errLoginPassword',true);ok=false}else showErr('errLoginPassword',false);
  if(!ok)return;
  setLoading('btnMasuk',true);
  const res=await apiCall({action:'login',token:TOKEN,nomor,password,device_id:getDeviceId()});
  setLoading('btnMasuk',false);
  if(res.ok){
    localStorage.setItem('smp7k_session',res.data.session_token);
    localStorage.setItem('smp7k_user',JSON.stringify(res.data));
    toast('Login berhasil!','sukses');
    setTimeout(()=>location.href='dashboard.html',700);
  }else toast(res.pesan||'Login gagal','error');
}

async function prosesDaftar(){
  const nama=document.getElementById('regNama').value.trim();
  const nomor=document.getElementById('regNomor').value.trim();
  const password=document.getElementById('regPassword').value;
  let ok=true;
  if(!validNama(nama)){showErr('errRegNama',true);ok=false}else showErr('errRegNama',false);
  if(!validNomor(nomor)){showErr('errRegNomor',true);ok=false}else showErr('errRegNomor',false);
  if(!validPassword(password)){showErr('errRegPassword',true);ok=false}else showErr('errRegPassword',false);
  if(!ok)return;
  setLoading('btnDaftar',true);
  const device_id=getDeviceId();
  const res=await apiCall({action:'register',token:TOKEN,nama,nomor,password,device_id});
  if(!res.ok){setLoading('btnDaftar',false);toast(res.pesan||'Registrasi gagal','error');return}
  toast('Registrasi berhasil!','sukses');
  const lg=await apiCall({action:'login',token:TOKEN,nomor,password,device_id});
  setLoading('btnDaftar',false);
  if(lg.ok){
    localStorage.setItem('smp7k_session',lg.data.session_token);
    localStorage.setItem('smp7k_user',JSON.stringify(lg.data));
    setTimeout(()=>location.href='dashboard.html',700);
  }else{switchTab('masuk');toast('Silakan login manual','warning')}
}

function bukaAdmin(){document.getElementById('modalAdmin').classList.add('show')}
function tutupAdmin(){document.getElementById('modalAdmin').classList.remove('show')}

async function prosesAdminLogin(){
  const admin_id=document.getElementById('adminId').value.trim();
  const password=document.getElementById('adminPassword').value;
  if(!admin_id||!password){toast('Isi ID dan password admin','warning');return}
  setLoading('btnAdminLogin',true);
  const res=await apiCall({action:'adminLogin',token:TOKEN,admin_id,password});
  setLoading('btnAdminLogin',false);
  if(res.ok){
    localStorage.setItem('smp7k_admin',res.data.session_token);
    toast('Login admin berhasil!','sukses');
    setTimeout(()=>location.href='dashboard.html?admin=1',700);
  }else toast(res.pesan||'Login admin gagal','error');
}

document.getElementById('loginPassword').addEventListener('keydown',e=>{if(e.key==='Enter')prosesMasuk()});
document.getElementById('regPassword').addEventListener('keydown',e=>{if(e.key==='Enter')prosesDaftar()});
document.getElementById('adminPassword').addEventListener('keydown',e=>{if(e.key==='Enter')prosesAdminLogin()});
['loginNomor','regNomor'].forEach(id=>document.getElementById(id).addEventListener('input',function(){this.value=this.value.replace(/\D/g,'')}));

// ============ HUJAN ============
(function(){
  const cv=document.getElementById('rainCanvas'),ctx=cv.getContext('2d');
  let W,H;
  function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}
  rs();addEventListener('resize',rs);
  const drops=[],splashes=[],clouds=[],lightning={timer:0,active:false,alpha:0};
  for(let i=0;i<7;i++)clouds.push({x:Math.random()*1.2-.1,y:Math.random()*.3,w:.35+Math.random()*.4,h:.12+Math.random()*.1,speed:.008+Math.random()*.018,alpha:.08+Math.random()*.1});
  for(let i=0;i<110;i++)drops.push({x:Math.random()*1.1-.05,y:Math.random()*-1,len:.008+Math.random()*.022,speed:.25+Math.random()*.5,alpha:.12+Math.random()*.35,w:.4+Math.random()*1.2});
  function draw(){
    ctx.clearRect(0,0,W,H);
    clouds.forEach(c=>{
      c.x+=c.speed*.008;if(c.x>1.3)c.x=-.35;
      const gx=c.x*W,gy=c.y*H,gw=c.w*W,gh=c.h*H;
      const g=ctx.createRadialGradient(gx+gw/2,gy+gh/2,0,gx+gw/2,gy+gh/2,gw/2);
      g.addColorStop(0,'rgba(20,18,30,'+c.alpha+')');g.addColorStop(1,'rgba(20,18,30,0)');
      ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(gx+gw/2,gy+gh/2,gw/2,gh/2,0,0,Math.PI*2);ctx.fill();
    });
    lightning.timer++;
    if(lightning.timer>900&&Math.random()<.0008){lightning.active=true;lightning.alpha=.55;lightning.timer=0}
    if(lightning.active){lightning.alpha-=.025;if(lightning.alpha<=0){lightning.active=false;lightning.alpha=0}
      ctx.fillStyle='rgba(200,210,255,'+(lightning.alpha*.25)+')';ctx.fillRect(0,0,W,H)}
    drops.forEach(d=>{
      d.y+=d.speed*.008;
      if(d.y>1.05){
        if(splashes.length<40&&Math.random()<.35)splashes.push({x:d.x*W,y:H-6,r:2+Math.random()*6,maxR:12+Math.random()*18,alpha:.35,speed:.6+Math.random()*.8});
        d.y=-.05;d.x=Math.random()*1.1-.05;
      }
      const px=d.x*W,py=d.y*H,pl=d.len*H;
      ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px-1.5,py+pl);
      ctx.strokeStyle='rgba(180,200,230,'+d.alpha+')';ctx.lineWidth=d.w;ctx.lineCap='round';ctx.stroke();
    });
    for(let i=splashes.length-1;i>=0;i--){
      const s=splashes[i];s.r+=s.speed;s.alpha-=.008;
      if(s.alpha<=0||s.r>s.maxR){splashes.splice(i,1);continue}
      ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.strokeStyle='rgba(190,210,240,'+s.alpha+')';ctx.lineWidth=1.2;ctx.stroke();
    }
    requestAnimationFrame(draw);
  }
  draw();
})();
</script>
</body>
</html>
