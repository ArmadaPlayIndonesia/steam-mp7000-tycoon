<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Steam MP 7000 Tycoon - Login</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  body { background: #1a0505; color: #FAFAFA; position: relative; }

  #rainCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }

  .overlay-bg {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;
    background: radial-gradient(ellipse at 50% 30%, rgba(183,28,28,0.15) 0%, rgba(10,2,2,0.7) 60%, rgba(5,1,1,0.92) 100%);
    pointer-events: none;
  }

  .container {
    position: relative; z-index: 10;
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 20px;
    overflow-y: auto;
  }

  .logo-wrap { text-align: center; margin-bottom: 24px; animation: fadeDown 0.8s ease; }
  .logo-title {
    font-size: clamp(26px, 7vw, 40px);
    font-weight: 900;
    letter-spacing: 2px;
    color: #FAFAFA;
    text-shadow: 0 0 10px #B71C1C, 0 0 25px #B71C1C, 0 0 45px rgba(183,28,28,0.6), 0 0 80px rgba(183,28,28,0.3);
    animation: glowPulse 2.5s ease-in-out infinite;
  }
  .logo-sub {
    font-size: clamp(11px, 3vw, 14px);
    color: #D4AF37;
    letter-spacing: 6px;
    margin-top: 6px;
    text-transform: uppercase;
    opacity: 0.9;
  }
  .logo-steam {
    display: inline-block;
    margin-top: 10px;
    font-size: 28px;
    filter: drop-shadow(0 0 8px rgba(212,175,55,0.5));
  }
  @keyframes glowPulse {
    0%,100% { text-shadow: 0 0 10px #B71C1C, 0 0 25px #B71C1C, 0 0 45px rgba(183,28,28,0.6); }
    50% { text-shadow: 0 0 18px #B71C1C, 0 0 40px #B71C1C, 0 0 70px rgba(183,28,28,0.8), 0 0 110px rgba(183,28,28,0.4); }
  }
  @keyframes fadeDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }

  .card {
    width: 100%; max-width: 380px;
    background: rgba(20, 6, 6, 0.72);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(212,175,55,0.25);
    border-radius: 18px;
    padding: 22px 20px 26px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.06);
    animation: fadeUp 0.7s ease;
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

  .tabs { display: flex; background: rgba(0,0,0,0.35); border-radius: 12px; padding: 4px; margin-bottom: 20px; }
  .tab-btn {
    flex: 1; padding: 11px 0; border: none; background: transparent; color: #bbb;
    font-size: 14px; font-weight: 700; border-radius: 9px; cursor: pointer; transition: all 0.25s;
    letter-spacing: 0.5px;
  }
  .tab-btn.active { background: linear-gradient(135deg, #B71C1C, #8B0000); color: #FAFAFA; box-shadow: 0 4px 14px rgba(183,28,28,0.5); }

  .form-group { margin-bottom: 15px; }
  .form-group label { display: block; font-size: 12px; color: #D4AF37; margin-bottom: 6px; font-weight: 600; letter-spacing: 0.5px; }
  .form-group input {
    width: 100%; padding: 13px 14px;
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(212,175,55,0.2);
    border-radius: 11px; color: #FAFAFA; font-size: 15px;
    outline: none; transition: all 0.25s;
  }
  .form-group input:focus { border-color: #B71C1C; box-shadow: 0 0 0 3px rgba(183,28,28,0.2); }
  .form-group input::placeholder { color: #666; }

  .btn-primary {
    width: 100%; padding: 14px; margin-top: 6px;
    background: linear-gradient(135deg, #B71C1C, #7f0e0e);
    border: none; border-radius: 12px; color: #FAFAFA;
    font-size: 16px; font-weight: 800; letter-spacing: 1px; cursor: pointer;
    box-shadow: 0 6px 20px rgba(183,28,28,0.45);
    transition: all 0.2s; position: relative; overflow: hidden;
  }
  .btn-primary:active { transform: scale(0.97); }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
  .btn-primary .spinner {
    display: none; width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite;
    margin: 0 auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error-msg { color: #ff6b6b; font-size: 12.5px; margin-top: 10px; text-align: center; min-height: 16px; }

  .admin-btn {
    position: fixed; bottom: 14px; right: 14px; z-index: 30;
    background: rgba(20,6,6,0.75); border: 1px solid rgba(212,175,55,0.3);
    color: #D4AF37; font-size: 11px; font-weight: 700; letter-spacing: 1px;
    padding: 8px 14px; border-radius: 20px; cursor: pointer;
    backdrop-filter: blur(6px); transition: all 0.25s;
  }
  .admin-btn:active { transform: scale(0.94); background: rgba(183,28,28,0.4); }

  .toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px);
    background: rgba(20,6,6,0.95); border: 1px solid rgba(212,175,55,0.4);
    color: #FAFAFA; padding: 13px 20px; border-radius: 12px; font-size: 13.5px;
    z-index: 100; transition: transform 0.4s cubic-bezier(0.68,-0.55,0.27,1.55);
    max-width: 88%; text-align: center; box-shadow: 0 8px 30px rgba(0,0,0,0.6);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.err { border-color: rgba(255,80,80,0.6); }
  .toast.ok { border-color: rgba(80,200,120,0.6); }

  .hidden { display: none !important; }
  .admin-info { font-size: 12px; color: #D4AF37; text-align: center; margin-bottom: 14px; opacity: 0.8; }
</style>
</head>
<body>
<canvas id="rainCanvas"></canvas>
<div class="overlay-bg"></div>

<div class="container">
  <div class="logo-wrap">
    <div class="logo-title">STEAM MP 7000</div>
    <div class="logo-sub">Tycoon</div>
    <div class="logo-steam">🏍️💦</div>
  </div>

  <div class="card">
    <div class="tabs">
      <button class="tab-btn active" id="tabLogin" onclick="switchTab('login')">MASUK</button>
      <button class="tab-btn" id="tabRegister" onclick="switchTab('register')">DAFTAR</button>
    </div>

    <!-- LOGIN FORM -->
    <form id="formLogin" onsubmit="return doLogin(event)">
      <div class="form-group">
        <label>Nomor HP</label>
        <input type="tel" id="loginNomor" placeholder="08xxxxxxxxxx" inputmode="numeric" autocomplete="tel">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="Minimal 6 karakter" autocomplete="current-password">
      </div>
      <button type="submit" class="btn-primary" id="btnLogin">
        <span class="txt">MASUK</span>
        <span class="spinner"></span>
      </button>
      <div class="error-msg" id="loginError"></div>
    </form>

    <!-- REGISTER FORM -->
    <form id="formRegister" class="hidden" onsubmit="return doRegister(event)">
      <div class="form-group">
        <label>Nama Pemain</label>
        <input type="text" id="regNama" placeholder="Nama kamu" maxlength="20" autocomplete="name">
      </div>
      <div class="form-group">
        <label>Nomor HP</label>
        <input type="tel" id="regNomor" placeholder="08xxxxxxxxxx" inputmode="numeric" autocomplete="tel">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="regPassword" placeholder="Minimal 6 karakter" autocomplete="new-password">
      </div>
      <button type="submit" class="btn-primary" id="btnRegister">
        <span class="txt">DAFTAR</span>
        <span class="spinner"></span>
      </button>
      <div class="error-msg" id="registerError"></div>
    </form>

    <!-- ADMIN FORM -->
    <form id="formAdmin" class="hidden" onsubmit="return doAdminLogin(event)">
      <div class="admin-info">🔐 PANEL ADMIN</div>
      <div class="form-group">
        <label>Admin ID</label>
        <input type="text" id="adminId" placeholder="ID Admin" inputmode="numeric">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="adminPassword" placeholder="Password admin">
      </div>
      <button type="submit" class="btn-primary" id="btnAdmin">
        <span class="txt">MASUK ADMIN</span>
        <span class="spinner"></span>
      </button>
      <button type="button" class="btn-primary" style="background:linear-gradient(135deg,#444,#222);margin-top:8px;box-shadow:none;" onclick="switchTab('login')">KEMBALI</button>
      <div class="error-msg" id="adminError"></div>
    </form>
  </div>
</div>

<button class="admin-btn" id="adminToggle" onclick="switchTab('admin')">⚙ ADMIN</button>

<div class="toast" id="toast"></div>

<script>
/* ================= KONFIGURASI ================= */
const API_URL = "https://script.google.com/macros/s/AKfycbzQAwSp0RwqEcsFP0wwmoTTE5RbBJDcj4hH0vwrfKi-Bp2KAOCMulsw1dookIFmW8z_iA/exec";
const TOKEN_KEY = "smp7k_token";
const DEVICE_KEY = "smp7k_device";

/* ================= DEVICE ID ================= */
function getDeviceId() {
  let d = localStorage.getItem(DEVICE_KEY);
  if (!d) {
    d = "dev_" + Math.random().toString(36).substring(2, 12) + Date.now().toString(36);
    localStorage.setItem(DEVICE_KEY, d);
  }
  return d;
}

/* ================= TOAST ================= */
let toastTimer;
function toast(msg, type) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast show" + (type ? " " + type : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = "toast"; }, 3200);
}

/* ================= TAB SWITCH ================= */
function switchTab(tab) {
  document.getElementById("tabLogin").classList.toggle("active", tab === "login");
  document.getElementById("tabRegister").classList.toggle("active", tab === "register");
  document.getElementById("formLogin").classList.toggle("hidden", tab !== "login");
  document.getElementById("formRegister").classList.toggle("hidden", tab !== "register");
  document.getElementById("formAdmin").classList.toggle("hidden", tab !== "admin");
  document.getElementById("adminToggle").classList.toggle("hidden", tab === "admin");
  document.getElementById("loginError").textContent = "";
  document.getElementById("registerError").textContent = "";
  document.getElementById("adminError").textContent = "";
}

/* ================= VALIDASI ================= */
function validNomor(n) {
  return /^08[0-9]{8,11}$/.test(n);
}
function validPassword(p) {
  return p && p.length >= 6;
}

/* ================= FETCH HELPER ================= */
async function apiCall(action, data, token) {
  try {
    const body = { action, token: token || null, data: data || {} };
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    let json;
    try { json = await res.json(); }
    catch (e) { throw new Error("Server tidak merespons"); }
    if (json && json.ok === false && json.message && /token/i.test(json.message) && /expired|invalid|kadaluarsa/i.test(json.message)) {
      localStorage.removeItem(TOKEN_KEY);
    }
    return json;
  } catch (err) {
    return { ok: false, message: err.message === "Server tidak merespons" ? "Server tidak merespons" : "Gagal terhubung ke server" };
  }
}

/* ================= LOADING ================= */
function setLoading(btnId, on) {
  const btn = document.getElementById(btnId);
  if (!btn) return;
  btn.disabled = on;
  const txt = btn.querySelector(".txt");
  const sp = btn.querySelector(".spinner");
  if (txt) txt.style.display = on ? "none" : "inline";
  if (sp) sp.style.display = on ? "block" : "none";
}

/* ================= LOGIN ================= */
async function doLogin(e) {
  e.preventDefault();
  const nomor = document.getElementById("loginNomor").value.trim();
  const password = document.getElementById("loginPassword").value;
  const errEl = document.getElementById("loginError");
  errEl.textContent = "";

  if (!validNomor(nomor)) { errEl.textContent = "Nomor HP wajib 08, 10-13 digit angka"; return false; }
  if (!validPassword(password)) { errEl.textContent = "Password minimal 6 karakter"; return false; }

  setLoading("btnLogin", true);
  const res = await apiCall("login", { nomor, password, device_id: getDeviceId() });
  setLoading("btnLogin", false);

  if (res && res.ok) {
    if (res.data && res.data.token) {
      localStorage.setItem(TOKEN_KEY, res.data.token);
      toast("Login berhasil! Selamat datang 🏍️", "ok");
      setTimeout(() => { window.location.href = "dashboard.html"; }, 700);
    } else {
      errEl.textContent = "Token tidak diterima dari server";
    }
  } else {
    errEl.textContent = (res && res.message) ? res.message : "Login gagal";
  }
  return false;
}

/* ================= REGISTER ================= */
async function doRegister(e) {
  e.preventDefault();
  const nama = document.getElementById("regNama").value.trim();
  const nomor = document.getElementById("regNomor").value.trim();
  const password = document.getElementById("regPassword").value;
  const errEl = document.getElementById("registerError");
  errEl.textContent = "";

  if (!nama || nama.length < 2) { errEl.textContent = "Nama minimal 2 karakter"; return false; }
  if (!validNomor(nomor)) { errEl.textContent = "Nomor HP wajib 08, 10-13 digit angka"; return false; }
  if (!validPassword(password)) { errEl.textContent = "Password minimal 6 karakter"; return false; }

  setLoading("btnRegister", true);
  const res = await apiCall("register", { nama, nomor, password, device_id: getDeviceId() });
  setLoading("btnRegister", false);

  if (res && res.ok) {
    toast("Registrasi sukses! Login otomatis...", "ok");
    // Auto login
    setTimeout(async () => {
      setLoading("btnRegister", true);
      const loginRes = await apiCall("login", { nomor, password, device_id: getDeviceId() });
      setLoading("btnRegister", false);
      if (loginRes && loginRes.ok && loginRes.data && loginRes.data.token) {
        localStorage.setItem(TOKEN_KEY, loginRes.data.token);
        setTimeout(() => { window.location.href = "dashboard.html"; }, 500);
      } else {
        errEl.textContent = "Registrasi sukses, silakan login manual.";
        switchTab("login");
        document.getElementById("loginNomor").value = nomor;
      }
    }, 800);
  } else {
    errEl.textContent = (res && res.message) ? res.message : "Registrasi gagal";
  }
  return false;
}

/* ================= ADMIN LOGIN ================= */
async function doAdminLogin(e) {
  e.preventDefault();
  const admin_id = document.getElementById("adminId").value.trim();
  const password = document.getElementById("adminPassword").value;
  const errEl = document.getElementById("adminError");
  errEl.textContent = "";

  if (!admin_id) { errEl.textContent = "Admin ID wajib diisi"; return false; }
  if (!password) { errEl.textContent = "Password wajib diisi"; return false; }

  setLoading("btnAdmin", true);
  const res = await apiCall("adminLogin", { admin_id, password });
  setLoading("btnAdmin", false);

  if (res && res.ok) {
    if (res.data && res.data.token) {
      localStorage.setItem(TOKEN_KEY, res.data.token);
      toast("Login admin berhasil 🔐", "ok");
      setTimeout(() => { window.location.href = "dashboard.html?admin=1"; }, 700);
    } else {
      errEl.textContent = "Token admin tidak diterima";
    }
  } else {
    errEl.textContent = (res && res.message) ? res.message : "Login admin gagal";
  }
  return false;
}

/* ================= HUJAN ANIMASI ================= */
(function initRain() {
  const canvas = document.getElementById("rainCanvas");
  const ctx = canvas.getContext("2d");
  let W, H;
  let drops = [];
  let ripples = [];
  let clouds = [];
  let lastLightning = 0;
  let lightningAlpha = 0;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    const count = Math.min(140, Math.floor((W * H) / 14000));
    drops = [];
    for (let i = 0; i < count; i++) {
      drops.push({
        x: Math.random() * W,
        y: Math.random() * H,
        len: 10 + Math.random() * 18,
        speed: 1.8 + Math.random() * 2.4,
        opacity: 0.12 + Math.random() * 0.25,
        thickness: 0.6 + Math.random() * 0.9
      });
    }
    clouds = [];
    for (let i = 0; i < 6; i++) {
      clouds.push({
        x: Math.random() * W,
        y: Math.random() * H * 0.35,
        r: 90 + Math.random() * 160,
        speed: 0.08 + Math.random() * 0.18,
        alpha: 0.04 + Math.random() * 0.07
      });
    }
  }
  resize();
  window.addEventListener("resize", resize);

  function spawnRipple(x, y) {
    ripples.push({ x, y, r: 1, maxR: 12 + Math.random() * 14, alpha: 0.35, speed: 0.55 });
    if (ripples.length > 40) ripples.shift();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // Awan gelap bergerak
    for (const c of clouds) {
      c.x += c.speed;
      if (c.x - c.r > W) c.x = -c.r;
      const g = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, c.r);
      g.addColorStop(0, "rgba(30,10,10," + c.alpha + ")");
      g.addColorStop(1, "rgba(30,10,10,0)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
      ctx.fill();
    }

    // Kilat jarang
    const now = Date.now();
    if (now - lastLightning > 12000 && Math.random() < 0.0025) {
      lastLightning = now;
      lightningAlpha = 0.4 + Math.random() * 0.3;
    }
    if (lightningAlpha > 0) {
      ctx.fillStyle = "rgba(255,230,230," + lightningAlpha + ")";
      ctx.fillRect(0, 0, W, H);
      lightningAlpha -= 0.02;
      if (lightningAlpha < 0) lightningAlpha = 0;
    }

    // Hujan
    ctx.lineCap = "round";
    for (const d of drops) {
      d.y += d.speed;
      d.x += d.speed * 0.08;
      if (d.y > H) {
        spawnRipple(d.x, H - Math.random() * 6);
        d.y = -d.len;
        d.x = Math.random() * W;
      }
      if (d.x > W) d.x = 0;
      const grad = ctx.createLinearGradient(d.x, d.y, d.x, d.y + d.len);
      grad.addColorStop(0, "rgba(200,220,255,0)");
      grad.addColorStop(1, "rgba(200,220,255," + d.opacity + ")");
      ctx.strokeStyle = grad;
      ctx.lineWidth = d.thickness;
      ctx.beginPath();
      ctx.moveTo(d.x, d.y);
      ctx.lineTo(d.x, d.y + d.len);
      ctx.stroke();
    }

    // Riak air
    for (let i = ripples.length - 1; i >= 0; i--) {
      const rp = ripples[i];
      rp.r += rp.speed;
      rp.alpha -= 0.006;
      if (rp.alpha <= 0 || rp.r > rp.maxR) { ripples.splice(i, 1); continue; }
      ctx.strokeStyle = "rgba(180,200,230," + rp.alpha + ")";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.ellipse(rp.x, rp.y, rp.r, rp.r * 0.35, 0, 0, Math.PI * 2);
      ctx.stroke();
    }

    requestAnimationFrame(draw);
  }
  draw();
})();

/* ================= INIT ================= */
(function init() {
  getDeviceId();
  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.get("admin") === "1") switchTab("admin");
  const existing = localStorage.getItem(TOKEN_KEY);
  if (existing) {
    // Sudah login, tapi tetap tampil form (user bisa logout dari dashboard)
  }
})();
</script>
</body>
</html>
