<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Steam MP 7000 Tycoon — Masuk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ==================== RESET & BASE ==================== */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  height: 100%;
  overflow-x: hidden;
}

body {
  font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
  background: linear-gradient(160deg, #FAFAFA 0%, #F5E6E9 40%, #E8C8CE 100%);
  color: #2A0A10;
  min-height: 100vh;
  position: relative;
}

/* ==================== CANVAS HUJAN ==================== */
#hujanCanvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
  display: block;
}

/* ==================== APP WRAPPER ==================== */
#app {
  position: relative;
  z-index: 1;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px 16px;
}

/* ==================== LOGIN WRAP ==================== */
.login-wrap {
  width: 100%;
  max-width: 400px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 22px;
  animation: fadeInUp 0.7s ease;
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ==================== BRAND ==================== */
.brand {
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}

.logo {
  width: 76px;
  height: 76px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #E63946 0%, #C8102E 45%, #8B0000 100%);
  color: #FFF;
  font-size: 28px;
  font-weight: 700;
  letter-spacing: 1px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  user-select: none;
  box-shadow:
    0 0 20px rgba(200, 16, 46, 0.55),
    0 0 40px rgba(200, 16, 46, 0.25),
    inset 0 -3px 8px rgba(0,0,0,0.25);
  position: relative;
  transition: transform 0.2s ease, box-shadow 0.3s ease;
  -webkit-tap-highlight-color: transparent;
}

.logo:active { transform: scale(0.94); }

.logo::after {
  content: '';
  position: absolute;
  inset: -3px;
  border-radius: 50%;
  border: 2px solid rgba(245, 158, 11, 0.5);
  animation: pulseGlow 2.8s ease-in-out infinite;
}

@keyframes pulseGlow {
  0%, 100% { opacity: 0.4; transform: scale(1); }
  50% { opacity: 0.9; transform: scale(1.06); }
}

.brand h1 {
  font-size: 20px;
  font-weight: 700;
  color: #8B0000;
  letter-spacing: 0.3px;
  margin-top: 2px;
}

.brand .tagline {
  font-size: 11px;
  font-weight: 500;
  color: #7A4A52;
  letter-spacing: 0.4px;
  line-height: 1.5;
}

/* ==================== KARTU ==================== */
.kartu {
  width: 100%;
  background: #FFFFFF;
  border-radius: 18px;
  padding: 22px 20px 24px;
  box-shadow:
    0 10px 30px rgba(139, 0, 0, 0.12),
    0 2px 8px rgba(0,0,0,0.06);
  border: 1px solid rgba(200, 16, 46, 0.08);
  position: relative;
}

/* ==================== TOGGLE ==================== */
.toggle {
  display: flex;
  background: #F5EDEE;
  border-radius: 12px;
  padding: 4px;
  margin-bottom: 20px;
  gap: 4px;
}

.toggle button {
  flex: 1;
  padding: 10px 8px;
  border: none;
  background: transparent;
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  color: #8A6A6F;
  border-radius: 9px;
  cursor: pointer;
  transition: all 0.25s ease;
}

.toggle button.aktif {
  background: linear-gradient(135deg, #C8102E, #8B0000);
  color: #FFF;
  box-shadow: 0 3px 10px rgba(200, 16, 46, 0.35);
}

/* ==================== FORM ==================== */
.form-mode {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.input-wrap {
  position: relative;
  width: 100%;
}

.form-mode input {
  width: 100%;
  padding: 13px 44px 13px 14px;
  border: 1.5px solid #E0D2D5;
  border-radius: 11px;
  font-family: inherit;
  font-size: 14px;
  color: #2A0A10;
  background: #FCFAFB;
  transition: border-color 0.2s, box-shadow 0.2s;
  outline: none;
}

.form-mode input::placeholder {
  color: #A88E93;
  font-size: 13px;
}

.form-mode input:focus {
  border-color: #C8102E;
  box-shadow: 0 0 0 3px rgba(200, 16, 46, 0.12);
  background: #FFF;
}

/* Tombol show/hide password */
.toggle-pass {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  background: transparent;
  border: none;
  font-size: 16px;
  color: #A88E93;
  cursor: pointer;
  padding: 4px;
  line-height: 1;
  width: 30px;
  height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 6px;
}

.toggle-pass:active { background: #F0E6E8; }

/* Tombol submit */
.form-mode button[type="submit"] {
  margin-top: 6px;
  padding: 14px;
  border: none;
  border-radius: 12px;
  background: linear-gradient(135deg, #C8102E 0%, #8B0000 100%);
  color: #FFF;
  font-family: inherit;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.5px;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.25s, opacity 0.2s;
  box-shadow: 0 6px 18px rgba(200, 16, 46, 0.35);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 48px;
}

.form-mode button[type="submit"]:active {
  transform: translateY(1px) scale(0.99);
  box-shadow: 0 3px 10px rgba(200, 16, 46, 0.3);
}

.form-mode button[type="submit"]:disabled {
  opacity: 0.7;
  cursor: not-allowed;
}

/* Spinner di tombol */
.spinner {
  width: 18px;
  height: 18px;
  border: 2.5px solid rgba(255,255,255,0.4);
  border-top-color: #FFF;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  display: inline-block;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* ==================== PESAN ERROR ==================== */
.pesan-error {
  margin-top: 14px;
  padding: 0;
  font-size: 12.5px;
  color: #DC2626;
  background: #FEF2F2;
  border: 1px solid #FECACA;
  border-radius: 9px;
  line-height: 1.5;
  max-height: 0;
  overflow: hidden;
  opacity: 0;
  transition: all 0.3s ease;
}

.pesan-error.tampil {
  padding: 10px 13px;
  max-height: 200px;
  opacity: 1;
}

/* ==================== TOAST ==================== */
#toastBox {
  position: fixed;
  top: 16px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 9999;
  display: flex;
  flex-direction: column;
  gap: 8px;
  width: calc(100% - 32px);
  max-width: 380px;
  pointer-events: none;
}

.toast {
  padding: 12px 16px;
  border-radius: 11px;
  color: #FFF;
  font-size: 13px;
  font-weight: 500;
  line-height: 1.45;
  box-shadow: 0 8px 22px rgba(0,0,0,0.18);
  animation: toastIn 0.35s ease;
  pointer-events: auto;
  word-break: break-word;
}

.toast.sukses { background: #059669; }
.toast.error  { background: #DC2626; }
.toast.warning{ background: #D97706; }
.toast.info   { background: #2563EB; }

.toast.hilang {
  animation: toastOut 0.3s ease forwards;
}

@keyframes toastIn {
  from { opacity: 0; transform: translateY(-14px) scale(0.96); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes toastOut {
  to { opacity: 0; transform: translateY(-14px) scale(0.96); }
}

/* ==================== MODAL ADMIN ==================== */
#modalAdmin {
  position: fixed;
  inset: 0;
  z-index: 9998;
  background: rgba(42, 10, 16, 0.55);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  animation: fadeIn 0.25s ease;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.modal-admin-box {
  width: 100%;
  max-width: 340px;
  background: #FFF;
  border-radius: 16px;
  padding: 22px 20px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.35);
  animation: fadeInUp 0.35s ease;
}

.modal-admin-box h3 {
  font-size: 16px;
  font-weight: 700;
  color: #8B0000;
  margin-bottom: 4px;
  text-align: center;
}

.modal-admin-box p {
  font-size: 11.5px;
  color: #8A6A6F;
  text-align: center;
  margin-bottom: 16px;
}

.modal-admin-box .form-mode input {
  margin-bottom: 10px;
}

.modal-admin-box .btn-row {
  display: flex;
  gap: 8px;
  margin-top: 6px;
}

.modal-admin-box .btn-row button {
  flex: 1;
  padding: 12px;
  border-radius: 11px;
  font-family: inherit;
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: transform 0.15s, opacity 0.2s;
}

.modal-admin-box .btn-row button:active { transform: scale(0.98); }

.btn-batal {
  background: #F0E6E8;
  color: #6B4046;
}

.btn-admin-masuk {
  background: linear-gradient(135deg, #C8102E, #8B0000);
  color: #FFF;
  box-shadow: 0 4px 14px rgba(200, 16, 46, 0.3);
}

/* ==================== RESPONSIVE ==================== */
@media (max-width: 360px) {
  .brand h1 { font-size: 18px; }
  .brand .tagline { font-size: 10px; }
  .logo { width: 68px; height: 68px; font-size: 24px; }
  .kartu { padding: 18px 16px 20px; }
}

/* ==================== LOADING OVERLAY ==================== */
#loadingOverlay {
  position: fixed;
  inset: 0;
  z-index: 9997;
  background: rgba(250, 250, 250, 0.55);
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
  display: none;
  align-items: center;
  justify-content: center;
}

#loadingOverlay.tampil { display: flex; }

.loading-box {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

.loading-spinner-besar {
  width: 44px;
  height: 44px;
  border: 4px solid rgba(200, 16, 46, 0.18);
  border-top-color: #C8102E;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

.loading-box span {
  font-size: 12.5px;
  font-weight: 500;
  color: #8B0000;
}
</style>
</head>
<body>

<!-- ==================== CANVAS HUJAN ==================== -->
<canvas id="hujanCanvas"></canvas>

<!-- ==================== APP ==================== -->
<div id="app">
  <div class="login-wrap">

    <!-- BRAND -->
    <div class="brand">
      <div class="logo" id="logoMP">MP</div>
      <h1>Steam MP 7000 Tycoon</h1>
      <div class="tagline">Jujur • Disiplin • Tanggung Jawab • Harga Mati</div>
    </div>

    <!-- KARTU FORM -->
    <div class="kartu">
      <div class="toggle">
        <button data-mode="login" class="aktif" type="button">Masuk</button>
        <button data-mode="register" type="button">Daftar</button>
      </div>

      <!-- FORM LOGIN -->
      <form id="formLogin" class="form-mode" autocomplete="off">
        <div class="input-wrap">
          <input id="loginNomor" placeholder="Nomor HP (08xxxxxxxxxx)" inputmode="numeric" maxlength="13">
        </div>
        <div class="input-wrap">
          <input id="loginPassword" type="password" placeholder="Password" maxlength="32">
          <button type="button" class="toggle-pass" data-target="loginPassword">👁️</button>
        </div>
        <button type="submit" id="btnLogin">MASUK</button>
      </form>

      <!-- FORM REGISTER -->
      <form id="formRegister" class="form-mode" style="display:none" autocomplete="off">
        <div class="input-wrap">
          <input id="regNama" placeholder="Nama lengkap" maxlength="40">
        </div>
        <div class="input-wrap">
          <input id="regNomor" placeholder="Nomor HP (08xxxxxxxxxx)" inputmode="numeric" maxlength="13">
        </div>
        <div class="input-wrap">
          <input id="regPassword" type="password" placeholder="Password (min 6)" maxlength="32">
          <button type="button" class="toggle-pass" data-target="regPassword">👁️</button>
        </div>
        <button type="submit" id="btnRegister">DAFTAR</button>
      </form>

      <!-- PESAN ERROR -->
      <div id="pesanError" class="pesan-error"></div>
    </div>
  </div>
</div>

<!-- ==================== TOAST ==================== -->
<div id="toastBox"></div>

<!-- ==================== MODAL ADMIN ==================== -->
<div id="modalAdmin" style="display:none">
  <div class="modal-admin-box">
    <h3>🔐 Admin Panel</h3>
    <p>Khusus administrator MP 7000</p>
    <form id="formAdmin" class="form-mode" autocomplete="off">
      <input id="adminId" placeholder="Admin ID" maxlength="20">
      <div class="input-wrap">
        <input id="adminPassword" type="password" placeholder="Password admin" maxlength="32">
        <button type="button" class="toggle-pass" data-target="adminPassword">👁️</button>
      </div>
    </form>
    <div class="btn-row">
      <button type="button" class="btn-batal" id="btnAdminBatal">Batal</button>
      <button type="button" class="btn-admin-masuk" id="btnAdminMasuk">Masuk</button>
    </div>
  </div>
</div>

<!-- ==================== LOADING OVERLAY ==================== -->
<div id="loadingOverlay">
  <div class="loading-box">
    <div class="loading-spinner-besar"></div>
    <span id="loadingText">Memproses...</span>
  </div>
</div>

<script>
/* ============================================================
 *  STEAM MP 7000 TYCOON — LOGIN & REGISTER (index.html)
 * ============================================================
 *  Anti-CORS: Content-Type: text/plain, body JSON.stringify
 *  Backend: Google Apps Script Web App
 * ============================================================ */

// ==================== KONFIGURASI ====================
var BACKEND_URL = 'https://script.google.com/macros/s/AKfycbwxMCkgrLAx3AAjYvl7tTCGd9nLOXGvULixAlgh5QiCPFqHkXE7ir1L_km9cIvQPNoO3g/exec';
var TOKEN = 'steam-mp-7000-2026';

// ==================== STATE ====================
var deviceId = '';
var modeForm = 'login'; // 'login' | 'register'
var tapLogoTimes = [];
var sedangProses = false;

// ==================== UTIL: FETCH KE BACKEND ====================
/**
 * Kirim request ke backend Apps Script.
 * Content-Type WAJIB text/plain (anti-CORS).
 * Return Promise<object>.
 */
function apiCall(action, payload) {
  payload = payload || {};
  payload.action = action;
  payload.token = TOKEN;

  return fetch(BACKEND_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify(payload),
    redirect: 'follow'
  })
  .then(function(r) { return r.text(); })
  .then(function(t) {
    try { return JSON.parse(t); }
    catch (e) { return { ok: false, pesan: 'Respons tidak valid' }; }
  })
  .catch(function(e) {
    return { ok: false, pesan: 'Gagal terhubung ke server' };
  });
}

// ==================== UTIL: DEVICE ID ====================
/**
 * Ambil device_id dari localStorage.
 * Kalau belum ada, generate baru: "dev_" + 16 karakter acak.
 */
function getDeviceId() {
  var key = 'smp7k_device';
  var id = localStorage.getItem(key);
  if (!id) {
    var chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
    var rand = '';
    for (var i = 0; i < 16; i++) {
      rand += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    id = 'dev_' + rand;
    localStorage.setItem(key, id);
  }
  return id;
}

// ==================== UTIL: SESSION TOKEN ====================
/**
 * Generate session token 32 karakter (huruf + angka).
 */
function generateSessionToken() {
  var chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
  var token = '';
  for (var i = 0; i < 32; i++) {
    token += chars.charAt(Math.floor(Math.random() * chars.length));
  }
  return token;
}

// ==================== UTIL: TANGGAL ====================
/**
 * Tanggal hari ini format YYYY-MM-DD.
 */
function tanggalHariIni() {
  var d = new Date();
  var y = d.getFullYear();
  var m = String(d.getMonth() + 1).padStart(2, '0');
  var t = String(d.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + t;
}

/**
 * Waktu sekarang ISO string.
 */
function waktuSekarang() {
  return new Date().toISOString();
}

/**
 * Waktu sekarang + 7 hari (ISO string).
 */
function waktuExpired() {
  var d = new Date();
  d.setDate(d.getDate() + 7);
  return d.toISOString();
}

// ==================== UTIL: TOAST ====================
/**
 * Tampilkan toast notifikasi.
 * jenis: 'sukses' | 'error' | 'warning' | 'info'
 */
function tampilToast(pesan, jenis) {
  jenis = jenis || 'info';
  var box = document.getElementById('toastBox');
  var el = document.createElement('div');
  el.className = 'toast ' + jenis;
  el.textContent = pesan;
  box.appendChild(el);

  setTimeout(function() {
    el.classList.add('hilang');
    setTimeout(function() {
      if (el.parentNode) el.parentNode.removeChild(el);
    }, 320);
  }, 3000);
}

// ==================== UTIL: PESAN ERROR ====================
function tampilError(pesan) {
  var el = document.getElementById('pesanError');
  el.textContent = pesan;
  el.classList.add('tampil');
}

function sembunyikanError() {
  var el = document.getElementById('pesanError');
  el.classList.remove('tampil');
  el.textContent = '';
}

// ==================== UTIL: LOADING ====================
function tampilLoading(teks) {
  document.getElementById('loadingText').textContent = teks || 'Memproses...';
  document.getElementById('loadingOverlay').classList.add('tampil');
}

function sembunyikanLoading() {
  document.getElementById('loadingOverlay').classList.remove('tampil');
}

/**
 * Set tombol jadi loading state.
 */
function setTombolLoading(btn, loading) {
  if (!btn) return;
  if (loading) {
    btn.disabled = true;
    btn.dataset.originalText = btn.innerHTML;
    btn.innerHTML = '<span class="spinner"></span> Memproses...';
  } else {
    btn.disabled = false;
    if (btn.dataset.originalText) {
      btn.innerHTML = btn.dataset.originalText;
    }
  }
}

// ==================== VALIDASI ====================
/**
 * Validasi nomor HP: hanya angka, diawali "08", panjang 10-13 digit.
 */
function validasiNomor(nomor) {
  if (!nomor) return { ok: false, pesan: 'Nomor HP harus diisi' };
  var n = String(nomor).trim();
  if (!/^\d+$/.test(n)) return { ok: false, pesan: 'Nomor HP hanya boleh angka' };
  if (!n.startsWith('08')) return { ok: false, pesan: 'Nomor HP harus diawali 08, 10-13 digit' };
  if (n.length < 10 || n.length > 13) return { ok: false, pesan: 'Nomor HP harus diawali 08, 10-13 digit' };
  return { ok: true };
}

/**
 * Validasi password: min 6 karakter.
 */
function validasiPassword(pass) {
  if (!pass) return { ok: false, pesan: 'Password harus diisi' };
  if (String(pass).length < 6) return { ok: false, pesan: 'Password minimal 6 karakter' };
  return { ok: true };
}

/**
 * Validasi nama: tidak kosong.
 */
function validasiNama(nama) {
  if (!nama || String(nama).trim() === '') return { ok: false, pesan: 'Nama tidak boleh kosong' };
  return { ok: true };
}

// ==================== TOGGLE MODE LOGIN/REGISTER ====================
function setMode(mode) {
  modeForm = mode;
  var tabs = document.querySelectorAll('.toggle button');
  tabs.forEach(function(b) {
    if (b.dataset.mode === mode) b.classList.add('aktif');
    else b.classList.remove('aktif');
  });
  document.getElementById('formLogin').style.display = (mode === 'login') ? 'flex' : 'none';
  document.getElementById('formRegister').style.display = (mode === 'register') ? 'flex' : 'none';
  sembunyikanError();
}

// ==================== TOGGLE PASSWORD ====================
function setupTogglePass() {
  document.querySelectorAll('.toggle-pass').forEach(function(btn) {
    btn.addEventListener('click', function(e) {
      e.preventDefault();
      var targetId = btn.dataset.target;
      var input = document.getElementById(targetId);
      if (!input) return;
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '🙈';
      } else {
        input.type = 'password';
        btn.textContent = '👁️';
      }
    });
  });
}

// ==================== ALUR REGISTER ====================
/**
 * Cari ID terakhir dengan prefix "MP7000-", increment.
 * Kalau belum ada, mulai dari MP7000-0001.
 */
function generateIdBaru(users) {
  var maxNum = 0;
  var prefix = 'MP7000-';
  users.forEach(function(u) {
    var id = String(u.id || '');
    if (id.indexOf(prefix) === 0) {
      var num = parseInt(id.substring(prefix.length), 10);
      if (!isNaN(num) && num > maxNum) maxNum = num;
    }
  });
  var next = maxNum + 1;
  return prefix + String(next).padStart(4, '0');
}

function prosesRegister(nama, nomor, password) {
  if (sedangProses) return;
  sedangProses = true;

  // Validasi lokal
  var vNama = validasiNama(nama);
  if (!vNama.ok) { tampilError(vNama.pesan); tampilToast(vNama.pesan, 'error'); sedangProses = false; return; }
  var vNomor = validasiNomor(nomor);
  if (!vNomor.ok) { tampilError(vNomor.pesan); tampilToast(vNomor.pesan, 'error'); sedangProses = false; return; }
  var vPass = validasiPassword(password);

// ==================== ALUR LOGIN ADMIN ====================
function prosesLoginAdmin(adminId, password) {
  if (sedangProses) return;
  sedangProses = true;

  if (!adminId || String(adminId).trim() === '') {
    tampilToast('Admin ID harus diisi', 'error');
    sedangProses = false;
    return;
  }
  if (!password || String(password).length < 1) {
    tampilToast('Password admin harus diisi', 'error');
    sedangProses = false;
    return;
  }

  var btn = document.getElementById('btnAdminMasuk');
  setTombolLoading(btn, true);

  apiCall('bacaSatu', { sheet: 'Users', kolom: 'id', nilai: String(adminId).trim() })
    .then(function(res) {
      if (!res.ok) throw new Error(res.pesan || 'Gagal membaca data');
      var u = res.data;
      if (!u) throw new Error('Admin ID atau password salah');
      if (String(u.password) !== String(password)) throw new Error('Admin ID atau password salah');
      if (String(u.status).toLowerCase() === 'banned') throw new Error('Akun admin dibanned');

      // Generate session admin
      var sessionToken = generateSessionToken();
      var expiresAt = waktuExpired();
      var createdAt = waktuSekarang();

      var sessionData = {
        token: sessionToken,
        user_id: String(u.id),
        is_admin: true,
        expires_at: expiresAt,
        created_at: createdAt
      };

      return apiCall('tulis', { sheet: 'Sessions', data: sessionData })
        .then(function(res2) {
          if (!res2.ok) throw new Error(res2.pesan || 'Gagal membuat session');
          return { token: sessionToken, user: u };
        });
    })
    .then(function(hasil) {
      localStorage.setItem('smp7k_admin', JSON.stringify({
        token: hasil.token,
        user_id: String(hasil.user.id)
      }));
      tampilToast('Login admin berhasil!', 'sukses');
      setTimeout(function() {
        window.location.href = 'dashboard.html?admin=1';
      }, 600);
    })
    .catch(function(err) {
      tampilToast(err.message, 'error');
    })
    .finally(function() {
      sedangProses = false;
      setTombolLoading(btn, false);
    });
}

  document.querySelectorAll('.toggle button').forEach(function(btn) {

    var nomor = document.getElementById('loginNomor').value.trim();
    var password = document.getElementById('loginPassword').value;

  });

  // Form register submit
  document.getElementById('formRegister').addEventListener('submit', function(e) {
    e.preventDefault();
    var nama = document.getElementById('regNama').value.trim();

    prosesRegister(nama, nomor, password);

  ['loginNomor', 'regNomor'].forEach(function(id) {

    var pass = document.getElementById('adminPassword').value;
    prosesLoginAdmin(id, pass);
  });

  // Modal admin: enter di form
  document.getElementById('formAdmin').addEventListener('submit', function(e) {
    e.preventDefault();
    var id = document.getElementById('adminId').value.trim();
    var pass = document.getElementById('adminPassword').value;
    prosesLoginAdmin(id, pass);

      this.style.display = 'none';
    }
  });

  setupTapLogo();

  setupTogglePass();
}

// ==================== ANIMASI HUJAN (CANVAS) ====================
function initHujan() {
  var canvas = document.getElementById('hujanCanvas');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0;
  var tetes = [];
  var riak = [];
  var awan = [];
  var kilatTerakhir = 0;
  var kilatDurasi = 0;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // Inisialisasi tetes hujan
  function initTetes() {
    tetes = [];
    var jumlah = Math.floor(W / 8);
    if (jumlah < 60) jumlah = 60;
    if (jumlah > 160) jumlah = 160;
    for (var i = 0; i < jumlah; i++) {
      tetes.push({
        x: Math.random() * W,
        y: Math.random() * H,
        len: 8 + Math.random() * 14,
        speed: 1.2 + Math.random() * 1.8,
        opacity: 0.08 + Math.random() * 0.14,
        tebal: Math.random() < 0.15 ? 1.6 : 1
      });
    }
  }

  // Inisialisasi riak air di bawah
  function initRiak() {
    riak = [];
    for (var i = 0; i < 6; i++) {
      riak.push({
        x: Math.random() * W,
        y: H - 40 - Math.random() * 80,
        r: 0,
        maxR: 20 + Math.random() * 30,
        speed: 0.25 + Math.random() * 0.35,
        opacity: 0.18
      });
    }
  }

  // Inisialisasi awan gelap
  function initAwan() {
    awan = [];
    for (var i = 0; i < 5; i++) {
      awan.push({
        x: Math.random() * W,
        y: 20 + Math.random() * (H * 0.28),
        r: 80 + Math.random() * 110,
        speed: 0.06 + Math.random() * 0.12,
        opacity: 0.05 + Math.random() * 0.07
      });
    }
  }

  initTetes();
  initRiak();
  initAwan();

  function gambar() {
    ctx.clearRect(0, 0, W, H);

    // 1. Awan gelap
    awan.forEach(function(a) {
      var grad = ctx.createRadialGradient(a.x, a.y, 0, a.x, a.y, a.r);
      grad.addColorStop(0, 'rgba(60, 20, 30, ' + a.opacity + ')');
      grad.addColorStop(1, 'rgba(60, 20, 30, 0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(a.x, a.y, a.r, 0, Math.PI * 2);
      ctx.fill();

      a.x += a.speed;
      if (a.x - a.r > W) {
        a.x = -a.r;
        a.y = 20 + Math.random() * (H * 0.28);
      }
    });

    // 2. Tetes hujan
    tetes.forEach(function(t) {
      ctx.strokeStyle = 'rgba(200, 16, 46, ' + t.opacity + ')';
      ctx.lineWidth = t.tebal;
      ctx.beginPath();
      ctx.moveTo(t.x, t.y);
      ctx.lineTo(t.x, t.y + t.len);
      ctx.stroke();

      t.y += t.speed;
      if (t.y > H) {
        t.y = -t.len;
        t.x = Math.random() * W;
      }
    });

    // 3. Riak air di bawah
    riak.forEach(function(r) {
      if (r.r > 0) {
        ctx.strokeStyle = 'rgba(200, 16, 46, ' + (r.opacity * (1 - r.r / r.maxR)) + ')';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
        ctx.stroke();
      }
      r.r += r.speed;
      if (r.r > r.maxR) {
        r.r = 0;
        r.x = Math.random() * W;
        r.y = H - 40 - Math.random() * 80;
      }
    });

    // 4. Kilat sangat jarang
    var now = Date.now();
    if (kilatDurasi > 0) {
      ctx.fillStyle = 'rgba(255, 255, 255, ' + (kilatDurasi / 200 * 0.35) + ')';
      ctx.fillRect(0, 0, W, H);
      kilatDurasi -= 16;
    } else if (now - kilatTerakhir > 30000) {
      if (Math.random() < 0.02) {
        kilatTerakhir = now;
        kilatDurasi = 200;
      }
    }

    requestAnimationFrame(gambar);
  }

  gambar();
}

// ==================== INIT ====================
(function init() {
  deviceId = getDeviceId();
  setMode('login');
  setupEvents();
  initHujan();
})();
