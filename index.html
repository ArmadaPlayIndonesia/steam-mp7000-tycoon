<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Steam MP 7000 Tycoon — Masuk</title>
<style>
  /* ===== RESET & DASAR ===== */
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(160deg, #b30000 0%, #e60000 45%, #ff4d4d 100%);
    color:#fff; overflow:hidden; position:relative;
  }

  /* ===== BACKGROUND ANIMASI (awan & tetesan air) ===== */
  .bg-awan { position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:0; }
  .awan {
    position:absolute; width:120px; height:40px; background:rgba(255,255,255,.15);
    border-radius:50px; filter:blur(6px); animation:gerakAwan linear infinite;
  }
  .awan::before, .awan::after {
    content:""; position:absolute; background:rgba(255,255,255,.15); border-radius:50%;
  }
  .awan::before { width:60px; height:60px; top:-25px; left:15px; }
  .awan::after  { width:45px; height:45px; top:-18px; left:55px; }
  .awan.a1 { top:8%;  animation-duration:28s; }
  .awan.a2 { top:22%; animation-duration:38s; animation-delay:-8s; transform:scale(.8); }
  .awan.a3 { top:60%; animation-duration:46s; animation-delay:-20s; transform:scale(1.2); }
  @keyframes gerakAwan { from { left:-160px; } to { left:110%; } }

  .tetes {
    position:absolute; width:4px; height:12px; background:rgba(255,255,255,.35);
    border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
    animation:jatuh linear infinite;
  }
  @keyframes jatuh {
    0%   { transform:translateY(-20px); opacity:0; }
    15%  { opacity:.8; }
    100% { transform:translateY(105vh); opacity:0; }
  }

  /* ===== KARTU FORM ===== */
  .wrap {
    position:relative; z-index:2; height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:20px;
  }
  .logo-area { text-align:center; margin-bottom:18px; }
  .logo-emoji { font-size:56px; display:block; animation:putar 6s linear infinite; }
  @keyframes putar { from{transform:rotate(0)} to{transform:rotate(360deg)} }
  .logo-area h1 { font-size:22px; font-weight:800; letter-spacing:.5px; margin-top:6px; text-shadow:0 2px 8px rgba(0,0,0,.35); }
  .logo-area p  { font-size:12px; opacity:.85; margin-top:2px; }

  .card {
    width:100%; max-width:380px; background:rgba(255,255,255,.12);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.25); border-radius:18px;
    padding:20px 18px; box-shadow:0 12px 32px rgba(0,0,0,.3);
  }
  .tab-toggle { display:flex; background:rgba(0,0,0,.2); border-radius:12px; padding:4px; margin-bottom:16px; }
  .tab-toggle button {
    flex:1; padding:10px; border:none; background:transparent; color:#fff;
    font-weight:700; font-size:14px; border-radius:9px; cursor:pointer; transition:.2s;
  }
  .tab-toggle button.aktif { background:#fff; color:#c00; box-shadow:0 2px 8px rgba(0,0,0,.2); }

  .form-group { margin-bottom:12px; }
  .form-group label { display:block; font-size:12px; margin-bottom:5px; opacity:.9; font-weight:600; }
  .form-group input {
    width:100%; padding:12px 14px; border-radius:11px; border:1px solid rgba(255,255,255,.3);
    background:rgba(255,255,255,.15); color:#fff; font-size:15px; outline:none; transition:.2s;
  }
  .form-group input::placeholder { color:rgba(255,255,255,.55); }
  .form-group input:focus { border-color:#fff; background:rgba(255,255,255,.25); }

  .btn-utama {
    width:100%; padding:13px; border:none; border-radius:12px;
    background:linear-gradient(135deg,#fff,#ffe6e6); color:#c00;
    font-weight:800; font-size:15px; cursor:pointer; margin-top:6px;
    transition:.2s; box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
  .btn-utama:active { transform:scale(.97); }
  .btn-utama:disabled { opacity:.6; cursor:not-allowed; }

  .pesan { font-size:13px; text-align:center; margin-top:12px; min-height:18px; font-weight:600; }
  .pesan.error { color:#ffe0e0; }
  .pesan.sukses { color:#d4ffd4; }

  .loading {
    display:none; width:22px; height:22px; border:3px solid rgba(255,255,255,.3);
    border-top-color:#fff; border-radius:50%; animation:spin .8s linear infinite;
    margin:12px auto 0;
  }
  @keyframes spin { to { transform:rotate(360deg); } }

  .info-bawah { font-size:11px; opacity:.7; margin-top:14px; text-align:center; }
</style>
</head>
<body>

<!-- Background animasi -->
<div class="bg-awan">
  <div class="awan a1"></div>
  <div class="awan a2"></div>
  <div class="awan a3"></div>
</div>

<div class="wrap">
  <div class="logo-area">
    <span class="logo-emoji">🏍️</span>
    <h1>Steam MP 7000 Tycoon</h1>
    <p>Kelola steam motor bareng Pak Aldi</p>
  </div>

  <div class="card">
    <!-- Toggle Login / Register -->
    <div class="tab-toggle">
      <button id="tabLogin" class="aktif" onclick="gantiTab('login')">Masuk</button>
      <button id="tabRegister" onclick="gantiTab('register')">Daftar</button>
    </div>

    <!-- FORM LOGIN -->
    <form id="formLogin" onsubmit="return aksiLogin(event)">
      <div class="form-group">
        <label>Nomor HP</label>
        <input type="tel" id="loginNomor" placeholder="08xxxxxxxxxx" autocomplete="tel" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="Minimal 6 karakter" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn-utama" id="btnLogin">Masuk</button>
    </form>

    <!-- FORM REGISTER -->
    <form id="formRegister" style="display:none" onsubmit="return aksiRegister(event)">
      <div class="form-group">
        <label>Nama Pemain</label>
        <input type="text" id="regNama" placeholder="Nama kamu" maxlength="20" required>
      </div>
      <div class="form-group">
        <label>Nomor HP</label>
        <input type="tel" id="regNomor" placeholder="08xxxxxxxxxx" autocomplete="tel" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="regPassword" placeholder="Minimal 6 karakter" autocomplete="new-password" required>
      </div>
      <button type="submit" class="btn-utama" id="btnRegister">Daftar Sekarang</button>
    </form>

    <div class="pesan" id="pesan"></div>
    <div class="loading" id="loading"></div>
  </div>

  <div class="info-bawah">© Steam MP 7000 Tycoon — Pak Aldi</div>
</div>

<script>
/* =========================================================
   KONFIGURASI BACKEND — SAMA PERSIS DI KEDUA FILE
   ========================================================= */
const API_URL = "https://script.google.com/macros/s/AKfycbyp04EZaT8vhi5gDmTeSw1ovDVDVh-cF-EkdcQohxu2ys3MwGrJm8yZg6A02qrPHujO6g/exec";
const API_KEY = "smp7k_ganti_ini_nanti";

/* =========================================================
   DEVICE ID — dibuat sekali, disimpan di localStorage
   ========================================================= */
function ambilDeviceId() {
  let id = localStorage.getItem("smp7k_device_id");
  if (!id) {
    // generate random string
    const acak = Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-6);
    id = "dev_" + acak;
    localStorage.setItem("smp7k_device_id", id);
  }
  return id;
}

/* =========================================================
   FUNGSI FETCH TERPUSAT
   Semua request lewat sini biar konsisten & aman.
   ========================================================= */
async function panggilApi(action, data = null, token = null) {
  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" }, // JANGAN tambah header CORS
      body: JSON.stringify({
        api_key: API_KEY,
        action: action,
        token: token,
        data: data
      })
    });

    if (!res.ok) {
      return { ok: false, message: "Server tidak merespons dengan benar (" + res.status + ")" };
    }

    let json;
    try {
      json = await res.json();
    } catch (e) {
      return { ok: false, message: "Server tidak merespons dengan benar" };
    }

    // Cek sesi habis
    if (json.ok === false && json.message && json.message.toLowerCase().includes("sesi")) {
      localStorage.removeItem("smp7k_token");
      // redirect kalau bukan di index
      if (!location.pathname.endsWith("index.html") && location.pathname !== "/") {
        window.location.href = "index.html";
      }
    }
    return json;
  } catch (err) {
    return { ok: false, message: "Koneksi bermasalah. Cek internet kamu." };
  }
}

/* =========================================================
   UI HELPER
   ========================================================= */
const elPesan   = document.getElementById("pesan");
const elLoading = document.getElementById("loading");

function tampilPesan(teks, tipe = "error") {
  elPesan.textContent = teks;
  elPesan.className = "pesan " + tipe;
}
function setLoading(aktif, btnId) {
  elLoading.style.display = aktif ? "block" : "none";
  if (btnId) document.getElementById(btnId).disabled = aktif;
}
function gantiTab(tab) {
  const isLogin = tab === "login";
  document.getElementById("formLogin").style.display    = isLogin ? "block" : "none";
  document.getElementById("formRegister").style.display = isLogin ? "none" : "block";
  document.getElementById("tabLogin").classList.toggle("aktif", isLogin);
  document.getElementById("tabRegister").classList.toggle("aktif", !isLogin);
  tampilPesan("");
}

/* =========================================================
   VALIDASI
   ========================================================= */
function validasiNomor(nomor) {
  // wajib diawali 08, 10-13 digit total
  return /^08\d{8,11}$/.test(nomor);
}
function validasiPassword(pass) {
  return pass && pass.length >= 6;
}

/* =========================================================
   AKSI LOGIN
   ========================================================= */
async function aksiLogin(e) {
  e.preventDefault();
  const nomor    = document.getElementById("loginNomor").value.trim();
  const password = document.getElementById("loginPassword").value;

  if (!validasiNomor(nomor)) { tampilPesan("Nomor HP harus diawali 08 dan 10-13 digit."); return false; }
  if (!validasiPassword(password)) { tampilPesan("Password minimal 6 karakter."); return false; }

  setLoading(true, "btnLogin");
  tampilPesan("");

  const resp = await panggilApi("login", {
    nomor: nomor,
    password: password,
    device_id: ambilDeviceId()
  });

  setLoading(false, "btnLogin");

  if (resp.ok) {
    // Simpan token
    localStorage.setItem("smp7k_token", resp.data.token);
    localStorage.setItem("smp7k_nama", resp.data.nama || "");
    tampilPesan("Login sukses! Mengalihkan...", "sukses");
    setTimeout(() => { window.location.href = "dashboard.html"; }, 700);
  } else {
    tampilPesan(resp.message || "Login gagal. Cek nomor & password.");
  }
  return false;
}

/* =========================================================
   AKSI REGISTER
   ========================================================= */
async function aksiRegister(e) {
  e.preventDefault();
  const nama     = document.getElementById("regNama").value.trim();
  const nomor    = document.getElementById("regNomor").value.trim();
  const password = document.getElementById("regPassword").value;

  if (nama.length < 2) { tampilPesan("Nama minimal 2 karakter."); return false; }
  if (!validasiNomor(nomor)) { tampilPesan("Nomor HP harus diawali 08 dan 10-13 digit."); return false; }
  if (!validasiPassword(password)) { tampilPesan("Password minimal 6 karakter."); return false; }

  setLoading(true, "btnRegister");
  tampilPesan("");

  const resp = await panggilApi("register", {
    nama: nama,
    nomor: nomor,
    password: password,
    device_id: ambilDeviceId()
  });

  if (!resp.ok) {
    setLoading(false, "btnRegister");
    tampilPesan(resp.message || "Registrasi gagal. Coba nomor lain.");
    return false;
  }

  // Register sukses → otomatis login
  tampilPesan("Daftar sukses! Sedang masuk...", "sukses");

  const loginResp = await panggilApi("login", {
    nomor: nomor,
    password: password,
    device_id: ambilDeviceId()
  });

  setLoading(false, "btnRegister");

  if (loginResp.ok) {
    localStorage.setItem("smp7k_token", loginResp.data.token);
    localStorage.setItem("smp7k_nama", loginResp.data.nama || nama);
    setTimeout(() => { window.location.href = "dashboard.html"; }, 700);
  } else {
    tampilPesan("Daftar berhasil, tapi login otomatis gagal. Silakan login manual.");
    gantiTab("login");
    document.getElementById("loginNomor").value = nomor;
  }
  return false;
}

/* =========================================================
   GENERATE TETESAN AIR DI BACKGROUND
   ========================================================= */
(function buatTetesan() {
  const kontainer = document.querySelector(".bg-awan");
  for (let i = 0; i < 18; i++) {
    const t = document.createElement("div");
    t.className = "tetes";
    t.style.left = Math.random() * 100 + "%";
    t.style.animationDuration = (2 + Math.random() * 3) + "s";
    t.style.animationDelay = (Math.random() * 5) + "s";
    t.style.opacity = 0.2 + Math.random() * 0.4;
    kontainer.appendChild(t);
  }
})();

/* Kalau sudah punya token, langsung ke dashboard */
if (localStorage.getItem("smp7k_token")) {
  // Validasi cepat: coba getProfile, kalau gagal baru tetap di sini
  (async () => {
    const cek = await panggilApi("getProfile", null, localStorage.getItem("smp7k_token"));
    if (cek.ok) window.location.href = "dashboard.html";
    else localStorage.removeItem("smp7k_token");
  })();
}
</script>
</body>
</html>
