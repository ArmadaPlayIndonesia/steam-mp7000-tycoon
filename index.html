<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#C8102E">
  <title>Steam MP 7000 Tycoon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(160deg, #FAFAFA 0%, #FDE8EC 40%, #FADADD 70%, #FAFAFA 100%);
      color: #1A1A1A;
      position: relative;
      min-height: 100dvh;
    }

    /* ===== CANVAS HUJAN ===== */
    #hujanCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* ===== APP WRAPPER ===== */
    #app {
      position: relative;
      z-index: 1;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 18px 16px 30px;
    }

    /* ===== LOGIN WRAP ===== */
    .login-wrap {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      animation: fadeSlideUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes fadeSlideUp {
      0% { opacity: 0; transform: translateY(30px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* ===== BRAND ===== */
    .brand {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .logo {
      width: 82px;
      height: 82px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #E8354F, #C8102E 45%, #8B0000 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 800;
      color: #F59E0B;
      letter-spacing: 1px;
      box-shadow:
        0 0 18px rgba(200, 16, 46, 0.7),
        0 0 40px rgba(200, 16, 46, 0.4),
        0 0 80px rgba(200, 16, 46, 0.2),
        inset 0 -4px 10px rgba(0,0,0,0.25);
      text-shadow: 0 0 10px rgba(245, 158, 11, 0.8);
      cursor: pointer;
      user-select: none;
      transition: transform 0.15s ease, box-shadow 0.3s ease;
      position: relative;
      animation: logoPulse 3s ease-in-out infinite;
    }

    .logo:active {
      transform: scale(0.92);
    }

    @keyframes logoPulse {
      0%, 100% { box-shadow: 0 0 18px rgba(200, 16, 46, 0.7), 0 0 40px rgba(200, 16, 46, 0.4), 0 0 80px rgba(200, 16, 46, 0.2), inset 0 -4px 10px rgba(0,0,0,0.25); }
      50% { box-shadow: 0 0 24px rgba(200, 16, 46, 0.9), 0 0 55px rgba(200, 16, 46, 0.55), 0 0 100px rgba(200, 16, 46, 0.3), inset 0 -4px 10px rgba(0,0,0,0.25); }
    }

    .brand h1 {
      font-size: 20px;
      font-weight: 700;
      color: #8B0000;
      letter-spacing: 0.3px;
      line-height: 1.2;
      text-shadow: 0 1px 4px rgba(200, 16, 46, 0.1);
    }

    .tagline {
      font-size: 10.5px;
      font-weight: 500;
      color: #9B6B6B;
      letter-spacing: 0.4px;
      word-spacing: 2px;
      opacity: 0.85;
    }

    /* ===== KARTU ===== */
    .kartu {
      width: 100%;
      background: #FFFFFF;
      border-radius: 20px;
      padding: 22px 18px 20px;
      box-shadow:
        0 8px 30px rgba(200, 16, 46, 0.12),
        0 2px 8px rgba(0,0,0,0.04),
        0 0 0 1px rgba(245, 158, 11, 0.18);
      border: 1px solid rgba(245, 158, 11, 0.25);
      position: relative;
      overflow: hidden;
    }

    .kartu::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #C8102E, #F59E0B, #C8102E);
      background-size: 200% 100%;
      animation: shimmerLine 3s linear infinite;
    }

    @keyframes shimmerLine {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ===== TOGGLE ===== */
    .toggle {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      background: #F5F5F5;
      border-radius: 14px;
      padding: 4px;
    }

    .toggle button {
      flex: 1;
      padding: 10px 0;
      border: none;
      border-radius: 11px;
      font-family: 'Poppins', sans-serif;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      background: transparent;
      color: #888;
      letter-spacing: 0.2px;
    }

    .toggle button.aktif {
      background: linear-gradient(135deg, #C8102E, #8B0000);
      color: #FFFFFF;
      box-shadow: 0 3px 12px rgba(200, 16, 46, 0.35);
      transform: scale(1.02);
    }

    .toggle button:not(.aktif):active {
      background: #EBEBEB;
    }

    /* ===== FORM ===== */
    form {
      display: flex;
      flex-direction: column;
      gap: 13px;
      animation: formFade 0.35s ease both;
    }

    @keyframes formFade {
      0% { opacity: 0; transform: translateY(8px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    input {
      width: 100%;
      padding: 13px 15px;
      border: 1.5px solid #E0E0E0;
      border-radius: 12px;
      font-family: 'Poppins', sans-serif;
      font-size: 14px;
      font-weight: 500;
      color: #1A1A1A;
      background: #FAFAFA;
      outline: none;
      transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
      -webkit-appearance: none;
    }

    input::placeholder {
      color: #AAAAAA;
      font-weight: 400;
      font-size: 13px;
    }

    input:focus {
      border-color: #C8102E;
      background: #FFFFFF;
      box-shadow: 0 0 0 3.5px rgba(200, 16, 46, 0.1);
    }

    /* ===== INPUT PASSWORD ===== */
    .input-pw {
      position: relative;
      width: 100%;
    }

    .input-pw input {
      padding-right: 48px;
    }

    .toggle-pw {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      width: 38px;
      height: 38px;
      border: none;
      background: transparent;
      font-size: 17px;
      cursor: pointer;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      color: #888;
      line-height: 1;
    }

    .toggle-pw:active {
      background: #F0F0F0;
    }

    /* ===== TOMBOL ===== */
    .btn-primary {
      width: 100%;
      padding: 14px 0;
      border: none;
      border-radius: 13px;
      background: linear-gradient(135deg, #C8102E 0%, #A00D25 50%, #8B0000 100%);
      color: #FFFFFF;
      font-family: 'Poppins', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1.2px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.3s, opacity 0.3s;
      box-shadow: 0 4px 16px rgba(200, 16, 46, 0.35);
      position: relative;
      overflow: hidden;
      margin-top: 4px;
    }

    .btn-primary:active {
      transform: scale(0.97);
      box-shadow: 0 2px 8px rgba(200, 16, 46, 0.3);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .btn-primary .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2.5px solid rgba(255,255,255,0.3);
      border-top-color: #FFFFFF;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .btn-outline {
      padding: 12px 20px;
      border: 1.5px solid #C8102E;
      border-radius: 12px;
      background: #FFFFFF;
      color: #C8102E;
      font-family: 'Poppins', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-outline:active {
      background: #FDE8EC;
    }

    /* ===== PESAN ERROR ===== */
    .pesan-error {
      font-size: 12.5px;
      font-weight: 500;
      color: #DC2626;
      text-align: center;
      min-height: 18px;
      margin-top: 8px;
      line-height: 1.4;
      transition: opacity 0.3s;
      padding: 0 4px;
    }

    /* ===== TOMBOL MUSIK ===== */
    .btn-musik {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 50;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1.5px solid rgba(245, 158, 11, 0.5);
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 12px rgba(200, 16, 46, 0.15);
      transition: transform 0.2s, box-shadow 0.2s;
      line-height: 1;
    }

    .btn-musik:active {
      transform: scale(0.9);
    }

    .btn-musik.mati {
      opacity: 0.55;
      filter: grayscale(0.5);
    }

    /* ===== TOAST ===== */
    #toastBox {
      position: fixed;
      top: 68px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 200;
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: calc(100% - 32px);
      max-width: 400px;
      pointer-events: none;
    }

    .toast {
      padding: 12px 16px;
      border-radius: 12px;
      color: #FFFFFF;
      font-size: 13px;
      font-weight: 500;
      text-align: center;
      box-shadow: 0 6px 20px rgba(0,0,0,0.18);
      animation: toastIn 0.35s cubic-bezier(0.22, 1, 0.36, 1) both;
      line-height: 1.4;
      pointer-events: auto;
    }

    .toast.sukses { background: #059669; }
    .toast.error { background: #DC2626; }
    .toast.warning { background: #D97706; }
    .toast.info { background: #2563EB; }

    @keyframes toastIn {
      0% { opacity: 0; transform: translateY(-16px) scale(0.95); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .toast.hilang {
      animation: toastOut 0.3s ease both;
    }

    @keyframes toastOut {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-12px) scale(0.92); }
    }

    /* ===== MODAL ADMIN ===== */
    #modalAdmin {
      position: fixed;
      inset: 0;
      z-index: 300;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: modalFadeIn 0.25s ease both;
    }

    @keyframes modalFadeIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    .modal {
      width: 100%;
      max-width: 360px;
      background: #FFFFFF;
      border-radius: 20px;
      padding: 24px 20px 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      gap: 14px;
      animation: modalSlideUp 0.35s cubic-bezier(0.22, 1, 0.36, 1) both;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    @keyframes modalSlideUp {
      0% { opacity: 0; transform: translateY(30px) scale(0.96); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .modal h3 {
      font-size: 17px;
      font-weight: 700;
      color: #8B0000;
      text-align: center;
      letter-spacing: 0.3px;
    }

    .modal input {
      padding: 12px 14px;
      font-size: 14px;
    }

    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 4px;
    }

    .btn-row button {
      flex: 1;
    }

    /* ===== RESPONSIVE KECIL ===== */
    @media (max-width: 360px) {
      .logo { width: 68px; height: 68px; font-size: 26px; }
      .brand h1 { font-size: 17px; }
      .tagline { font-size: 9.5px; }
      .kartu { padding: 18px 14px 16px; }
      input { padding: 11px 13px; font-size: 13px; }
      .btn-primary { padding: 12px 0; font-size: 14px; }
    }

    @media (min-height: 750px) {
      .login-wrap { gap: 24px; }
      .logo { width: 92px; height: 92px; font-size: 36px; }
    }
  </style>
</head>
<body>

<div id="app">
  <canvas id="hujanCanvas"></canvas>

  <div class="login-wrap">
    <div class="brand">
      <div class="logo" id="logoMP">MP</div>
      <h1>Steam MP 7000 Tycoon</h1>
      <div class="tagline">Jujur • Disiplin • Tanggung Jawab • Harga Mati</div>
    </div>

    <div class="kartu">
      <div class="toggle">
        <button data-mode="login" class="aktif" id="tabLogin">Masuk</button>
        <button data-mode="register" id="tabRegister">Daftar</button>
      </div>

      <!-- FORM LOGIN -->
      <form id="formLogin" autocomplete="off">
        <input id="loginNomor" placeholder="Nomor HP (08xxxxxxxxxx)" inputmode="numeric" autocomplete="off" maxlength="13">
        <div class="input-pw">
          <input id="loginPassword" type="password" placeholder="Password" autocomplete="off">
          <button type="button" class="toggle-pw" data-target="loginPassword">👁</button>
        </div>
        <button type="submit" class="btn-primary" id="btnLogin">MASUK</button>
      </form>

      <!-- FORM REGISTER -->
      <form id="formRegister" style="display:none" autocomplete="off">
        <input id="regNama" placeholder="Nama lengkap" autocomplete="off">
        <input id="regNomor" placeholder="Nomor HP (08xxxxxxxxxx)" inputmode="numeric" autocomplete="off" maxlength="13">
        <div class="input-pw">
          <input id="regPassword" type="password" placeholder="Password (min 6)" autocomplete="off">
          <button type="button" class="toggle-pw" data-target="regPassword">👁</button>
        </div>
        <button type="submit" class="btn-primary" id="btnRegister">DAFTAR</button>
      </form>

      <div id="pesanError" class="pesan-error"></div>
    </div>
  </div>

  <button id="btnMusik" class="btn-musik" title="Musik">🎵</button>
  <div id="toastBox"></div>

  <!-- MODAL ADMIN -->
  <div id="modalAdmin" style="display:none">
    <div class="modal">
      <h3>🔐 Login Admin</h3>
      <input id="adminId" placeholder="Admin ID" autocomplete="off">
      <input id="adminPassword" type="password" placeholder="Password" autocomplete="off">
      <div class="btn-row">
        <button type="button" id="btnAdminBatal" class="btn-outline">Batal</button>
        <button type="button" id="btnAdminLogin" class="btn-primary">Masuk</button>
      </div>
    </div>
  </div>

  <audio id="musik" src="assets/musik-latar.mp3" loop preload="auto"></audio>
</div>

<script>
(function(){
  'use strict';

  // ============================================================
  // KONFIGURASI
  // ============================================================
  var BACKEND_URL = 'https://script.google.com/macros/s/AKfycbysHvNR2JwLFuNu6poci5wIleJBnc8IGNMq-ULxUV1NyMxoorEcBj0c8oBh4b8JiL3m/exec';
  var TOKEN = 'steam-mp-7000-2026';
  var TIMEOUT_MS = 15000;
  var DEVICE_KEY = 'smp7k_device';
  var SESSION_KEY = 'smp7k_session';
  var USER_KEY = 'smp7k_user';
  var ADMIN_KEY = 'smp7k_admin';
  var MUSIC_KEY = 'smp7k_music';

  // ============================================================
  // STATE
  // ============================================================
  var isLoading = false;
  var mode = 'login'; // 'login' | 'register'
  var logoTapCount = 0;
  var logoTapTimer = null;

  // ============================================================
  // UTIL: FETCH TIMEOUT
  // ============================================================
  function fetchTimeout(url, options, ms) {
    return Promise.race([
      fetch(url, options),
      new Promise(function(_, reject) {
        setTimeout(function() { reject(new Error('Timeout')); }, ms || TIMEOUT_MS);
      })
    ]);
  }

  // ============================================================
  // UTIL: API CALL
  // ============================================================
  function apiCall(payload) {
    var options = {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(payload),
      redirect: 'follow'
    };

    return fetchTimeout(BACKEND_URL, options, TIMEOUT_MS)
      .then(function(r) { return r.text(); })
      .then(function(t) {
        try {
          return JSON.parse(t);
        } catch (e) {
          console.warn('Respons bukan JSON:', t);
          return { ok: false, pesan: 'Respons tidak valid' };
        }
      })
      .catch(function(e) {
        if (e.message === 'Timeout') {
          return { ok: false, pesan: 'Server tidak merespons, coba lagi' };
        }
        console.warn('Fetch error:', e);
        return { ok: false, pesan: 'Gagal terhubung ke server' };
      });
  }

  // ============================================================
  // UTIL: DEVICE ID
  // ============================================================
  function getDeviceId() {
    var id = localStorage.getItem(DEVICE_KEY);
    if (!id || id.length < 8) {
      var chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
      var result = 'dev_';
      for (var i = 0; i < 16; i++) {
        result += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      id = result;
      localStorage.setItem(DEVICE_KEY, id);
    }
    return id;
  }

  // ============================================================
  // UTIL: RANDOM TOKEN
  // ============================================================
  function generateToken(len) {
    var chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
    var result = '';
    for (var i = 0; i < (len || 32); i++) {
      result += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    return result;
  }

  // ============================================================
  // UTIL: TANGGAL
  // ============================================================
  function nowISO() {
    return new Date().toISOString();
  }

  function todayDate() {
    var d = new Date();
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, '0');
    var day = String(d.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + day;
  }

  function expires7Days() {
    var d = new Date();
    d.setDate(d.getDate() + 7);
    return d.toISOString();
  }

  // ============================================================
  // UI: TOAST
  // ============================================================
  function showToast(msg, tipe) {
    var box = document.getElementById('toastBox');
    var el = document.createElement('div');
    el.className = 'toast ' + (tipe || 'info');
    el.textContent = msg;
    box.appendChild(el);

    setTimeout(function() {
      el.classList.add('hilang');
      setTimeout(function() {
        if (el.parentNode) el.parentNode.removeChild(el);
      }, 320);
    }, 3000);
  }

  // ============================================================
  // UI: LOADING
  // ============================================================
  function showLoading(btn) {
    if (!btn) return;
    isLoading = true;
    btn.disabled = true;
    btn.dataset.originalText = btn.innerHTML;
    btn.innerHTML = '<span class="spinner"></span>Memuat...';
  }

  function hideLoading(btn) {
    isLoading = false;
    if (!btn) return;
    btn.disabled = false;
    if (btn.dataset.originalText) {
      btn.innerHTML = btn.dataset.originalText;
      delete btn.dataset.originalText;
    }
  }

  // ============================================================
  // UI: PESAN ERROR
  // ============================================================
  function setPesanError(msg) {
    var el = document.getElementById('pesanError');
    if (el) el.textContent = msg || '';
  }

  // ============================================================
  // VALIDASI
  // ============================================================
  function validasiNomor(nomor) {
    if (!nomor) return 'Nomor HP wajib diisi';
    var clean = String(nomor).trim().replace(/\s/g, '');
    if (!/^08\d{8,11}$/.test(clean)) {
      return 'Nomor HP harus diawali 08, 10-13 digit';
    }
    return null;
  }

  function validasiPassword(pw) {
    if (!pw) return 'Password wajib diisi';
    if (String(pw).length < 6) return 'Password minimal 6 karakter';
    return null;
  }

  function validasiNama(nama) {
    if (!nama || !String(nama).trim()) return 'Nama wajib diisi';
    return null;
  }

  // ============================================================
  // UTIL: NORMALISASI
  // ============================================================
  function normNomor(v) {
    return String(v == null ? '' : v).trim().replace(/\s/g, '');
  }

  function normStr(v) {
    return String(v == null ? '' : v).trim();
  }

  // ============================================================
  // PROSES: BACA USERS
  // ============================================================
  function bacaUsers() {
    return apiCall({
      action: 'baca',
      token: TOKEN,
      sheet: 'Users'
    });
  }

  // ============================================================
  // PROSES: REGISTER
  // ============================================================
  function prosesRegister(nama, nomor, password, btn) {
    var deviceId = getDeviceId();

    console.log('Mulai register: nama=' + nama + ', nomor=' + nomor);
    console.log('Device ID: ' + deviceId);

    // Validasi
    var errNama = validasiNama(nama);
    if (errNama) { setPesanError(errNama); showToast(errNama, 'error'); return Promise.resolve(); }

    var errNomor = validasiNomor(nomor);
    if (errNomor) { setPesanError(errNomor); showToast(errNomor, 'error'); return Promise.resolve(); }

    var errPw = validasiPassword(password);
    if (errPw) { setPesanError(errPw); showToast(errPw, 'error'); return Promise.resolve(); }

    setPesanError('');

    var cleanNomor = normNomor(nomor);
    var cleanPassword = normStr(password);
    var cleanNama = normStr(nama);

    showLoading(btn);

    return bacaUsers()
      .then(function(res) {
        console.log('Baca Users: ' + (res && res.data ? res.data.length : 0) + ' baris');

        if (!res || !res.ok) {
          throw new Error((res && res.pesan) || 'Server tidak bisa dihubungi, coba lagi');
        }

        var rows = res.data || [];
        if (!Array.isArray(rows)) rows = [];

        // Cek duplikat nomor & device
        var dupNomor = false;
        var dupDevice = false;
        for (var i = 0; i < rows.length; i++) {
          var r = rows[i] || {};
          if (normNomor(r.nomor) === cleanNomor) dupNomor = true;
          if (normStr(r.device_id) === normStr(deviceId)) dupDevice = true;
        }

        console.log('Cek duplikat: nomor=' + dupNomor + ', device=' + dupDevice);

        if (dupNomor) {
          throw new Error('Nomor sudah terdaftar. Silakan masuk.');
        }
        if (dupDevice) {
          throw new Error('Device ini sudah terdaftar. Hubungi admin.');
        }

        // Generate ID internal
        var maxNum = 0;
        for (var j = 0; j < rows.length; j++) {
          var rid = normStr(rows[j].id);
          var match = rid.match(/^MP7000-(\d+)$/);
          if (match) {
            var n = parseInt(match[1], 10);
            if (!isNaN(n) && n > maxNum) maxNum = n;
          }
        }
        var newId = 'MP7000-' + String(maxNum + 1).padStart(4, '0');
        console.log('ID baru: ' + newId);

        // Data baru
        var newData = {
          id: newId,
          nama: cleanNama,
          nomor: cleanNomor,
          password: cleanPassword,
          device_id: deviceId,
          saldo_koin: 0,
          saldo_rupiah: 0,
          kristal: 0,
          level: 1,
          cabang_aktif: 1,
          status: 'aktif',
          last_login: '',
          last_sync: '',
          tanggal_daftar: todayDate(),
          story_unlocked: 0
        };

        return apiCall({
          action: 'tulis',
          token: TOKEN,
          sheet: 'Users',
          data: newData
        });
      })
      .then(function(resTulis) {
        if (!resTulis || !resTulis.ok) {
          throw new Error((resTulis && resTulis.pesan) || 'Gagal menyimpan data. Coba lagi.');
        }

        console.log('Tulis Users: ' + JSON.stringify(resTulis));

        // VERIFIKASI: baca ulang
        return bacaUsers().then(function(resVerif) {
          if (!resVerif || !resVerif.ok) {
            throw new Error('Gagal memverifikasi data. Coba lagi.');
          }

          var rows = resVerif.data || [];
          var found = false;
          for (var i = 0; i < rows.length; i++) {
            if (normNomor(rows[i].nomor) === cleanNomor) {
              found = true;
              break;
            }
          }

          console.log('Verifikasi: nomor ' + cleanNomor + ' ditemukan=' + (found ? 'ya' : 'tidak'));

          if (!found) {
            throw new Error('Gagal menyimpan data. Coba lagi.');
          }

          showToast('Pendaftaran berhasil! Masuk otomatis...', 'sukses');
          // Otomatis login
          return prosesLogin(cleanNomor, cleanPassword, btn, true);
        });
      })
      .catch(function(e) {
        console.log('Register gagal: ' + e.message);
        setPesanError(e.message);
        showToast(e.message, 'error');
      })
      .finally(function() {
        hideLoading(btn);
      });
  }

  // ============================================================
  // PROSES: LOGIN
  // ============================================================
  function prosesLogin(nomor, password, btn, isAuto) {
    var deviceId = getDeviceId();

    console.log('Mulai login: nomor=' + nomor);

    var errNomor = validasiNomor(nomor);
    if (errNomor) { setPesanError(errNomor); showToast(errNomor, 'error'); return Promise.resolve(); }

    var errPw = validasiPassword(password);
    if (errPw) { setPesanError(errPw); showToast(errPw, 'error'); return Promise.resolve(); }

    setPesanError('');

    var cleanNomor = normNomor(nomor);
    var cleanPassword = normStr(password);

    if (!isAuto) showLoading(btn);

    return bacaUsers()
      .then(function(res) {
        if (!res || !res.ok) {
          throw new Error((res && res.pesan) || 'Server tidak bisa dihubungi, coba lagi');
        }

        var rows = res.data || [];
        if (!Array.isArray(rows)) rows = [];

        console.log('Login: total ' + rows.length + ' baris user');

        var foundRow = null;
        var nomorDitemukan = false;
        var deviceCocok = false;
        var passwordCocok = false;
        var statusBanned = false;

        for (var i = 0; i < rows.length; i++) {
          var r = rows[i] || {};
          if (normNomor(r.nomor) === cleanNomor) {
            nomorDitemukan = true;
            if (normStr(r.device_id) === normStr(deviceId)) {
              deviceCocok = true;
              if (normStr(r.password) === cleanPassword) {
                passwordCocok = true;
                foundRow = r;
              }
            }
            if (normStr(r.status).toLowerCase() === 'banned') {
              statusBanned = true;
            }
            break;
          }
        }

        console.log('Login: nomor ditemukan=' + (nomorDitemukan ? 'ya' : 'tidak') +
          ', device cocok=' + (deviceCocok ? 'ya' : 'tidak') +
          ', password cocok=' + (passwordCocok ? 'ya' : 'tidak'));

        // Pesan spesifik
        if (!nomorDitemukan) {
          throw new Error('Nomor belum terdaftar');
        }

        if (statusBanned && foundRow) {
          throw new Error('Akun diblokir. Hubungi admin.');
        }

        if (!deviceCocok) {
          throw new Error('Device tidak cocok. Hubungi admin.');
        }

        if (!passwordCocok) {
          throw new Error('Password salah');
        }

        if (!foundRow) {
          throw new Error('Data user tidak ditemukan');
        }

        // Login sukses
        var sessionToken = generateToken(32);
        var expiresAt = expires7Days();
        var now = nowISO();

        console.log('Login sukses, token=' + sessionToken);

        // Tulis session
        return apiCall({
          action: 'tulis',
          token: TOKEN,
          sheet: 'Sessions',
          data: {
            token: sessionToken,
            user_id: normStr(foundRow.id),
            is_admin: 'false',
            expires_at: expiresAt,
            created_at: now
          }
        }).then(function(resSess) {
          // Update last_login
          var rowNum = foundRow._row || foundRow.row || null;
          var updateData = { last_login: now };

          if (rowNum) {
            return apiCall({
              action: 'update',
              token: TOKEN,
              sheet: 'Users',
              row: rowNum,
              data: updateData
            }).catch(function() {
              // abaikan error update
              return { ok: true };
            });
          }
          return { ok: true };
        }).then(function() {
          // Simpan localStorage
          localStorage.setItem(SESSION_KEY, JSON.stringify({
            token: sessionToken,
            user_id: normStr(foundRow.id),
            expires_at: expiresAt
          }));

          localStorage.setItem(USER_KEY, JSON.stringify({
            id: normStr(foundRow.id),
            nama: normStr(foundRow.nama),
            nomor: normNomor(foundRow.nomor),
            saldo_koin: foundRow.saldo_koin || 0,
            saldo_rupiah: foundRow.saldo_rupiah || 0,
            kristal: foundRow.kristal || 0,
            level: foundRow.level || 1,
            cabang_aktif: foundRow.cabang_aktif || 1,
            story_unlocked: foundRow.story_unlocked || 0
          }));

          showToast('Login berhasil! Selamat datang, ' + normStr(foundRow.nama), 'sukses');

          // Redirect ke dashboard
          setTimeout(function() {
            window.location.replace('dashboard.html');
          }, 600);
        });
      })
      .catch(function(e) {
        console.log('Login gagal: ' + e.message);
        setPesanError(e.message);
        showToast(e.message, 'error');
      })
      .finally(function() {
        if (!isAuto) hideLoading(btn);
      });
  }

  // ============================================================
  // PROSES: LOGIN ADMIN
  // ============================================================
  function prosesLoginAdmin(adminId, password) {
    var id = normStr(adminId);
    var pw = normStr(password);

    if (!id) {
      showToast('Admin ID wajib diisi', 'error');
      return;
    }
    if (!pw) {
      showToast('Password wajib diisi', 'error');
      return;
    }

    var btn = document.getElementById('btnAdminLogin');
    showLoading(btn);

    bacaUsers()
      .then(function(res) {
        if (!res || !res.ok) {
          throw new Error((res && res.pesan) || 'Server tidak bisa dihubungi');
        }

        var rows = res.data || [];
        var adminRow = null;

        for (var i = 0; i < rows.length; i++) {
          if (normStr(rows[i].id) === id) {
            adminRow = rows[i];
            break;
          }
        }

        if (!adminRow) {
          throw new Error('Admin ID atau password salah');
        }

        if (normStr(adminRow.password) !== pw) {
          throw new Error('Admin ID atau password salah');
        }

        var sessionToken = generateToken(32);
        var expiresAt = expires7Days();
        var now = nowISO();

        return apiCall({
          action: 'tulis',
          token: TOKEN,
          sheet: 'Sessions',
          data: {
            token: sessionToken,
            user_id: normStr(adminRow.id),
            is_admin: 'true',
            expires_at: expiresAt,
            created_at: now
          }
        }).then(function() {
          localStorage.setItem(ADMIN_KEY, JSON.stringify({
            token: sessionToken,
            user_id: normStr(adminRow.id)
          }));

          showToast('Login admin berhasil!', 'sukses');

          setTimeout(function() {
            window.location.replace('dashboard.html?admin=1');
          }, 600);
        });
      })
      .catch(function(e) {
        showToast(e.message, 'error');
      })
      .finally(function() {
        hideLoading(btn);
      });
  }

  // ============================================================
  // UI: TOGGLE MODE
  // ============================================================
  function setMode(newMode) {
    mode = newMode;
    var tabLogin = document.getElementById('tabLogin');
    var tabRegister = document.getElementById('tabRegister');
    var formLogin = document.getElementById('formLogin');
    var formRegister = document.getElementById('formRegister');

    if (newMode === 'login') {
      tabLogin.classList.add('aktif');
      tabRegister.classList.remove('aktif');
      formLogin.style.display = '';
      formRegister.style.display = 'none';
    } else {
      tabLogin.classList.remove('aktif');
      tabRegister.classList.add('aktif');
      formLogin.style.display = 'none';
      formRegister.style.display = '';
    }
    setPesanError('');
  }

  // ============================================================
  // UI: TOGGLE PASSWORD
  // ============================================================
  function setupPasswordToggles() {
    var buttons = document.querySelectorAll('.toggle-pw');
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].addEventListener('click', function() {
        var targetId = this.getAttribute('data-target');
        var input = document.getElementById(targetId);
        if (!input) return;
        if (input.type === 'password') {
          input.type = 'text';
          this.textContent = '🙈';
        } else {
          input.type = 'password';
          this.textContent = '👁';
        }
      });
    }
  }

  // ============================================================
  // UI: FORM HANDLERS
  // ============================================================
  function setupForms() {
    // Login
    document.getElementById('formLogin').addEventListener('submit', function(e) {
      e.preventDefault();
      if (isLoading) return;
      var nomor = document.getElementById('loginNomor').value;
      var pw = document.getElementById('loginPassword').value;
      prosesLogin(nomor, pw, document.getElementById('btnLogin'), false);
    });

    // Register
    document.getElementById('formRegister').addEventListener('submit', function(e) {
      e.preventDefault();
      if (isLoading) return;
      var nama = document.getElementById('regNama').value;
      var nomor = document.getElementById('regNomor').value;
      var pw = document.getElementById('regPassword').value;
      prosesRegister(nama, nomor, pw, document.getElementById('btnRegister'));
    });

    // Toggle tab
    document.getElementById('tabLogin').addEventListener('click', function() { setMode('login'); });
    document.getElementById('tabRegister').addEventListener('click', function() { setMode('register'); });

    // Admin modal
    document.getElementById('btnAdminBatal').addEventListener('click', function() {
      document.getElementById('modalAdmin').style.display = 'none';
    });

    document.getElementById('btnAdminLogin').addEventListener('click', function() {
      var id = document.getElementById('adminId').value;
      var pw = document.getElementById('adminPassword').value;
      prosesLoginAdmin(id, pw);
    });

    // Enter di admin
    document.getElementById('adminPassword').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        document.getElementById('btnAdminLogin').click();
      }
    });

    // Input nomor hanya angka
    ['loginNomor', 'regNomor'].forEach(function(id) {
      var el = document.getElementById(id);
      if (el) {
        el.addEventListener('input', function() {
          this.value = this.value.replace(/[^0-9]/g, '');
        });
      }
    });
  }

  // ============================================================
  // UI: LOGO TAP (ADMIN TERSEMBUNYI)
  // ============================================================
  function setupLogoTap() {
    var logo = document.getElementById('logoMP');
    logo.addEventListener('click', function() {
      logoTapCount++;
      clearTimeout(logoTapTimer);
      logoTapTimer = setTimeout(function() {
        logoTapCount = 0;
      }, 3000);

      if (logoTapCount >= 5) {
        logoTapCount = 0;
        clearTimeout(logoTapTimer);
        document.getElementById('modalAdmin').style.display = 'flex';
        document.getElementById('adminId').value = '';
        document.getElementById('adminPassword').value = '';
        showToast('Mode Admin', 'info');
      }
    });
  }

  // ============================================================
  // UI: MUSIK
  // ============================================================
  function setupMusic() {
    var audio = document.getElementById('musik');
    var btn = document.getElementById('btnMusik');
    var pref = localStorage.getItem(MUSIC_KEY);

    // Cek apakah file audio ada
    audio.addEventListener('error', function() {
      btn.style.display = 'none';
      console.log('File musik tidak ditemukan (404), tombol disembunyikan.');
    });

    // Coba autoplay
    if (pref !== 'off') {
      var playPromise = audio.play();
      if (playPromise !== undefined) {
        playPromise.then(function() {
          btn.textContent = '🎵';
          btn.classList.remove('mati');
          localStorage.setItem(MUSIC_KEY, 'on');
        }).catch(function() {
          btn.textContent = '🔇';
          btn.classList.add('mati');
          localStorage.setItem(MUSIC_KEY, 'off');
        });
      }
    } else {
      btn.textContent = '🔇';
      btn.classList.add('mati');
    }

    btn.addEventListener('click', function() {
      if (audio.paused) {
        audio.play().then(function() {
          btn.textContent = '🎵';
          btn.classList.remove('mati');
          localStorage.setItem(MUSIC_KEY, 'on');
        }).catch(function() {
          showToast('Gagal memutar musik', 'error');
        });
      } else {
        audio.pause();
        btn.textContent = '🔇';
        btn.classList.add('mati');
        localStorage.setItem(MUSIC_KEY, 'off');
      }
    });
  }

  // ============================================================
  // CANVAS HUJAN
  // ============================================================
  function initRain() {
    var canvas = document.getElementById('hujanCanvas');
    var ctx = canvas.getContext('2d');
    var w, h;
    var drops = [];
    var ripples = [];
    var clouds = [];
    var lightning = 0;
    var lightningTimer = 0;
    var DROP_COUNT = 90;

    function resize() {
      w = canvas.width = window.innerWidth * (window.devicePixelRatio || 1);
      h = canvas.height = window.innerHeight * (window.devicePixelRatio || 1);
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';

      // Sesuaikan jumlah tetesan
      DROP_COUNT = Math.floor((window.innerWidth * window.innerHeight) / 9000);
      DROP_COUNT = Math.max(50, Math.min(DROP_COUNT, 160));

      // Reset drops
      drops = [];
      for (var i = 0; i < DROP_COUNT; i++) {
        drops.push({
          x: Math.random() * w,
          y: Math.random() * h,
          len: (6 + Math.random() * 14) * (window.devicePixelRatio || 1),
          speed: (0.6 + Math.random() * 1.2) * (window.devicePixelRatio || 1),
          opacity: 0.08 + Math.random() * 0.18,
          width: (0.8 + Math.random() * 1.2) * (window.devicePixelRatio || 1)
        });
      }

      // Clouds
      clouds = [];
      for (var j = 0; j < 5; j++) {
        clouds.push({
          x: Math.random() * w,
          y: Math.random() * h * 0.25,
          r: (80 + Math.random() * 120) * (window.devicePixelRatio || 1),
          speed: 0.08 + Math.random() * 0.18,
          opacity: 0.06 + Math.random() * 0.1
        });
      }
    }

    function draw() {
      ctx.clearRect(0, 0, w, h);

      // Awan gelap
      for (var c = 0; c < clouds.length; c++) {
        var cl = clouds[c];
        cl.x += cl.speed * (window.devicePixelRatio || 1);
        if (cl.x > w + cl.r * 2) cl.x = -cl.r * 2;

        var grad = ctx.createRadialGradient(cl.x, cl.y, 0, cl.x, cl.y, cl.r);
        grad.addColorStop(0, 'rgba(30, 30, 50, ' + cl.opacity + ')');
        grad.addColorStop(1, 'rgba(30, 30, 50, 0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(cl.x, cl.y, cl.r, 0, Math.PI * 2);
        ctx.fill();
      }

      // Hujan
      for (var i = 0; i < drops.length; i++) {
        var d = drops[i];
        d.y += d.speed;
        d.x += d.speed * 0.15;

        if (d.y > h) {
          // Buat riak di bawah
          if (Math.random() < 0.3) {
            ripples.push({
              x: d.x,
              y: h - 4 * (window.devicePixelRatio || 1),
              r: 2 * (window.devicePixelRatio || 1),
              maxR: (8 + Math.random() * 18) * (window.devicePixelRatio || 1),
              opacity: 0.18,
              speed: 0.3 + Math.random() * 0.4
            });
          }
          d.y = -d.len;
          d.x = Math.random() * w;
        }

        ctx.beginPath();
        ctx.moveTo(d.x, d.y);
        ctx.lineTo(d.x - d.speed * 0.3, d.y + d.len);
        ctx.strokeStyle = 'rgba(200, 16, 46, ' + d.opacity + ')';
        ctx.lineWidth = d.width;
        ctx.lineCap = 'round';
        ctx.stroke();
      }

      // Riak air
      for (var r = ripples.length - 1; r >= 0; r--) {
        var rp = ripples[r];
        rp.r += rp.speed;
        rp.opacity -= 0.004;
        if (rp.opacity <= 0 || rp.r > rp.maxR) {
          ripples.splice(r, 1);
          continue;
        }
        ctx.beginPath();
        ctx.arc(rp.x, rp.y, rp.r, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(200, 16, 46, ' + rp.opacity + ')';
        ctx.lineWidth = 1 * (window.devicePixelRatio || 1);
        ctx.stroke();
      }

      // Kilat (1x per 30 detik)
      lightningTimer++;
      if (lightningTimer > 30 * 60) {
        lightningTimer = 0;
        lightning = 1;
      }

      if (lightning > 0) {
        ctx.fillStyle = 'rgba(255, 255, 255, ' + (lightning * 0.12) + ')';
        ctx.fillRect(0, 0, w, h);
        lightning -= 0.015;
        if (lightning < 0) lightning = 0;
      }

      requestAnimationFrame(draw);
    }

    resize();
    window.addEventListener('resize', resize);
    draw();
  }

  // ============================================================
  // CEK SESSION SAAT LOAD (TIDAK AUTO REDIRECT)
  // ============================================================
  function cekSessionSaatLoad() {
    // Sesuai permintaan: JANGAN redirect otomatis.
    var session = localStorage.getItem(SESSION_KEY);
    var adminSession = localStorage.getItem(ADMIN_KEY);
    if (session || adminSession) {
      console.log('Session lama ditemukan, tapi tidak auto-redirect. User harus klik MASUK.');
    }
  }

  // ============================================================
  // INIT
  // ============================================================
  function init() {
    console.log('=== Steam MP 7000 Tycoon v0.07 ===');
    console.log('Mode: Mobile-first, Anti-CORS, Timeout 15s');

    // Device ID
    getDeviceId();

    // Setup UI
    setupForms();
    setupPasswordToggles();
    setupLogoTap();
    setupMusic();
    initRain();

    // Cek session (tidak redirect)
    cekSessionSaatLoad();

    // Set mode default
    setMode('login');

    // Fokus ke input pertama
    setTimeout(function() {
      var el = document.getElementById('loginNomor');
      if (el) el.focus();
    }, 500);
  }

  // Jalankan setelah DOM siap
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})();
