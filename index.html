<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Steam MP 7000 Tycoon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #fff5f5 0%, #fce8e8 40%, #f0d8d8 100%);
      position: relative;
      overflow: hidden;
    }

    /* ===== CANVAS HUJAN ===== */
    #hujanCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* ===== WRAPPER UTAMA ===== */
    .login-wrap {
      position: relative;
      z-index: 5;
      width: 100%;
      max-width: 420px;
      padding: 20px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ===== BRAND ===== */
    .brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: linear-gradient(135deg, #C8102E, #8B0000);
      color: #fff;
      font-weight: 700;
      font-size: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px;
      box-shadow: 0 0 30px rgba(200, 16, 46, 0.6), 0 0 60px rgba(200, 16, 46, 0.3);
      border: 3px solid rgba(245, 158, 11, 0.7);
      letter-spacing: 2px;
      cursor: pointer;
      user-select: none;
      transition: transform 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .logo:active {
      transform: scale(0.95);
    }

    .brand h1 {
      font-size: 1.55rem;
      font-weight: 700;
      color: #C8102E;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .brand .tagline {
      font-size: 0.72rem;
      color: #8a6d6d;
      font-weight: 500;
      letter-spacing: 0.3px;
    }

    /* ===== KARTU ===== */
    .kartu {
      width: 100%;
      background: #FAFAFA;
      border-radius: 18px;
      padding: 24px 20px 22px;
      box-shadow: 0 12px 40px rgba(200, 16, 46, 0.12), 0 2px 8px rgba(0, 0, 0, 0.04);
      border: 1px solid rgba(245, 158, 11, 0.35);
    }

    /* ===== TOGGLE ===== */
    .toggle {
      display: flex;
      gap: 8px;
      margin-bottom: 22px;
      background: #f0e8e8;
      border-radius: 12px;
      padding: 4px;
    }

    .toggle button {
      flex: 1;
      padding: 10px 0;
      border: none;
      border-radius: 10px;
      font-family: 'Poppins', sans-serif;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      background: transparent;
      color: #8a6d6d;
      letter-spacing: 0.3px;
      -webkit-tap-highlight-color: transparent;
    }

    .toggle button.aktif {
      background: linear-gradient(135deg, #C8102E, #8B0000);
      color: #fff;
      box-shadow: 0 4px 12px rgba(200, 16, 46, 0.3);
    }

    .toggle button:not(.aktif):hover {
      background: rgba(200, 16, 46, 0.08);
      color: #C8102E;
    }

    /* ===== FORM ===== */
    form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1.5px solid #ddd0d0;
      border-radius: 10px;
      font-family: 'Poppins', sans-serif;
      font-size: 0.9rem;
      color: #2d1f1f;
      background: #fff;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      outline: none;
    }

    input:focus {
      border-color: #C8102E;
      box-shadow: 0 0 0 3px rgba(200, 16, 46, 0.1);
    }

    input::placeholder {
      color: #b5a0a0;
      font-size: 0.85rem;
    }

    /* ===== INPUT PASSWORD ===== */
    .input-pw {
      position: relative;
      width: 100%;
    }

    .input-pw input {
      padding-right: 46px;
    }

    .toggle-pw {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      font-size: 1.15rem;
      cursor: pointer;
      padding: 6px 8px;
      line-height: 1;
      opacity: 0.6;
      transition: opacity 0.2s;
      -webkit-tap-highlight-color: transparent;
    }

    .toggle-pw:hover {
      opacity: 1;
    }

    /* ===== TOMBOL ===== */
    .btn-primary {
      width: 100%;
      padding: 14px 0;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #C8102E, #8B0000);
      color: #fff;
      font-family: 'Poppins', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 1px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.2s ease;
      box-shadow: 0 6px 18px rgba(200, 16, 46, 0.3);
      margin-top: 4px;
      -webkit-tap-highlight-color: transparent;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary:hover {
      box-shadow: 0 8px 24px rgba(200, 16, 46, 0.4);
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    .btn-primary:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .btn-outline {
      padding: 12px 20px;
      border: 1.5px solid #C8102E;
      border-radius: 10px;
      background: transparent;
      color: #C8102E;
      font-family: 'Poppins', sans-serif;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-outline:hover {
      background: rgba(200, 16, 46, 0.06);
    }

    .btn-outline:active {
      transform: scale(0.97);
    }

    /* ===== SPINNER ===== */
    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2.5px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ===== PESAN ERROR ===== */
    .pesan-error {
      margin-top: 14px;
      padding: 10px 14px;
      border-radius: 8px;
      background: #fef2f2;
      border: 1px solid #DC2626;
      color: #991b1b;
      font-size: 0.78rem;
      font-weight: 500;
      line-height: 1.4;
      display: none;
      animation: fadeSlide 0.25s ease;
    }

    .pesan-error.tampil {
      display: block;
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== TOAST ===== */
    #toastBox {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
      width: 90%;
      max-width: 380px;
    }

    .toast {
      padding: 13px 18px;
      border-radius: 12px;
      color: #fff;
      font-size: 0.82rem;
      font-weight: 500;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
      animation: toastIn 0.35s ease;
      pointer-events: auto;
      text-align: center;
      line-height: 1.4;
    }

    .toast.sukses { background: #059669; }
    .toast.error { background: #DC2626; }
    .toast.warning { background: #D97706; }
    .toast.info { background: #2563EB; }

    .toast.hilang {
      animation: toastOut 0.3s ease forwards;
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateY(-16px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes toastOut {
      from { opacity: 1; transform: translateY(0) scale(1); }
      to { opacity: 0; transform: translateY(-12px) scale(0.96); }
    }

    /* ===== MODAL ADMIN ===== */
    #modalAdmin {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0, 0, 0, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal {
      background: #FAFAFA;
      border-radius: 18px;
      padding: 26px 22px 22px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(245, 158, 11, 0.4);
      animation: modalUp 0.3s ease;
    }

    @keyframes modalUp {
      from { opacity: 0; transform: translateY(20px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .modal h3 {
      font-size: 1.15rem;
      font-weight: 700;
      color: #C8102E;
      margin-bottom: 18px;
      text-align: center;
    }

    .modal input {
      margin-bottom: 12px;
    }

    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 6px;
    }

    .btn-row .btn-outline,
    .btn-row .btn-primary {
      flex: 1;
      padding: 12px 0;
      font-size: 0.85rem;
    }

    /* ===== RESPONSIVE ===== */
    @media (min-width: 480px) {
      .brand h1 { font-size: 1.75rem; }
      .kartu { padding: 28px 24px 24px; }
      .logo { width: 100px; height: 100px; font-size: 42px; }
    }

    @media (max-width: 360px) {
      .brand h1 { font-size: 1.3rem; }
      .logo { width: 76px; height: 76px; font-size: 32px; }
      .kartu { padding: 20px 16px 18px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="hujanCanvas"></canvas>

    <div class="login-wrap">
      <div class="brand">
        <div class="logo" id="logoMP">MP</div>
        <h1>Steam MP 7000 Tycoon</h1>
        <div class="tagline">Jujur • Disiplin • Tanggung Jawab • Harga Mati</div>
      </div>

      <div class="kartu">
        <div class="toggle">
          <button data-mode="login" class="aktif">Masuk</button>
          <button data-mode="register">Daftar</button>
        </div>

        <!-- FORM LOGIN -->
        <form id="formLogin">
          <input id="loginNomor" placeholder="Nomor HP (08xxxxxxxxxx)" inputmode="numeric" autocomplete="off">
          <div class="input-pw">
            <input id="loginPassword" type="password" placeholder="Password" autocomplete="off">
            <button type="button" class="toggle-pw" data-target="loginPassword">👁</button>
          </div>
          <button type="submit" class="btn-primary" id="btnLogin">MASUK</button>
        </form>

        <!-- FORM REGISTER -->
        <form id="formRegister" style="display:none">
          <input id="regNama" placeholder="Nama lengkap" autocomplete="off">
          <input id="regNomor" placeholder="Nomor HP (08xxxxxxxxxx)" inputmode="numeric" autocomplete="off">
          <div class="input-pw">
            <input id="regPassword" type="password" placeholder="Password (min 6)" autocomplete="off">
            <button type="button" class="toggle-pw" data-target="regPassword">👁</button>
          </div>
          <button type="submit" class="btn-primary" id="btnRegister">DAFTAR</button>
        </form>

        <div id="pesanError" class="pesan-error"></div>
      </div>
    </div>

    <div id="toastBox"></div>

    <!-- MODAL ADMIN -->
    <div id="modalAdmin" style="display:none">
      <div class="modal">
        <h3>Login Admin</h3>
        <input id="adminId" placeholder="Admin ID" autocomplete="off">
        <input id="adminPassword" type="password" placeholder="Password" autocomplete="off">
        <div class="btn-row">
          <button type="button" id="btnAdminBatal" class="btn-outline">Batal</button>
          <button type="button" id="btnAdminLogin" class="btn-primary">Masuk</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      'use strict';

      // ==================== KONFIGURASI ====================
      var BACKEND_URL = 'https://script.google.com/macros/s/AKfycbxANi_x0tXyAqC2a6L10p5Uu4TNGvhQV4UsI8k-7rogvuzSl_o4TuECRsDCOXDjcvIA/exec';
      var TOKEN = 'steam-mp-7000-2026';

      // ==================== DEVICE ID ====================
      function getDeviceId() {
        var key = 'smp7k_device';
        var dev = localStorage.getItem(key);
        if (!dev) {
          var chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
          var rand = '';
          for (var i = 0; i < 16; i++) {
            rand += chars.charAt(Math.floor(Math.random() * chars.length));
          }
          dev = 'dev_' + rand;
          localStorage.setItem(key, dev);
        }
        return dev;
      }

      var DEVICE_ID = getDeviceId();

      // ==================== FETCH HELPER ====================
      function fetchBackend(payload) {
        return fetch(BACKEND_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify(payload),
          redirect: 'follow'
        })
        .then(function(r) { return r.text(); })
        .then(function(t) {
          try { return JSON.parse(t); }
          catch(e) { return { ok: false, pesan: 'Respons tidak valid' }; }
        })
        .catch(function(e) { return { ok: false, pesan: 'Gagal terhubung ke server' }; });
      }

      // ==================== TOAST ====================
      var toastBox = document.getElementById('toastBox');

      function toast(pesan, tipe) {
        tipe = tipe || 'info';
        var el = document.createElement('div');
        el.className = 'toast ' + tipe;
        el.textContent = pesan;
        toastBox.appendChild(el);

        setTimeout(function() {
          el.classList.add('hilang');
          setTimeout(function() {
            if (el.parentNode) el.parentNode.removeChild(el);
          }, 350);
        }, 3000);
      }

      // ==================== PESAN ERROR ====================
      var pesanError = document.getElementById('pesanError');

      function tampilError(msg) {
        pesanError.textContent = msg;
        pesanError.classList.add('tampil');
      }

      function sembunyiError() {
        pesanError.textContent = '';
        pesanError.classList.remove('tampil');
      }

      // ==================== VALIDASI ====================
      function validasiNomor(nomor) {
        var n = String(nomor).trim();
        if (!/^08\d{8,11}$/.test(n)) {
          return 'Nomor HP harus diawali 08, 10-13 digit';
        }
        return null;
      }

      function validasiPassword(pw) {
        if (!pw || pw.length < 6) {
          return 'Password minimal 6 karakter';
        }
        return null;
      }

      function validasiNama(nama) {
        if (!nama || !nama.trim()) {
          return 'Nama tidak boleh kosong';
        }
        return null;
      }

      // ==================== TOGGLE PASSWORD ====================
      document.querySelectorAll('.toggle-pw').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var targetId = this.getAttribute('data-target');
          var input = document.getElementById(targetId);
          if (!input) return;
          if (input.type === 'password') {
            input.type = 'text';
            this.textContent = '🙈';
          } else {
            input.type = 'password';
            this.textContent = '👁';
          }
        });
      });

      // ==================== TOGGLE LOGIN / REGISTER ====================
      var toggleBtns = document.querySelectorAll('.toggle button');
      var formLogin = document.getElementById('formLogin');
      var formRegister = document.getElementById('formRegister');

      toggleBtns.forEach(function(btn) {
        btn.addEventListener('click', function() {
          toggleBtns.forEach(function(b) { b.classList.remove('aktif'); });
          this.classList.add('aktif');
          var mode = this.getAttribute('data-mode');
          if (mode === 'login') {
            formLogin.style.display = 'flex';
            formRegister.style.display = 'none';
          } else {
            formLogin.style.display = 'none';
            formRegister.style.display = 'flex';
          }
          sembunyiError();
        });
      });

      // ==================== LOADING BUTTON ====================
      function setLoading(btn, loading) {
        if (loading) {
          btn.disabled = true;
          btn.dataset.original = btn.innerHTML;
          btn.innerHTML = '<span class="spinner"></span> Memproses...';
        } else {
          btn.disabled = false;
          if (btn.dataset.original) {
            btn.innerHTML = btn.dataset.original;
            delete btn.dataset.original;
          }
        }
      }

      // ==================== GENERATE SESSION TOKEN ====================
      function generateToken() {
        var chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
        var token = '';
        for (var i = 0; i < 32; i++) {
          token += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        return token;
      }

      // ==================== LOGIN HANDLER ====================
      formLogin.addEventListener('submit', function(e) {
        e.preventDefault();
        sembunyiError();

        var nomor = document.getElementById('loginNomor').value.trim();
        var password = document.getElementById('loginPassword').value;
        var btn = document.getElementById('btnLogin');

        var errNomor = validasiNomor(nomor);
        if (errNomor) { tampilError(errNomor); return; }

        var errPw = validasiPassword(password);
        if (errPw) { tampilError(errPw); return; }

        setLoading(btn, true);

        fetchBackend({ action: 'baca', token: TOKEN, sheet: 'Users' })
        .then(function(res) {
          if (!res.ok || !res.data) {
            setLoading(btn, false);
            tampilError(res.pesan || 'Gagal membaca data pengguna');
            toast(res.pesan || 'Gagal membaca data', 'error');
            return;
          }

          var users = res.data;
          var found = null;
          var nomorExists = false;
          var passwordSalah = false;
          var deviceSalah = false;
          var banned = false;

          for (var i = 0; i < users.length; i++) {
            var u = users[i];
            if (String(u.nomor).trim() === String(nomor).trim()) {
              nomorExists = true;
              if (String(u.password) === String(password)) {
                if (String(u.device_id) === String(DEVICE_ID)) {
                  if (String(u.status) !== 'banned') {
                    found = u;
                    break;
                  } else {
                    banned = true;
                  }
                } else {
                  deviceSalah = true;
                }
              } else {
                passwordSalah = true;
              }
            }
          }

          if (!found) {
            setLoading(btn, false);
            if (banned) {
              tampilError('Akun diblokir');
              toast('Akun diblokir', 'error');
            } else if (deviceSalah) {
              tampilError('Device tidak cocok');
              toast('Device tidak cocok', 'error');
            } else if (passwordSalah) {
              tampilError('Password salah');
              toast('Password salah', 'error');
            } else if (!nomorExists) {
              tampilError('Nomor belum terdaftar');
              toast('Nomor belum terdaftar', 'error');
            } else {
              tampilError('Login gagal, periksa data');
              toast('Login gagal', 'error');
            }
            return;
          }

          // === LOGIN SUKSES ===
          var sessionToken = generateToken();
          var now = new Date();
          var expires = new Date(now.getTime() + 7 * 24 * 60 * 60 * 1000);

          var sessionData = {
            token: sessionToken,
            user_id: found.id,
            is_admin: false,
            expires_at: expires.toISOString(),
            created_at: now.toISOString()
          };

          // Tulis session
          fetchBackend({ action: 'tulis', token: TOKEN, sheet: 'Sessions', data: sessionData })
          .then(function(sessRes) {
            // Update last_login
            var updateData = { last_login: now.toISOString() };
            return fetchBackend({
              action: 'update',
              token: TOKEN,
              sheet: 'Users',
              row: found._row,
              data: updateData
            });
          })
          .then(function(updRes) {
            // Simpan localStorage
            localStorage.setItem('smp7k_session', JSON.stringify({
              token: sessionToken,
              user_id: found.id,
              expires_at: expires.toISOString()
            }));

            localStorage.setItem('smp7k_user', JSON.stringify({
              id: found.id,
              nama: found.nama,
              nomor: found.nomor,
              saldo_koin: Number(found.saldo_koin) || 0,
              saldo_rupiah: Number(found.saldo_rupiah) || 0,
              kristal: Number(found.kristal) || 0,
              level: Number(found.level) || 1,
              cabang_aktif: Number(found.cabang_aktif) || 1
            }));

            setLoading(btn, false);
            toast('Login berhasil! Selamat datang, ' + found.nama, 'sukses');

            setTimeout(function() {
              window.location.href = 'dashboard.html';
            }, 600);
          })
          .catch(function() {
            setLoading(btn, false);
            tampilError('Gagal menyimpan sesi');
            toast('Gagal menyimpan sesi', 'error');
          });
        })
        .catch(function() {
          setLoading(btn, false);
          tampilError('Gagal terhubung ke server');
          toast('Gagal terhubung ke server', 'error');
        });
      });

      // ==================== REGISTER HANDLER ====================
      formRegister.addEventListener('submit', function(e) {
        e.preventDefault();
        sembunyiError();

        var nama = document.getElementById('regNama').value.trim();
        var nomor = document.getElementById('regNomor').value.trim();
        var password = document.getElementById('regPassword').value;
        var btn = document.getElementById('btnRegister');

        var errNama = validasiNama(nama);
        if (errNama) { tampilError(errNama); return; }

        var errNomor = validasiNomor(nomor);
        if (errNomor) { tampilError(errNomor); return; }

        var errPw = validasiPassword(password);
        if (errPw) { tampilError(errPw); return; }

        setLoading(btn, true);

        fetchBackend({ action: 'baca', token: TOKEN, sheet: 'Users' })
        .then(function(res) {
          if (!res.ok || !res.data) {
            setLoading(btn, false);
            tampilError(res.pesan || 'Gagal membaca data pengguna');
            toast(res.pesan || 'Gagal membaca data', 'error');
            return;
          }

          var users = res.data;
          var nomorTerdaftar = false;
          var deviceTerdaftar = false;
          var maxId = 0;

          for (var i = 0; i < users.length; i++) {
            var u = users[i];
            if (String(u.nomor).trim() === String(nomor).trim()) {
              nomorTerdaftar = true;
            }
            if (String(u.device_id).trim() === String(DEVICE_ID).trim()) {
              deviceTerdaftar = true;
            }
            // Cari ID MP7000-xxxx
            var idStr = String(u.id || '');
            if (idStr.indexOf('MP7000-') === 0) {
              var numPart = parseInt(idStr.replace('MP7000-', ''), 10);
              if (!isNaN(numPart) && numPart > maxId) {
                maxId = numPart;
              }
            }
          }

          if (nomorTerdaftar) {
            setLoading(btn, false);
            tampilError('Nomor sudah terdaftar, silakan login');
            toast('Nomor sudah terdaftar', 'warning');
            return;
          }

          if (deviceTerdaftar) {
            setLoading(btn, false);
            tampilError('Device ini sudah terdaftar');
            toast('Device sudah terdaftar', 'warning');
            return;
          }

          // Generate ID
          var newIdNum = maxId + 1;
          var newId = 'MP7000-' + String(newIdNum).padStart(4, '0');

          var today = new Date();
          var tgl = today.getFullYear() + '-' +
                    String(today.getMonth() + 1).padStart(2, '0') + '-' +
                    String(today.getDate()).padStart(2, '0');

          var userData = {
            id: newId,
            nama: nama,
            nomor: nomor,
            password: password,
            device_id: DEVICE_ID,
            saldo_koin: 0,
            saldo_rupiah: 0,
            kristal: 0,
            level: 1,
            cabang_aktif: 1,
            status: 'aktif',
            last_login: '',
            last_sync: '',
            tanggal_daftar: tgl
          };

          fetchBackend({ action: 'tulis', token: TOKEN, sheet: 'Users', data: userData })
          .then(function(tulisRes) {
            if (!tulisRes.ok) {
              setLoading(btn, false);
              tampilError(tulisRes.pesan || 'Gagal mendaftar');
              toast(tulisRes.pesan || 'Gagal mendaftar', 'error');
              return;
            }

            toast('Pendaftaran berhasil! Silakan login', 'sukses');
            setLoading(btn, false);

            // Auto login
            document.getElementById('loginNomor').value = nomor;
            document.getElementById('loginPassword').value = password;

            // Switch ke tab login
            toggleBtns.forEach(function(b) {
              if (b.getAttribute('data-mode') === 'login') {
                b.click();
              }
            });

            // Submit form login otomatis setelah jeda
            setTimeout(function() {
              formLogin.dispatchEvent(new Event('submit', { cancelable: true }));
            }, 400);
          })
          .catch(function() {
            setLoading(btn, false);
            tampilError('Gagal mendaftar, coba lagi');
            toast('Gagal mendaftar', 'error');
          });
        })
        .catch(function() {
          setLoading(btn, false);
          tampilError('Gagal terhubung ke server');
          toast('Gagal terhubung ke server', 'error');
        });
      });

      // ==================== ADMIN LOGIN (TAP LOGO 5x) ====================
      var logoMP = document.getElementById('logoMP');
      var tapCount = 0;
      var tapTimer = null;
      var modalAdmin = document.getElementById('modalAdmin');

      logoMP.addEventListener('click', function() {
        tapCount++;
        if (tapTimer) clearTimeout(tapTimer);
        tapTimer = setTimeout(function() {
          tapCount = 0;
        }, 3000);

        if (tapCount >= 5) {
          tapCount = 0;
          if (tapTimer) clearTimeout(tapTimer);
          modalAdmin.style.display = 'flex';
          document.getElementById('adminId').value = '';
          document.getElementById('adminPassword').value = '';
          document.getElementById('adminId').focus();
        }
      });

      document.getElementById('btnAdminBatal').addEventListener('click', function() {
        modalAdmin.style.display = 'none';
      });

      modalAdmin.addEventListener('click', function(e) {
        if (e.target === modalAdmin) {
          modalAdmin.style.display = 'none';
        }
      });

      document.getElementById('btnAdminLogin').addEventListener('click', function() {
        var adminId = document.getElementById('adminId').value.trim();
        var adminPw = document.getElementById('adminPassword').value;
        var btn = this;

        if (!adminId || !adminPw) {
          toast('Isi ID dan password admin', 'warning');
          return;
        }

        setLoading(btn, true);

        fetchBackend({ action: 'baca', token: TOKEN, sheet: 'Users' })
        .then(function(res) {
          if (!res.ok || !res.data) {
            setLoading(btn, false);
            toast(res.pesan || 'Gagal membaca data', 'error');
            return;
          }

          var users = res.data;
          var adminUser = null;

          for (var i = 0; i < users.length; i++) {
            if (String(users[i].id).trim() === '1001') {
              adminUser = users[i];
              break;
            }
          }

          if (!adminUser || String(adminUser.password) !== String(adminPw)) {
            setLoading(btn, false);
            toast('Admin ID atau password salah', 'error');
            return;
          }

          // Admin login sukses
          var sessionToken = generateToken();
          var now = new Date();
          var expires = new Date(now.getTime() + 7 * 24 * 60 * 60 * 1000);

          var sessionData = {
            token: sessionToken,
            user_id: '1001',
            is_admin: true,
            expires_at: expires.toISOString(),
            created_at: now.toISOString()
          };

          fetchBackend({ action: 'tulis', token: TOKEN, sheet: 'Sessions', data: sessionData })
          .then(function(sessRes) {
            if (!sessRes.ok) {
              setLoading(btn, false);
              toast('Gagal membuat sesi admin', 'error');
              return;
            }

            localStorage.setItem('smp7k_admin', JSON.stringify({
              token: sessionToken,
              user_id: '1001'
            }));

            setLoading(btn, false);
            modalAdmin.style.display = 'none';
            toast('Login admin berhasil!', 'sukses');

            setTimeout(function() {
              window.location.href = 'dashboard.html?admin=1';
            }, 600);
          })
          .catch(function() {
            setLoading(btn, false);
            toast('Gagal membuat sesi admin', 'error');
          });
        })
        .catch(function() {
          setLoading(btn, false);
          toast('Gagal terhubung ke server', 'error');
        });
      });

      // ==================== ANIMASI HUJAN ====================
      var canvas = document.getElementById('hujanCanvas');
      var ctx = canvas.getContext('2d');
      var W, H;
      var hujan = [];
      var riak = [];
      var awan = [];
      var kilat = { aktif: false, alpha: 0 };
      var lastKilat = Date.now();

      function resizeCanvas() {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
        initHujan();
        initAwan();
      }

      function initHujan() {
        hujan = [];
        var jumlah = Math.floor(W * H / 14000);
        if (jumlah > 220) jumlah = 220;
        if (jumlah < 50) jumlah = 50;
        for (var i = 0; i < jumlah; i++) {
          hujan.push({
            x: Math.random() * W,
            y: Math.random() * H,
            len: 8 + Math.random() * 14,
            speed: 0.6 + Math.random() * 0.9,
            alpha: 0.08 + Math.random() * 0.22,
            width: 0.6 + Math.random() * 0.9
          });
        }
      }

      function initAwan() {
        awan = [];
        for (var i = 0; i < 5; i++) {
          awan.push({
            x: Math.random() * W,
            y: 10 + Math.random() * 80,
            w: 180 + Math.random() * 260,
            h: 40 + Math.random() * 50,
            speed: 0.08 + Math.random() * 0.18,
            alpha: 0.06 + Math.random() * 0.1
          });
        }
      }

      function gambarAwan() {
        for (var i = 0; i < awan.length; i++) {
          var a = awan[i];
          ctx.save();
          ctx.globalAlpha = a.alpha;
          ctx.fillStyle = '#3a2a2a';
          ctx.beginPath();
          ctx.ellipse(a.x, a.y, a.w, a.h, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();

          a.x += a.speed;
          if (a.x > W + a.w + 100) {
            a.x = -a.w - 100;
            a.y = 10 + Math.random() * 80;
          }
        }
      }

      function gambarHujan() {
        for (var i = 0; i < hujan.length; i++) {
          var d = hujan[i];
          ctx.beginPath();
          ctx.strokeStyle = 'rgba(200, 16, 46, ' + d.alpha + ')';
          ctx.lineWidth = d.width;
          ctx.lineCap = 'round';
          ctx.moveTo(d.x, d.y);
          ctx.lineTo(d.x - 1, d.y + d.len);
          ctx.stroke();

          d.y += d.speed;
          if (d.y > H + 20) {
            // Buat riak
            if (Math.random() < 0.3) {
              riak.push({
                x: d.x,
                y: H - 4 - Math.random() * 12,
                r: 0,
                maxR: 8 + Math.random() * 18,
                alpha: 0.18 + Math.random() * 0.15,
                speed: 0.4 + Math.random() * 0.5
              });
            }
            d.y = -d.len - Math.random() * 40;
            d.x = Math.random() * W;
          }
        }
      }

      function gambarRiak() {
        for (var i = riak.length - 1; i >= 0; i--) {
          var r = riak[i];
          ctx.beginPath();
          ctx.strokeStyle = 'rgba(200, 16, 46, ' + r.alpha + ')';
          ctx.lineWidth = 0.7;
          ctx.ellipse(r.x, r.y, r.r, r.r * 0.3, 0, 0, Math.PI * 2);
          ctx.stroke();

          r.r += r.speed;
          r.alpha *= 0.985;
          if (r.r > r.maxR || r.alpha < 0.005) {
            riak.splice(i, 1);
          }
        }
      }

      function gambarKilat() {
        var now = Date.now();
        if (!kilat.aktif && now - lastKilat > 30000) {
          kilat.aktif = true;
          kilat.alpha = 0.7;
          lastKilat = now;
          setTimeout(function() {
            kilat.aktif = false;
          }, 200);
        }
        if (kilat.aktif && kilat.alpha > 0) {
          ctx.fillStyle = 'rgba(255, 255, 255, ' + kilat.alpha + ')';
          ctx.fillRect(0, 0, W, H);
          kilat.alpha *= 0.88;
        }
      }

      function loop() {
        ctx.clearRect(0, 0, W, H);

        // Background gradient gelap elegan
        var grad = ctx.createLinearGradient(0, 0, 0, H);
        grad.addColorStop(0, 'rgba(30, 15, 15, 0.3)');
        grad.addColorStop(0.5, 'rgba(50, 25, 25, 0.2)');
        grad.addColorStop(1, 'rgba(80, 40, 40, 0.15)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);

        gambarAwan();
        gambarHujan();
        gambarRiak();
        gambarKilat();

        requestAnimationFrame(loop);
      }

      window.addEventListener('resize', resizeCanvas);

      // ==================== INIT ====================
      resizeCanvas();
      loop();

      // Sembunyikan error saat mulai
      sembunyiError();

      console.log('%cSteam MP 7000 Tycoon v0.02', 'color:#C8102E;font-size:16px;font-weight:bold;');
      console.log('%cDevice ID: ' + DEVICE_ID, 'color:#F59E0B;font-size:12px;');
    })();
  </script>
</body>
</html>
