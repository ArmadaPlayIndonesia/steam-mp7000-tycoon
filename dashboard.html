  // ==================== SPAWN MOTOR ====================
  function spawnMotor() {
    var canvas = $('gameCanvas');
    var W = canvas.width, H = canvas.height;
    var parkiranPenuh = state.parkiran.length >= 15;
    var isMoge = false;
    if (!parkiranPenuh && Math.random() < 0.125) { // 1 in 8
      isMoge = true;
      state.mogeCount++;
    }
    var arahKanan = Math.random() < 0.5;
    var x = arahKanan ? -60 : W + 60;
    var jalanY = H * 0.72;
    var masukParkir = !parkiranPenuh && (Math.random() < 0.4) && !isMoge;
    // Moge always goes to parkir
    if (isMoge) masukParkir = true;
    var motor = {
      id: Date.now() + Math.random(),
      x: x,
      y: jalanY,
      arah: arahKanan ? 'kiri-ke-kanan' : 'kanan-ke-kiri',
      state: 'lewat',
      kotor: true,
      tapCount: 0,
      waktuMasuk: Date.now(),
      isMoge: isMoge,
      sudahNontonIklan: false,
      targetSlot: -1,
      speed: 0.8 + Math.random() * 0.6,
      warna: isMoge ? '#ff6b6b' : '#ddd'
    };
    if (masukParkir) {
      var slot = cariSlotKosong();
      if (slot >= 0) {
        motor.state = 'parkir';
        motor.targetSlot = slot;
        motor.waktuMasuk = Date.now();
        state.parkiran.push(motor);
      } else {
        motor.state = 'lewat';
      }
    }
    state.motors.push(motor);
  }

  function cariSlotKosong() {
    for (var i = 0; i < 15; i++) {
      var occupied = false;
      for (var j = 0; j < state.parkiran.length; j++) {
        if (state.parkiran[j].targetSlot === i && state.parkiran[j].state === 'parkir') {
          occupied = true;
          break;
        }
      }
      if (!occupied) return i;
    }
    return -1;
  }

  function getSlotPosition(slot) {
    var canvas = $('gameCanvas');
    var W = canvas.width, H = canvas.height;
    var startX = W * 0.15;
    var startY = H * 0.58;
    var col = slot % 5;
    var row = Math.floor(slot / 5);
    return { x: startX + col * 62, y: startY + row * 52 };
  }

  // ==================== GAME LOOP ====================
  function gameLoop(t) {
    var canvas = $('gameCanvas');
    var ctx = canvas.getContext('2d');
    var hujanCanvas = $('hujanCanvas');
    var hujanCtx = hujanCanvas.getContext('2d');
    var dt = t - state.lastFrame;
    state.lastFrame = t;
    if (dt > 200) dt = 200;

    // Update cuaca
    state.cuacaTimer += dt;
    if (state.cuacaTimer > state.cuacaDuration * 1000) {
      state.cuacaTimer = 0;
      state.cuacaDuration = randomInt(60, 180);
      state.cuaca = state.cuaca === 'panas' ? 'hujan' : 'panas';
      state.hujan = state.cuaca === 'hujan';
      state.spawnInterval = state.cuaca === 'hujan' ? 6000 : 1500;
      toast(state.cuaca === 'hujan' ? '🌧️ Hujan turun! Pelanggan sepi...' : '☀️ Panas! Pelanggan ramai!', 'info');
      renderHeader();
    }
    // Fade hujan
    var targetAlpha = state.cuaca === 'hujan' ? 1 : 0;
    state.hujanAlpha += (targetAlpha - state.hujanAlpha) * 0.02;

    // Spawn motor
    state.lastSpawn += dt;
    var interval = state.cuaca === 'hujan' ? 6000 : 1500;
    if (state.cuaca === 'hujan') {
      interval = state.parkiran.length >= 15 ? 8000 : 6000;
    } else {
      interval = state.parkiran.length >= 15 ? 2000 : 1500;
    }
    if (state.lastSpawn > interval) {
      state.lastSpawn = 0;
      spawnMotor();
    }

    // Update motors
    var H = canvas.height, W = canvas.width;
    for (var i = state.motors.length - 1; i >= 0; i--) {
      var m = state.motors[i];
      if (m.state === 'lewat') {
        m.x += (m.arah === 'kiri-ke-kanan' ? 1 : -1) * m.speed * (dt / 16);
        if ((m.arah === 'kiri-ke-kanan' && m.x > W + 80) || (m.arah === 'kanan-ke-kiri' && m.x < -80)) {
          state.motors.splice(i, 1);
        }
      } else if (m.state === 'parkir') {
        var slotPos = getSlotPosition(m.targetSlot);
        m.x += (slotPos.x - m.x) * 0.08;
        m.y += (slotPos.y - m.y) * 0.08;
        // Timer kabur
        var elapsed = (Date.now() - m.waktuMasuk) / 1000;
        if (!m.isMoge && elapsed > 8) {
          // kabur
          m.state = 'pergi';
          m.arah = Math.random() < 0.5 ? 'kiri-ke-kanan' : 'kanan-ke-kiri';
          toast('Pelanggan kabur!', 'info');
          // remove from parkiran
          var idx = state.parkiran.indexOf(m);
          if (idx >= 0) state.parkiran.splice(idx, 1);
        }
        if (m.isMoge && elapsed > 10 && !m.sudahNontonIklan) {
          m.state = 'pergi';
          m.arah = Math.random() < 0.5 ? 'kiri-ke-kanan' : 'kanan-ke-kiri';
          toast('Moge kabur!', 'info');
          var idx2 = state.parkiran.indexOf(m);
          if (idx2 >= 0) state.parkiran.splice(idx2, 1);
        }
      } else if (m.state === 'pergi') {
        m.x += (m.arah === 'kiri-ke-kanan' ? 1 : -1) * m.speed * 2 * (dt / 16);
        if ((m.arah === 'kiri-ke-kanan' && m.x > W + 80) || (m.arah === 'kanan-ke-kiri' && m.x < -80)) {
          state.motors.splice(i, 1);
        }
      }
    }

    // Update particles
    for (var p = state.particles.length - 1; p >= 0; p--) {
      var pt = state.particles[p];
      pt.x += pt.vx * (dt / 16);
      pt.y += pt.vy * (dt / 16);
      pt.life -= dt;
      if (pt.life <= 0) state.particles.splice(p, 1);
    }

    // Update coin anims
    for (var c = state.coinAnims.length - 1; c >= 0; c--) {
      var ca = state.coinAnims[c];
      ca.life -= dt;
      if (ca.life <= 0) state.coinAnims.splice(c, 1);
    }

    // Rendering
    renderGame(ctx, W, H);
    renderHujan(hujanCtx, W, H);

    requestAnimationFrame(gameLoop);
  }

  // ==================== RENDER GAME ====================
  function renderGame(ctx, W, H) {
    ctx.clearRect(0, 0, W, H);
    // Langit
    var skyGrad = ctx.createLinearGradient(0, 0, 0, H * 0.7);
    if (state.cuaca === 'hujan') {
      skyGrad.addColorStop(0, '#3a4a5a');
      skyGrad.addColorStop(1, '#6b7b8b');
    } else {
      skyGrad.addColorStop(0, '#87CEEB');
      skyGrad.addColorStop(1, '#f0e68c');
    }
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, W, H);

    // Matahari / awan
    if (state.cuaca === 'panas') {
      ctx.beginPath();
      ctx.arc(W * 0.8, H * 0.15, 40, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 220, 50, 0.9)';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(W * 0.8, H * 0.15, 55, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 220, 50, 0.2)';
      ctx.fill();
    }

    // Bangunan ruko
    var rukoY = H * 0.48;
    ctx.fillStyle = '#c0392b';
    ctx.fillRect(0, rukoY, W, 40);
    ctx.fillStyle = '#e74c3c';
    for (var i = 0; i < W; i += 70) {
      ctx.fillRect(i + 5, rukoY - 15, 60, 20);
    }
    // Atap putih
    ctx.fillStyle = '#ecf0f1';
    ctx.fillRect(0, rukoY - 18, W, 8);

    // Parkiran area
    ctx.fillStyle = '#7f8c8d';
    ctx.fillRect(0, H * 0.55, W, H * 0.12);

    // Slot parkiran
    for (var s = 0; s < 15; s++) {
      var sp = getSlotPosition(s);
      ctx.strokeStyle = 'rgba(255,255,255,0.15)';
      ctx.lineWidth = 1;
      ctx.setLineDash([3, 3]);
      ctx.strokeRect(sp.x - 14, sp.y - 14, 28, 28);
      ctx.setLineDash([]);
    }

    // Jalan raya
    ctx.fillStyle = '#2c3e50';
    ctx.fillRect(0, H * 0.72, W, H * 0.14);
    // Marka jalan
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    for (var d = 0; d < W; d += 40) {
      ctx.fillRect(d, H * 0.785, 20, 3);
    }

    // Genangan air (hujan)
    if (state.hujanAlpha > 0.2) {
      ctx.fillStyle = 'rgba(100, 150, 200, ' + (state.hujanAlpha * 0.15) + ')';
      ctx.fillRect(0, H * 0.73, W, H * 0.04);
    }

    // Motors
    state.motors.forEach(function(m){
      var emoji = '🏍️';
      if (m.isMoge) emoji = '🏍️';
      ctx.font = '28px serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      // Dirty effect
      if (m.kotor && m.state === 'parkir' && m.tapCount < 3) {
        ctx.globalAlpha = 0.7;
      }
      ctx.fillText(emoji, m.x, m.y);
      ctx.globalAlpha = 1;
      // Timer emoji 💢
      if (m.state === 'parkir' && !m.isMoge) {
        var elapsed = (Date.now() - m.waktuMasuk) / 1000;
        if (elapsed > 5) {
          ctx.font = '16px serif';
          ctx.fillText('💢', m.x + 18, m.y - 18);
        }
      }
      // Moge 🎬 icon
      if (m.isMoge && m.state === 'parkir' && !m.sudahNontonIklan) {
        ctx.font = '18px serif';
        ctx.fillText('🎬', m.x, m.y - 22);
      }
      // Coin animation text
      if (m._coinAnim) {
        ctx.font = 'bold 14px sans-serif';
        ctx.fillStyle = '#f1c40f';
        ctx.fillText('+' + m._coinAnim, m.x, m.y - 30);
      }
    });

    // Particles
    state.particles.forEach(function(p){
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(100, 180, 255, ' + Math.max(0, p.life / 500) * 0.7 + ')';
      ctx.fill();
    });

    // Coin anims
    state.coinAnims.forEach(function(ca){
      ctx.font = 'bold ' + (14 + (1 - ca.life/800) * 6) + 'px sans-serif';
      ctx.fillStyle = 'rgba(243, 156, 18, ' + (ca.life/800) + ')';
      ctx.textAlign = 'center';
      ctx.fillText('+' + ca.amount, ca.x, ca.y - (1 - ca.life/800) * 40);
    });
  }

  // ==================== RENDER HUJAN ====================
  function renderHujan(ctx, W, H) {
    ctx.clearRect(0, 0, W, H);
    if (state.hujanAlpha < 0.05) return;
    var count = Math.floor(80 * state.hujanAlpha);
    ctx.strokeStyle = 'rgba(180, 210, 240, ' + (state.hujanAlpha * 0.5) + ')';
    ctx.lineWidth = 1.5;
    for (var i = 0; i < count; i++) {
      var x = Math.random() * W;
      var y = Math.random() * H;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x - 3, y + 12);
      ctx.stroke();
    }
  }

  // ==================== TAP DETECTION ====================
  function handleTap(e) {
    var canvas = $('gameCanvas');
    var rect = canvas.getBoundingClientRect();
    var clientX, clientY;
    if (e.touches) {
      clientX = e.touches[0].clientX;
      clientY = e.touches[0].clientY;
    } else {
      clientX = e.clientX;
      clientY = e.clientY;
    }
    var x = (clientX - rect.left) * (canvas.width / rect.width);
    var y = (clientY - rect.top) * (canvas.height / rect.height);

    initAudio();

    // Check motors in parkiran
    var hit = false;
    for (var i = state.parkiran.length - 1; i >= 0; i--) {
      var m = state.parkiran[i];
      var dx = x - m.x;
      var dy = y - m.y;
      if (Math.abs(dx) < 30 && Math.abs(dy) < 30 && m.state === 'parkir') {
        hit = true;
        if (m.isMoge && !m.sudahNontonIklan) {
          // Show modal to watch ad
          showMogeModal(m);
        } else {
          tapMotor(m);
        }
        break;
      }
    }
    if (!hit) {
      // Tap empty area: no coin, maybe small splash
      spawnSplash(x, y, 3);
    }
  }

  function tapMotor(m) {
    m.tapCount++;
    spawnSplash(m.x, m.y, 5);
    playSound('air');
    var needed = m.isMoge ? 5 : 3;
    if (m.tapCount >= needed) {
      // Bersih!
      m.kotor = false;
      var bayar = m.isMoge ? 25 : 5;
      state.saldoKoin += bayar;
      state.totalKoin += bayar;
      playSound('coin');
      // Coin animation
      state.coinAnims.push({ x: m.x, y: m.y - 30, life: 800, amount: bayar });
      // Remove from parkiran
      var idx = state.parkiran.indexOf(m);
      if (idx >= 0) state.parkiran.splice(idx, 1);
      // Motor pergi
      m.state = 'pergi';
      m.arah = Math.random() < 0.5 ? 'kiri-ke-kanan' : 'kanan-ke-kiri';
      toast('+' + bayar + ' koin!', 'success');
      renderHeader();
      // Cek level up
      checkLevelUp();
    }
  }

  function spawnSplash(x, y, count) {
    for (var i = 0; i < count; i++) {
      state.particles.push({
        x: x + (Math.random() - 0.5) * 20,
        y: y + (Math.random() - 0.5) * 20,
        vx: (Math.random() - 0.5) * 3,
        vy: (Math.random() - 0.5) * 3 - 1,
        r: 2 + Math.random() * 5,
        life: 400 + Math.random() * 300
      });
    }
  }

  function checkLevelUp() {
    while (state.totalKoin >= state.expNext) {
      state.level++;
      state.expNext = Math.floor(state.expNext * 1.8);
      playSound('levelup');
      toast('⬆️ Level Up! Level ' + state.level, 'success');
      renderHeader();
    }
  }

  // ==================== PANEL: GAME ====================
  function renderGamePanel(panel) {
    var title = el('div', 'panel-title', '🎮 Upgrade Steam');
    panel.appendChild(title);
    UPGRADE_DEFS.forEach(function(def){
      var u = state.upgrades[def.key] || { level: 0, count: 1 };
      var level = u.level || 0;
      var price = getUpgradePrice(def.key, level);
      var prod = getUpgradeProd(def.key, level);

      card.innerHTML =
        '<div class="info">' +
          '<div class="name">' + def.nama + ' <span style="font-size:10px;color:#aaa">Lv' + level + '</span></div>' +

        '</div>' +
        '<button class="btn-buy" ' + (state.saldoKoin < price ? 'disabled' : '') + '>Upgrade</button>';

      '<div class="input-group"><label>Jumlah Koin</label><input type="number" id="convertJumlah" placeholder="Min 10.000" value="10000"></div>' +

      '</div>' +
      '<button class="btn-block" id="btnConvert">Konversi</button>';

    var input = $('convertJumlah');
    var preview = $('convertPreview');
    function updatePreview() {
      var v = parseInt(input.value) || 0;
      var rp = Math.floor(v / 1000) * 100;
      var mode = document.querySelector('input[name="convertMode"]:checked').value;
      if (mode === 'potong') rp = Math.floor(rp * 0.9);
      preview.textContent = 'Rp ' + rp.toLocaleString('id-ID');
    }
    input.oninput = updatePreview;
    document.querySelectorAll('input[name="convertMode"]').forEach(function(r){ r.onchange = updatePreview; });
    updatePreview();

    $('btnConvert').onclick = function(){
      var v = parseInt(input.value) || 0;
      if (v < 10000) { playSound('error'); toast('Minimal 10.000 koin!', 'error'); return; }
      if (state.saldoKoin < v) { playSound('error'); toast('Koin tidak cukup!', 'error'); return; }
      var mode = document.querySelector('input[name="convertMode"]:checked').value;
      var rp = Math.floor(v / 1000) * 100;
      if (mode === 'iklan') {
        tampilkanIklan(function(){
          state.saldoRupiah += rp;
          state.saldoKoin -= v;
          playSound('coin');
          toast('Convert berhasil! +' + formatRupiah(rp), 'success');
          renderHeader();
          saveUserToSheet();
        });
      } else {
        rp = Math.floor(rp * 0.9);
        state.saldoRupiah += rp;
        state.saldoKoin -= v;
        playSound('coin');
        toast('Convert berhasil! +' + formatRupiah(rp), 'success');
        renderHeader();
        saveUserToSheet();
      }
    };
  }

  // ==================== PANEL: TOPUP ====================
  function renderTopupPanel(panel) {
    var title = el('div', 'panel-title', '💰 Topup');
    panel.appendChild(title);
    var div = el('div');
    div.innerHTML =
      '<div class="input-group"><label>Jenis</label><select id="topupJenis">' +
      '<option value="koin">Koin</option><option value="rupiah">Rupiah</option><option value="kristal">Kristal</option>' +
      '</select></div>' +
      '<div id="topupPaket"></div>' +
      '<div class="qris-placeholder" id="qrisBox">QRIS<br><small>assets/qris.png</small></div>' +
      '<div class="input-group"><label>Upload Bukti</label><input type="file" id="topupBukti" accept="image/*"></div>' +
      '<button class="btn-block" id="btnTopup">Kirim Topup</button>' +
      '<div style="margin-top:12px;font-size:11px;color:#aaa;" id="riwayatTopup">Memuat riwayat...</div>';
    panel.appendChild(div);

    function renderPaket() {
      var jenis = $('topupJenis').value;
      var box = $('topupPaket');
      var paket = [];
      if (jenis === 'koin') paket = [[5000,100000],[10000,250000],[25000,700000],[50000,1500000],[100000,3500000]];
      else if (jenis === 'rupiah') paket = [[5000,5500],[10000,12000],[25000,32500],[50000,70000],[100000,150000]];
      else paket = [[5000,10],[10000,25],[25000,70],[50000,160],[100000,350]];
      box.innerHTML = paket.map(function(p){
        return '<div class="upgrade-card"><div class="info"><div class="name">Rp ' + p[0].toLocaleString('id-ID') + '</div>' +
          '<div class="prod">→ ' + (jenis==='kristal'?'💎 ':'🪙 ') + p[1].toLocaleString('id-ID') + '</div></div>' +
          '<button class="btn-buy" data-harga="' + p[0] + '" data-jumlah="' + p[1] + '">Pilih</button></div>';
      }).join('');
      box.querySelectorAll('.btn-buy').forEach(function(b){
        b.onclick = function(){
          box.querySelectorAll('.btn-buy').forEach(function(x){ x.style.background = ''; });
          b.style.background = '#2ecc71';
          b.setAttribute('data-selected', '1');
        };
      });
    }
    $('topupJenis').onchange = renderPaket;
    renderPaket();

    $('btnTopup').onclick = function(){
      var selected = $('topupPaket').querySelector('.btn-buy[data-selected="1"]');
      if (!selected) { playSound('error'); toast('Pilih paket dulu!', 'error'); return; }
      var fileInput = $('topupBukti');
      if (!fileInput.files || !fileInput.files[0]) { playSound('error'); toast('Upload bukti dulu!', 'error'); return; }
      var file = fileInput.files[0];
      var reader = new FileReader();
      reader.onload = function(ev){
        // Compress via canvas
        var img = new Image();
        img.onload = function(){
          var canvas = document.createElement('canvas');
          var scale = Math.min(1, 500 / Math.max(img.width, img.height));
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          var base64 = canvas.toDataURL('image/jpeg', 0.6);
          api('tulis', { sheet: 'Topups', data: {
            user: state.user.nomor,
            jenis: $('topupJenis').value,
            harga: selected.getAttribute('data-harga'),
            jumlah: selected.getAttribute('data-jumlah'),
            bukti: base64,
            status: 'pending',
            waktu: new Date().toISOString()
          }}).then(function(res){
            if (res && res.ok) toast('Topup dikirim! Menunggu verifikasi.', 'success');
            else toast('Gagal kirim topup.', 'error');
          });
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    };

    // Riwayat
    api('baca', { sheet: 'Topups' }).then(function(res){
      var list = (res && res.ok && res.data) ? res.data.filter(function(t){ return t.user === state.user.nomor; }) : [];
      var box = $('riwayatTopup');
      if (box) box.innerHTML = list.length ? list.map(function(t){
        return '<div>• ' + t.jenis + ' Rp' + t.harga + ' → ' + t.jumlah + ' [' + t.status + ']</div>';
      }).join('') : 'Belum ada riwayat.';
    });
  }

      window.location.href = 'index.html';
    };
    panel.querySelectorAll('.admin-tab').forEach(function(btn){
      btn.onclick = function(){
        state.adminTab = btn.getAttribute('data-tab');
        renderAdmin();
      };
    });
    renderAdminContent();
  }

  function renderAdminContent() {
    var box = $('adminContent');
    if (!box) return;
    var tab = state.adminTab;
    if (tab === 'Dashboard') {
      Promise.all([
        api('baca', { sheet: 'Users' }),
        api('baca', { sheet: 'Topups' }),
        api('baca', { sheet: 'Vouchers' })
      ]).then(function(res){
        var users = (res[0] && res[0].ok) ? res[0].data : [];
        var topups = (res[1] && res[1].ok) ? res[1].data : [];
        var vouchers = (res[2] && res[2].ok) ? res[2].data : [];
        var totalKoin = users.reduce(function(s,u){ return s + (u.koin||0); }, 0);
        var pending = topups.filter(function(t){ return t.status === 'pending'; }).length;
        var aktif = vouchers.filter(function(v){ return v.status === 'aktif'; }).length;
        box.innerHTML =
          '<div class="admin-card"><div class="row"><span class="label">Total Pemain</span><span class="value">' + users.length + '</span></div>' +
          '<div class="row"><span class="label">Total Koin Beredar</span><span class="value">' + formatNumber(totalKoin) + '</span></div>' +
          '<div class="row"><span class="label">Topup Pending</span><span class="value">' + pending + '</span></div>' +
          '<div class="row"><span class="label">Voucher Aktif</span><span class="value">' + aktif + '</span></div></div>';
      });
    } else if (tab === 'Pemain') {
      api('baca', { sheet: 'Users' }).then(function(res){
        var users = (res && res.ok) ? res.data : [];
        var html = '<input class="admin-input" id="adminCari" placeholder="Cari nama/nomor...">';
        html += '<div class="admin-list" id="adminUserList">' + users.map(function(u){
          return '<div class="admin-card" data-row="' + u._row + '">' +
            '<div class="row"><span class="label">' + (u.nama||'-') + '</span><span class="value">' + sensorHP(u.nomor) + '</span></div>' +
            '<div class="row"><span class="label">Koin</span><span class="value">' + formatNumber(u.koin||0) + '</span></div>' +
            '<button class="admin-btn blue" onclick="window._adminDetail(' + u._row + ')">Detail</button></div>';
        }).join('') + '</div>';
        box.innerHTML = html;
        $('adminCari').oninput = function(){
          var q = this.value.toLowerCase();
          box.querySelectorAll('#adminUserList .admin-card').forEach(function(c){
            c.style.display = c.textContent.toLowerCase().includes(q) ? '' : 'none';
          });
        };
      });
      window._adminDetail = function(row) {
        api('bacaSatu', { sheet: 'Users', kolom: '_row', nilai: row }).then(function(res){
          if (!res || !res.ok || !res.data) { toast('Gagal ambil data', 'error'); return; }
          var u = res.data;
          box.innerHTML =
            '<button class="admin-btn gray" onclick="renderAdminContent()">← Kembali</button>' +
            '<div class="admin-card"><h3>' + (u.nama||'-') + '</h3>' +
            '<div class="row"><span class="label">Nomor</span><span class="value">' + u.nomor + '</span></div>' +
            '<div class="row"><span class="label">Koin</span><input class="admin-input" id="admKoin" value="' + (u.koin||0) + '"></div>' +
            '<div class="row"><span class="label">Rupiah</span><input class="admin-input" id="admRupiah" value="' + (u.rupiah||0) + '"></div>' +
            '<div class="row"><span class="label">Kristal</span><input class="admin-input" id="admKristal" value="' + (u.kristal||0) + '"></div>' +
            '<div class="row"><span class="label">Level</span><input class="admin-input" id="admLevel" value="' + (u.level||1) + '"></div>' +
            '<button class="admin-btn green" onclick="window._adminSimpan(' + row + ')">Simpan</button>' +
            '<button class="admin-btn red" onclick="window._adminBan(' + row + ')">Banned</button>' +
            '<button class="admin-btn orange" onclick="window._adminReset(' + row + ')">Reset</button></div>';
        });
      };
      window._adminSimpan = function(row) {
        var data = {
          koin: parseInt($('admKoin').value)||0,
          rupiah: parseInt($('admRupiah').value)||0,
          kristal: parseInt($('admKristal').value)||0,
          level: parseInt($('admLevel').value)||1
        };
        api('update', { sheet: 'Users', row: row, data: data }).then(function(res){
          if (res && res.ok) { toast('Data tersimpan', 'success'); renderAdminContent(); }
          else toast('Gagal simpan', 'error');
        });
      };
      window._adminBan = function(row) {
        api('update', { sheet: 'Users', row: row, data: { banned: true } }).then(function(){
          toast('User dibanned', 'info'); renderAdminContent();
        });
      };
      window._adminReset = function(row) {
        if (!confirm('Reset semua progress user ini?')) return;
        api('update', { sheet: 'Users', row: row, data: { koin:0, rupiah:0, kristal:0, level:1, totalKoin:0 } }).then(function(){
          toast('User direset', 'info'); renderAdminContent();
        });
      };
    } else if (tab === 'Topup') {
      api('baca', { sheet: 'Topups' }).then(function(res){
        var list = (res && res.ok) ? res.data : [];
        box.innerHTML = list.map(function(t){
          return '<div class="admin-card"><div class="row"><span class="label">' + (t.user||'-') + '</span><span class="value">' + t.status + '</span></div>' +
            '<div class="row"><span>Rp' + t.harga + ' → ' + t.jumlah + '</span></div>' +
            (t.bukti ? '<img src="' + t.bukti + '" style="max-width:100%;max-height:80px;border-radius:6px;margin:4px 0;">' : '') +
            '<button class="admin-btn green" onclick="window._admApprove(\'' + t._row + '\')">Approve</button>' +
            '<button class="admin-btn red" onclick="window._admReject(\'' + t._row + '\')">Reject</button></div>';
        }).join('') || '<div class="admin-card">Tidak ada topup.</div>';
      });
      window._admApprove = function(row) {
        api('update', { sheet: 'Topups', row: row, data: { status: 'approved' } }).then(function(){
          toast('Topup di-approve', 'success'); renderAdminContent();
        });
      };
      window._admReject = function(row) {
        api('update', { sheet: 'Topups', row: row, data: { status: 'rejected' } }).then(function(){
          toast('Topup di-reject', 'info'); renderAdminContent();
        });
      };
    } else if (tab === 'Voucher') {
      api('baca', { sheet: 'Vouchers' }).then(function(res){
        var list = (res && res.ok) ? res.data : [];
        box.innerHTML = list.map(function(v){
          return '<div class="admin-card"><div class="row"><span>' + v.kode + '</span><span>' + v.status + '</span></div>' +
            '<div class="row"><span>' + (v.user||'-') + '</span></div>' +
            '<button class="admin-btn green" onclick="window._vVerif(\'' + v._row + '\')">Verifikasi</button>' +
            '<button class="admin-btn orange" onclick="window._vPakai(\'' + v._row + '\')">Tandai Terpakai</button></div>';
        }).join('') || '<div class="admin-card">Tidak ada voucher.</div>';
      });
      window._vVerif = function(row) {
        api('update', { sheet: 'Vouchers', row: row, data: { status: 'terverifikasi' } }).then(function(){
          toast('Voucher diverifikasi', 'success'); renderAdminContent();
        });
      };
      window._vPakai = function(row) {
        api('update', { sheet: 'Vouchers', row: row, data: { status: 'terpakai' } }).then(function(){
          toast('Voucher ditandai terpakai', 'info'); renderAdminContent();
        });
      };
    } else {
      // Generic admin tabs
      box.innerHTML = '<div class="admin-card"><p>Fitur admin <b>' + tab + '</b> siap dikembangkan.</p></div>';
    }
  }

  // ==================== SYNC ====================
  function startSync() {
    setInterval(function(){
      if (state.saldoKoin > 0 || state.saldoRupiah > 0 || state.saldoKristal > 0) {
        saveUserToSheet();
      }
    }, 10000);
  }

  // ==================== PRODUKSI OTOMATIS ====================
  function startProduksi() {
    setInterval(function(){
      var total = getTotalProduksi();
      if (total > 0) {
        state.saldoKoin += total;
        state.totalKoin += total;
        checkLevelUp();
        renderHeader();
      }
    }, 1000);
  }

  // ==================== INIT ====================
  function init() {
    if (!checkSession()) return;
    loadUserData();
    initMusic();

    // Canvas setup
    var canvas = $('gameCanvas');
    var hujanCanvas = $('hujanCanvas');
    function resizeCanvas() {
      var w = window.innerWidth, h = window.innerHeight;
      canvas.width = w; canvas.height = h;
      hujanCanvas.width = w; hujanCanvas.height = h;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // Tap events
    canvas.addEventListener('click', handleTap);
    canvas.addEventListener('touchstart', function(e){ e.preventDefault(); handleTap(e); }, { passive: false });

    // Render
    renderHeader();
    renderBottomNav();

    // Start game
    state.lastFrame = performance.now();
    state.lastSpawn = 0;
    state.cuaca = 'panas';
    state.cuacaDuration = randomInt(60, 180);
    state.spawnInterval = 1500;

    requestAnimationFrame(gameLoop);
    startSync();
    startProduksi();

    // Admin panel
    if (state.isAdmin) {
      renderAdmin();
      document.getElementById('app').style.display = 'none';
    } else {
      document.getElementById('panelAdmin').classList.remove('open');
    }

    // Load managers
    api('baca', { sheet: 'Manajers' }).then(function(res){
      if (res && res.ok && res.data) {
        state.managers = res.data.filter(function(m){ return m.user === state.user.nomor; });
      }
    });

    // Load branches
    api('baca', { sheet: 'Cabangs' }).then(function(res){
      if (res && res.ok && res.data) {
        var userBranches = res.data.filter(function(b){ return b.user === state.user.nomor; });
        if (userBranches.length) {
          state.branches = userBranches.map(function(b, i){ return { nama: b.nama || ('Cabang ' + (i+1)), index: i }; });
        }
      }
    });

    // Before unload
    window.addEventListener('beforeunload', function(){
      if (state.user) saveUserToSheet();
    });

    // Initial toast
    setTimeout(function(){ toast('Selamat datang di Steam MP 7000 Tycoon!', 'success'); }, 500);
  }

  // Start
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})();
</script>
</body>
</html>
