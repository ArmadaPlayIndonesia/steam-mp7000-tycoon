<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Steam MP 7000 Tycoon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      font-family: 'Poppins', sans-serif;
      background: #1a1a1a;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      position: fixed;
      color: #FAFAFA;
    }
    #app {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      background: #111;
    }
    /* ===== HEADER ===== */
    #header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 80px;
      background: linear-gradient(135deg, #C8102E 0%, #a00d24 100%);
      z-index: 100;
      display: flex;
      align-items: center;
      padding: 0 8px;
      box-shadow: 0 2px 12px rgba(200,16,46,0.5);
      border-bottom: 2px solid #F59E0B;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      min-width: 0;
    }
    .logo-mp {
      width: 38px; height: 38px;
      background: #F59E0B;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 16px;
      color: #C8102E;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(245,158,11,0.5);
      border: 2px solid #fff;
    }
    .header-info {
      min-width: 0;
      flex: 1;
    }
    .header-name {
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
    }
    .header-hp {
      font-size: 9px;
      color: rgba(255,255,255,0.7);
      line-height: 1.2;
    }
    .header-saldo {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-top: 2px;
      flex-wrap: wrap;
    }
    .saldo-item {
      display: flex;
      align-items: center;
      gap: 2px;
      font-size: 10px;
      font-weight: 600;
      color: #fff;
      background: rgba(0,0,0,0.25);
      padding: 1px 5px;
      border-radius: 8px;
      line-height: 1.4;
    }
    .saldo-item img {
      width: 14px; height: 14px;
      object-fit: contain;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .header-btn {
      width: 32px; height: 32px;
      border-radius: 8px;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.25);
      color: #fff;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
    }
    .header-btn:active {
      transform: scale(0.9);
      background: rgba(255,255,255,0.3);
    }
    .header-btn.active {
      background: #F59E0B;
      border-color: #F59E0B;
    }
    .level-bar-wrap {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 4px;
      background: rgba(0,0,0,0.3);
    }
    .level-bar {
      height: 100%;
      background: linear-gradient(90deg, #F59E0B, #fbbf24);
      width: 0%;
      transition: width 0.5s;
      border-radius: 0 2px 2px 0;
    }
    /* ===== CANVAS ===== */
    #gameCanvas {
      position: fixed;
      top: 80px;
      bottom: 70px;
      left: 0;
      right: 0;
      width: 100%;
      height: calc(100% - 150px);
      display: block;
      z-index: 1;
      touch-action: manipulation;
    }
    /* ===== BOTTOM NAV ===== */
    #bottomNav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 70px;
      background: linear-gradient(180deg, #1a1a2e 0%, #0f0f1a 100%);
      border-top: 2px solid #C8102E;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 2px;
      box-shadow: 0 -2px 12px rgba(0,0,0,0.5);
    }
    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      padding: 4px 6px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
      min-width: 48px;
      flex: 1;
      max-width: 64px;
    }
    .nav-btn:active {
      transform: scale(0.9);
    }
    .nav-btn.active {
      background: rgba(200,16,46,0.25);
    }
    .nav-btn .nav-icon {
      font-size: 20px;
      line-height: 1;
    }
    .nav-btn .nav-label {
      font-size: 9px;
      font-weight: 600;
      color: rgba(255,255,255,0.7);
      line-height: 1;
    }
    .nav-btn.active .nav-label {
      color: #F59E0B;
    }
    .nav-btn.more-btn .nav-icon {
      font-size: 22px;
    }
    /* ===== PANEL ===== */
    .panel {
      position: fixed;
      bottom: 70px; left: 0; right: 0;
      max-height: 70vh;
      background: #FAFAFA;
      color: #1a1a1a;
      border-radius: 20px 20px 0 0;
      z-index: 90;
      overflow-y: auto;
      padding: 16px 14px 90px;
      transform: translateY(110%);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 -8px 30px rgba(0,0,0,0.3);
    }
    .panel.open {
      transform: translateY(0);
    }
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      position: sticky;
      top: 0;
      background: #FAFAFA;
      padding-bottom: 8px;
      z-index: 2;
      border-bottom: 2px solid #C8102E;
    }
    .panel-title {
      font-size: 16px;
      font-weight: 700;
      color: #C8102E;
    }
    .panel-close {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: #C8102E;
      color: #fff;
      border: none;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .panel-close:active {
      transform: scale(0.85);
    }
    /* ===== LIST ITEMS ===== */
    .list-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: #fff;
      border-radius: 12px;
      margin-bottom: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      border: 1px solid #eee;
      transition: all 0.2s;
    }
    .list-item:active {
      transform: scale(0.98);
    }
    .list-icon {
      width: 42px; height: 42px;
      border-radius: 10px;
      background: linear-gradient(135deg, #C8102E, #e63946);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #fff;
      flex-shrink: 0;
    }
    .list-icon.gold {
      background: linear-gradient(135deg, #F59E0B, #fbbf24);
    }
    .list-body {
      flex: 1;
      min-width: 0;
    }
    .list-name {
      font-size: 13px;
      font-weight: 700;
      color: #1a1a1a;
    }
    .list-desc {
      font-size: 10px;
      color: #666;
      margin-top: 1px;
    }
    .list-action {
      flex-shrink: 0;
    }
    .btn {
      padding: 6px 14px;
      border-radius: 8px;
      border: none;
      font-family: 'Poppins', sans-serif;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .btn:active {
      transform: scale(0.92);
    }
    .btn-merah {
      background: #C8102E;
      color: #fff;
    }
    .btn-emas {
      background: #F59E0B;
      color: #1a1a1a;
    }
    .btn-outline {
      background: transparent;
      border: 2px solid #C8102E;
      color: #C8102E;
    }
    .btn-hijau {
      background: #10b981;
      color: #fff;
    }
    .btn-abu {
      background: #e5e7eb;
      color: #999;
    }
    .btn:disabled {
      opacity: 0.5;
      pointer-events: none;
    }
    /* ===== TOAST ===== */
    #toastContainer {
      position: fixed;
      top: 90px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 200;
      display: flex;
      flex-direction: column;
      gap: 6px;
      pointer-events: none;
      width: 90%;
      max-width: 340px;
    }
    .toast {
      background: rgba(26,26,46,0.95);
      color: #fff;
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      border-left: 4px solid #F59E0B;
      animation: toastIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      backdrop-filter: blur(8px);
    }
    @keyframes toastIn {
      from { opacity: 0; transform: translateY(-20px) scale(0.9); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .toast.out {
      animation: toastOut 0.3s forwards;
    }
    @keyframes toastOut {
      to { opacity: 0; transform: translateY(-20px) scale(0.9); }
    }
    /* ===== MODAL ===== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      backdrop-filter: blur(4px);
    }
    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-box {
      background: #fff;
      border-radius: 20px;
      padding: 20px;
      max-width: 340px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
      border: 3px solid #F59E0B;
      transform: scale(0.9);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      color: #1a1a1a;
    }
    .modal-overlay.open .modal-box {
      transform: scale(1);
    }
    .modal-title {
      font-size: 18px;
      font-weight: 800;
      color: #C8102E;
      margin-bottom: 8px;
      text-align: center;
    }
    .modal-text {
      font-size: 13px;
      color: #333;
      line-height: 1.6;
      margin-bottom: 12px;
      text-align: center;
    }
    .modal-btns {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }
    /* ===== STORY MODAL ===== */
    .story-box {
      background: linear-gradient(135deg, #fff 0%, #fef3c7 100%);
      border: 3px solid #F59E0B;
    }
    .story-avatar {
      width: 80px; height: 80px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #F59E0B;
      margin: 0 auto 10px;
      display: block;
      background: #f0f0f0;
    }
    /* ===== ADMIN ===== */
    #adminPanel {
      position: fixed;
      inset: 0;
      background: #FAFAFA;
      z-index: 500;
      display: none;
      flex-direction: column;
      color: #1a1a1a;
    }
    #adminPanel.open {
      display: flex;
    }
    .admin-header {
      background: #C8102E;
      color: #fff;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 700;
      font-size: 14px;
      flex-shrink: 0;
    }
    .admin-tabs {
      display: flex;
      overflow-x: auto;
      background: #fff;
      border-bottom: 2px solid #eee;
      flex-shrink: 0;
      scrollbar-width: none;
    }
    .admin-tabs::-webkit-scrollbar { display: none; }
    .admin-tab {
      padding: 10px 14px;
      font-size: 11px;
      font-weight: 600;
      color: #666;
      white-space: nowrap;
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }
    .admin-tab.active {
      color: #C8102E;
      border-bottom-color: #C8102E;
    }
    .admin-content {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }
    .admin-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .admin-table th {
      background: #C8102E;
      color: #fff;
      padding: 6px 8px;
      text-align: left;
      font-weight: 600;
    }
    .admin-table td {
      padding: 5px 8px;
      border-bottom: 1px solid #f0f0f0;
    }
    /* ===== MISC ===== */
    .hidden { display: none !important; }
    .text-center { text-align: center; }
    .mt-8 { margin-top: 8px; }
    .mt-12 { margin-top: 12px; }
    .mb-8 { margin-bottom: 8px; }
    .gap-8 { gap: 8px; }
    .flex { display: flex; }
    .flex-col { flex-direction: column; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .section-title {
      font-size: 13px;
      font-weight: 700;
      color: #C8102E;
      margin: 12px 0 6px;
      padding-bottom: 4px;
      border-bottom: 2px solid #F59E0B;
    }
    .progress-bar {
      height: 6px;
      background: #e5e7eb;
      border-radius: 3px;
      overflow: hidden;
      margin-top: 4px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #C8102E, #F59E0B);
      border-radius: 3px;
      transition: width 0.3s;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 9px;
      font-weight: 700;
    }
    .badge-merah { background: #C8102E; color: #fff; }
    .badge-emas { background: #F59E0B; color: #1a1a1a; }
    .badge-hijau { background: #10b981; color: #fff; }
    .loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .loading-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 4px solid rgba(255,255,255,0.3);
      border-top-color: #F59E0B;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text {
      color: #fff;
      font-size: 12px;
      font-weight: 600;
    }
    /* ===== SCROLLBAR ===== */
    .panel::-webkit-scrollbar,
    .admin-content::-webkit-scrollbar,
    .modal-box::-webkit-scrollbar {
      width: 4px;
    }
    .panel::-webkit-scrollbar-thumb,
    .admin-content::-webkit-scrollbar-thumb,
    .modal-box::-webkit-scrollbar-thumb {
      background: #C8102E;
      border-radius: 2px;
    }
    /* ===== RIPPLE ===== */
    .ripple {
      position: relative;
      overflow: hidden;
    }
    .ripple::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle, rgba(255,255,255,0.4) 10%, transparent 70%);
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }
    .ripple:active::after {
      opacity: 1;
    }
    /* ===== RESPONSIVE ===== */
    @media (max-height: 600px) {
      #header { height: 70px; }
      #gameCanvas { top: 70px; height: calc(100% - 140px); }
      #bottomNav { height: 60px; }
      .panel { bottom: 60px; }
    }
    @media (min-width: 500px) {
      #app {
        max-width: 420px;
        margin: 0 auto;
        border-left: 2px solid #333;
        border-right: 2px solid #333;
      }
    }
  </style>
</head>
<body>
<div id="app">
  <!-- HEADER -->
  <header id="header">
    <div class="header-left">
      <div class="logo-mp">MP</div>
      <div class="header-info">
        <div class="header-name" id="hName">Memuat...</div>
        <div class="header-hp" id="hHp">-</div>
        <div class="header-saldo">
          <div class="saldo-item"><img id="imgKoin" src="assets/koin.png" alt="k" onerror="this.style.display='none'"><span id="hKoin">0</span></div>
          <div class="saldo-item"><img id="imgRupiah" src="assets/rupiah.png" alt="r" onerror="this.style.display='none'"><span id="hRupiah">0</span></div>
          <div class="saldo-item"><img id="imgKristal" src="assets/kristal.png" alt="kr" onerror="this.style.display='none'"><span id="hKristal">0</span></div>
        </div>
      </div>
    </div>
    <div class="header-right">
      <div class="header-btn" id="btnCuaca" title="Cuaca">☀️</div>
      <div class="header-btn" id="btnMusik" title="Musik">🔊</div>
      <div class="header-btn" id="btnMenu" title="Menu">☰</div>
    </div>
    <div class="level-bar-wrap"><div class="level-bar" id="levelBar"></div></div>
  </header>

  <!-- CANVAS -->
  <canvas id="gameCanvas"></canvas>

  <!-- BOTTOM NAV -->
  <nav id="bottomNav">
    <div class="nav-btn active" data-tab="game"><span class="nav-icon">🎮</span><span class="nav-label">Game</span></div>
    <div class="nav-btn" data-tab="manajer"><span class="nav-icon">👔</span><span class="nav-label">Manajer</span></div>
    <div class="nav-btn" data-tab="toko"><span class="nav-icon">🛒</span><span class="nav-label">Toko</span></div>
    <div class="nav-btn" data-tab="quest"><span class="nav-icon">📋</span><span class="nav-label">Quest</span></div>
    <div class="nav-btn" data-tab="profil"><span class="nav-icon">👤</span><span class="nav-label">Profil</span></div>
    <div class="nav-btn more-btn" id="btnMore"><span class="nav-icon">⋯</span><span class="nav-label">Lainnya</span></div>
  </nav>

  <!-- PANEL SLIDE-UP -->
  <div class="panel" id="panel">
    <div class="panel-header">
      <div class="panel-title" id="panelTitle">Menu</div>
      <button class="panel-close" id="panelClose">✕</button>
    </div>
    <div id="panelContent"></div>
  </div>

  <!-- TOAST -->
  <div id="toastContainer"></div>

  <!-- LOADING -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <div class="loading-text" id="loadingText">Memuat...</div>
  </div>

  <!-- MODAL -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box" id="modalBox">
      <div id="modalContent"></div>
    </div>
  </div>

  <!-- ADMIN PANEL -->
  <div id="adminPanel">
    <div class="admin-header">
      <span>🔧 ADMIN PANEL</span>
      <button class="btn btn-outline" style="color:#fff;border-color:#fff;padding:4px 10px;font-size:10px" id="adminClose">Keluar Admin</button>
    </div>
    <div class="admin-tabs" id="adminTabs">
      <div class="admin-tab active" data-atab="dashboard">Dashboard</div>
      <div class="admin-tab" data-atab="pemain">Pemain</div>
      <div class="admin-tab" data-atab="topup">Topup</div>
      <div class="admin-tab" data-atab="voucher">Voucher</div>
      <div class="admin-tab" data-atab="toko">Toko</div>
      <div class="admin-tab" data-atab="manajer">Manajer</div>
      <div class="admin-tab" data-atab="cabang">Cabang</div>
      <div class="admin-tab" data-atab="cerita">Cerita</div>
      <div class="admin-tab" data-atab="quest">Quest</div>
      <div class="admin-tab" data-atab="config">Config</div>
      <div class="admin-tab" data-atab="log">Log</div>
    </div>
    <div class="admin-content" id="adminContent"></div>
  </div>
</div>

<script>
// ===================================================================
// KONFIGURASI
// ===================================================================
var API_URL = 'https://script.google.com/macros/s/AKfycbysHvNR2JwLFuNu6poci5wIleJBnc8IGNMq-ULxUV1NyMxoorEcBj0c8oBh4b8JiL3m/exec';
var TOKEN = 'steam-mp-7000-2026';

// ===================================================================
// STATE GLOBAL
// ===================================================================
var state = {
  user: null,
  koin: 0,
  rupiah: 0,
  kristal: 0,
  level: 1,
  exp: 0,
  pendingProduction: 0,
  lastSync: 0,
  cuaca: 'panas',
  cuacaTimer: 0,
  musikOn: false,
  admin: false,
  storyUnlocked: 0,
  totalCuci: 0,
  manajer: {},
  cabang: 1,
  upgrade: {},
  questProgress: {},
  voucherLast: 0,
  lastTapTime: 0
};

var motors = [];
var motorIdCounter = 0;
var imageCache = {};
var canvas, ctx;
var animFrame;
var isGameActive = false;
var lastSpawnTime = 0;

// ===================================================================
// UTIL
// ===================================================================
function $(id) { return document.getElementById(id); }
function rupiahFormat(n) {
  if (n === undefined || n === null) n = 0;
  return 'Rp ' + Math.floor(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
}
function angkaFormat(n) {
  if (n === undefined || n === null) n = 0;
  if (n >= 1000000000) return (n/1000000000).toFixed(1) + 'M';
  if (n >= 1000000) return (n/1000000).toFixed(1) + 'jt';
  if (n >= 1000) return (n/1000).toFixed(1) + 'rb';
  return Math.floor(n).toString();
}
function acak(min, max) { return Math.random() * (max - min) + min; }
function acakInt(min, max) { return Math.floor(acak(min, max + 1)); }
function pilihAcak(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function sensorHP(hp) {
  if (!hp) return '-';
  var s = String(hp);
  if (s.length <= 4) return s;
  return s.substring(0, 4) + '****' + s.substring(s.length - 2);
}

// ===================================================================
// FETCH TIMEOUT
// ===================================================================
function fetchTimeout(url, options, ms) {
  return Promise.race([
    fetch(url, options),
    new Promise(function(_, reject) {
      setTimeout(function() { reject(new Error('Timeout')); }, ms || 15000);
    })
  ]);
}

// ===================================================================
// API CALL
// ===================================================================
function apiCall(action, params) {
  var body = Object.assign({ action: action, token: TOKEN }, params || {});
  return fetchTimeout(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify(body)
  }, 15000)
  .then(function(res) { return res.json(); })
  .then(function(json) {
    if (!json.ok) throw new Error(json.pesan || 'Gagal');
    return json;
  });
}

// ===================================================================
// HILANGKAN BACKGROUND PUTIH
// ===================================================================
function hilangkanBackgroundPutih(imgSrc, toleransi, callback) {
  var img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = function() {
    var c = document.createElement('canvas');
    c.width = img.width; c.height = img.height;
    var cx = c.getContext('2d');
    cx.drawImage(img, 0, 0);
    try {
      var d = cx.getImageData(0, 0, c.width, c.height);
      var p = d.data;
      var tol = toleransi || 40;
      for (var i = 0; i < p.length; i += 4) {
        if (p[i] > 255 - tol && p[i+1] > 255 - tol && p[i+2] > 255 - tol) p[i+3] = 0;
      }
      cx.putImageData(d, 0, 0);
      callback(c.toDataURL('image/png'));
    } catch(e) { callback(imgSrc); }
  };
  img.onerror = function() { callback(null); };
  img.src = imgSrc;
}

// ===================================================================
// LOAD ASSETS
// ===================================================================
function loadAssets() {
  // Background tanpa hilangkanBackgroundPutih
  var bg = new Image();
  bg.onload = function() {
    imageCache['steam-bg'] = bg;
    log('Gambar steam-bg: loaded ' + bg.width + 'x' + bg.height);
  };
  bg.onerror = function() { log('Gambar steam-bg: gagal'); };
  bg.src = 'assets/steam-bg.png';

  var qris = new Image();
  qris.onload = function() { imageCache['qris'] = qris; };
  qris.src = 'assets/qris.png';

  // Pakai hilangkanBackgroundPutih
  var assets = [
    { key: 'koin', src: 'assets/koin.png', tol: 30 },
    { key: 'kristal', src: 'assets/kristal.png', tol: 20 },
    { key: 'rupiah', src: 'assets/rupiah.png', tol: 25 },
    { key: 'pak-aldi', src: 'assets/pak-aldi.png', tol: 40 },
    { key: 'motor-bebek-kotor', src: 'assets/motor-bebek-kotor.png', tol: 40 },
    { key: 'motor-bebek-bersih', src: 'assets/motor-bebek-bersih.png', tol: 40 },
    { key: 'motor-moge-kotor', src: 'assets/motor-moge-kotor.png', tol: 40 },
    { key: 'motor-moge-bersih', src: 'assets/motor-moge-bersih.png', tol: 40 }
  ];
  assets.forEach(function(a) {
    hilangkanBackgroundPutih(a.src, a.tol, function(dataUrl) {
      if (dataUrl) {
        var img = new Image();
        img.onload = function() { imageCache[a.key] = img; };
        img.src = dataUrl;
      } else {
        log('Asset ' + a.key + ': 404');
      }
    });
  });
}

// ===================================================================
// AUDIO
// ===================================================================
var audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
}
function playSound(type) {
  initAudio();
  if (!audioCtx) return;
  try {
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    if (type === 'syuush') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(800, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.3);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
      osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    } else if (type === 'ting') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
      osc.start(); osc.stop(audioCtx.currentTime + 0.2);
    } else if (type === 'chime') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(800, audioCtx.currentTime);
      osc.frequency.setValueAtTime(1000, audioCtx.currentTime + 0.1);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
      osc.start(); osc.stop(audioCtx.currentTime + 0.4);
    } else if (type === 'buzz') {
      osc.type = 'square';
      osc.frequency.setValueAtTime(150, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
      osc.start(); osc.stop(audioCtx.currentTime + 0.2);
    }
  } catch(e) {}
}

// ===================================================================
function fetchUserData() {
  var session = getUserSession();
  if (!session || !session.nomor) { log('Fetch user: tidak ada sesi'); return; }
  showLoading('Sinkronisasi...');
  apiCall('bacaSatu', { sheet: 'Users', kolom: 'nomor', nilai: String(session.nomor) })
  .then(function(json) {
    var u = json.data;
    if (u) {
      log('Fetch user: selesai');
      state.user = u;
      state.koin = parseInt(u.saldo_koin) || 0;
      state.rupiah = parseInt(u.saldo_rupiah) || 0;
      state.kristal = parseInt(u.kristal) || 0;
      state.level = parseInt(u.level) || 1;
      state.storyUnlocked = parseInt(u.story_unlocked) || 0;
      setUserSession(u);
      updateHeader();
      updateLevelBar();
    }
  })
  .catch(function(err) {
    log('Fetch user: gagal - ' + err.message);
  })
  .finally(function() { hideLoading(); });
}

// ===================================================================
// GAME LOOP
// ===================================================================
function startGameLoop() {
  if (animFrame) cancelAnimationFrame(animFrame);
  function loop(ts) {
    if (!isGameActive) return;
    updateGame(ts);
    renderGame();
    animFrame = requestAnimationFrame(loop);
  }
  animFrame = requestAnimationFrame(loop);
}

// ===================================================================
// UPDATE GAME
// ===================================================================
function updateGame(ts) {
  // Spawn motor
  if (!lastSpawnTime) lastSpawnTime = ts;
  var interval = state.cuaca === 'hujan' ? 6000 : 2000;
  if (ts - lastSpawnTime > interval) {
    spawnMotor();
    lastSpawnTime = ts;
  }

  // Update motor
  var now = Date.now();
  for (var i = motors.length - 1; i >= 0; i--) {
    var m = motors[i];
    // Motor lewat
    if (m.state === 'lewat') {
      m.x += m.kecepatan;
      if (m.x > canvas.width + 100) {
        motors.splice(i, 1);
      }
      continue;
    }
    // Motor parkir
    if (m.state === 'parkir') {
      var elapsed = (now - m.waktuMasuk) / 1000;
      // Pelanggan kabur
      if (elapsed > 8 && !m.kabur) {
        m.kabur = true;
        toast('Pelanggan kabur! 💨');
        motors.splice(i, 1);
        continue;
      }
      if (elapsed > 5) {
        m.marah = true;
      }
      // Moge kabur kalau tidak nonton iklan
      if (m.isMoge && m.sudahNontonIklan === false && elapsed > 10 && !m.kabur) {
        m.kabur = true;
        toast('Moge VIP kabur! 🏍️💨');
        motors.splice(i, 1);
        continue;
      }
    }
  }
}

// ===================================================================
// SPAWN MOTOR
// ===================================================================
function spawnMotor() {
  // Hitung motor parkir
  var parkirCount = motors.filter(function(m) { return m.state === 'parkir'; }).length;
  if (parkirCount >= 18) {
    // Parkiran penuh, semua lewat
    spawnMotorLewat();
    return;
  }

  // Tentukan level motor
  var isMoge = Math.random() < (1/8);
  var level = isMoge ? 2 : 1;

  // Cari slot kosong
  var slot = cariSlotKosong();
  if (slot === -1) {
    spawnMotorLewat();
    return;
  }

  var baris = Math.floor(slot / 6);
  var kolom = slot % 6;
  var y = canvas.height * (0.42 + baris * 0.10);
  var x = canvas.width * (0.10 + kolom * 0.14);

  var motor = {
    id: ++motorIdCounter,
    x: x,
    y: y,
    arah: 'turun',
    state: 'parkir',
    level: level,
    kotor: 1.0,
    tapCount: 0,
    maxTap: isMoge ? 5 : 1,
    waktuMasuk: Date.now(),
    isMoge: isMoge,
    sudahNontonIklan: !isMoge,
    slotTarget: slot,
    rotasi: Math.PI,
    marah: false,
    kabur: false,
    bayar: isMoge ? 500 : 1,
    kecepatan: 0
  };
  motors.push(motor);
  log('Spawn motor ke-' + motor.id + ': level ' + level + ', x=' + x.toFixed(0) + ', y=' + y.toFixed(0));
}

function spawnMotorLewat() {
  var isMoge = Math.random() < (1/8);
  var motor = {
    id: ++motorIdCounter,
    x: -80,
    y: canvas.height * 0.06,
    arah: 'kanan',
    state: 'lewat',
    level: isMoge ? 2 : 1,
    kotor: 1.0,
    tapCount: 0,
    maxTap: isMoge ? 5 : 1,
    waktuMasuk: Date.now(),
    isMoge: isMoge,
    sudahNontonIklan: true,
    slotTarget: -1,
    rotasi: 0,
    marah: false,
    kabur: false,
    bayar: 0,
    kecepatan: acak(1.5, 3)
  };
  motors.push(motor);
}

function cariSlotKosong() {
  var terisi = {};
  motors.forEach(function(m) {
    if (m.state === 'parkir' && m.slotTarget >= 0) terisi[m.slotTarget] = true;
  });
  var kosong = [];
  for (var i = 0; i < 18; i++) {
    if (!terisi[i]) kosong.push(i);
  }
  if (kosong.length === 0) return -1;
  return pilihAcak(kosong);
}

// ===================================================================
// RENDER GAME
// ===================================================================
function renderGame() {
  if (!ctx || !canvas) return;
  var w = canvas.width;
  var h = canvas.height;
  ctx.clearRect(0, 0, w, h);

  // Latar: SCALE-Y
  var bg = imageCache['steam-bg'];
  if (bg && bg.width > 0) {
    var scale = h / bg.height;
    var bw = bg.width * scale;
    var bh = h;
    var bx = (w - bw) / 2;
    // Gradient merah putih di kiri-kanan
    var grad = ctx.createLinearGradient(0, 0, w, 0);
    grad.addColorStop(0, '#C8102E');
    grad.addColorStop(0.3, '#FAFAFA');
    grad.addColorStop(0.7, '#FAFAFA');
    grad.addColorStop(1, '#C8102E');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);
    ctx.drawImage(bg, bx, 0, bw, bh);
    log('Render latar: scale=' + scale.toFixed(2) + ', x=' + bx.toFixed(0));
  } else {
    // Fallback gradient
    var g2 = ctx.createLinearGradient(0, 0, 0, h);
    g2.addColorStop(0, '#C8102E');
    g2.addColorStop(0.5, '#FAFAFA');
    g2.addColorStop(1, '#C8102E');
    ctx.fillStyle = g2;
    ctx.fillRect(0, 0, w, h);
  }

  // Cuaca overlay
  if (state.cuaca === 'panas') {
    ctx.fillStyle = 'rgba(255, 200, 0, ' + weatherOverlayAlpha * 0.15 + ')';
    ctx.fillRect(0, 0, w, h);
  } else if (state.cuaca === 'hujan') {
    ctx.fillStyle = 'rgba(100, 150, 255, ' + weatherOverlayAlpha * 0.12 + ')';
    ctx.fillRect(0, 0, w, h);
    // Hujan
    ctx.strokeStyle = 'rgba(150, 200, 255, 0.4)';
    ctx.lineWidth = 1;
    rainDrops.forEach(function(d) {
      ctx.beginPath();
      ctx.moveTo(d.x, d.y);
      ctx.lineTo(d.x - 1, d.y + 8);
      ctx.stroke();
    });
  }

  // Render motor
  motors.forEach(function(m) {
    renderMotor(m);
  });
}

function renderMotor(m) {
  var img = null;
  if (m.isMoge) {
    img = m.kotor > 0.5 ? imageCache['motor-moge-kotor'] : imageCache['motor-moge-bersih'];
  } else {
    img = m.kotor > 0.5 ? imageCache['motor-bebek-kotor'] : imageCache['motor-bebek-bersih'];
  }

  ctx.save();
  ctx.translate(m.x + 30, m.y + 40);
  ctx.rotate(m.rotasi || 0);

  // Glow moge
  if (m.isMoge && m.kotor <= 0.5) {
    ctx.shadowColor = '#F59E0B';
    ctx.shadowBlur = 15;
  }

  if (img && img.width > 0) {
    ctx.drawImage(img, -30, -40, 60, 80);
  } else {
    // Fallback emoji
    ctx.font = '40px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(m.isMoge ? '🏍️' : '🛵', 0, 0);
  }
  ctx.restore();

  // Sparkle moge
  if (m.isMoge && m.kotor <= 0.5) {
    ctx.font = '14px sans-serif';
    ctx.fillText('✨', m.x + 45, m.y + 10);
    ctx.fillText('✨', m.x + 10, m.y + 5);
  }

  // Emoji marah
  if (m.marah && m.state === 'parkir') {
    ctx.font = '20px sans-serif';
    ctx.fillText('💢', m.x + 45, m.y - 5);
  }

  // Ikon nonton untuk moge
  if (m.isMoge && !m.sudahNontonIklan && m.state === 'parkir') {
    ctx.font = '22px sans-serif';
    ctx.fillText('🎬', m.x + 50, m.y - 10);
  }

  // Koin terbang
  if (m.koinTerbang) {
    var t = (Date.now() - m.koinTerbang.start) / 800;
    if (t < 1) {
      var kx = m.koinTerbang.x + (m.koinTerbang.tx - m.koinTerbang.x) * t;
      var ky = m.koinTerbang.y + (m.koinTerbang.ty - m.koinTerbang.y) * t;
      ctx.font = '20px sans-serif';
      ctx.fillText('🪙', kx, ky);
    }
  }
}

// ===================================================================
// TAP MOTOR
// ===================================================================
function handleCanvasTap(e) {
  if (!isGameActive) return;
  var rect = canvas.getBoundingClientRect();
  var touch = e.touches ? e.touches[0] : e;
  var tapX = touch.clientX - rect.left;
  var tapY = touch.clientY - rect.top;

  for (var i = motors.length - 1; i >= 0; i--) {
    var m = motors[i];
    if (m.state !== 'parkir') continue;

    // Hit area motor
    var mx = m.x + 30;
    var my = m.y + 40;
    var dx = tapX - mx;
    var dy = tapY - my;
    if (Math.abs(dx) < 45 && Math.abs(dy) < 55) {
      tapMotor(m);
      return;
    }
  }
}

function tapMotor(m) {
  if (m.state !== 'parkir') return;

  // Moge wajib nonton iklan
  if (m.isMoge && !m.sudahNontonIklan) {
    showModalIklan(m);
    return;
  }

  m.tapCount++;
  log('Tap motor: ' + m.id + ', tapCount ' + m.tapCount);

  // Efek tap
  playSound('syuush');
  spawnPartikelAir(m.x + 30, m.y + 40);

  // Kurangi kotor
  m.kotor = Math.max(0, m.kotor - (1 / m.maxTap));

  // Cek selesai
  if (m.tapCount >= m.maxTap) {
    m.kotor = 0;
    selesaikanCuci(m);
  } else {
    // Setengah bersih
    if (m.kotor <= 0.5 && m.kotor > 0) {
      m.kotor = 0.5;
    }
  }
}

function selesaikanCuci(m) {
  // Tambah koin
  var bayar = m.bayar;
  state.koin += bayar;

  // Koin terbang
  m.koinTerbang = {
    start: Date.now(),
    x: m.x + 30,
    y: m.y + 40,

// PARTIKEL AIR
// ===================================================================
var partikels = [];
function spawnPartikelAir(x, y) {
  for (var i = 0; i < 8; i++) {
    partikels.push({
      x: x + acak(-20, 20),
      y: y + acak(-20, 20),
      vx: acak(-2, 2),
      vy: acak(-3, -1),
      life: 500,
      start: Date.now()
    });
  }
}

function updatePartikels() {
  var now = Date.now();
  for (var i = partikels.length - 1; i >= 0; i--) {
    var p = partikels[i];
    var elapsed = now - p.start;
    if (elapsed > p.life) {
      partikels.splice(i, 1);
      continue;
    }
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.1;
  }
}

function renderPartikels() {
  var now = Date.now();
  partikels.forEach(function(p) {
    var alpha = 1 - (now - p.start) / p.life;
    ctx.fillStyle = 'rgba(150, 200, 255, ' + alpha * 0.6 + ')';
    ctx.beginPath();
    ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
    ctx.fill();
  });
}

// ===================================================================
// SYNC LOOP
// ===================================================================
function startSyncLoop() {
  if (pendingSyncTimer) clearInterval(pendingSyncTimer);
  pendingSyncTimer = setInterval(function() {
    syncKeServer();
  }, 10000);
}

function syncKeServer() {
  if (syncInProgress) return;
  if (!state.user || !state.user._row) return;
  syncInProgress = true;

  // Hitung total
  var kirim = state.koin + state.pendingProduction;
  if (kirim <= 0) { syncInProgress = false; return; }

  // Cap max 1.000.000
  var cap = Math.min(kirim, 1000000);

  log('Sync: kirim=' + cap + ', pending=' + state.pendingProduction);

  apiCall('update', {
    sheet: 'Users',
    row: state.user._row,
    data: {
      saldo_koin: cap,
      saldo_rupiah: state.rupiah,
      kristal: state.kristal,
      level: state.level,
      last_sync: new Date().toISOString()
    }
  })
  .then(function(json) {
    if (json.ok) {
      log('Sync sukses, pending reset');
      state.koin = cap;
      state.pendingProduction = 0;
      updateHeader();
      // Update session
      if (state.user) {
        state.user.saldo_koin = cap;
        setUserSession(state.user);
      }
    }
  })
  .catch(function(err) {
    log('Sync gagal: ' + err.message);
    // Jangan reset pendingProduction
  })
  .finally(function() {
    syncInProgress = false;
  });
}

// ===================================================================
// STORY
// ===================================================================
function cekStory() {
  if (storyModalShown) return;
  var unlocked = state.storyUnlocked;
  var next = unlocked + 1;
  if (next > 7) return;

  var bisa = false;
  if (next === 1) bisa = true;
  else if (next === 2 && state.totalCuci >= 5) bisa = true;
  else if (next === 3 && state.koin >= 10000) bisa = true;
  else if (next === 4 && Object.keys(state.manajer).length >= 1) bisa = true;
  else if (next === 5 && state.koin >= 1000000) bisa = true;
  else if (next === 6 && Object.keys(state.manajer).length >= 3) bisa = true;
  else if (next === 7 && state.koin >= 1000000000) bisa = true;

  if (bisa) {
    storyModalShown = true;
    tampilkanStory(next);
  }
}

// ===================================================================
// BIND EVENTS
// ===================================================================
function bindEvents() {
  // Canvas tap
  canvas.addEventListener('touchstart', function(e) {
    e.preventDefault();
    handleCanvasTap(e);
  }, { passive: false });
  canvas.addEventListener('mousedown', handleCanvasTap);

  // Nav
  document.querySelectorAll('.nav-btn[data-tab]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.nav-btn').forEach(function(b) { b.classList.remove('active'); });
      this.classList.add('active');
      openPanel(this.dataset.tab);
    });
  });

  // More button
  $('btnMore').addEventListener('click', function() {
    var html = '<div class="section-title">📋 Menu Lainnya</div>' +
      '<div class="list-item" onclick="openPanel(\'cabang\')"><div class="list-icon">🏢</div><div class="list-body"><div class="list-name">Cabang</div></div></div>' +
      '<div class="list-item" onclick="openPanel(\'convert\')"><div class="list-icon">💱</div><div class="list-body"><div class="list-name">Convert</div></div></div>' +
      '<div class="list-item" onclick="openPanel(\'topup\')"><div class="list-icon">💎</div><div class="list-body"><div class="list-name">Topup</div></div></div>' +
      '<div class="list-item" onclick="openPanel(\'voucher\')"><div class="list-icon">🎟️</div><div class="list-body"><div class="list-name">Voucher</div></div></div>' +
      '<div class="list-item" onclick="openPanel(\'cerita\')"><div class="list-icon">📖</div><div class="list-body"><div class="list-name">Cerita</div></div></div>';
    $('panelTitle').textContent = 'Lainnya';
    $('panelContent').innerHTML = html;
    $('panel').classList.add('open');
  });

  // Panel close
  $('panelClose').addEventListener('click', closePanel);

  // Header buttons
  $('btnMusik').addEventListener('click', function() {
    state.musikOn = !state.musikOn;
    this.textContent = state.musikOn ? '🔊' : '🔇';
    this.classList.toggle('active', state.musikOn);
  });
  $('btnMenu').addEventListener('click', function() {
    $('panelTitle').textContent = 'Menu';
    $('panelContent').innerHTML = '<div class="section-title">⚙️ Menu</div>' +
      '<div class="list-item" onclick="logout()"><div class="list-icon">🚪</div><div class="list-body"><div class="list-name">Logout</div></div></div>';
    $('panel').classList.add('open');
  });

  // Modal close on overlay
  $('modalOverlay').addEventListener('click', function(e) {
    if (e.target === this) this.classList.remove('open');
  });

  // Admin close
  $('adminClose').addEventListener('click', function() {
    localStorage.removeItem('smp7k_admin');
    location.reload();
  });

  // Admin tabs
  document.querySelectorAll('.admin-tab').forEach(function(tab) {
    tab.addEventListener('click', function() {
      document.querySelectorAll('.admin-tab').forEach(function(t) { t.classList.remove('active'); });
      this.classList.add('active');
      renderAdminTab(this.dataset.atab);
    });
  });
}

// ===================================================================
// BELI UPGRADE
// ===================================================================
function beliUpgrade(id) {
  var upgrades = {
    tukang_semprot: { harga: 100, produksi: 1 },
    tukang_sabun: { harga: 1000, produksi: 5 },
    tukang_bilas: { harga: 10000, produksi: 25 },
    tukang_kering: { harga: 100000, produksi: 100 },
    tukang_poles: { harga: 1000000, produksi: 500 },
    kompresor: { harga: 10000000, produksi: 2500 }
  };
  var u = upgrades[id];
  if (!u) return;
  var lvl = state.upgrade[id] || 0;
  var harga = Math.floor(u.harga * Math.pow(2.5, lvl));
  if (state.koin < harga) { toast('Koin tidak cukup!'); playSound('buzz'); return; }
  state.koin -= harga;
  state.upgrade[id] = lvl + 1;
  updateExtra('upgrade', state.upgrade);
  updateHeader();
  playSound('chime');
  toast('Upgrade berhasil! Level ' + (lvl + 1));
  renderPanelContent('game');
}

// ===================================================================
// CONVERT
// ===================================================================
function convertKoin() {
  var input = $('convertAmount');
  if (!input) return;
  var amount = parseInt(input.value) || 0;
  if (amount < 10000) { toast('Minimal 10.000 koin!'); return; }
  if (state.koin < amount) { toast('Koin tidak cukup!'); return; }
  var rupiah = (amount / 1000) * 100;
  var potong = rupiah * 0.1;
  var hasil = rupiah - potong;
  state.koin -= amount;
  state.rupiah += hasil;
  updateHeader();
  playSound('chime');
  toast('Convert berhasil! +' + rupiahFormat(hasil));
  syncKeServer();
  renderPanelContent('convert');
}

// ===================================================================
// VOUCHER
// ===================================================================
function beliVoucher() {
  var now = Date.now();
  if (now - state.voucherLast < 7 * 24 * 60 * 60 * 1000) {
    toast('Voucher mingguan sudah dipakai!');
    return;
  }
  if (state.koin < 70000) { toast('Koin tidak cukup!'); return; }
  state.koin -= 70000;
  state.voucherLast = now;
  updateExtra('voucherLast', now);
  updateHeader();
  var kode = 'MP7K-' + Math.random().toString(36).substring(2, 8).toUpperCase();
  toast('Voucher: ' + kode);
  playSound('chime');
}
