<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Steam MP 7000 Tycoon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ===== RESET & GLOBAL ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Poppins', sans-serif;
      background: #1a1a1a;
      position: fixed;
      top: 0;
      left: 0;
    }

    :root {
      --merah: #C8102E;
      --merah-gelap: #9A0C22;
      --emas: #F59E0B;
      --emas-terang: #FCD34D;
      --putih: #FAFAFA;
      --hitam: #1a1a1a;
      --abu: #6B7280;
      --hijau: #10B981;
      --biru: #3B82F6;
      --header-h: 80px;
      --nav-h: 70px;
      --panel-h: 70vh;
    }

    /* ===== SCROLLBAR HIDE ===== */
    .no-scroll::-webkit-scrollbar { display: none; }
    .no-scroll { -ms-overflow-style: none; scrollbar-width: none; }

    /* ===== HEADER ===== */
    #header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--header-h);
      background: linear-gradient(135deg, var(--merah) 0%, var(--merah-gelap) 100%);
      z-index: 100;
      display: flex;
      flex-direction: column;
      padding: 6px 10px 4px;
      box-shadow: 0 4px 20px rgba(200,16,46,0.4);
      border-bottom: 2px solid var(--emas);
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex: 1;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .logo-mp {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: var(--emas);
      color: var(--merah);
      font-weight: 800;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      flex-shrink: 0;
    }

    .header-info {
      min-width: 0;
      flex: 1;
    }

    .header-nama {
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
    }

    .header-nomor {
      font-size: 10px;
      color: rgba(255,255,255,0.8);
      line-height: 1.2;
    }

    .header-saldo {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-shrink: 0;
    }

    .saldo-item {
      display: flex;
      align-items: center;
      gap: 3px;
      background: rgba(0,0,0,0.25);
      border-radius: 12px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
    }

    .saldo-item .icon { font-size: 13px; }

    .header-bottom {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 2px;
    }

    .level-badge {
      background: var(--emas);
      color: var(--merah-gelap);
      font-size: 9px;
      font-weight: 800;
      padding: 1px 7px;
      border-radius: 8px;
      white-space: nowrap;
    }

    .progress-bar {
      flex: 1;
      height: 8px;
      background: rgba(0,0,0,0.3);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--emas), var(--emas-terang));
      border-radius: 4px;
      width: 0%;
      transition: width 0.5s ease;
    }

    .header-actions {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .btn-icon {
      width: 30px; height: 30px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      color: #fff;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .btn-icon:active {
      transform: scale(0.9);
      background: rgba(255,255,255,0.3);
    }

    .btn-icon.aktif {
      background: var(--emas);
      color: var(--merah-gelap);
      border-color: var(--emas);
    }

    /* ===== CANVAS ===== */
    #canvas {
      position: fixed;
      top: var(--header-h);
      bottom: var(--nav-h);
      left: 0;
      right: 0;
      width: 100%;
      height: calc(100% - var(--header-h) - var(--nav-h));
      background: linear-gradient(180deg, #87CEEB 0%, #E0F2FE 30%, #FEF3C7 60%, #D1D5DB 100%);
      z-index: 1;
      display: block;
    }

    /* ===== BOTTOM NAV ===== */
    #bottomNav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: var(--nav-h);
      background: var(--putih);
      border-top: 2px solid var(--emas);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 4px;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
    }

    .nav-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      padding: 6px 2px;
      border: none;
      background: transparent;
      cursor: pointer;
      transition: all 0.2s;
      border-radius: 12px;
      position: relative;
      min-width: 0;
    }

    .nav-btn .nav-icon {
      font-size: 20px;
      line-height: 1;
      transition: transform 0.2s;
    }

    .nav-btn .nav-label {
      font-size: 9px;
      font-weight: 600;
      color: var(--abu);
      white-space: nowrap;
    }

    .nav-btn.aktif .nav-label {
      color: var(--merah);
    }

    .nav-btn.aktif .nav-icon {
      transform: scale(1.15);
    }

    .nav-btn.aktif::after {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 30px;
      height: 3px;
      background: var(--merah);
      border-radius: 0 0 4px 4px;
    }

    .nav-btn:active {
      transform: scale(0.95);
    }

    /* ===== PANEL SLIDE-UP ===== */
    .panel-slide {
      position: fixed;
      bottom: var(--nav-h);
      left: 0;
      right: 0;
      max-height: var(--panel-h);
      background: var(--putih);
      border-radius: 20px 20px 0 0;
      z-index: 90;
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      overflow-y: auto;
      overflow-x: hidden;
      padding: 16px 14px 90px;
      box-shadow: 0 -8px 30px rgba(0,0,0,0.15);
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .panel-slide::-webkit-scrollbar { display: none; }

    .panel-slide.terbuka {
      transform: translateY(0);
    }

    .panel-handle {
      width: 40px;
      height: 4px;
      background: #ccc;
      border-radius: 2px;
      margin: 0 auto 12px;
    }

    .panel-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--merah);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ===== LIST ITEM ===== */
    .list-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #fff;
      border: 1.5px solid #f0f0f0;
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 8px;
      transition: all 0.2s;
      cursor: pointer;
    }

    .list-item:active {
      transform: scale(0.98);
      background: #fef2f2;
      border-color: var(--merah);
    }

    .list-item .item-icon {
      font-size: 26px;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fef2f2;
      border-radius: 12px;
      flex-shrink: 0;
    }

    .list-item .item-body {
      flex: 1;
      min-width: 0;
    }

    .list-item .item-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--hitam);
      line-height: 1.3;
    }

    .list-item .item-desc {
      font-size: 10px;
      color: var(--abu);
      line-height: 1.3;
      margin-top: 1px;
    }

    .list-item .item-harga {
      font-size: 12px;
      font-weight: 700;
      color: var(--merah);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .list-item .item-harga.emas { color: var(--emas); }

    .list-item .item-btn {
      background: var(--merah);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 11px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .list-item .item-btn:active {
      transform: scale(0.92);
      background: var(--merah-gelap);
    }

    .list-item .item-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
    }

    .list-item .item-btn.emas {
      background: var(--emas);
      color: var(--merah-gelap);
    }

    .list-item .item-btn.hijau {
      background: var(--hijau);
      color: #fff;
    }

    /* ===== TOAST ===== */
    #toastContainer {
      position: fixed;
      top: calc(var(--header-h) + 10px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 200;
      display: flex;
      flex-direction: column;
      gap: 6px;
      pointer-events: none;
      width: 90%;
      max-width: 360px;
    }

    .toast {
      background: rgba(26,26,26,0.92);
      color: #fff;
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      animation: toastIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .toast.merah { background: rgba(200,16,46,0.92); }
    .toast.emas { background: rgba(245,158,11,0.92); color: #1a1a1a; }
    .toast.hijau { background: rgba(16,185,129,0.92); }

    @keyframes toastIn {
      from { opacity: 0; transform: translateY(-20px) scale(0.9); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes toastOut {
      from { opacity: 1; transform: translateY(0) scale(1); }
      to { opacity: 0; transform: translateY(-20px) scale(0.9); }
    }

    /* ===== MODAL ===== */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      z-index: 300;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      backdrop-filter: blur(4px);
    }

    .modal-overlay.aktif {
      display: flex;
    }

    .modal-box {
      background: var(--putih);
      border-radius: 20px;
      padding: 24px 20px;
      width: 100%;
      max-width: 360px;
      border: 3px solid var(--emas);
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      animation: modalIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      max-height: 80vh;
      overflow-y: auto;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .modal-box::-webkit-scrollbar { display: none; }

    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.8) translateY(20px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .modal-icon {
      width: 80px; height: 80px;
      border-radius: 50%;
      background: #fef2f2;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      margin: 0 auto 12px;
      border: 3px solid var(--emas);
      overflow: hidden;
    }

    .modal-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--merah);
      text-align: center;
      margin-bottom: 8px;
    }

    .modal-dialog {
      font-size: 13px;
      color: #444;
      text-align: center;
      line-height: 1.6;
      margin-bottom: 18px;
      max-height: 200px;
      overflow-y: auto;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .modal-dialog::-webkit-scrollbar { display: none; }

    .modal-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--merah), var(--merah-gelap));
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 15px rgba(200,16,46,0.4);
    }

    .modal-btn:active {
      transform: scale(0.96);
    }

    .modal-btn.emas {
      background: linear-gradient(135deg, var(--emas), var(--emas-terang));
      color: var(--merah-gelap);
      box-shadow: 0 4px 15px rgba(245,158,11,0.4);
    }

    .modal-btn:disabled {
      background: #ccc;
      box-shadow: none;
      cursor: not-allowed;
    }

    /* ===== LOADING ===== */
    #loadingOverlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      z-index: 500;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      backdrop-filter: blur(4px);
    }

    #loadingOverlay.aktif { display: flex; }

    .spinner {
      width: 48px; height: 48px;
      border: 4px solid rgba(255,255,255,0.2);
      border-top-color: var(--emas);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text {
      color: #fff;
      font-size: 13px;
      font-weight: 600;
    }

    /* ===== ADMIN ===== */
    #adminPanel {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #fff;
      z-index: 1000;
      display: none;
      flex-direction: column;
      overflow: hidden;
    }

    #adminPanel.aktif { display: flex; }

    .admin-header {
      background: var(--merah);
      color: #fff;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .admin-header h2 { font-size: 16px; font-weight: 700; }

    .admin-tabs {
      display: flex;
      overflow-x: auto;
      background: #f5f5f5;
      border-bottom: 1px solid #ddd;
      flex-shrink: 0;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .admin-tabs::-webkit-scrollbar { display: none; }

    .admin-tab {
      padding: 10px 16px;
      font-size: 12px;
      font-weight: 600;
      color: var(--abu);
      border: none;
      background: transparent;
      cursor: pointer;
      white-space: nowrap;
      font-family: inherit;
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
    }

    .admin-tab.aktif {
      color: var(--merah);
      border-bottom-color: var(--merah);
    }

    .admin-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .admin-content::-webkit-scrollbar { display: none; }

    .admin-content .list-item {
      cursor: default;
    }

    /* ===== PROFILE ===== */
    .profile-card {
      background: linear-gradient(135deg, var(--merah), var(--merah-gelap));
      border-radius: 18px;
      padding: 20px;
      color: #fff;
      margin-bottom: 16px;
      position: relative;
      overflow: hidden;
    }

    .profile-card::before {
      content: '';
      position: absolute;
      top: -30px; right: -30px;
      width: 120px; height: 120px;
      background: rgba(255,255,255,0.1);
      border-radius: 50%;
    }

    .profile-avatar {
      width: 60px; height: 60px;
      border-radius: 50%;
      background: var(--emas);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 800;
      color: var(--merah);
      margin-bottom: 10px;
      border: 3px solid rgba(255,255,255,0.3);
    }

    .profile-nama {
      font-size: 18px;
      font-weight: 800;
    }

    .profile-nomor {
      font-size: 12px;
      opacity: 0.8;
    }

    .profile-stats {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-top: 14px;
    }

    .profile-stat {
      background: rgba(0,0,0,0.2);
      border-radius: 10px;
      padding: 8px;
      text-align: center;
    }

    .profile-stat .stat-val {
      font-size: 14px;
      font-weight: 800;
      color: var(--emas);
    }

    .profile-stat .stat-label {
      font-size: 9px;
      opacity: 0.8;
    }

    /* ===== QUEST ===== */
    .quest-section {
      margin-bottom: 16px;
    }

    .quest-section-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--merah);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .quest-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #fff;
      border: 1.5px solid #f0f0f0;
      border-radius: 14px;
      padding: 10px 12px;
      margin-bottom: 6px;
    }

    .quest-item .quest-body { flex: 1; min-width: 0; }

    .quest-item .quest-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--hitam);
    }

    .quest-item .quest-desc {
      font-size: 10px;
      color: var(--abu);
    }

    .quest-item .quest-progress {
      height: 6px;
      background: #f0f0f0;
      border-radius: 3px;
      margin-top: 4px;
      overflow: hidden;
    }

    .quest-item .quest-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--hijau), #34D399);
      border-radius: 3px;
      transition: width 0.5s;
    }

    .quest-item .quest-reward {
      font-size: 10px;
      font-weight: 700;
      color: var(--emas);
      white-space: nowrap;
    }

    .quest-item .quest-btn {
      background: var(--hijau);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 10px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .quest-item .quest-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 360px) {
      .header-nama { font-size: 11px; }
      .saldo-item { font-size: 10px; padding: 2px 6px; }
      .nav-btn .nav-icon { font-size: 18px; }
      .nav-btn .nav-label { font-size: 8px; }
    }
  </style>
</head>
<body>

<!-- ===== HEADER ===== -->
<header id="header">
  <div class="header-top">
    <div class="header-left">
      <div class="logo-mp">MP</div>
      <div class="header-info">
        <div class="header-nama" id="headerNama">Memuat...</div>
        <div class="header-nomor" id="headerNomor">-</div>
      </div>
    </div>
    <div class="header-saldo">
      <div class="saldo-item"><span class="icon">🪙</span><span id="headerKoin">0</span></div>
      <div class="saldo-item"><span class="icon">💵</span><span id="headerRupiah">Rp 0</span></div>
      <div class="saldo-item"><span class="icon">💎</span><span id="headerKristal">0</span></div>
    </div>
  </div>
  <div class="header-bottom">
    <span class="level-badge" id="headerLevel">Lv 1</span>
    <div class="progress-bar"><div class="progress-fill" id="headerProgress"></div></div>
    <div class="header-actions">
      <div class="btn-icon" id="btnCuaca">☀️</div>
      <div class="btn-icon" id="btnMusik">🔊</div>
      <div class="btn-icon" id="btnMenu">☰</div>
      <div class="btn-icon" id="btnKeluar">🚪</div>
    </div>
  </div>
</header>

<!-- ===== CANVAS ===== -->
<canvas id="canvas"></canvas>

<!-- ===== TOAST ===== -->
<div id="toastContainer"></div>

<!-- ===== BOTTOM NAV ===== -->
<nav id="bottomNav">
  <button class="nav-btn aktif" data-tab="game">
    <span class="nav-icon">🎮</span>
    <span class="nav-label">Game</span>
  </button>
  <button class="nav-btn" data-tab="manajer">
    <span class="nav-icon">👔</span>
    <span class="nav-label">Manajer</span>
  </button>
  <button class="nav-btn" data-tab="toko">
    <span class="nav-icon">🛒</span>
    <span class="nav-label">Toko</span>

// ===== KONFIGURASI =====

function formatRupiah(n) {
  if (n === undefined || n === null) return 'Rp 0';
  return 'Rp ' + Math.floor(n).toLocaleString('id-ID');
}

function formatAngka(n) {
  if (n === undefined || n === null) return '0';
  if (n >= 1000000000) return (n / 1000000000).toFixed(1) + 'M';
  if (n >= 1000000) return (n / 1000000).toFixed(1) + 'jt';
  if (n >= 1000) return (n / 1000).toFixed(1) + 'rb';
  return Math.floor(n).toString();
}

// ===== FETCH DENGAN TIMEOUT =====
function fetchTimeout(url, options = {}, timeout = FETCH_TIMEOUT) {
  return new Promise((resolve, reject) => {
    const controller = new AbortController();
    const timer = setTimeout(() => {
      controller.abort();
      reject(new Error('Timeout'));
    }, timeout);

    fetch(url, { ...options, signal: controller.signal })
      .then(res => {
        clearTimeout(timer);
        resolve(res);
      })
      .catch(err => {
        clearTimeout(timer);
        reject(err);
      });
  });
}

// ===== API CALL =====
async function apiCall(action, data = {}) {
  const body = JSON.stringify({
    action,
    token: TOKEN,
    ...data
  });

  log('API:', action, data);

  try {
    const res = await fetchTimeout(BACKEND_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body,
      redirect: 'follow'
    });

    const text = await res.text();
    let json;
    try {
      json = JSON.parse(text);
    } catch (e) {
      throw new Error('Response bukan JSON: ' + text.substring(0, 100));
    }

    if (!json.ok) {
      throw new Error(json.pesan || 'Gagal');
    }

    return json;
  } catch (err) {
    console.error('[SMP7K] API Error:', action, err);
    throw err;
  }
}

// ===== HILANGKAN BACKGROUND PUTIH =====
function hilangkanBackgroundPutih(img, tolerance = 40) {
  if (!img || !img.complete || img.naturalWidth === 0) return img;
  try {
    const c = document.createElement('canvas');
    c.width = img.naturalWidth;
    c.height = img.naturalHeight;
    const ctx = c.getContext('2d');
    ctx.drawImage(img, 0, 0);
    const imageData = ctx.getImageData(0, 0, c.width, c.height);
    const data = imageData.data;

    for (let i = 0; i < data.length; i += 4) {
      const r = data[i], g = data[i + 1], b = data[i + 2];
      if (r > 255 - tolerance && g > 255 - tolerance && b > 255 - tolerance) {
        data[i + 3] = 0;
      }
    }
    ctx.putImageData(imageData, 0, 0);

    const newImg = new Image();
    newImg.src = c.toDataURL();
    return newImg;
  } catch (e) {
    console.warn('[SMP7K] Gagal hilangkan background:', e);
    return img;
  }
}

// ===== AUDIO =====
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) {
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch { return null; }
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function playSuara(tipe) {
  const ctx = getAudioCtx();
  if (!ctx) return;

  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain);
  gain.connect(ctx.destination);

  const now = ctx.currentTime;

  switch (tipe) {
    case 'syuush':
      osc.type = 'sine';
      osc.frequency.setValueAtTime(800, now);
      osc.frequency.exponentialRampToValueAtTime(200, now + 0.3);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
      osc.start(now);
      osc.stop(now + 0.3);
      break;
    case 'ting':
      osc.type = 'sine';
      osc.frequency.setValueAtTime(1200, now);
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
      osc.start(now);
      osc.stop(now + 0.15);
      break;
    case 'chime':
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(523, now);
      osc.frequency.setValueAtTime(659, now + 0.1);
      osc.frequency.setValueAtTime(784, now + 0.2);
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
      osc.start(now);
      osc.stop(now + 0.5);
      break;
    case 'buzz':
      osc.type = 'square';
      osc.frequency.setValueAtTime(200, now);
      gain.gain.setValueAtTime(0.1, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
      osc.start(now);
      osc.stop(now + 0.2);
      break;
  }
}

// ===== CANVAS =====
const canvas = $('canvas');
const ctx = canvas.getContext('2d');
let canvasW = 0, canvasH = 0;

function resizeCanvas() {
  const rect = canvas.getBoundingClientRect();
  canvasW = Math.floor(rect.width);
  canvasH = Math.floor(rect.height);
  canvas.width = canvasW * (window.devicePixelRatio || 1);
  canvas.height = canvasH * (window.devicePixelRatio || 1);
  ctx.setTransform(window.devicePixelRatio || 1, 0, 0, window.devicePixelRatio || 1, 0, 0);
  log('Canvas:', canvasW + 'x' + canvasH);
}

// ===== GAMBAR =====
const IMAGES = {};

function loadImage(key, src, hapusBg = false) {
  return new Promise((resolve) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      if (hapusBg) {
        IMAGES[key] = hilangkanBackgroundPutih(img);
      } else {
        IMAGES[key] = img;
      }
      log('Gambar ' + key + ': loaded ' + img.width + 'x' + img.height);
      resolve(IMAGES[key]);
    };
    img.onerror = () => {
      console.warn('[SMP7K] Gagal load gambar:', key, src);
      IMAGES[key] = null;
      resolve(null);
    };
    img.src = src;
  });
}

async function loadSemuaGambar() {
  const list = [
    ['steam-bg', 'assets/steam-bg.png', false],
    ['motor-bebek-kotor', 'assets/motor-bebek-kotor.png', true],

    ['motor-moge-kotor', 'assets/motor-moge-kotor.png', true],
    ['motor-moge-bersih', 'assets/motor-moge-bersih.png', true],
    ['pak-aldi', 'assets/pak-aldi.png', true],
    ['qris', 'assets/qris.png', false],
  ];

  for (const [key, src, hapusBg] of list) {
    await loadImage(key, src, hapusBg);
  }

  state.bgImg = IMAGES['steam-bg'];
  state.bgLoaded = !!state.bgImg;
  if (state.bgImg) {
    log('Gambar steam-bg: loaded ' + state.bgImg.width + 'x' + state.bgImg.height);
  }
}

// ===== RENDER LATAR =====
function renderLatar() {
  ctx.clearRect(0, 0, canvasW, canvasH);

  // Gradient dasar
  const grad = ctx.createLinearGradient(0, 0, 0, canvasH);
  grad.addColorStop(0, '#87CEEB');
  grad.addColorStop(0.3, '#E0F2FE');
  grad.addColorStop(0.6, '#FEF3C7');
  grad.addColorStop(1, '#D1D5DB');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvasW, canvasH);

  // Gambar steam-bg dengan SCALE-Y
  if (state.bgImg && state.bgImg.complete && state.bgImg.naturalWidth > 0) {
    const img = state.bgImg;
    const scale = canvasH / img.naturalHeight;
    const w = img.naturalWidth * scale;
    const h = canvasH;
    const x = (canvasW - w) / 2;
    const y = 0;

    // Isi area kosong kiri-kanan dengan gradient merah
    ctx.fillStyle = '#C8102E';
    ctx.fillRect(0, 0, Math.max(0, x), canvasH);
    ctx.fillRect(Math.min(canvasW, x + w), 0, Math.max(0, canvasW - x - w), canvasH);

    ctx.drawImage(img, x, y, w, h);
  }

  // Overlay cuaca
  if (state.cuaca === 'panas') {
    ctx.fillStyle = 'rgba(255, 200, 0, 0.06)';
    ctx.fillRect(0, 0, canvasW, canvasH);
  } else if (state.cuaca === 'hujan') {
    ctx.fillStyle = 'rgba(100, 150, 200, 0.12)';
    ctx.fillRect(0, 0, canvasW, canvasH);
    // Hujan
    ctx.strokeStyle = 'rgba(180, 200, 230, 0.5)';
    ctx.lineWidth = 1;
    for (let i = 0; i < 40; i++) {
      const rx = (Math.sin(i * 7.3 + state.frameCount * 0.02) * 0.5 + 0.5) * canvasW;
      const ry = ((i * 37 + state.frameCount * 3) % canvasH);
      ctx.beginPath();
      ctx.moveTo(rx, ry);
      ctx.lineTo(rx - 2, ry + 12);
      ctx.stroke();
    }
  }
}

// ===== SPAWN MOTOR =====
function spawnMotor() {
  // Hitung slot kosong
  const slotKosong = [];
  for (let i = 0; i < 12; i++) {
    if (!state.slotParkir[i]) slotKosong.push(i);
  }

  const parkirPenuh = slotKosong.length === 0;

  // Tentukan tipe motor
  const rand = Math.random();
  let isMoge = false;
  let level = 'bebek';

  if (rand < 0.125) { // 1/8
    isMoge = true;
    level = 'moge';
  } else if (rand < 0.125 + 0.333) { // 1/3 dari sisanya
    level = 'bebek';
  }

  // Kalau parkir penuh, semua lewat
  const akanParkir = !parkirPenuh && (level === 'bebek' || level === 'moge');

  // Tentukan arah spawn
  const dariKiri = Math.random() > 0.5;
  const spawnX = dariKiri ? -80 : canvasW + 80;
  const arah = dariKiri ? 1 : -1;

  const motor = {
    id: 'm' + Date.now() + '_' + Math.floor(Math.random() * 1000),
    x: spawnX,
    y: canvasH * 0.95,
    arah: arah, // 1 = kanan, -1 = kiri
    state: 'lewat',
    level: level,
    isMoge: isMoge,
    kotor: true,
    tapCount: 0,
    waktuMasuk: 0,
    sudahNontonIklan: false,
    slotTarget: akanParkir ? slotKosong[Math.floor(Math.random() * slotKosong.length)] : -1,
    rotasi: 0,
    targetX: 0,
    targetY: 0,
    animProgress: 0,
    animPhase: '',
    timestamp: Date.now(),
    kabur: false,
    selesai: false,
  };

  // Kalau akan parkir, set state masuk
  if (akanParkir) {
    motor.state = 'masuk';
    motor.waktuMasuk = Date.now();
    motor.animPhase = 'keJembatan';
    motor.targetX = canvasW * 0.20;
    motor.targetY = canvasH * 0.95;
    motor.animProgress = 0;
  }

  state.motors.push(motor);
  state.motorSpawnCounter++;

  log('Spawn motor ke-' + state.motorSpawnCounter + ': x=' + Math.floor(motor.x) + ', y=' + Math.floor(motor.y) + ', state=' + motor.state + ', level=' + level + ', slot=' + motor.slotTarget);
}

// ===== UPDATE MOTOR =====
function updateMotor(motor, dt) {
  const now = Date.now();

  if (motor.selesai) return;

  // ===== STATE: LEWAT =====
  if (motor.state === 'lewat') {
    motor.x += motor.arah * (state.cuaca === 'hujan' ? 1.2 : 2.2);
    if ((motor.arah > 0 && motor.x > canvasW + 100) || (motor.arah < 0 && motor.x < -100)) {
      motor.selesai = true;
    }
  }

  // ===== STATE: MASUK =====
  else if (motor.state === 'masuk') {
    motor.animProgress += dt * 0.5; // 2 detik total

    if (motor.animPhase === 'keJembatan') {
      // Dari jalan raya ke jembatan kiri
      const t = Math.min(1, motor.animProgress);
      motor.x = motor.x + (canvasW * 0.20 - motor.x) * 0.08;
      if (t >= 1 || Math.abs(motor.x - canvasW * 0.20) < 5) {
        motor.x = canvasW * 0.20;
        motor.animPhase = 'naik';
        motor.animProgress = 0;
      }
    } else if (motor.animPhase === 'naik') {
      // Naik dari jalan raya ke slot parkir
      const slot = motor.slotTarget;
      if (slot >= 0) {
        const baris = Math.floor(slot / 4);
        const kolom = slot % 4;
        const targetY = canvasH * (0.30 + baris * 0.07);
        const targetX = canvasW * (0.18 + kolom * 0.20);

        motor.y = motor.y + (targetY - motor.y) * 0.06;
        motor.x = motor.x + (targetX - motor.x) * 0.06;

        if (Math.abs(motor.y - targetY) < 5 && Math.abs(motor.x - targetX) < 5) {
          motor.y = targetY;
          motor.x = targetX;
          motor.state = 'parkir';
          motor.waktuMasuk = now;
          motor.rotasi = Math.PI; // rotate 180°
          state.slotParkir[slot] = motor.id;
          log('Motor parkir di slot ' + slot + ': ' + motor.id);
        }
      }
    }
  }

  // ===== STATE: PARKIR =====
  else if (motor.state === 'parkir') {
    const elapsed = (now - motor.waktuMasuk) / 1000;

    // 5 detik → 💢
    if (elapsed > 5 && !motor.emosi) {
      motor.emosi = true;
    }

    // 8 detik → kabur
    if (elapsed > 8 && !motor.kabur) {
      motor.kabur = true;
      motor.state = 'keluar';
      motor.animPhase = 'turun';
      motor.animProgress = 0;
      motor.targetX = canvasW * 0.80;
      motor.targetY = canvasH * 0.95;
      tampilToast('Pelanggan kabur! 🏃', 'merah');
      playSuara('buzz');
      // Kosongkan slot
      if (motor.slotTarget >= 0) {
        state.slotParkir[motor.slotTarget] = null;
      }
    }
  }

  // ===== STATE: DICARI (setelah tap) =====
  else if (motor.state === 'dicuci') {
    // Motor pergi setelah dicuci
    motor.state = 'keluar';
    motor.animPhase = 'turun';
    motor.animProgress = 0;
    motor.targetX = canvasW * 0.80;
    motor.targetY = canvasH * 0.95;
    if (motor.slotTarget >= 0) {
      state.slotParkir[motor.slotTarget] = null;
    }
  }

  // ===== STATE: KELUAR =====
  else if (motor.state === 'keluar') {
    motor.animProgress += dt * 0.5;

    if (motor.animPhase === 'turun') {
      // Dari slot ke jembatan kanan
      const t = Math.min(1, motor.animProgress);
      motor.x = motor.x + (canvasW * 0.80 - motor.x) * 0.06;
      motor.y = motor.y + (canvasH * 0.95 - motor.y) * 0.06;

      if (Math.abs(motor.x - canvasW * 0.80) < 5 && Math.abs(motor.y - canvasH * 0.95) < 5) {
        motor.x = canvasW * 0.80;
        motor.y = canvasH * 0.95;
        motor.animPhase = 'jalan';
        motor.animProgress = 0;
        motor.arah = 1; // ke kanan
      }
    } else if (motor.animPhase === 'jalan') {
      motor.x += 2.5;
      if (motor.x > canvasW + 100) {
        motor.selesai = true;
      }
    }
  }
}

// ===== RENDER MOTOR =====
function renderMotor(motor) {
  const imgKotor = motor.isMoge ? IMAGES['motor-moge-kotor'] : IMAGES['motor-bebek-kotor'];
  const imgBersih = motor.isMoge ? IMAGES['motor-moge-bersih'] : IMAGES['motor-bebek-bersih'];

  let img = motor.kotor ? imgKotor : imgBersih;
  if (!img) return;

  const w = motor.isMoge ? 70 : 60;
  const h = motor.isMoge ? 90 : 80;

  ctx.save();
  ctx.translate(motor.x, motor.y);

  // Rotasi
  if (motor.state === 'parkir' || motor.state === 'masuk' || motor.state === 'keluar') {
    if (motor.rotasi) ctx.rotate(motor.rotasi);
  } else {
    // Di jalan raya, hadap arah gerak
    if (motor.arah < 0) ctx.scale(-1, 1);
  }

  // Kilau emas untuk Moge
  if (motor.isMoge) {
    ctx.shadowColor = '#F59E0B';
    ctx.shadowBlur = 15 + Math.sin(state.frameCount * 0.1) * 5;
  }

  ctx.drawImage(img, -w/2, -h/2, w, h);

  // Sparkle untuk Moge
  if (motor.isMoge) {
    ctx.shadowBlur = 0;
    for (let i = 0; i < 3; i++) {
      const angle = state.frameCount * 0.05 + i * 2.1;
      const r = 25 + Math.sin(state.frameCount * 0.1 + i) * 8;
      const sx = Math.cos(angle) * r;
      const sy = Math.sin(angle) * r;
      ctx.font = '12px sans-serif';
      ctx.fillText('✨', sx - 6, sy + 4);
    }
  }

  ctx.restore();

  // Emosi 💢
  if (motor.emosi && motor.state === 'parkir') {
    ctx.font = '20px sans-serif';
    ctx.fillText('💢', motor.x + 20, motor.y - 40);
  }

  // Ikon 🎬 untuk Moge
  if (motor.isMoge && motor.state === 'parkir') {
    ctx.font = '16px sans-serif';
    ctx.fillText('🎬', motor.x - 30, motor.y - 40);
  }

  // Indikator tap
  if (motor.state === 'parkir' && motor.kotor) {
    const maxTap = motor.isMoge ? 5 : 1;
    ctx.font = 'bold 11px Poppins, sans-serif';
    ctx.fillStyle = '#C8102E';
    ctx.textAlign = 'center';
    ctx.fillText(motor.tapCount + '/' + maxTap, motor.x, motor.y + 55);
    ctx.textAlign = 'left';
  }
}

// ===== TAP MOTOR =====
function cekTapMotor(x, y) {
  // Cari motor yang di-tap (dari yang paling atas / terakhir)
  for (let i = state.motors.length - 1; i >= 0; i--) {
    const m = state.motors[i];
    if (m.selesai || m.state !== 'parkir' || !m.kotor) continue;

    const w = m.isMoge ? 70 : 60;
    const h = m.isMoge ? 90 : 80;
    const dx = Math.abs(x - m.x);
    const dy = Math.abs(y - m.y);

    if (dx < w * 0.7 && dy < h * 0.7) {
      handleTapMotor(m);
      return true;
    }
  }
  return false;
}

function handleTapMotor(motor) {
  log('Tap motor:', motor.id, 'tapCount', motor.tapCount);

  const maxTap = motor.isMoge ? 5 : 1;

  // Moge wajib nonton iklan
  if (motor.isMoge && !motor.sudahNontonIklan) {
    tampilModalIklanMoge(motor);
    return;
  }

  // Efek tap
  efekTap(motor.x, motor.y);
  playSuara('syuush');

  motor.tapCount++;

  if (motor.tapCount >= maxTap) {
    // Selesai dicuci
    motor.kotor = false;
    motor.state = 'dicuci';

    // Hitung koin
    const koinDidapat = motor.isMoge ? 500 : 1;
    state.koin += koinDidapat;
    state.pendingProduction += koinDidapat;
    state.motorDicuci++;
    state.totalKoinDidapat += koinDidapat;

    // Efek koin terbang
    efekKoinTerbang(motor.x, motor.y);
    playSuara('chime');

    tampilToast('+' + koinDidapat + ' koin! 🪙', 'emas');

    // Update header
    updateHeader();

    // Cek story & quest
    cekStory();
    cekQuest();

    // Simpan ke localStorage
    simpanLokal();

    // Update ke backend (tap = langsung sync)
    syncKeBackend();

    log('Motor dicuci: ' + motor.id + ', koin +' + koinDidapat + ', total koin=' + state.koin);
  } else {
    // Setengah bersih
    if (motor.tapCount === Math.floor(maxTap / 2)) {
      // Efek visual setengah
    }
    // Update tampilan
    playSuara('ting');
  }
}

// ===== EFEK TAP =====
function efekTap(x, y) {
  // Partikel air
  for (let i = 0; i < 8; i++) {
    const angle = Math.random() * Math.PI * 2;
    const dist = 5 + Math.random() * 15;
    const px = x + Math.cos(angle) * dist;
    const py = y + Math.sin(angle) * dist;
    const size = 5 + Math.random() * 5;

    ctx.beginPath();
    ctx.arc(px, py, size, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(100, 180, 255, 0.6)';
    ctx.fill();
  }
}

// ===== EFEK KOIN TERBANG =====
function efekKoinTerbang(x, y) {
  const startX = x;
  const startY = y;
  const endX = canvasW - 60;
  const endY = 30;
  const duration = 800;
  const startTime = performance.now();

  function animate(now) {
    const elapsed = now - startTime;
    const t = Math.min(1, elapsed / duration);
    const ease = 1 - Math.pow(1 - t, 3);

    const px = startX + (endX - startX) * ease;
    const py = startY + (endY - startY) * ease;

    ctx.font = '20px sans-serif';
    ctx.fillText('🪙', px - 10, py + 7);

    if (t < 1) {
      requestAnimationFrame(animate);
    }
  }
  requestAnimationFrame(animate);
}

// ===== RENDER LOOP =====
let lastRenderTime = performance.now();

function renderLoop(now) {
  const dt = Math.min(0.1, (now - lastRenderTime) / 1000);
  lastRenderTime = now;

  state.frameCount++;

  // Resize cek
  const rect = canvas.getBoundingClientRect();
  if (Math.abs(rect.width - canvasW) > 1 || Math.abs(rect.height - canvasH) > 1) {
    resizeCanvas();
  }

  // Render latar
  renderLatar();

  // Update & render motor
  let motorAktif = 0;
  for (const m of state.motors) {
    if (!m.selesai) {
      updateMotor(m, dt);
      renderMotor(m);
      motorAktif++;
    }
  }

  // Hapus motor yang selesai
  state.motors = state.motors.filter(m => !m.selesai);

  // Debug render
  if (state.frameCount % 120 === 0) {
    log('Render frame ' + state.frameCount + ': ' + motorAktif + ' motor');
  }

  requestAnimationFrame(renderLoop);
}

// ===== SPAWN LOOP =====
function startSpawnLoop() {
  if (state.spawnLoopStarted) {
    log('Spawn loop sudah jalan');
    return;
  }
  state.spawnLoopStarted = true;

  const intervalPanas = 2000; // 1 motor / 2 detik
  const intervalHujan = 6000; // 1 motor / 6 detik
  let interval = state.cuaca === 'panas' ? intervalPanas : intervalHujan;

  log('Spawn loop: mulai, interval=' + interval + 'ms');

  setInterval(() => {
    // Cek parkir penuh
    const slotKosong = state.slotParkir.filter(s => s === null).length;
    if (slotKosong === 0) {
      // Parkir penuh, semua lewat
      spawnMotor();
      return;
    }
    spawnMotor();
  }, interval);

  // Ganti interval saat cuaca berubah
  setInterval(() => {
    const newInterval = state.cuaca === 'panas' ? intervalPanas : intervalHujan;
    if (newInterval !== interval) {
      interval = newInterval;
      log('Spawn interval berubah: ' + interval + 'ms');
    }
  }, 5000);
}

// ===== PRODUKSI LOOP (HANYA SATU) =====
function startProduksiLoop() {
  if (state.produksiLoopStarted) {
    log('Produksi loop sudah jalan');
    return;
  }
  state.produksiLoopStarted = true;
  window.__produksiLoop = true;

  log('Produksi loop: mulai');

  setInterval(() => {
    // Hitung total produksi per detik
    let totalProd = 0;

    // Upgrade
    const upgrades = state.upgrades || {};
    const upgradeDefs = [
      { key: 'semprot', prod: 1 },
      { key: 'sabun', prod: 5 },
      { key: 'bilas', prod: 25 },
      { key: 'kering', prod: 100 },
      { key: 'poles', prod: 500 },
      { key: 'kompresor', prod: 2500 },
    ];

    for (const u of upgradeDefs) {
      const lvl = upgrades[u.key] || 0;
      totalProd += lvl * u.prod;
    }

    // Manajer
    const managers = state.managers || [];
    for (const m of managers) {
      if (m.aktif) {
        totalProd += m.produksi || 0;
      }
    }

    state.totalProd = totalProd;

    // Kalau totalProd = 0, JANGAN tambah
    if (totalProd > 0) {
      state.pendingProduction = Math.min(MAX_PENDING, state.pendingProduction + totalProd);
    }

    // Debug
    if (state.frameCount % 300 === 0) {
      log('Upgrade total: ' + totalProd + ', pending: ' + state.pendingProduction + ', koin: ' + state.koin);
    }

    // Update header
    updateHeader();
  }, 1000);
}

// ===== SYNC KE BACKEND =====
async function syncKeBackend() {
  if (!state.user) return;

  const kirim = state.koin + state.pendingProduction;
  log('Sync: kirim=' + kirim + ', pending=' + state.pendingProduction);

  try {
    const res = await apiCall('update', {
      sheet: 'Users',
      id: state.user.id,
      data: {
        saldo_koin: kirim,
        saldo_rupiah: state.rupiah,
        kristal: state.kristal,
        level: state.level,
        cabang_aktif: state.branches,
        last_sync: new Date().toISOString(),
        story_unlocked: state.storyUnlocked,
      }
    });

    if (res.ok) {
      state.koin = kirim;
      state.pendingProduction = 0;
      log('Sync sukses, pending reset');
      updateHeader();
      simpanLokal();
    }
  } catch (err) {
    console.warn('[SMP7K] Sync gagal:', err.message);
    // JANGAN reset pendingProduction
  }
}

      state.branches = u.cabang_aktif || state.branches;

      log('User dari localStorage: ' + u.nama);

// ===== CEK STORY =====
function cekStory() {
  const unlocked = state.storyUnlocked;

  // Bab 2: motor dicuci ≥ 5
  if (unlocked < 2 && state.motorDicuci >= 5) {
    state.storyUnlocked = 2;
    tampilToast('📖 Bab 2 terbuka!', 'emas');
    playSuara('chime');
  }
  // Bab 3: total koin ≥ 10000
  if (unlocked < 3 && state.totalKoinDidapat >= 10000) {
    state.storyUnlocked = 3;
    tampilToast('📖 Bab 3 terbuka!', 'emas');
  }
  // Bab 4: manajer ≥ 1
  if (unlocked < 4 && state.managers.length >= 1) {
    state.storyUnlocked = 4;
    tampilToast('📖 Bab 4 terbuka!', 'emas');
  }
  // Bab 5: total koin ≥ 1.000.000
  if (unlocked < 5 && state.totalKoinDidapat >= 1000000) {
    state.storyUnlocked = 5;
    tampilToast('📖 Bab 5 terbuka!', 'emas');
  }
  // Bab 6: manajer ≥ 3
  if (unlocked < 6 && state.managers.length >= 3) {
    state.storyUnlocked = 6;
    tampilToast('📖 Bab 6 terbuka!', 'emas');
  }
  // Bab 7: total koin ≥ 1.000.000.000
  if (unlocked < 7 && state.totalKoinDidapat >= 1000000000) {
    state.storyUnlocked = 7;
    tampilToast('📖 Bab 7 terbuka!', 'emas');
  }

  updateExtra('storyUnlocked', state.storyUnlocked);
}

      <div class="item-icon">🚿</div>
      <div class="item-body">
        <div class="item-title">Motor Dicuci</div>
        <div class="item-desc">${state.motorDicuci} motor</div>
      </div>
    </div>

    <div class="list-item">
      <div class="item-icon">📖</div>
      <div class="item-body">
        <div class="item-title">Cerita Terbuka</div>
        <div class="item-desc">Bab ${state.storyUnlocked}/7</div>
      </div>
    </div>

    <button class="modal-btn" id="btnLogoutProfil" style="margin-top:16px;background:linear-gradient(135deg,#EF4444,#DC2626);">
      🚪 Keluar
    </button>
  `;
}

// ===== TAB LAINNYA =====
function renderTabLainnya() {
  const items = [
    { icon: '🏢', nama: 'Cabang', desc: 'Kelola cabang usaha' },
    { icon: '🔄', nama: 'Convert', desc: 'Tukar koin jadi rupiah' },
    { icon: '💰', nama: 'Topup', desc: 'Isi saldo koin/rupiah/kristal' },
    { icon: '🎫', nama: 'Voucher', desc: 'Tukar voucher cuci' },
    { icon: '📖', nama: 'Cerita', desc: 'Baca kisah Steam MP 7000' },
  ];

  let html = '<div class="panel-title">⋯ Lainnya</div>';

  for (const it of items) {
    html += `
      <div class="list-item" data-panel="${it.nama.toLowerCase()}">
        <div class="item-icon">${it.icon}</div>
        <div class="item-body">
          <div class="item-title">${it.nama}</div>
          <div class="item-desc">${it.desc}</div>
        </div>
      </div>
    `;
  }

  return html;
}

// ===== BIND PANEL EVENTS =====
function bindPanelEvents(tab) {
  // Manajer
  document.querySelectorAll('[data-beli-manajer]').forEach(btn => {
    btn.onclick = () => {
      const nama = btn.dataset.beliManajer;
      const harga = parseInt(btn.dataset.harga);
      const prod = parseInt(btn.dataset.prod);

      if (state.koin < harga) {
        tampilToast('Koin tidak cukup!', 'merah');
        playSuara('buzz');
        return;
      }

      state.koin -= harga;
      state.managers.push({ nama, produksi: prod, aktif: true });
      updateExtra('managers', state.managers);
      simpanLokal();
      updateHeader();
      tampilToast('✅ ' + nama + ' direkrut!', 'hijau');
      playSuara('chime');
      bukaPanel('manajer');
      syncKeBackend();
    };
  });

  // Toko
  document.querySelectorAll('[data-beli-item]').forEach(btn => {
    btn.onclick = () => {
      tampilToast('✅ Item dibeli!', 'hijau');
      playSuara('chime');
    };
  });

  // Quest
  document.querySelectorAll('[data-klaim-quest]').forEach(btn => {
    btn.onclick = () => {
      const qid = btn.dataset.klaimQuest;
      const progress = getExtra().questProgress || {};
      progress[qid + '_claimed'] = true;
      updateExtra('questProgress', progress);

      const rewards = { q1: 500, q2: 1000, q3: 200, q4: 300, q5: 5000, q6: 10000, q7: 3000, q8: 25000, q9: 50000, q10: 100000, q11: 200000, q12: 150000, q13: 1000000 };
      const reward = rewards[qid] || 500;

      state.koin += reward;
      state.pendingProduction += reward;
      updateHeader();
      simpanLokal();
      tampilToast('+' + formatAngka(reward) + ' koin! 🪙', 'emas');
      playSuara('chime');
      bukaPanel('quest');
      syncKeBackend();
    };
  });

  // Panel lainnya
  document.querySelectorAll('[data-panel]').forEach(el => {
    el.onclick = () => {
      const panel = el.dataset.panel;
      tampilToast('Panel ' + panel + ' segera hadir!', '');
    };
  });

  // Logout profil
  const btnLogout = $('btnLogoutProfil');
  if (btnLogout) {
    btnLogout.onclick = () => {
      keluarAkun();
    };
  }
}

// ===== KELUAR AKUN =====
function keluarAkun() {
  if (state.redirecting) return;
  state.redirecting = true;

  localStorage.removeItem(LS_USER);
  localStorage.removeItem(LS_EXTRA);

  tampilToast('👋 Sampai jumpa!', 'emas');

  setTimeout(() => {
    window.location.replace('index.html');
  }, 800);
}

// ===== CEK SESSION =====
function cekSession() {
  try {
    const u = JSON.parse(localStorage.getItem(LS_USER) || '{}');
    if (u && u.id) {
      state.user = u;
      muatLokal();
      return true;
    }
  } catch (e) {}
  return false;
}

// ===== LOAD USER DARI BACKEND =====
async function loadUserFromBackend() {
  if (!state.user) return;

  try {
    const res = await apiCall('bacaSatu', {
      sheet: 'Users',
      id: state.user.id
    });

    if (res.ok && res.data) {
      const u = res.data;
      state.user = u;
      state.koin = u.saldo_koin || 0;
      state.rupiah = u.saldo_rupiah || 0;
      state.kristal = u.kristal || 0;
      state.level = u.level || 1;
      state.branches = u.cabang_aktif || 1;
      state.storyUnlocked = u.story_unlocked || 0;
      localStorage.setItem(LS_USER, JSON.stringify(u));
      updateHeader();
      log('User dari backend: ' + u.nama);
    }
  } catch (err) {
    console.warn('[SMP7K] Gagal load user:', err.message);
  }
}

// ===== CUACA =====
function mulaiCuaca() {
  const gantiCuaca = () => {
    const baru = Math.random() > 0.5 ? 'panas' : 'hujan';
    if (baru !== state.cuaca) {
      state.cuaca = baru;
      $('btnCuaca').textContent = baru === 'panas' ? '☀️' : '🌧️';
      tampilToast(baru === 'panas' ? '☀️ Cuaca panas' : '🌧️ Cuaca hujan', '');
      log('Cuaca berubah: ' + baru);
    }
    // Ganti random 1-3 menit
    const next = 60000 + Math.random() * 120000;
    setTimeout(gantiCuaca, next);
  };

  // Pertama kali
  state.cuaca = 'panas';
  $('btnCuaca').textContent = '☀️';
  setTimeout(gantiCuaca, 60000 + Math.random() * 120000);
}

// ===== INIT =====
async function init() {
  log('Dashboard: load');

  // Cek admin mode
  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.get('admin') === '1' && localStorage.getItem(LS_ADMIN)) {
    state.adminMode = true;
    $('adminPanel').classList.add('aktif');
    initAdmin();
  }

  // Cek session
  if (!cekSession()) {
    // Tidak ada session → tampilkan pesan + tombol login
    document.body.innerHTML = `
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:linear-gradient(135deg,#C8102E,#9A0C22);color:#fff;text-align:center;padding:20px;font-family:Poppins,sans-serif;">
        <div style="font-size:60px;margin-bottom:16px;">🏍️</div>
        <h1 style="font-size:22px;font-weight:800;margin-bottom:8px;">Steam MP 7000 Tycoon</h1>
        <p style="font-size:13px;opacity:0.8;margin-bottom:24px;">Kamu belum login. Silakan login dulu untuk bermain.</p>
        <button onclick="window.location.href='index.html'" style="padding:14px 32px;border:none;border-radius:14px;background:#F59E0B;color:#9A0C22;font-size:15px;font-weight:800;font-family:Poppins,sans-serif;cursor:pointer;box-shadow:0 4px 15px rgba(245,158,11,0.4);">
          🔑 Login
        </button>
      </div>
    `;
    return;
  }

  // Resize canvas
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  // Load gambar
  await loadSemuaGambar();

  // Muat data lokal
  muatLokal();

  // Update header
  updateHeader();

  // Load user dari backend (background)
  loadUserFromBackend();

  // Mulai render loop
  requestAnimationFrame(renderLoop);

  // Mulai spawn loop (setelah canvas siap)
  startSpawnLoop();

  // Mulai produksi loop (HANYA SATU)
  startProduksiLoop();

  // Mulai sync loop
  startSyncLoop();

  // Mulai cuaca
  mulaiCuaca();

  // Init musik
  initMusik();

  // ===== EVENT LISTENERS =====
  // Canvas tap
  canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    cekTapMotor(x, y);
  });

  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const touch = e.touches[0];
    const x = touch.clientX - rect.left;
    const y = touch.clientY - rect.top;
    cekTapMotor(x, y);
  }, { passive: false });

  // Nav
  document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.onclick = () => bukaPanel(btn.dataset.tab);
  });

  // Tombol header
  $('btnMusik').onclick = toggleMusik;
  $('btnCuaca').onclick = () => {
    state.cuaca = state.cuaca === 'panas' ? 'hujan' : 'panas';
    $('btnCuaca').textContent = state.cuaca === 'panas' ? '☀️' : '🌧️';
    tampilToast(state.cuaca === 'panas' ? '☀️ Cuaca panas' : '🌧️ Cuaca hujan', '');
  };
  $('btnMenu').onclick = () => bukaPanel('lainnya');
  $('btnKeluar').onclick = keluarAkun;

  // Tutup panel saat tap overlay
  $('modalOverlay').onclick = (e) => {
    if (e.target === $('modalOverlay')) {
      $('modalOverlay').classList.remove('aktif');
    }
  };

  // Story Bab 1 wajib
  if (state.storyUnlocked < 1) {
    setTimeout(() => {
      tampilModalStory(1);
    }, 1500);
  }

  log('Dashboard: siap');
}

// ===== MODAL STORY =====
function tampilModalStory(bab) {
  const overlay = $('modalOverlay');
  const icon = $('modalIcon');
  const title = $('modalTitle');
  const dialog = $('modalDialog');
  const btn = $('modalBtn');

  const cerita = {
    1: { judul: 'Bab 1: Awal Mula', isi: 'Pak Aldi membuka usaha cuci motor sederhana bernama Steam MP 7000. Ia bermimpi punya cabang di seluruh kota. Bantulah Pak Aldi membangun kerajaannya!' },
    2: { judul: 'Bab 2: Pelanggan Setia', isi: 'Usaha Pak Aldi mulai dikenal. Pelanggan datang silih berganti. Teruslah mencuci motor untuk mendapatkan lebih banyak koin!' },
    3: { judul: 'Bab 3: Koin Pertama', isi: 'Pak Aldi berhasil mengumpulkan 10.000 koin! Ia mulai bisa membeli peralatan yang lebih baik.' },
    4: { judul: 'Bab 4: Merekrut Manajer', isi: 'Pak Aldi merekrut manajer pertamanya. Usaha semakin berkembang pesat!' },
    5: { judul: 'Bab 5: Jutaan Koin', isi: 'Steam MP 7000 telah menghasilkan 1 juta koin! Pak Aldi semakin dekat dengan mimpinya.' },
    6: { judul: 'Bab 6: Tim Solid', isi: 'Dengan 3 manajer, Pak Aldi bisa fokus mengembangkan cabang baru.' },
    7: { judul: 'Bab 7: Raja Steam', isi: '1 miliar koin! Pak Aldi resmi menjadi Raja Steam MP 7000. Terima kasih telah bermain!' },
  };

  const c = cerita[bab] || cerita[1];

  icon.innerHTML = '<img src="assets/pak-aldi.png" alt="Pak Aldi" onerror="this.style.display=\'none\';this.parentElement.textContent=\'👨‍🔧\'">';
  title.textContent = c.judul;
  dialog.textContent = c.isi;

  btn.textContent = bab < 7 ? 'Lanjut ➡️' : 'Selesai ✅';
  btn.className = 'modal-btn emas';
  btn.disabled = false;

  btn.onclick = () => {
    overlay.classList.remove('aktif');
    if (bab >= 1) {
      state.storyUnlocked = Math.max(state.storyUnlocked, bab);
      updateExtra('storyUnlocked', state.storyUnlocked);
      simpanLokal();
      if (bab < 7) {
        setTimeout(() => tampilModalStory(bab + 1), 500);
      }
    }
  };

  overlay.classList.add('aktif');
}

// ===== ADMIN PANEL =====
function initAdmin() {
  log('Admin mode aktif');

  document.querySelectorAll('.admin-tab').forEach(tab => {
    tab.onclick = () => {
      document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('aktif'));
      tab.classList.add('aktif');
      renderAdminTab(tab.dataset.atab);
    };
  });

  $('adminKeluar').onclick = () => {
    localStorage.removeItem(LS_ADMIN);
    window.location.href = 'index.html';
  };

  renderAdminTab('dashboard');
}

async function renderAdminTab(tab) {
  const content = $('adminContent');
  content.innerHTML = '<div style="text-align:center;padding:40px;color:#999;">Memuat...</div>';

  try {
    switch (tab) {
      case 'dashboard':
        const users = await apiCall('baca', { sheet: 'Users' });
        const totalUsers = users.data ? users.data.length : 0;
        content.innerHTML = `
          <div class="list-item"><div class="item-icon">👥</div><div class="item-body"><div class="item-title">Total Pemain</div><div class="item-desc">${totalUsers} pemain</div></div></div>
          <div class="list-item"><div class="item-icon">🪙</div><div class="item-body"><div class="item-title">Total Koin</div><div class="item-desc">${users.data ? users.data.reduce((a,u) => a + (u.saldo_koin || 0), 0).toLocaleString() : 0}</div></div></div>
        `;
        break;
      default:
        content.innerHTML = '<div style="text-align:center;padding:40px;color:#999;">Tab ' + tab + ' segera hadir</div>';
    }
  } catch (err) {
    content.innerHTML = '<div style="text-align:center;padding:40px;color:#EF4444;">Gagal memuat: ' + err.message + '</div>';
  }
}

// ===== START =====
document.addEventListener('DOMContentLoaded', init);

// Resume audio on first interaction
document.addEventListener('click', () => {
  getAudioCtx();
}, { once: true });

log('Dashboard script loaded');
</script>
</body>
</html>
