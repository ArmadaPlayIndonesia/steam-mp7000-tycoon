<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Steam MP 7000 Tycoon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Poppins',sans-serif;background:#1a1a1a;color:#FAFAFA;user-select:none;}

/* === HEADER === */
#header{position:fixed;top:0;left:0;right:0;height:80px;z-index:100;
background:linear-gradient(180deg,#C8102E 0%,#a00d24 100%);
display:flex;align-items:center;padding:0 10px;gap:6px;
box-shadow:0 2px 12px rgba(0,0,0,.4);}
#logoMP{width:44px;height:44px;border-radius:12px;background:#F59E0B;
display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;color:#fff;
box-shadow:0 0 10px rgba(245,158,11,.6);flex-shrink:0;}
#headerInfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
#playerName{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;}
#playerPhone{font-size:10px;color:rgba(255,255,255,.75);}
#levelBarWrap{display:flex;align-items:center;gap:4px;margin-top:1px;}
#levelText{font-size:9px;font-weight:700;color:#F59E0B;white-space:nowrap;}
#levelBarBg{flex:1;height:6px;background:rgba(0,0,0,.3);border-radius:3px;overflow:hidden;max-width:90px;}
#levelBarFill{height:100%;background:linear-gradient(90deg,#F59E0B,#fbbf24);border-radius:3px;transition:width .4s;width:0%;}
#headerStats{display:flex;flex-direction:column;gap:2px;align-items:flex-end;flex-shrink:0;}
.statRow{display:flex;align-items:center;gap:3px;font-size:11px;font-weight:700;color:#fff;}
.statRow img{width:16px;height:16px;object-fit:contain;}
.statRow .emojiIcon{font-size:14px;}
#weatherIcon{font-size:18px;margin-left:2px;}
.headerBtn{width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,.15);
border:none;color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;
flex-shrink:0;transition:background .2s;}
.headerBtn:active{background:rgba(255,255,255,.35);}

/* === CANVAS === */
#gameCanvas{position:fixed;top:80px;bottom:70px;left:0;right:0;width:100%;height:auto;z-index:1;display:block;}

/* === BOTTOM NAV === */
#bottomNav{position:fixed;bottom:0;left:0;right:0;height:70px;z-index:100;
background:rgba(20,20,30,.92);backdrop-filter:blur(12px);
display:flex;align-items:center;overflow-x:auto;overflow-y:hidden;
padding:0 4px;gap:0;box-shadow:0 -2px 12px rgba(0,0,0,.5);
-webkit-overflow-scrolling:touch;scrollbar-width:none;}
#bottomNav::-webkit-scrollbar{display:none;}
.navItem{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;
min-width:56px;height:60px;gap:2px;border:none;background:transparent;color:rgba(255,255,255,.6);
font-family:'Poppins',sans-serif;font-size:9px;font-weight:600;cursor:pointer;
border-radius:12px;transition:all .2s;padding:4px 6px;}
.navItem:active{background:rgba(200,16,46,.3);}
.navItem.active{color:#F59E0B;background:rgba(245,158,11,.12);}
.navItem .navEmoji{font-size:20px;line-height:1;}

/* === PANEL SLIDE-UP === */
.panel{position:fixed;bottom:70px;left:0;right:0;max-height:70vh;overflow-y:auto;z-index:90;
background:rgba(24,24,36,.97);backdrop-filter:blur(16px);
border-radius:20px 20px 0 0;padding:16px 16px 80px 16px;
transform:translateY(110%);transition:transform .35s cubic-bezier(.34,1.56,.64,1);
box-shadow:0 -4px 30px rgba(0,0,0,.5);-webkit-overflow-scrolling:touch;}
.panel.open{transform:translateY(0);}
.panelHeader{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;
position:sticky;top:0;background:rgba(24,24,36,.97);z-index:5;padding:4px 0 8px 0;}
.panelTitle{font-size:17px;font-weight:700;color:#F59E0B;}
.panelClose{width:32px;height:32px;border-radius:50%;background:rgba(200,16,46,.3);
border:none;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.panelClose:active{background:rgba(200,16,46,.6);}

/* === LIST ITEMS === */
.listItem{display:flex;align-items:center;gap:10px;padding:12px 10px;border-radius:14px;
background:rgba(255,255,255,.05);margin-bottom:8px;transition:background .2s;}
.listItem:active{background:rgba(255,255,255,.12);}
.listIcon{width:40px;height:40px;border-radius:12px;background:rgba(200,16,46,.25);
display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;overflow:hidden;}
.listIcon img{width:100%;height:100%;object-fit:contain;}
.listInfo{flex:1;min-width:0;}
.listName{font-size:13px;font-weight:700;color:#fff;}
.listDesc{font-size:10px;color:rgba(255,255,255,.55);margin-top:1px;}
.listAction{flex-shrink:0;padding:8px 14px;border-radius:10px;border:none;
font-family:'Poppins',sans-serif;font-size:11px;font-weight:700;cursor:pointer;
background:linear-gradient(135deg,#C8102E,#e01535);color:#fff;transition:all .2s;}
.listAction:active{transform:scale(.95);}
.listAction:disabled{background:rgba(255,255,255,.1);color:rgba(255,255,255,.3);cursor:not-allowed;}
.listAction.gold{background:linear-gradient(135deg,#F59E0B,#fbbf24);color:#1a1a1a;}
.listAction.green{background:linear-gradient(135deg,#16a34a,#22c55e);}

/* === PROGRESS BAR === */
.progressWrap{width:100%;height:10px;background:rgba(0,0,0,.35);border-radius:5px;
overflow:hidden;margin-top:4px;}
.progressFill{height:100%;background:linear-gradient(90deg,#C8102E,#F59E0B);
border-radius:5px;transition:width .5s;}

/* === MODAL === */
.modalOverlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.75);
display:flex;align-items:center;justify-content:center;padding:20px;
opacity:0;pointer-events:none;transition:opacity .3s;}
.modalOverlay.show{opacity:1;pointer-events:auto;}
.modalBox{background:linear-gradient(160deg,#1e1e2e,#151520);border:2px solid #F59E0B;
border-radius:20px;padding:20px;max-width:360px;width:100%;max-height:80vh;overflow-y:auto;
box-shadow:0 0 40px rgba(245,158,11,.3);transform:scale(.9);transition:transform .3s;}
.modalOverlay.show .modalBox{transform:scale(1);}
.modalTitle{font-size:16px;font-weight:800;color:#F59E0B;margin-bottom:10px;text-align:center;}
.modalText{font-size:12px;color:rgba(255,255,255,.8);line-height:1.6;margin-bottom:14px;}
.modalBtn{width:100%;padding:12px;border-radius:12px;border:none;font-family:'Poppins',sans-serif;
font-size:13px;font-weight:700;cursor:pointer;margin-top:8px;
background:linear-gradient(135deg,#C8102E,#e01535);color:#fff;transition:all .2s;}
.modalBtn:active{transform:scale(.97);}
.modalBtn.gold{background:linear-gradient(135deg,#F59E0B,#fbbf24);color:#1a1a1a;}
.modalBtn:disabled{background:rgba(255,255,255,.1);color:rgba(255,255,255,.3);cursor:not-allowed;}

/* === TOAST === */
#toastContainer{position:fixed;top:90px;left:50%;transform:translateX(-50%);z-index:300;
display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:90%;max-width:340px;}
.toast{background:rgba(20,20,30,.95);border:1px solid rgba(245,158,11,.5);
color:#fff;padding:10px 18px;border-radius:12px;font-size:12px;font-weight:600;
box-shadow:0 4px 20px rgba(0,0,0,.5);animation:toastIn .3s ease,toastOut .3s ease 2.2s forwards;
white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
@keyframes toastIn{from{opacity:0;transform:translateY(-20px) scale(.9);}to{opacity:1;transform:translateY(0) scale(1);}}
@keyframes toastOut{to{opacity:0;transform:translateY(-20px) scale(.9);}}

/* === LOADING === */
#loadingOverlay{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.8);
display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
opacity:0;pointer-events:none;transition:opacity .3s;}
#loadingOverlay.show{opacity:1;pointer-events:auto;}
.spinner{width:40px;height:40px;border:4px solid rgba(245,158,11,.2);border-top-color:#F59E0B;
border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
#loadingText{color:#F59E0B;font-size:13px;font-weight:600;}

/* === LOGIN PROMPT === */
#loginPrompt{position:fixed;inset:0;z-index:400;background:#1a1a1a;
display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:30px;text-align:center;}
#loginPrompt h2{color:#F59E0B;font-size:20px;}
#loginPrompt p{color:rgba(255,255,255,.7);font-size:13px;}
#loginPrompt button{padding:14px 32px;border-radius:14px;border:none;font-family:'Poppins',sans-serif;
font-size:15px;font-weight:700;background:linear-gradient(135deg,#C8102E,#e01535);color:#fff;cursor:pointer;}

/* === ADMIN === */
#adminPanel{position:fixed;inset:0;z-index:600;background:#fff;color:#1a1a1a;
display:none;flex-direction:column;overflow:hidden;}
#adminPanel.show{display:flex;}
#adminHeader{background:#C8102E;color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0;}
#adminHeader h2{font-size:15px;flex:1;}
#adminTabs{display:flex;overflow-x:auto;gap:4px;padding:8px;background:#f5f5f5;flex-shrink:0;scrollbar-width:none;}
#adminTabs::-webkit-scrollbar{display:none;}
.adminTab{padding:8px 14px;border-radius:8px;border:none;background:#e0e0e0;font-family:'Poppins',sans-serif;
font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;color:#333;}
.adminTab.active{background:#C8102E;color:#fff;}
#adminContent{flex:1;overflow-y:auto;padding:16px;}
.adminCard{background:#f9f9f9;border-radius:12px;padding:14px;margin-bottom:10px;border:1px solid #eee;}
.adminCard h3{font-size:13px;margin-bottom:8px;color:#C8102E;}
.adminInput{width:100%;padding:8px 10px;border-radius:8px;border:1px solid #ddd;
font-family:'Poppins',sans-serif;font-size:12px;margin-bottom:6px;}
.adminBtn{padding:8px 16px;border-radius:8px;border:none;font-family:'Poppins',sans-serif;
font-size:11px;font-weight:700;cursor:pointer;background:#C8102E;color:#fff;margin-right:6px;}
.adminBtn.gold{background:#F59E0B;color:#1a1a1a;}

/* === MISC === */
.badge{display:inline-block;padding:2px 8px;border-radius:8px;font-size:9px;font-weight:700;
background:rgba(245,158,11,.2);color:#F59E0B;margin-left:4px;}
.hidden{display:none !important;}
.sectionTitle{font-size:12px;font-weight:700;color:#F59E0B;margin:12px 0 8px 0;
padding-bottom:4px;border-bottom:1px solid rgba(245,158,11,.2);}
.emptyState{text-align:center;padding:30px 10px;color:rgba(255,255,255,.4);font-size:12px;}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.4);
transform:scale(0);animation:rippleAnim .6s ease-out;pointer-events:none;}
@keyframes rippleAnim{to{transform:scale(4);opacity:0;}}
.sparkle{animation:sparkleAnim 1.5s ease-in-out infinite;}
@keyframes sparkleAnim{0%,100%{opacity:1;}50%{opacity:.4;}}
.glowGold{box-shadow:0 0 12px rgba(245,158,11,.6);}
</style>
</head>
<body>

<!-- LOGIN PROMPT -->
<div id="loginPrompt" class="hidden">

<div id="header">

<!-- PANEL CONTAINER -->

<!-- TOAST -->

<!-- ADMIN PANEL -->
<div id="adminPanel">
  <div id="adminHeader">
    <h2>⚙️ Admin Panel</h2>
    <button class="adminBtn" onclick="closeAdmin()" style="background:#fff;color:#C8102E;">Keluar Admin</button>
  </div>
  <div id="adminTabs"></div>
  <div id="adminContent"></div>

<script>
/* ============================================================
   STEAM MP 7000 TYCOON v0.09 - dashboard.html
   ============================================================ */
'use strict';

// === KONFIGURASI ===
var BACKEND_URL = 'https://script.google.com/macros/s/AKfycbysHvNR2JwLFuNu6poci5wIleJBnc8IGNMq-ULxUV1NyMxoorEcBj0c8oBh4b8JiL3m/exec';
var TOKEN = 'steam-mp-7000-2026';
var SYNC_INTERVAL = 10000;
var MAX_PENDING_PER_SEC = 100000;

// === DEBUG ===
function log(){ var a=Array.prototype.slice.call(arguments); console.log.apply(console,a); }

// === FETCH TIMEOUT ===
function fetchTimeout(url, options, ms) {
  return Promise.race([
    fetch(url, options),
    new Promise(function(_, reject) { setTimeout(function(){ reject(new Error('Timeout')); }, ms || 15000); })
  ]);
}

// === API CALL ===
function apiCall(action, params) {
  var body = Object.assign({ action: action, token: TOKEN }, params || {});
  return fetchTimeout(BACKEND_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify(body)
  }, 15000).then(function(r){ return r.json(); });
}

// === LOADING ===
var loadingCount = 0;
function showLoading(txt){
  loadingCount++;
  document.getElementById('loadingText').textContent = txt || 'Memuat...';
  document.getElementById('loadingOverlay').classList.add('show');
}
function hideLoading(){
  loadingCount = Math.max(0, loadingCount-1);
  if(loadingCount===0) document.getElementById('loadingOverlay').classList.remove('show');
}

// === TOAST ===
function toast(msg, dur){
  var c = document.getElementById('toastContainer');
  var t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); }, (dur||2500)+300);
}

// === FORMAT RUPIAH ===
function formatRupiah(n){
  n = Math.floor(n||0);
  return 'Rp ' + n.toLocaleString('id-ID');
}
function formatNum(n){
  n = Math.floor(n||0);
  if(n >= 1e9) return (n/1e9).toFixed(1)+'M';
  if(n >= 1e6) return (n/1e6).toFixed(1)+'jt';
  if(n >= 1e3) return (n/1e3).toFixed(1)+'rb';
  return n.toLocaleString('id-ID');
}

// === STATE ===
var state = {
  user: null,
  session: null,
  koin: 0,
  rupiah: 0,
  kristal: 0,
  level: 1,
  exp: 0,
  pendingProduction: 0,
  productionRate: 0,
  motorList: [],
  upgrades: {},
  managers: {},
  branches: 1,
  totalCuci: 0,
  totalMoge: 0,
  totalTap: 0,
  totalConvert: 0,
  totalTopup: 0,
  totalSewaManajer: 0,
  totalBukaCabang: 0,
  questProgress: {},
  storyUnlocked: 0,
  weather: 'panas',
  weatherTimer: 0,
  musicOn: true,
  lastSync: Date.now(),
  redirecting: false
};

// === REDIRECT FLAG ===
window.__redirecting = false;

// === LOCALSTORAGE KEYS ===
var LS_SESSION = 'smp7k_session';
var LS_USER = 'smp7k_user';
var LS_EXTRA = 'smp7k_extra';
var LS_MUSIC = 'smp7k_music';
var LS_ADMIN = 'smp7k_admin';

// === EXTRA DATA (field yang tidak ada di sheet) ===
function loadExtra(){
  try {
    var raw = localStorage.getItem(LS_EXTRA);
    if(raw){
      var d = JSON.parse(raw);
      state.exp = d.exp || 0;
      state.upgrades = d.upgrades || {};
      state.managers = d.managers || {};
      state.branches = d.branches || 1;
      state.totalCuci = d.totalCuci || 0;
      state.totalMoge = d.totalMoge || 0;
      state.totalTap = d.totalTap || 0;
      state.totalConvert = d.totalConvert || 0;
      state.totalTopup = d.totalTopup || 0;
      state.totalSewaManajer = d.totalSewaManajer || 0;
      state.totalBukaCabang = d.totalBukaCabang || 0;
      state.questProgress = d.questProgress || {};
      state.storyUnlocked = d.storyUnlocked || 0;
    }
  } catch(e){ console.warn('loadExtra error', e); }
}
function saveExtra(){
  try {
    var d = {
      exp: state.exp,
      upgrades: state.upgrades,
      managers: state.managers,
      branches: state.branches,
      totalCuci: state.totalCuci,
      totalMoge: state.totalMoge,
      totalTap: state.totalTap,
      totalConvert: state.totalConvert,
      totalTopup: state.totalTopup,
      totalSewaManajer: state.totalSewaManajer,
      totalBukaCabang: state.totalBukaCabang,
      questProgress: state.questProgress,
      storyUnlocked: state.storyUnlocked
    };
    localStorage.setItem(LS_EXTRA, JSON.stringify(d));
  } catch(e){ console.warn('saveExtra error', e); }
}

// === IMAGE CACHE ===
var imageCache = {};
var imageLoadStatus = {};

// === HILANGKAN BACKGROUND PUTIH ===
function hilangkanBackgroundPutih(imgSrc, toleransi, callback) {
  var img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = function() {
    var c = document.createElement('canvas');
    c.width = img.width; c.height = img.height;
    var cx = c.getContext('2d');
    cx.drawImage(img, 0, 0);
    try {
      var d = cx.getImageData(0, 0, c.width, c.height);
      var p = d.data;
      var tol = toleransi || 40;
      for (var i = 0; i < p.length; i += 4) {
        if (p[i] > 255 - tol && p[i+1] > 255 - tol && p[i+2] > 255 - tol) p[i+3] = 0;
      }
      cx.putImageData(d, 0, 0);
      callback(c.toDataURL('image/png'));
    } catch(e) { callback(imgSrc); }
  };
  img.onerror = function() { callback(null); };
  img.src = imgSrc;
}

// === LOAD IMAGES ===
function loadImages(){
  var assets = [
    { key:'steam-bg', src:'assets/steam-bg.png', noRemove:true },
    { key:'qris', src:'assets/qris.png', noRemove:true },
    { key:'koin', src:'assets/koin.png', tol:30 },
    { key:'kristal', src:'assets/kristal.png', tol:20 },
    { key:'rupiah', src:'assets/rupiah.png', tol:25 },
    { key:'pak-aldi', src:'assets/pak-aldi.png', tol:40 },
    { key:'motor-bebek-kotor', src:'assets/motor-bebek-kotor.png', tol:40 },
    { key:'motor-bebek-bersih', src:'assets/motor-bebek-bersih.png', tol:40 },
    { key:'motor-moge-kotor', src:'assets/motor-moge-kotor.png', tol:40 },
    { key:'motor-moge-bersih', src:'assets/motor-moge-bersih.png', tol:40 }
  ];
  assets.forEach(function(a){
    if(a.noRemove){
      var img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = function(){
        imageCache[a.key] = img;
        imageLoadStatus[a.key] = 'loaded';
        if(a.key==='steam-bg') log('Gambar steam-bg: loaded '+img.width+'x'+img.height);
      };
      img.onerror = function(){
        imageLoadStatus[a.key] = 'error';
        log('Gambar gagal: '+a.src);
      };
      img.src = a.src;
    } else {

}

function getUpgradeHarga(def){
  var lvl = state.upgrades[def.id] || 0;
  return Math.floor(def.baseHarga * Math.pow(2.5, lvl));
}
function getUpgradeProd(def){
  var lvl = state.upgrades[def.id] || 0;
  return Math.floor(def.baseProd * Math.pow(2, lvl));
}
function hitungProduksiTotal(){
  var total = 0;
  UPGRADE_DEFS.forEach(function(def){
    total += getUpgradeProd(def);
  });
  MANAGER_DEFS.forEach(function(def){
    var jml = state.managers[def.id] || 0;
    total += def.prod * jml;
  });
  return total;
}

  var level = isMoge ? 'moge' : 'bebek';
  var motor = {
    id: 'm_' + Date.now() + '_' + Math.random().toString(36).substr(2,4),
    x: -80,

    rotasi: 0,
    xTarget: 0,
    yTarget: 0,
    progress: 0,
    kecepatan: 1.2 + Math.random()*0.8
  };
  // Cari slot parkir kosong
  var slots = [];
  for(var r=0;r<3;r++){
    for(var c=0;c<6;c++){
      slots.push({row:r, col:c});
    }
  }
  var used = {};

    if(m.slotTarget >= 0) used[m.slotTarget] = true;
  });
  var available = [];
  for(var i=0;i<slots.length;i++){
    if(!used[i]) available.push(i);
  }
  if(available.length > 0){
    motor.slotTarget = available[Math.floor(Math.random()*available.length)];
    motor.state = 'parkir';
  } else {
    motor.state = 'lewat';
  }
  state.motorList.push(motor);
  log('Spawn motor ke-'+state.motorList.length+': level '+level);
}

// === RENDER ===
function render(){
  frameCount++;
  if(frameCount % 60 === 0) log('Render frame: '+frameCount);
  var W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);
  // Latar
  if(imageCache['steam-bg']){
    var img = imageCache['steam-bg'];
    var scale = Math.max(W / img.width, H / img.height);
    var dw = img.width * scale;
    var dh = img.height * scale;
    var dx = (W - dw) / 2;
    var dy = (H - dh) / 2;
    ctx.drawImage(img, dx, dy, dw, dh);
  } else {
    var grad = ctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0,'#C8102E');
    grad.addColorStop(0.5,'#e01535');
    grad.addColorStop(1,'#FAFAFA');
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,W,H);
  }
  // Overlay cuaca
  if(state.weather === 'panas'){
    ctx.fillStyle = 'rgba(255,220,50,0.06)';
    ctx.fillRect(0,0,W,H);
  } else {
    ctx.fillStyle = 'rgba(100,150,255,0.08)';
    ctx.fillRect(0,0,W,H);
  }
  // Render motor
  state.motorList.forEach(function(m){
    renderMotor(m, W, H);
  });
  requestAnimationFrame(render);
}

function renderMotor(m, W, H){
  var imgKey = '';
  if(m.level === 'bebek') imgKey = m.kotor ? 'motor-bebek-kotor' : 'motor-bebek-bersih';
  else imgKey = m.kotor ? 'motor-moge-kotor' : 'motor-moge-bersih';
  var img = imageCache[imgKey];
  var size = m.level === 'moge' ? {w:60, h:80} : {w:60, h:80};
  var drawX = m.x, drawY = m.y;
  ctx.save();
  if(m.state === 'parkir'){
    var targetY = H * (0.42 + m.slotTarget >= 0 ? (Math.floor(m.slotTarget/6) * 0.10) : 0);
    var targetX = W * (0.10 + (m.slotTarget % 6) * 0.14);
    m.x += (targetX - m.x) * 0.08;
    m.y += (targetY - m.y) * 0.08;
    drawX = m.x; drawY = m.y;
    ctx.translate(drawX + size.w/2, drawY + size.h/2);
    ctx.rotate(Math.PI);
    ctx.translate(-(drawX + size.w/2), -(drawY + size.h/2));
  } else if(m.state === 'jalan'){
    m.x += m.kecepatan * 2;
    m.y = H * 0.06;
    drawX = m.x; drawY = m.y;
  } else {
    m.x += m.kecepatan * 2;
    m.y = H * 0.06;
    drawX = m.x; drawY = m.y;
  }
  if(img){
    ctx.drawImage(img, drawX, drawY, size.w, size.h);
  } else {
    ctx.font = '40px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(m.level === 'moge' ? '🏍️' : '🛵', drawX + size.w/2, drawY + size.h/2);
  }
  if(m.level === 'moge' && m.state === 'parkir'){
    ctx.beginPath();
    ctx.arc(drawX + size.w/2, drawY + size.h/2, 36, 0, Math.PI*2);
    var grad = ctx.createConicGradient(0, drawX+size.w/2, drawY+size.h/2);
    grad.addColorStop(0,'rgba(245,158,11,0.5)');
    grad.addColorStop(0.5,'rgba(255,215,0,0.2)');
    grad.addColorStop(1,'rgba(245,158,11,0.5)');
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.font = '16px sans-serif';
    ctx.fillText('✨', drawX + size.w/2 + 20, drawY + 10);
  }
  // Kabur timer
  if(m.state === 'parkir' && m.waktuMasuk){
    var elapsed = (Date.now() - m.waktuMasuk) / 1000;
    if(elapsed > 8){
      m.state = 'kabur';
      toast('Pelanggan kabur!');
    } else if(elapsed > 5){
      ctx.font = '18px sans-serif';
      ctx.fillText('💢', drawX + size.w/2, drawY - 10);
    }
  }
  ctx.restore();
}

// === CANVAS TAP ===
canvas.addEventListener('click', function(e){
  var rect = canvas.getBoundingClientRect();
  var tapX = (e.clientX - rect.left) * (canvas.width / rect.width);
  var tapY = (e.clientY - rect.top) * (canvas.height / rect.height);
  var W = canvas.width, H = canvas.height;
  for(var i=state.motorList.length-1; i>=0; i--){
    var m = state.motorList[i];
    if(m.state !== 'parkir') continue;
    var size = {w:60, h:80};
    if(tapX >= m.x && tapX <= m.x + size.w && tapY >= m.y && tapY <= m.y + size.h){
      tapMotor(m);
      break;
    }
  }
});

// === TAP MOTOR ===
function tapMotor(m){
  if(m.kotor){
    m.tapCount++;
    if(m.level === 'bebek'){
      if(m.tapCount >= 1){
        m.kotor = false;
        state.koin += 1;
        state.totalCuci++;
        state.totalTap++;
        state.exp += 5;
        playSyuush();
        showCoinFly(m);
        m.state = 'pergi';

        checkStoryUnlock();

    } else {
      if(!m.sudahNontonIklan){

      } else {
        if(m.tapCount >= 5){
          m.kotor = false;
          state.koin += 500;
          state.totalMoge++;
          state.totalCuci++;
          state.totalTap++;
          state.exp += 50;

function showCoinFly(m){
  var W = canvas.width, H = canvas.height;

// === AUDIO ===
var audioCtx = null;
function getAudioCtx(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function playSyuush(){
  try {
    var ctx = getAudioCtx();
    var o = ctx.createOscillator();
    var g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(800, ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 0.3);
    g.gain.setValueAtTime(0.08, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
    o.start(); o.stop(ctx.currentTime + 0.3);
  } catch(e){}
}
function playTing(){
  try {
    var ctx = getAudioCtx();
    var o = ctx.createOscillator();
    var g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type = 'sine';
    o.frequency.setValueAtTime(1200, ctx.currentTime);
    g.gain.setValueAtTime(0.06, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
    o.start(); o.stop(ctx.currentTime + 0.2);
  } catch(e){}
}
function playChime(){
  try {
    var ctx = getAudioCtx();
    [523,659,784].forEach(function(f,i){
      var o = ctx.createOscillator();
      var g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type = 'sine';
      o.frequency.value = f;
      g.gain.setValueAtTime(0.05, ctx.currentTime + i*0.1);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i*0.1 + 0.3);
      o.start(ctx.currentTime + i*0.1);
      o.stop(ctx.currentTime + i*0.1 + 0.3);
    });
  } catch(e){}
}
function playBuzz(){
  try {
    var ctx = getAudioCtx();
    var o = ctx.createOscillator();
    var g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type = 'square';
    o.frequency.value = 120;
    g.gain.setValueAtTime(0.06, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
    o.start(); o.stop(ctx.currentTime + 0.4);
  } catch(e){}
}

      '</div>';
  }
  return html;
}

function bukaCabang(n){
  var harga = [0,0,1000000,50000000,2500000000,100000000000][n];
  if(state.koin < harga){ toast('Koin tidak cukup!'); return; }
  state.koin -= harga;
  state.branches = n;
  state.totalBukaCabang++;
  state.exp += 50;
  playChime();
  toast('Cabang '+n+' dibuka!');
  saveExtra();
  syncSaldo();
  updateHeader();
  checkStoryUnlock();
  openPanel('cabang');
}

// === TAB CONVERT ===
function buildConvertTab(){
  return '<div class="sectionTitle">🔄 Convert Koin ke Rupiah</div>'+
    '<div class="listItem"><div class="listIcon">🪙</div><div class="listInfo">'+
    '<div class="listName">1000 Koin = Rp 100</div>'+
    '<div class="listDesc">Min. 10.000 koin | Potong 10% atau nonton iklan</div>'+
    '<div class="progressWrap"><div class="progressFill" id="convertProgress" style="width:0%"></div></div>'+
    '</div></div>'+
    '<div style="padding:10px 0;">'+
    '<input type="number" id="convertAmount" class="adminInput" placeholder="Jumlah koin (min 10.000)" style="background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2);">'+
    '<button class="listAction green" style="width:100%;padding:12px;margin-top:8px;" onclick="doConvert()">Konversi Sekarang</button>'+
    '</div>';
}

function doConvert(){
  var input = document.getElementById('convertAmount');
  var amount = parseInt(input.value) || 0;
  if(amount < 10000){ toast('Minimal 10.000 koin'); return; }
  if(state.koin < amount){ toast('Koin tidak cukup!'); return; }
  var rupiah = Math.floor(amount / 1000) * 100;
  var potongan = Math.floor(rupiah * 0.1);
  var hasil = rupiah - potongan;
  state.koin -= amount;
  state.rupiah += hasil;
  state.totalConvert += amount;
  state.exp += 10;
  playChime();
  toast('Convert berhasil! +'+formatRupiah(hasil));
  syncSaldo();
  updateHeader();
  saveExtra();
  checkStoryUnlock();
}

function loadCerita(){

function showStoryModal(bab, wajib){
  var overlay = document.createElement('div');
  overlay.className = 'modalOverlay show';
  overlay.innerHTML = '<div class="modalBox">'+
    '<div style="text-align:center;margin-bottom:10px;">'+
    (imageCache['pak-aldi'] ? '<img src="'+imageCache['pak-aldi'].src+'" style="width:80px;height:80px;border-radius:50%;">' : '<div style="font-size:50px;">👨‍🔧</div>')+

    '<button class="modalBtn" onclick="lanjutStory('+bab+',this)">Lanjut</button>'+
    '</div>';
  document.body.appendChild(overlay);
}
function lanjutStory(bab, btn){
  var overlay = btn.closest('.modalOverlay');
  if(bab === 1){
    state.storyUnlocked = 1;
    saveExtra();
    updateStoryServer();
    overlay.remove();
    toast('Bab 1 selesai!');
  } else {
    overlay.remove();
  }
}
function updateStoryServer(){
  if(!state.user || !state.user._row) return;
  apiCall('update', { sheet:'Users', row: state.user._row, data: { story_unlocked: state.storyUnlocked } })
    .catch(function(){});
}
function checkStoryUnlock(){
  var newUnlock = state.storyUnlocked;
  if(newUnlock < 2 && state.totalCuci >= 5) newUnlock = 2;
  if(newUnlock < 3 && state.koin >= 10000) newUnlock = 3;
  if(newUnlock < 4 && state.totalSewaManajer >= 1) newUnlock = 4;
  if(newUnlock < 5 && state.koin >= 1000000) newUnlock = 5;
  if(newUnlock < 6 && state.totalSewaManajer >= 3) newUnlock = 6;
  if(newUnlock < 7 && state.koin >= 1000000000) newUnlock = 7;
  if(newUnlock > state.storyUnlocked){
    state.storyUnlocked = newUnlock;
    saveExtra();
    updateStoryServer();
    toast('📖 Bab '+newUnlock+' terbuka!');
  }
}

// === TAB QUEST ===
function loadQuest(){
  var el = document.getElementById('questContent');
  if(!el) return;
  showLoading('Memuat quest...');
  apiCall('baca', { sheet:'Quests' })
    .then(function(res){
      if(res && res.ok && res.data){ renderQuest(res.data); }
      else { el.innerHTML = '<div class="emptyState">Gagal memuat quest</div>'; }
    })
    .catch(function(){ el.innerHTML = '<div class="emptyState">Gagal memuat quest</div>'; })
    .finally(function(){ hideLoading(); });
}
function renderQuest(quests){
  var el = document.getElementById('questContent');
  if(!el) return;
  var harian = quests.filter(function(q){ return q.tipe==='harian'; });
  var mingguan = quests.filter(function(q){ return q.tipe==='mingguan'; });
  var spesial = quests.filter(function(q){ return q.tipe==='spesial'; });
  var html = '';
  function renderSection(title, arr){
    html += '<div class="sectionTitle">'+title+'</div>';
    arr.forEach(function(q){
      var prog = state.questProgress[q.id] || 0;
      var target = q.target || 1;
      var pct = Math.min(100, prog/target*100);
      html += '<div class="listItem"><div class="listIcon">📋</div><div class="listInfo">'+
        '<div class="listName">'+(q.nama||'Quest')+'</div>'+
        '<div class="listDesc">Reward: '+formatNum(q.reward_koin||0)+' 🪙</div>'+
        '<div class="progressWrap"><div class="progressFill" style="width:'+pct+'%"></div></div>'+
        '<div style="font-size:9px;color:rgba(255,255,255,.5);">'+prog+'/'+target+'</div>'+
        '</div>'+
        '<button class="listAction green" onclick="klaimQuest(\''+q.id+'\')" '+(pct>=100?'':'disabled')+'>Klaim</button></div>';
    });
  }
  renderSection('📅 Harian', harian);
  renderSection('📆 Mingguan', mingguan);
  renderSection('⭐ Spesial', spesial);
  el.innerHTML = html || '<div class="emptyState">Belum ada quest</div>';
}
function klaimQuest(id){
  toast('Quest diklaim! +reward');
  playChime();
}

// === MOGE AD MODAL ===
function showMogeAdModal(m){
  var overlay = document.createElement('div');
  overlay.className = 'modalOverlay show';
  overlay.innerHTML = '<div class="modalBox">'+
    '<div class="modalTitle">🎬 Tonton Iklan Dulu</div>'+
    '<div class="modalText">Tonton iklan 30 detik untuk mencuci Moge VIP ini.</div>'+
    '<button class="modalBtn" id="btnTonton" onclick="tontonIklan(\''+m.id+'\',this)">Tonton Iklan</button>'+
    '<button class="modalBtn gold" id="btnKlaimMoge" disabled>Klaim (30s)</button>'+
    '</div>';
  document.body.appendChild(overlay);
  setTimeout(function(){
    if(m.state === 'parkir' && !m.sudahNontonIklan){
      m.state = 'kabur';
      toast('Moge kabur karena tidak ditonton!');
      if(overlay.parentNode) overlay.remove();
    }
  }, 10000);
}
function tontonIklan(motorId, btn){
  window.open('https://www.profitableratecpmnetwork.com/q9qnyhdf9c?key=56f60182ff2837aef7d8e65616a77746', '_blank');
  var m = state.motorList.find(function(x){ return x.id===motorId; });
  if(!m) return;
  var detik = 30;
  var klaimBtn = btn.parentNode.querySelector('#btnKlaimMoge');
  btn.disabled = true;
  btn.textContent = 'Menonton... '+detik+'s';
  var interval = setInterval(function(){
    detik--;
    btn.textContent = 'Menonton... '+detik+'s';
    if(detik <= 0){
      clearInterval(interval);
      btn.textContent = 'Selesai!';
      klaimBtn.disabled = false;
      klaimBtn.textContent = 'Klaim Moge';
      klaimBtn.onclick = function(){
        m.sudahNontonIklan = true;
        m.tapCount = 0;
        toast('Sekarang tap Moge 5x!');
        btn.closest('.modalOverlay').remove();
        updateHeader();
      };
    }
  }, 1000);
}

// === INIT USER ===
function initUser(){
  log('Dashboard: load');
  var session = localStorage.getItem(LS_SESSION);
  var userRaw = localStorage.getItem(LS_USER);
  if(!session || !userRaw){
    document.getElementById('loginPrompt').classList.remove('hidden');
    document.getElementById('loadingOverlay').classList.remove('show');
    return false;
  }
  try {
    state.session = JSON.parse(session);
    state.user = JSON.parse(userRaw);
    state.koin = state.user.saldo_koin || 0;
    state.rupiah = state.user.saldo_rupiah || 0;
    state.kristal = state.user.kristal || 0;
    state.level = state.user.level || 1;
    state.storyUnlocked = state.user.story_unlocked || 0;
    log('User dari localStorage: '+state.user.nama);
    document.getElementById('playerName').textContent = state.user.nama || 'Pemain';
    updateHeader();
    return true;
  } catch(e){
    console.warn('initUser error', e);
    document.getElementById('loginPrompt').classList.remove('hidden');
    return false;
  }
}

function fetchUserBackground(){
  if(!state.user || !state.user.id) return;
  apiCall('bacaSatu', { sheet:'Users', kolom:'id', nilai: state.user.id })
    .then(function(res){
      if(res && res.ok && res.data){
        state.user = res.data;
        state.koin = res.data.saldo_koin || 0;
        state.rupiah = res.data.saldo_rupiah || 0;
        state.kristal = res.data.kristal || 0;
        state.level = res.data.level || 1;
        localStorage.setItem(LS_USER, JSON.stringify(res.data));
        updateHeader();
        log('Fetch user: selesai');
      } else {
        log('Fetch user: gagal');
      }
    })
    .catch(function(){ log('Fetch user: gagal'); })
    .finally(function(){ hideLoading(); });
}

setInterval(function(){
  if(state.user) syncSaldo();
}, SYNC_INTERVAL);

// === PRODUCTION LOOP ===
setInterval(productionLoop, 100);

// === SPAWN LOOP ===
setInterval(function(){
  if(!state.user) return;
  var interval = state.weather === 'hujan' ? 6000 : 2000;
  if(Math.random() < 2000/interval) spawnMotor();

// === MOTOR CLEANUP ===
setInterval(function(){
  state.motorList = state.motorList.filter(function(m){

      if(m.x > canvas.width + 100) return false;

}, 2000);

// === ADMIN ===
function initAdmin(){
  var params = new URLSearchParams(window.location.search);
  if(params.get('admin') === '1' && localStorage.getItem(LS_ADMIN)){
    document.getElementById('adminPanel').classList.add('show');

function closeAdmin(){
  localStorage.removeItem(LS_ADMIN);
  window.location.replace('index.html');
}
function buildAdminTabs(){
  var tabs = ['dashboard','pemain','detail','topup','voucher','toko','manajer','cabang','cerita','quest','config','log'];
  var el = document.getElementById('adminTabs');
  el.innerHTML = tabs.map(function(t){
    return '<button class="adminTab" data-admin="'+t+'" onclick="renderAdminContent(\''+t+'\')">'+t.charAt(0).toUpperCase()+t.slice(1)+'</button>';
  }).join('');
}
function renderAdminContent(tab){
  document.querySelectorAll('.adminTab').forEach(function(b){
    b.classList.toggle('active', b.dataset.admin===tab);
  });

  el.innerHTML = '<div class="adminCard"><h3>'+tab.toUpperCase()+'</h3><p style="font-size:12px;color:#666;">Panel admin - '+tab+'</p></div>';
}

// === INIT ===
function init(){
  loadExtra();
  loadImages();
  if(!initUser()) return;
  resizeCanvas();
  updateHeader();
  initMusic();
  startWeatherCycle();
  productionLoop();
  requestAnimationFrame(render);
  fetchUserBackground();
  initAdmin();
  // Fix bug stuck loading
  setTimeout(function(){
    document.getElementById('loadingOverlay').classList.remove('show');
    if(!state.user){
      document.getElementById('loginPrompt').classList.remove('hidden');
    }
  }, 3000);
  log('Dashboard: load selesai');
}

document.addEventListener('DOMContentLoaded', init);

// === VISIBILITY ===
document.addEventListener('visibilitychange', function(){
  if(!document.hidden && state.user){
    lastProductionTick = Date.now();
  }
});
