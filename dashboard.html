<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Steam MP 7000 Tycoon — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ==================== RESET ==================== */
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; overflow-x:hidden; }
body {
  font-family:'Poppins',-apple-system,BlinkMacSystemFont,sans-serif;
  background:linear-gradient(160deg,#FAFAFA 0%,#F5E6E9 50%,#E8C8CE 100%);
  color:#2A0A10; min-height:100vh; overscroll-behavior:none;
}
button, input, select, textarea { font-family:inherit; }

/* ==================== CANVAS HUJAN ==================== */
#hujanCanvas {
  position:fixed; top:0; left:0; width:100%; height:100%;
  z-index:0; pointer-events:none; display:block;
}

/* ==================== APP ==================== */
#app { position:relative; z-index:1; min-height:100vh; padding-bottom:80px; }

/* ==================== HEADER ==================== */
#appHeader {
  position:sticky; top:0; z-index:100;
  background:rgba(255,255,255,0.94);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(200,16,46,0.12);
  padding:8px 12px;
  display:flex; align-items:center; gap:8px;
  box-shadow:0 2px 10px rgba(139,0,0,0.05);
}
.hdr-logo {
  width:38px; height:38px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #E63946 0%, #C8102E 45%, #8B0000 100%);
  color:#FFF; font-size:14px; font-weight:700;
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0; box-shadow:0 0 12px rgba(200,16,46,0.45);
}
.hdr-info { flex:1; min-width:0; }
.hdr-nama { font-size:13px; font-weight:600; color:#8B0000; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.hdr-nomor { font-size:10px; color:#8A6A6F; }
.hdr-saldo { display:flex; gap:6px; flex-wrap:wrap; margin-top:2px; }
.hdr-saldo span { font-size:10px; color:#5A3A40; font-weight:500; }
.hdr-actions { display:flex; gap:4px; flex-shrink:0; }
.hdr-btn {
  width:34px; height:34px; border-radius:9px; border:none;
  background:#F5EDEE; color:#8B0000; font-size:15px;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; transition:background 0.2s;
}
.hdr-btn:active { background:#E8D0D5; }
.hdr-btn.aktif { background:linear-gradient(135deg,#C8102E,#8B0000); color:#FFF; }

/* ==================== LEVEL BAR ==================== */
.hdr-level {
  padding:0 12px 6px;
  background:rgba(255,255,255,0.94);
  backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(200,16,46,0.08);
  display:flex; align-items:center; gap:8px;
  font-size:10px; color:#8A6A6F;
}
.lvl-bar {
  flex:1; height:5px; background:#F0E0E3; border-radius:3px; overflow:hidden;
}
.lvl-bar-inner {
  height:100%; background:linear-gradient(90deg,#F59E0B,#FBBF24);
  border-radius:3px; transition:width 0.4s ease;
}

/* ==================== DRAWER MENU ==================== */
.drawer {
  position:fixed; top:0; left:0; width:82%; max-width:300px; height:100%;
  background:#FFF; z-index:2000;
  transform:translateX(-100%); transition:transform 0.3s ease;
  box-shadow:4px 0 20px rgba(0,0,0,0.15);
  display:flex; flex-direction:column;
  overflow-y:auto;
}
.drawer.buka { transform:translateX(0); }
.drawer-backdrop {
  position:fixed; inset:0; background:rgba(42,10,16,0.5);
  z-index:1999; display:none; backdrop-filter:blur(2px);
}
.drawer-backdrop.tampil { display:block; }
.drawer-head {
  padding:20px 18px 14px;
  background:linear-gradient(135deg,#C8102E,#8B0000);
  color:#FFF;
}
.drawer-head .logo-mini {
  width:48px; height:48px; border-radius:50%;
  background:rgba(255,255,255,0.15);
  border:2px solid rgba(245,158,11,0.6);
  display:flex; align-items:center; justify-content:center;
  font-size:16px; font-weight:700; margin-bottom:8px;
}
.drawer-head h3 { font-size:15px; font-weight:600; }
.drawer-head p { font-size:11px; opacity:0.8; }
.drawer-item {
  padding:13px 18px; display:flex; align-items:center; gap:12px;
  cursor:pointer; border-bottom:1px solid #F5EDEE;
  font-size:13.5px; color:#3A1A20; font-weight:500;
  transition:background 0.2s;
}
.drawer-item:active { background:#FCF5F6; }
.drawer-item.aktif { background:#FDF2F4; color:#C8102E; font-weight:600; border-left:3px solid #C8102E; }
.drawer-item .ikon { font-size:18px; width:24px; text-align:center; }

/* ==================== KONTEN ==================== */
#appContent { padding:12px; max-width:600px; margin:0 auto; }

.kartu {
  background:#FFF; border-radius:14px; padding:16px;
  box-shadow:0 4px 16px rgba(139,0,0,0.08);
  border:1px solid rgba(200,16,46,0.06);
  margin-bottom:12px;
}
.kartu-judul {
  font-size:14px; font-weight:700; color:#8B0000;
  margin-bottom:10px; display:flex; align-items:center; gap:6px;
}

/* ==================== AREA TAP ==================== */
.tap-area {
  position:relative; height:220px;
  background:linear-gradient(160deg,#FFF 0%,#FDF5F6 100%);
  border-radius:16px; overflow:hidden;
  border:2px dashed rgba(200,16,46,0.25);
  cursor:pointer; user-select:none;
  display:flex; align-items:center; justify-content:center;
  touch-action:manipulation;
}
.tap-area:active { background:linear-gradient(160deg,#FDF5F6 0%,#F9E5E9 100%); }
.tap-motor { font-size:64px; filter:drop-shadow(0 4px 8px rgba(200,16,46,0.3)); pointer-events:none; }
.tap-hint {
  position:absolute; bottom:10px; left:0; right:0; text-align:center;
  font-size:11px; color:#A88E93; pointer-events:none;
}
.pop {
  position:absolute; font-size:18px; font-weight:700; color:#C8102E;
  pointer-events:none; animation:popUp 0.8s ease-out forwards;
  text-shadow:0 1px 3px rgba(255,255,255,0.9);
}
@keyframes popUp {
  0% { opacity:1; transform:translate(-50%,-50%) scale(1); }
  100% { opacity:0; transform:translate(-50%,-160%) scale(1.4); }
}
.partikel {
  position:absolute; border-radius:50%; pointer-events:none;
  animation:partikelKeluar 0.7s ease-out forwards;
}
@keyframes partikelKeluar {
  0% { opacity:0.9; transform:translate(-50%,-50%) scale(0.3); }
  100% { opacity:0; transform:translate(-50%,-50%) scale(2.2); }
}

/* ==================== UPGRADE ITEM ==================== */
.upgrade-item {
  display:flex; align-items:center; gap:10px;
  padding:11px 0; border-bottom:1px solid #F5EDEE;
}
.upgrade-item:last-child { border-bottom:none; }
.upgrade-ikon {
  width:42px; height:42px; border-radius:11px;
  background:linear-gradient(135deg,#FDF2F4,#F9E5E9);
  display:flex; align-items:center; justify-content:center;
  font-size:20px; flex-shrink:0;
}
.upgrade-info { flex:1; min-width:0; }
.upgrade-nama { font-size:13px; font-weight:600; color:#3A1A20; }
.upgrade-detail { font-size:10.5px; color:#8A6A6F; margin-top:1px; }
.upgrade-btn {
  padding:8px 12px; border-radius:9px; border:none;
  background:linear-gradient(135deg,#C8102E,#8B0000); color:#FFF;
  font-size:11px; font-weight:600; cursor:pointer;
  white-space:nowrap;
}
.upgrade-btn:disabled { background:#E0D2D5; color:#A88E93; cursor:not-allowed; }
.upgrade-btn:active:not(:disabled) { transform:scale(0.96); }

/* ==================== TOMBOL UMUM ==================== */
.btn {
  padding:11px 16px; border-radius:11px; border:none;
  font-size:13px; font-weight:600; cursor:pointer;
  transition:transform 0.15s, opacity 0.2s;
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
}
.btn:active { transform:scale(0.97); }
.btn-primary { background:linear-gradient(135deg,#C8102E,#8B0000); color:#FFF; box-shadow:0 4px 12px rgba(200,16,46,0.3); }
.btn-gold { background:linear-gradient(135deg,#F59E0B,#D97706); color:#FFF; box-shadow:0 4px 12px rgba(245,158,11,0.3); }
.btn-outline { background:#FFF; color:#C8102E; border:1.5px solid #C8102E; }
.btn-abu { background:#F0E6E8; color:#6B4046; }
.btn-full { width:100%; }
.btn:disabled { opacity:0.5; cursor:not-allowed; transform:none; }

/* ==================== INPUT ==================== */
.inp {
  width:100%; padding:11px 13px; border:1.5px solid #E0D2D5;
  border-radius:10px; font-size:13px; background:#FCFAFB;
  outline:none; transition:border-color 0.2s, box-shadow 0.2s;
  margin-bottom:10px;
}
.inp:focus { border-color:#C8102E; box-shadow:0 0 0 3px rgba(200,16,46,0.1); background:#FFF; }

/* ==================== BOTTOM NAV ==================== */
#bottomNav {
  position:fixed; bottom:0; left:0; right:0; z-index:100;
  background:rgba(255,255,255,0.96);
  backdrop-filter:blur(10px);
  border-top:1px solid rgba(200,16,46,0.1);
  display:flex; justify-content:space-around;
  padding:6px 0 max(6px, env(safe-area-inset-bottom));
  box-shadow:0 -2px 12px rgba(139,0,0,0.06);
}
.nav-btn {
  flex:1; border:none; background:transparent;
  display:flex; flex-direction:column; align-items:center; gap:2px;
  font-size:9.5px; color:#8A6A6F; cursor:pointer;
  padding:4px 0; font-weight:500;
}
.nav-btn .ikon { font-size:18px; }
.nav-btn.aktif { color:#C8102E; font-weight:600; }

/* ==================== TOAST ==================== */
#toastBox {
  position:fixed; top:14px; left:50%; transform:translateX(-50%);
  z-index:9999; display:flex; flex-direction:column; gap:8px;
  width:calc(100% - 32px); max-width:380px; pointer-events:none;
}
.toast {
  padding:11px 15px; border-radius:11px; color:#FFF;
  font-size:12.5px; font-weight:500; line-height:1.45;
  box-shadow:0 8px 22px rgba(0,0,0,0.18);
  animation:toastIn 0.35s ease; pointer-events:auto;
  word-break:break-word;
}
.toast.sukses { background:#059669; }
.toast.error { background:#DC2626; }
.toast.warning { background:#D97706; }
.toast.info { background:#2563EB; }
.toast.hilang { animation:toastOut 0.3s ease forwards; }
@keyframes toastIn { from { opacity:0; transform:translateY(-14px) scale(0.96); } to { opacity:1; transform:translateY(0) scale(1); } }
@keyframes toastOut { to { opacity:0; transform:translateY(-14px) scale(0.96); } }

/* ==================== MODAL ==================== */
#modalOverlay {
  position:fixed; inset:0; z-index:5000;
  background:rgba(42,10,16,0.55);
  backdrop-filter:blur(4px);
  display:none; align-items:center; justify-content:center;
  padding:18px; animation:fadeIn 0.2s ease;
  overflow-y:auto;
}
#modalOverlay.tampil { display:flex; }
@keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
.modal-box {
  width:100%; max-width:420px; background:#FFF;
  border-radius:16px; padding:20px 18px;
  box-shadow:0 20px 50px rgba(0,0,0,0.35);
  animation:fadeInUp 0.3s ease;
  max-height:88vh; overflow-y:auto;
}
@keyframes fadeInUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
.modal-box h3 { font-size:16px; font-weight:700; color:#8B0000; margin-bottom:14px; }
.modal-box .btn-row { display:flex; gap:8px; margin-top:12px; }
.modal-box .btn-row .btn { flex:1; }

/* ==================== UTIL ==================== */
.teks-kecil { font-size:11px; color:#8A6A6F; line-height:1.5; }
.teks-tengah { text-align:center; }
.baris { display:flex; justify-content:space-between; align-items:center; padding:7px 0; font-size:12.5px; border-bottom:1px solid #F5EDEE; }
.baris:last-child { border-bottom:none; }
.baris .label { color:#8A6A6F; }
.baris .nilai { font-weight:600; color:#3A1A20; }
.badge {
  display:inline-block; padding:3px 9px; border-radius:20px;
  font-size:10px; font-weight:600;
}
.badge-hijau { background:#D1FAE5; color:#059669; }
.badge-kuning { background:#FEF3C7; color:#D97706; }
.badge-merah { background:#FEE2E2; color:#DC2626; }
.badge-biru { background:#DBEAFE; color:#2563EB; }
.badge-abu { background:#F3F4F6; color:#6B7280; }

.spinner {
  width:18px; height:18px; border:2.5px solid rgba(255,255,255,0.4);
  border-top-color:#FFF; border-radius:50%;
  animation:spin 0.7s linear infinite; display:inline-block;
}
@keyframes spin { to { transform:rotate(360deg); } }
.loading-overlay {
  position:fixed; inset:0; z-index:9998;
  background:rgba(250,250,250,0.6); backdrop-filter:blur(2px);
  display:none; align-items:center; justify-content:center;
}
.loading-overlay.tampil { display:flex; }
.loading-spinner {
  width:44px; height:44px; border:4px solid rgba(200,16,46,0.18);
  border-top-color:#C8102E; border-radius:50%;
  animation:spin 0.8s linear infinite;
}

/* ==================== PANEL ADMIN ==================== */
#panelAdmin {
  position:fixed; inset:0; z-index:3000;
  background:#F7F2F3; overflow-y:auto; display:none;
}
#panelAdmin.tampil { display:block; }
.admin-header {
  position:sticky; top:0; z-index:10;
  background:linear-gradient(135deg,#8B0000,#C8102E);
  color:#FFF; padding:12px 14px;
  display:flex; align-items:center; gap:10px;
  box-shadow:0 2px 12px rgba(0,0,0,0.2);
}
.admin-header h2 { font-size:15px; font-weight:600; flex:1; }
.admin-header button {
  background:rgba(255,255,255,0.15); border:1px solid rgba(255,255,255,0.3);
  color:#FFF; padding:6px 12px; border-radius:8px; font-size:12px;
  cursor:pointer; font-weight:500;
}
.admin-tabs {
  display:flex; overflow-x:auto; background:#FFF;
  border-bottom:1px solid #E8D0D5; padding:0 6px;
  position:sticky; top:56px; z-index:9;
  scrollbar-width:none;
}
.admin-tabs::-webkit-scrollbar { display:none; }
.admin-tab {
  padding:11px 13px; border:none; background:transparent;
  font-size:12px; color:#8A6A6F; cursor:pointer;
  white-space:nowrap; font-weight:500;
  border-bottom:2.5px solid transparent;
}
.admin-tab.aktif { color:#C8102E; border-bottom-color:#C8102E; font-weight:600; }
.admin-body { padding:12px; max-width:900px; margin:0 auto; }

.tabel-admin { width:100%; border-collapse:collapse; font-size:11.5px; background:#FFF; border-radius:10px; overflow:hidden; box-shadow:0 2px 8px rgba(139,0,0,0.06); }
.tabel-admin th { background:#C8102E; color:#FFF; padding:8px 6px; text-align:left; font-weight:600; font-size:10.5px; }
.tabel-admin td { padding:7px 6px; border-bottom:1px solid #F5EDEE; color:#3A1A20; }
.tabel-admin tr:last-child td { border-bottom:none; }
.tabel-admin tr:active { background:#FDF5F6; }
.tabel-admin .aksi-btn {
  padding:4px 8px; border-radius:6px; border:none;
  font-size:10px; font-weight:600; cursor:pointer; margin-right:2px;
}
.tabel-admin .btn-lihat { background:#DBEAFE; color:#2563EB; }
.tabel-admin .btn-edit { background:#FEF3C7; color:#D97706; }
.tabel-admin .btn-hapus { background:#FEE2E2; color:#DC2626; }

/* ==================== QRIS ==================== */
.qris-box {
  width:100%; max-width:240px; margin:10px auto;
  aspect-ratio:1; background:#F5EDEE; border-radius:12px;
  display:flex; align-items:center; justify-content:center;
  border:2px dashed #E0D2D5; overflow:hidden;
}
.qris-box img { width:100%; height:100%; object-fit:contain; }
.qris-box .qris-placeholder { font-size:11px; color:#8A6A6F; text-align:center; padding:14px; line-height:1.5; }

/* ==================== PILIHAN PAKET ==================== */
.paket-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-bottom:12px; }
.paket-item {
  padding:10px; border:1.5px solid #E0D2D5; border-radius:10px;
  text-align:center; cursor:pointer; transition:all 0.2s; background:#FCFAFB;
}
.paket-item.aktif { border-color:#C8102E; background:#FDF2F4; box-shadow:0 0 0 3px rgba(200,16,46,0.08); }
.paket-item .harga { font-size:13px; font-weight:700; color:#8B0000; }
.paket-item .dapat { font-size:10px; color:#8A6A6F; margin-top:2px; }

/* ==================== CERITA ==================== */
.bab-item {
  padding:12px; border-radius:11px; margin-bottom:8px;
  border:1px solid #E8D0D5; background:#FFF; cursor:pointer;
  display:flex; align-items:center; gap:10px;
}
.bab-item.locked { opacity:0.55; cursor:not-allowed; background:#F7F2F3; }
.bab-num {
  width:32px; height:32px; border-radius:8px; flex-shrink:0;
  background:linear-gradient(135deg,#C8102E,#8B0000); color:#FFF;
  display:flex; align-items:center; justify-content:center;
  font-weight:700; font-size:13px;
}
.bab-item.locked .bab-num { background:#A88E93; }
.bab-info { flex:1; min-width:0; }
.bab-judul { font-size:12.5px; font-weight:600; color:#3A1A20; }
.bab-syarat { font-size:10px; color:#8A6A6F; margin-top:1px; }

/* ==================== VOUCHER KODE ==================== */
.kode-voucher {
  font-family:'Courier New',monospace;
  font-size:22px; font-weight:700; color:#C8102E;
  letter-spacing:3px; text-align:center;
  padding:16px; background:#FDF2F4; border-radius:12px;
  border:2px dashed #C8102E; margin:12px 0;
}

/* ==================== RESPONSIVE ==================== */
@media (max-width:360px) {
  .hdr-nama { font-size:12px; }
  .hdr-saldo span { font-size:9px; }
  .tap-area { height:190px; }
  .tap-motor { font-size:52px; }
}
</style>
</head>

  n = Number(n) || 0;
  if (n >= 1e12) return (n/1e12).toFixed(2)+'T';
  if (n >= 1e9) return (n/1e9).toFixed(2)+'M';
  if (n >= 1e6) return (n/1e6).toFixed(2)+'Jt';
  if (n >= 1e3) return (n/1e3).toFixed(1)+'rb';
  return String(Math.floor(n));
}
function formatTanggal(iso) {
  if (!iso) return '-';
  try {
    var d = new Date(iso);
    var bulan = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
    return d.getDate() + ' ' + bulan[d.getMonth()] + ' ' + d.getFullYear();
  } catch(e) { return String(iso); }
}
function sensorNomor(nomor) {
  var n = String(nomor || '');
  if (n.length <= 6) return n;
  return n.substring(0,4) + '****' + n.substring(n.length-3);
}
function sensorDevice(id) {
  var s = String(id || '');
  if (s.length <= 10) return s;
  return s.substring(0,6) + '...' + s.substring(s.length-4);
}
function hariIni() {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function sekarang() { return new Date().toISOString(); }
function acakStr(n) {
  var c = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  var s = '';
  for (var i=0;i<n;i++) s += c.charAt(Math.floor(Math.random()*c.length));
  return s;
}
function acakStrLower(n) {
  var c = 'abcdefghijklmnopqrstuvwxyz0123456789';
  var s = '';
  for (var i=0;i<n;i++) s += c.charAt(Math.floor(Math.random()*c.length));
  return s;
}

var audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
  return audioCtx;
}
function suaraTap() {
  var ctx = getAudioCtx(); if (!ctx) return;
  try {
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(600, ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 0.12);
    g.gain.setValueAtTime(0.06, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + 0.15);
  } catch(e) {}
}
function suaraKoin() {
  var ctx = getAudioCtx(); if (!ctx) return;
  try {
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'triangle'; o.frequency.setValueAtTime(1200, ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(1800, ctx.currentTime + 0.08);
    g.gain.setValueAtTime(0.08, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + 0.2);
  } catch(e) {}
}
function suaraLevelUp() {
  var ctx = getAudioCtx(); if (!ctx) return;
  try {
    [523,659,784,1046].forEach(function(f,i){
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.001, ctx.currentTime + i*0.08);
      g.gain.exponentialRampToValueAtTime(0.07, ctx.currentTime + i*0.08 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i*0.08 + 0.2);
      o.connect(g); g.connect(ctx.destination);
      o.start(ctx.currentTime + i*0.08);
      o.stop(ctx.currentTime + i*0.08 + 0.22);
    });
  } catch(e) {}
}
function suaraError() {
  var ctx = getAudioCtx(); if (!ctx) return;
  try {
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'square'; o.frequency.value = 120;
    g.gain.setValueAtTime(0.05, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + 0.25);
  } catch(e) {}
}

function muatDataGame() {
  loading(true);
  Promise.all([
    apiCall('baca', { sheet:'Users' }),
    apiCall('baca', { sheet:'Upgrades' }),
    apiCall('baca', { sheet:'Manajers' }),
    apiCall('baca', { sheet:'Cabangs' }),
    apiCall('baca', { sheet:'Toko' }),
    apiCall('baca', { sheet:'Inventory' }),
    apiCall('baca', { sheet:'Topups' }),
    apiCall('baca', { sheet:'Vouchers' }),
    apiCall('baca', { sheet:'Story' })
  ]).then(function(res) {
    // Users — cari user aktif berdasarkan session.user_id
    var users = (res[0] && res[0].data) || [];
    var found = null;
    for (var i=0;i<users.length;i++) {
      if (String(users[i].id) === String(session.user_id) || String(users[i].nomor) === String(session.nomor)) {
        found = users[i]; break;
      }
    }
    if (found) {
      dataUserFull = found;
      user.saldo_koin = Number(found.saldo_koin) || 0;
      user.saldo_rupiah = Number(found.saldo_rupiah) || 0;
      user.kristal = Number(found.kristal) || 0;
      user.level = Number(found.level) || 1;
      user.cabang_aktif = Number(found.cabang_aktif) || 1;
      user.nama = found.nama;
      user.nomor = found.nomor;
      localStorage.setItem('smp7k_user', JSON.stringify(user));
    }
    dataUpgrades = (res[1] && res[1].data) || [];
    dataManajers = (res[2] && res[2].data) || [];
    dataCabangs = (res[3] && res[3].data) || [];
    dataToko = (res[4] && res[4].data) || [];
    dataInventory = (res[5] && res[5].data) || [];
    dataTopups = (res[6] && res[6].data) || [];
    dataVouchers = (res[7] && res[7].data) || [];
    dataStory = (res[8] && res[8].data) || [];
    hitungProduksi();
    renderKonten();
    mulaiProduksi();
    loading(false);
  }).catch(function(e) {
    loading(false);
    toast('Gagal memuat data: ' + e.message, 'error');
  });
}

// ==================== PRODUKSI ====================
function hitungProduksi() {
  var total = 0;
  var uid = String(session.user_id);
  var cab = Number(user.cabang_aktif) || 1;

  // Dari upgrades user (cabang aktif)
  dataUpgrades.forEach(function(u) {
    if (String(u.user_id) === uid && Number(u.cabang) === cab) {
      total += Number(u.produksi_per_detik) || 0;
    }
  });
  // Dari manajer aktif (cabang aktif)
  dataManajers.forEach(function(m) {
    if (String(m.user_id) === uid && Number(m.cabang) === cab && String(m.status) === 'aktif') {
      total += Number(m.level) || 1;
    }
  });
  produksiPerDetik = total;
}

function mulaiProduksi() {
  if (produksiInterval) clearInterval(produksiInterval);
  if (syncInterval) clearInterval(syncInterval);
  produksiInterval = setInterval(function() {
    if (produksiPerDetik > 0) {
      user.saldo_koin = (Number(user.saldo_koin)||0) + produksiPerDetik;
      perbaruiHeaderSaldo();
      // Update tampilan saldo di tab game kalau sedang aktif
      var el = document.getElementById('saldoGame');
      if (el) el.textContent = formatAngka(user.saldo_koin);
    }
  }, 1000);
  syncInterval = setInterval(function() { syncSaldo(); }, 10000);
  window.addEventListener('beforeunload', syncSaldo);
}

function syncSaldo() {
  if (!dataUserFull) return;
  apiCall('update', {
    sheet:'Users',
    row: dataUserFull._row,
    data: {
      saldo_koin: user.saldo_koin,
      last_sync: sekarang()
    }
  }).then(function(res) {
    if (res.ok) {
      localStorage.setItem('smp7k_user', JSON.stringify(user));
    }
  });
}

function hargaUpgrade(level) { return Math.floor(100 * Math.pow(2.5, level) * Math.pow(2, level)); }
function prodUpgrade(level, dasar) { return Math.floor(dasar * Math.pow(2, level)); }

      '</div>' +
      '<button class="upgrade-btn" data-up="' + u.id + '" ' + (mampu?'':'disabled') + '>Beli</button>' +

function bindTabGame() {
  var area = document.getElementById('tapArea');
  if (area) {
    area.addEventListener('pointerdown', function(e) {
      e.preventDefault();
      var now = Date.now();
      tapTimes = tapTimes.filter(function(t){ return now - t < 1000; });
      if (tapTimes.length >= 15) return;
      tapTimes.push(now);
      prosesTap(e, area);
    });
  }
  document.querySelectorAll('.upgrade-btn').forEach(function(btn) {
    btn.onclick = function() { beliUpgrade(btn.dataset.up); };
  });
}

function prosesTap(e, area) {
  var rect = area.getBoundingClientRect();
  var x = e.clientX - rect.left;
  var y = e.clientY - rect.top;

  // +1
  var pop = document.createElement('div');
  pop.className = 'pop';
  pop.textContent = '+1';
  pop.style.left = x + 'px';
  pop.style.top = y + 'px';
  area.appendChild(pop);
  setTimeout(function(){ if (pop.parentNode) pop.parentNode.removeChild(pop); }, 800);

  // Partikel
  for (var i=0;i<5;i++) {
    var p = document.createElement('div');
    p.className = 'partikel';
    var warna = 'rgba(200,16,46,' + (0.4 + Math.random()*0.4) + ')';
    p.style.background = warna;
    var size = 4 + Math.random()*8;
    p.style.width = size + 'px';
    p.style.height = size + 'px';

function bindTabConvert() {
  var inp = document.getElementById('konvJumlah');
  inp.addEventListener('input', function() {
    var j = Number(inp.value)||0;
    var rp = Math.floor(j/1000)*100;
    var metode = document.querySelector('input[name="metodeKonv"]:checked').value;
    if (metode==='potong') rp = Math.floor(rp*0.9);
    document.getElementById('konvPreview').textContent = 'Preview: ' + formatRupiah(rp) + (metode==='potong'?' (setelah potong 10%)':' (penuh)');
  });
  document.querySelectorAll('input[name="metodeKonv"]').forEach(function(r) {
    r.onchange = function() { inp.dispatchEvent(new Event('input')); };
  });
  document.getElementById('btnKonversi').onclick = function() {
    var j = Number(inp.value)||0;
    var metode = document.querySelector('input[name="metodeKonv"]:checked').value;
    prosesKonversi(j, metode);
  };
}

function prosesKonversi(jumlah, metode) {
  if (!jumlah || jumlah < 10000) { toast('Minimal 10.000 koin','warning'); return; }
  if (Number(user.saldo_koin) < jumlah) { toast('Saldo koin kurang','error'); return; }
  var rupiah = Math.floor(jumlah/1000)*100;
  if (metode==='potong') rupiah = Math.floor(rupiah*0.9);

  if (metode==='iklan') {
    tampilkanIklan();
    var btn = document.getElementById('btnKonversi');
    toast('Tonton iklan 30 detik...','info');
    mulaiCooldownIklan(btn, 30, function() {
      eksekusiKonversi(jumlah, rupiah);
    });
    return;
  }
  if (!confirm('Konversi ' + formatAngka(jumlah) + ' koin → ' + formatRupiah(rupiah) + '?')) return;
  eksekusiKonversi(jumlah, rupiah);
}

function eksekusiKonversi(jumlah, rupiah) {
  user.saldo_koin -= jumlah;
  user.saldo_rupiah += rupiah;
  loading(true);
  Promise.all([
    apiCall('update', {
      sheet:'Users', row: dataUserFull._row,
      data: { saldo_koin: user.saldo_koin, saldo_rupiah: user.saldo_rupiah }
    }),
    apiCall('tulis', {
      sheet:'Log',
      data: { id:'LOG-'+acakStr(8), user_id:String(session.user_id), aksi:'convert', detail:jumlah+' koin -> Rp '+rupiah, timestamp:sekarang(), device_id:deviceId }
    })
  ]).then(function(res) {
    loading(false);
    if (!res[0].ok) { toast('Gagal convert','error'); return; }
    localStorage.setItem('smp7k_user', JSON.stringify(user));
    perbaruiHeaderSaldo();
    toast('Berhasil convert! +' + formatRupiah(rupiah),'sukses');
    suaraKoin();
    renderKonten();
  });
}

function renderQris() {
  var area = document.getElementById('qrisArea');
  if (!area) return;

  if (!p) { area.innerHTML = ''; return; }
  area.innerHTML = '<div class="teks-tengah teks-kecil" style="margin-bottom:8px;">Scan QRIS untuk bayar <b>' + formatRupiah(p.bayar) + '</b></div>' +
    '<div class="qris-box" id="qrisBox"><div class="qris-placeholder">Memuat QRIS...</div></div>' +
    '<input type="file" id="buktiFile" accept="image/*" style="display:none">' +
    '<button class="btn btn-primary btn-full" id="btnUploadBukti" style="margin-top:10px;">📤 Upload Bukti Transfer</button>' +
    '<div class="teks-kecil teks-tengah" style="margin-top:6px;">Setelah upload, admin akan verifikasi.</div>';
  // Coba load QRIS
  var img = new Image();
  img.onload = function() {
    var box = document.getElementById('qrisBox');
    if (box) box.innerHTML = '<img src="' + QRIS_URL + '" alt="QRIS">';
  };
  img.onerror = function() {
    var box = document.getElementById('qrisBox');
    if (box) box.innerHTML = '<div class="qris-placeholder">QRIS belum tersedia, hubungi admin</div>';
  };
  img.src = QRIS_URL;

  document.getElementById('btnUploadBukti').onclick = function() {
    document.getElementById('buktiFile').click();
  };
  document.getElementById('buktiFile').onchange = function(e) {
    var f = e.target.files[0];
    if (!f) return;
    kompresGambar(f, function(base64) {
      kirimTopup(base64, p);
    });
  };
}

function kompresGambar(file, cb) {
  var reader = new FileReader();
  reader.onload = function(ev) {
    var img = new Image();
    img.onload = function() {
      var canvas = document.createElement('canvas');
      var maxW = 800;
      var w = img.width, h = img.height;
      if (w > maxW) { h = h * maxW / w; w = maxW; }
      canvas.width = w; canvas.height = h;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      var kualitas = 0.8;
      var dataUrl = canvas.toDataURL('image/jpeg', kualitas);
      // Perkecil sampai < 500KB
      while (dataUrl.length > 500*1024*1.37 && kualitas > 0.3) {
        kualitas -= 0.1;
        dataUrl = canvas.toDataURL('image/jpeg', kualitas);
      }
      cb(dataUrl);
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function prosesTukarVoucher(nomor, bayar) {
  if (nomor !== String(user.nomor).trim()) { toast('Nomor HP tidak cocok','error'); suaraError(); return; }

  // Cek max 1 per minggu
  var uid = String(session.user_id);
  var riw = dataVouchers.filter(function(v){ return String(v.user_id)===uid; });
  var semingguLalu = Date.now() - 7*24*60*60*1000;
  for (var i=0;i<riw.length;i++) {
    if (riw[i].tanggal_tukar) {
      var t = new Date(riw[i].tanggal_tukar).getTime();
      if (t > semingguLalu) { toast('Sudah tukar voucher minggu ini','warning'); return; }
    }
  }

  if (bayar==='koin') {
    if (Number(user.saldo_koin) < 70000) { toast('Saldo koin kurang','error'); return; }
    user.saldo_koin -= 70000;
  } else {
    if (Number(user.saldo_rupiah) < 7000) { toast('Saldo rupiah kurang','error'); return; }
    user.saldo_rupiah -= 7000;
  }

  var kode = 'MP7K-' + acakStr(6);
  var idBaru = 'VCR-' + acakStr(8);
  loading(true);
  Promise.all([
    apiCall('tulis', {
      sheet:'Vouchers',
      data: {
        id: idBaru, user_id: uid, kode: kode, status: 'aktif',
        tanggal_tukar: sekarang(), tanggal_pakai: '', nomor_konfirmasi: nomor
      }
    }),
    apiCall('update', {
      sheet:'Users', row: dataUserFull._row,
      data: { saldo_koin: user.saldo_koin, saldo_rupiah: user.saldo_rupiah }
    })
  ]).then(function(res) {
    loading(false);
    if (!res[0].ok) { toast('Gagal tukar','error'); return; }
    dataVouchers.push({ id:idBaru, user_id:uid, kode:kode, status:'aktif', tanggal_tukar:sekarang(), tanggal_pakai:'', nomor_konfirmasi:nomor, _row:res[0]._row });
    localStorage.setItem('smp7k_user', JSON.stringify(user));
    perbaruiHeaderSaldo();
    tutupModal();
    bukaModal('<h3>🎉 Voucher Berhasil!</h3>' +
      '<div class="teks-tengah teks-kecil">Tunjukkan kode ini ke kasir:</div>' +
      '<div class="kode-voucher">' + kode + '</div>' +
      '<div class="btn-row"><button class="btn btn-primary" id="vcrOk">OK</button></div>');
    document.getElementById('vcrOk').onclick = function(){ tutupModal(); renderKonten(); };
    suaraLevelUp();
  });
}

function approveTopup(t) {
  loading(true);
  // Cari user
  var users = (dataUserFull&&dataUserFull.data)||[];
  var u = users.filter(function(x){ return String(x.id)===String(t.user_id); })[0];
  if (!u) { loading(false); toast('User tidak ditemukan','error'); return; }
  var dataUpdate = {};
  if (t.jenis==='koin') dataUpdate.saldo_koin = (Number(u.saldo_koin)||0) + Number(t.jumlah_dapat);
  else if (t.jenis==='rupiah') dataUpdate.saldo_rupiah = (Number(u.saldo_rupiah)||0) + Number(t.jumlah_dapat);
  else if (t.jenis==='kristal') dataUpdate.kristal = (Number(u.kristal)||0) + Number(t.jumlah_dapat);

  Promise.all([
    apiCall('update', { sheet:'Topups', row:t._row, data:{ status:'approved' } }),
    apiCall('update', { sheet:'Users', row:u._row, data:dataUpdate })
  ]).then(function(res) {
    loading(false);
    toast('Topup disetujui','sukses');
    tutupModal();
    muatDataAdmin();
  });
}

function rejectTopup(t) {
  loading(true);
  apiCall('update', { sheet:'Topups', row:t._row, data:{ status:'rejected' } }).then(function(res) {
    loading(false);
    toast('Topup ditolak','info');

  });
}

// ==================== ANIMASI HUJAN ====================
function initHujan() {
  var canvas = document.getElementById('hujanCanvas');
  var ctx = canvas.getContext('2d');
  var W=0,H=0, tetes=[], riak=[], awan=[], kilatT=0, kilatD=0;

  function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
  window.addEventListener('resize', resize); resize();

  function initTetes() {
    tetes = [];
    var n = Math.min(140, Math.max(50, Math.floor(W/9)));
    for (var i=0;i<n;i++) tetes.push({
      x:Math.random()*W, y:Math.random()*H,
      len:8+Math.random()*14, speed:1.2+Math.random()*1.8,
      opacity:0.06+Math.random()*0.12, tebal: Math.random()<0.15?1.6:1
    });
  }
  function initRiak() {
    riak = [];
    for (var i=0;i<5;i++) riak.push({ x:Math.random()*W, y:H-40-Math.random()*80, r:0, maxR:20+Math.random()*30, speed:0.25+Math.random()*0.3, opacity:0.15 });
  }
  function initAwan() {
    awan = [];
    for (var i=0;i<4;i++) awan.push({ x:Math.random()*W, y:20+Math.random()*(H*0.28), r:80+Math.random()*110, speed:0.06+Math.random()*0.1, opacity:0.05+Math.random()*0.06 });
  }
  initTetes(); initRiak(); initAwan();

  function gambar() {
    ctx.clearRect(0,0,W,H);
    // Awan
    awan.forEach(function(a) {
      var grad = ctx.createRadialGradient(a.x,a.y,0,a.x,a.y,a.r);
      grad.addColorStop(0,'rgba(60,20,30,'+a.opacity+')');
      grad.addColorStop(1,'rgba(60,20,30,0)');
      ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(a.x,a.y,a.r,0,Math.PI*2); ctx.fill();
      a.x += a.speed;
      if (a.x - a.r > W) { a.x = -a.r; a.y = 20+Math.random()*(H*0.28); }
    });
    // Tetes
    tetes.forEach(function(t) {
      ctx.strokeStyle = 'rgba(200,16,46,'+t.opacity+')';
      ctx.lineWidth = t.tebal;
      ctx.beginPath(); ctx.moveTo(t.x,t.y); ctx.lineTo(t.x,t.y+t.len); ctx.stroke();
      t.y += t.speed;
      if (t.y > H) { t.y = -t.len; t.x = Math.random()*W; }
    });
    // Riak
    riak.forEach(function(r) {
      if (r.r > 0) {
        ctx.strokeStyle = 'rgba(200,16,46,'+(r.opacity*(1-r.r/r.maxR))+')';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(r.x,r.y,r.r,0,Math.PI*2); ctx.stroke();
      }
      r.r += r.speed;
      if (r.r > r.maxR) { r.r=0; r.x=Math.random()*W; r.y=H-40-Math.random()*80; }
    });
    // Kilat
    var now = Date.now();
    if (kilatD > 0) {
      ctx.fillStyle = 'rgba(255,255,255,'+(kilatD/200*0.3)+')';
      ctx.fillRect(0,0,W,H);
      kilatD -= 16;
    } else if (now - kilatT > 30000) {
      if (Math.random() < 0.015) { kilatT = now; kilatD = 200; }
    }
    requestAnimationFrame(gambar);
  }
  gambar();
}
