<!DOCTYPE html>
<html lang="id">
<head>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    * {

      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      font-family: 'Poppins', sans-serif;
      background: #1a1a1a;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      position: fixed;
      color: #FAFAFA;
    }
    #app {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #2a2a2a;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    #gameCanvas {
      z-index: 1;
      touch-action: none;
    }
    #cuacaCanvas {
      z-index: 2;
      pointer-events: none;
    }

    /* HEADER */
    #appHeader {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      background: linear-gradient(180deg, rgba(200,16,46,0.95) 0%, rgba(200,16,46,0.85) 80%, rgba(200,16,46,0) 100%);
      padding: 8px 10px 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      pointer-events: none;
    }
    .header-row {
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: auto;
    }
    .header-logo {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: #F59E0B;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 13px;
      color: #C8102E;
      box-shadow: 0 2px 8px rgba(245,158,11,0.5);
      flex-shrink: 0;
    }
    .header-info {
      flex: 1;
      min-width: 0;
    }
    .header-name {
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .header-phone {
      font-size: 10px;
      color: rgba(255,255,255,0.8);
      line-height: 1.2;
    }
    .header-weather {
      font-size: 22px;
      width: 34px;
      text-align: center;
      flex-shrink: 0;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
    }
    .header-btn {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(4px);
      border: none;
      color: #fff;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.15s;
    }
    .header-btn:active { transform: scale(0.9); }
    .header-balance {
      display: flex;
      gap: 6px;
      pointer-events: auto;
    }
    .balance-item {
      flex: 1;
      background: rgba(0,0,0,0.35);
      backdrop-filter: blur(6px);
      border-radius: 10px;
      padding: 4px 6px;
      display: flex;
      align-items: center;
      gap: 4px;
      border: 1px solid rgba(255,255,255,0.15);
      min-width: 0;
    }
    .balance-icon {
      width: 20px;
      height: 20px;
      object-fit: contain;
      flex-shrink: 0;
      image-rendering: auto;
    }
    .balance-icon-emoji {
      font-size: 15px;
      flex-shrink: 0;
      line-height: 1;
    }
    .balance-text {
      font-size: 11px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
    }
    .level-row {
      display: flex;
      align-items: center;
      gap: 6px;
      pointer-events: auto;
    }
    .level-label {
      font-size: 10px;
      font-weight: 700;
      color: #F59E0B;
      background: rgba(0,0,0,0.4);
      padding: 2px 8px;
      border-radius: 10px;
      white-space: nowrap;
    }
    .level-bar {
      flex: 1;
      height: 6px;
      background: rgba(0,0,0,0.4);
      border-radius: 6px;
      overflow: hidden;
    }
    .level-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #F59E0B, #fbbf24);
      border-radius: 6px;
      transition: width 0.4s;
      width: 0%;
    }

    /* BOTTOM NAV */
    #bottomNav {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 20;
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      overflow-x: auto;
      padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px));
      gap: 2px;
      scrollbar-width: none;
      border-top: 1px solid rgba(200,16,46,0.15);
      box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
    }
    #bottomNav::-webkit-scrollbar { display: none; }
    .nav-item {
      flex: 0 0 auto;
      min-width: 58px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 4px 2px;
      border-radius: 12px;
      border: none;
      background: transparent;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      position: relative;
    }
    .nav-item:active { transform: scale(0.92); }
    .nav-item.active { background: rgba(200,16,46,0.12); }
    .nav-icon {
      font-size: 20px;
      line-height: 1;
    }
    .nav-label {
      font-size: 9px;
      font-weight: 600;
      color: #333;
      white-space: nowrap;
    }
    .nav-item.active .nav-label { color: #C8102E; }
    .nav-badge {
      position: absolute;
      top: 0;
      right: 6px;
      background: #C8102E;
      color: #fff;
      font-size: 8px;
      font-weight: 700;
      min-width: 14px;
      height: 14px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 3px;
      border: 1.5px solid #fff;
    }

    /* PANEL SLIDE */
    #panelSlide {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      background: #FAFAFA;
      border-radius: 22px 22px 0 0;
      box-shadow: 0 -8px 40px rgba(0,0,0,0.25);
      transform: translateY(110%);
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      max-height: 72vh;
      display: flex;
      flex-direction: column;
      pointer-events: none;
      color: #222;
    }
    #panelSlide.open {
      transform: translateY(0);
      pointer-events: auto;
    }
    .panel-handle {
      width: 40px;
      height: 4px;
      background: #ddd;
      border-radius: 4px;
      margin: 8px auto 4px;
      flex-shrink: 0;
    }
    .panel-title {
      font-size: 16px;
      font-weight: 700;
      color: #C8102E;
      text-align: center;
      padding: 4px 16px 8px;
      flex-shrink: 0;
    }
    .panel-content {
      flex: 1;
      overflow-y: auto;
      padding: 0 12px 20px;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }
    .panel-content::-webkit-scrollbar { width: 4px; }
    .panel-content::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }

    /* UPGRADE / ITEM CARDS */
    .upgrade-card, .item-card {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #fff;
      border-radius: 14px;
      padding: 10px;
      margin-bottom: 8px;
      border: 1.5px solid #eee;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      transition: border-color 0.2s, transform 0.15s;
    }
    .upgrade-card:active, .item-card:active { transform: scale(0.98); }
    .upgrade-card.affordable { border-color: #F59E0B; }
    .upgrade-card.locked { opacity: 0.55; }
    .upgrade-emoji {
      font-size: 28px;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f7f7f7;
      border-radius: 12px;
      flex-shrink: 0;
    }
    .upgrade-info {
      flex: 1;
      min-width: 0;
    }
    .upgrade-name {
      font-size: 13px;
      font-weight: 700;
      color: #222;
      line-height: 1.2;
    }
    .upgrade-desc {
      font-size: 10px;
      color: #888;
      line-height: 1.3;
    }
    .upgrade-level {
      font-size: 10px;
      font-weight: 600;
      color: #C8102E;
    }
    .upgrade-action {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      flex-shrink: 0;
    }
    .btn-buy {
      background: linear-gradient(135deg, #C8102E, #e63946);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 7px 12px;
      font-size: 11px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
      transition: transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 3px 10px rgba(200,16,46,0.3);
    }
    .btn-buy:active { transform: scale(0.93); }
    .btn-buy:disabled {
      background: #ccc;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }
    .btn-buy.gold {
      background: linear-gradient(135deg, #F59E0B, #fbbf24);
      box-shadow: 0 3px 10px rgba(245,158,11,0.4);
      color: #7c2d12;
    }
    .btn-buy.blue {
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      box-shadow: 0 3px 10px rgba(37,99,235,0.3);
    }

    /* STORY MODAL */
    #modalCerita {
      position: absolute;
      inset: 0;
      z-index: 60;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(4px);
      padding: 20px;
      opacity: 0;
      transition: opacity 0.4s;
    }
    #modalCerita.show {
      display: flex;
      opacity: 1;
    }
    .cerita-box {
      background: #fff;
      border: 3px solid #F59E0B;
      border-radius: 20px;
      padding: 20px 18px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      transform: scale(0.85);
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      color: #222;
    }
    #modalCerita.show .cerita-box { transform: scale(1); }
    .cerita-img {
      width: 80px;
      height: 80px;
      object-fit: contain;
      margin: 0 auto 8px;
      display: block;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.15));
    }
    .cerita-img-emoji {
      font-size: 56px;
      line-height: 1;
      margin-bottom: 8px;
    }
    .cerita-judul {
      font-size: 17px;
      font-weight: 800;
      color: #C8102E;
      margin-bottom: 10px;
    }
    .cerita-dialog {
      font-size: 13px;
      line-height: 1.6;
      color: #444;
      margin-bottom: 16px;
      min-height: 60px;
    }
    .cerita-dialog p { margin-bottom: 6px; }
    .btn-cerita {
      background: linear-gradient(135deg, #C8102E, #e63946);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 11px 32px;
      font-size: 14px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(200,16,46,0.4);
      transition: transform 0.15s;
    }
    .btn-cerita:active { transform: scale(0.95); }
    .btn-cerita.gold {
      background: linear-gradient(135deg, #F59E0B, #fbbf24);
      color: #7c2d12;
      box-shadow: 0 4px 14px rgba(245,158,11,0.4);
    }

    /* TOAST */
    #toastBox {
      position: absolute;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 70;
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: center;
      pointer-events: none;
      width: 90%;
      max-width: 340px;
    }
    .toast {
      background: rgba(30,30,30,0.92);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      padding: 10px 18px;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
      animation: toastIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      text-align: center;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.1);
      width: 100%;
    }
    .toast.success { background: rgba(22,163,74,0.92); }
    .toast.error { background: rgba(220,38,38,0.92); }
    .toast.gold { background: rgba(245,158,11,0.95); color: #422006; }
    .toast.out { animation: toastOut 0.3s forwards; }
    @keyframes toastIn {
      from { opacity: 0; transform: translateY(-16px) scale(0.9); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes toastOut {
      to { opacity: 0; transform: translateY(-12px) scale(0.9); }
    }

    /* MODAL OVERLAY (generic) */
    #modalOverlay {
      position: absolute;
      inset: 0;
      z-index: 55;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(3px);
      padding: 20px;
    }
    #modalOverlay.show { display: flex; }
    .modal-card {
      background: #fff;
      border-radius: 20px;
      padding: 22px 20px;
      max-width: 340px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
      text-align: center;
      animation: toastIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      color: #222;
      max-height: 85vh;
      overflow-y: auto;
    }
    .modal-card h3 {
      font-size: 17px;
      font-weight: 800;
      color: #C8102E;
      margin-bottom: 8px;
    }
    .modal-card p {
      font-size: 13px;
      color: #555;
      line-height: 1.5;
      margin-bottom: 14px;
    }
    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    .modal-actions .btn-buy { flex: 1; padding: 10px; font-size: 13px; }
    .btn-ghost {
      background: #eee;
      color: #444;
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 12px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      flex: 1;
    }

    /* ADMIN PANEL */
    #panelAdmin {
      position: absolute;
      inset: 0;
      z-index: 100;
      background: #0f172a;
      color: #e2e8f0;
      display: none;
      flex-direction: column;
      font-family: 'Poppins', sans-serif;
    }
    #panelAdmin.show { display: flex; }
    .admin-header {
      background: #C8102E;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .admin-header h2 { font-size: 15px; font-weight: 700; flex: 1; }
    .admin-tabs {
      display: flex;
      overflow-x: auto;
      background: #1e293b;
      padding: 6px 8px;
      gap: 4px;
      flex-shrink: 0;
      scrollbar-width: none;
    }
    .admin-tabs::-webkit-scrollbar { display: none; }
    .admin-tab {
      flex: 0 0 auto;
      padding: 6px 12px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: #94a3b8;
      font-size: 11px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
    }
    .admin-tab.active { background: #C8102E; color: #fff; }
    .admin-body {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      font-size: 12px;
    }
    .admin-body table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
    }
    .admin-body th, .admin-body td {
      padding: 6px 8px;
      text-align: left;
      border-bottom: 1px solid #334155;
    }
    .admin-body th { color: #F59E0B; font-weight: 700; }
    .admin-body .row { background: #1e293b; border-radius: 8px; padding: 10px; margin-bottom: 8px; }

    /* UTIL */
    .hidden { display: none !important; }
    .text-center { text-align: center; }
    .mt-8 { margin-top: 8px; }
    .mb-8 { margin-bottom: 8px; }
    .flex { display: flex; }
    .gap-8 { gap: 8px; }
    .flex-1 { flex: 1; }
    .section-label {
      font-size: 12px;
      font-weight: 700;
      color: #C8102E;
      margin: 14px 0 8px;
      padding-left: 4px;
    }
    .empty-state {
      text-align: center;
      color: #999;
      font-size: 12px;
      padding: 24px 0;
    }
    .progress-bar-sm {
      height: 6px;
      background: #eee;
      border-radius: 6px;
      overflow: hidden;
      margin-top: 4px;
    }
    .progress-bar-sm > div {
      height: 100%;
      background: linear-gradient(90deg, #F59E0B, #fbbf24);
      border-radius: 6px;
      transition: width 0.3s;
    }

    /* RIPPLE */
    .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.5);
      transform: scale(0);
      animation: rippleAnim 0.6s linear;
      pointer-events: none;
    }
    @keyframes rippleAnim {
      to { transform: scale(4); opacity: 0; }
    }

    @keyframes sparkle {
      0%, 100% { opacity: 0.4; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }
    .sparkle-star {
      position: absolute;
      font-size: 12px;
      animation: sparkle 1s infinite;
      pointer-events: none;
    }
  </style>
</head>

  img.crossOrigin = 'anonymous';
  img.onload = function() {
    var canvas = document.createElement('canvas');
    canvas.width = img.width;
    canvas.height = img.height;
    var ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0);
    try {
      var imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      var data = imageData.data;
      var tol = toleransi || 40;
      for (var i = 0; i < data.length; i += 4) {
        if (data[i] > 255 - tol && data[i+1] > 255 - tol && data[i+2] > 255 - tol) {
          data[i+3] = 0;
        }
      }
      ctx.putImageData(imageData, 0, 0);
      callback(canvas.toDataURL('image/png'));
    } catch(e) { callback(imgSrc); }
  };
  img.onerror = function() { callback(null); };
  img.src = imgSrc;
}

    { key: 'motorMogeKotor', src: 'assets/motor-moge-kotor.png', tol: 40 },
    { key: 'motorMogeBersih', src: 'assets/motor-moge-bersih.png', tol: 40 }
  ];
  // background & qris tidak dihapus
  var rawAssets = [
    { key: 'bg', src: 'assets/steam-bg.png' },
    { key: 'qris', src: 'assets/qris.png' }
  ];
  var total = assets.length + rawAssets.length;
  var done = 0;
  function checkDone() { done++; if (done >= total && cb) cb(); }

  assets.forEach(function(a) {
    hilangkanBackgroundPutih(a.src, a.tol, function(result) {
      if (result) {
        imageCache[a.key] = result;

      checkDone();
    });
  });
  rawAssets.forEach(function(a) {
    var img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = function() { imageCache[a.key] = a.src; checkDone(); };
    img.onerror = function() { imageCache[a.key] = null; checkDone(); };
    img.src = a.src;
  });
}

// ==================== AUDIO ====================
function initAudio() {
  if (!state.audioCtx) {
    try {
      state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch(e) {}
  }
}
function playSound(type) {
  if (!state.audioCtx) return;
  var ctx = state.audioCtx;
  if (ctx.state === 'suspended') ctx.resume();
  var osc = ctx.createOscillator();
  var gain = ctx.createGain();
  osc.connect(gain);
  gain.connect(ctx.destination);
  var now = ctx.currentTime;
  if (type === 'tap') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(800, now);
    osc.frequency.exponentialRampToValueAtTime(200, now + 0.15);
    gain.gain.setValueAtTime(0.08, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
    osc.start(now); osc.stop(now + 0.2);
  } else if (type === 'coin') {
    osc.type = 'square';
    osc.frequency.setValueAtTime(1200, now);
    osc.frequency.setValueAtTime(1600, now + 0.06);
    gain.gain.setValueAtTime(0.06, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
    osc.start(now); osc.stop(now + 0.2);
  } else if (type === 'levelup') {
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(523, now);
    osc.frequency.setValueAtTime(659, now + 0.1);
    osc.frequency.setValueAtTime(784, now + 0.2);
    gain.gain.setValueAtTime(0.1, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
    osc.start(now); osc.stop(now + 0.4);
  } else if (type === 'error') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(150, now);
    gain.gain.setValueAtTime(0.08, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
    osc.start(now); osc.stop(now + 0.25);
  }
}

// ==================== BACKEND API ====================
async function apiCall(action, data) {
  try {
    var body = Object.assign({ action: action, token: TOKEN }, data || {});
    var res = await fetch(BACKEND_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body)
    });
    var json = await res.json();
    return json;
  } catch(e) {
    console.warn('API error:', e);
    return { ok: false, pesan: 'Koneksi gagal', data: null };
  }
}

}

function cekSesi() {
  var session = localStorage.getItem('smp7k_session');
  if (!session) {
    window.location.href = 'index.html';
    return false;
  }
  var user = localStorage.getItem('smp7k_user');
  if (user) {
    try { state.user = JSON.parse(user); } catch(e) { state.user = { nama: user, hp: '' }; }
  } else {
    state.user = { nama: 'Pemain', hp: '' };
  }
  // Cek admin
  var urlParams = new URLSearchParams(window.location.search);
  if (urlParams.get('admin') === '1' && localStorage.getItem('smp7k_admin')) {
    state.isAdmin = true;
  }
  return true;
}

async function loadUserData() {
  if (!state.user) return;
  try {
    var res = await bacaSatu('Users', state.user.hp || state.user.nama);
    if (res && res.ok && res.data) {
      var d = res.data;
      state.saldo.koin = Number(d.koin) || 0;
      state.saldo.rupiah = Number(d.rupiah) || 0;
      state.saldo.kristal = Number(d.kristal) || 0;
      state.level = Number(d.level) || 1;
      state.exp = Number(d.exp) || 0;
      state.expNext = Number(d.exp_next) || 100;
      state.motorDicuci = Number(d.motor_dicuci) || 0;
      state.mogeDicuci = Number(d.moge_dicuci) || 0;
      state.totalTap = Number(d.total_tap) || 0;
      state.totalConvert = Number(d.total_convert) || 0;
      state.manajer = Number(d.manajer) || 0;
      state.cabang = Number(d.cabang) || 0;
      state.storyUnlocked = Number(d.story_unlocked) || 0;
      // upgrades
      if (d.upgrades) {
        try { var u = JSON.parse(d.upgrades); Object.assign(state.upgrades, u); } catch(e) {}
      }
      if (d.manajer_list) {
        try { var m = JSON.parse(d.manajer_list); Object.assign(state.manajerList, m); } catch(e) {}
      }
      state._serverData = d;
    }
  } catch(e) { console.warn('loadUserData error', e); }
}

// ==================== SYNC PROGRESS (DELTA) ====================
async function syncProgress(force) {
  if (!state.user) return;
  var now = Date.now();
  if (!force && now - state.lastSyncTime < 5000) return;
  var deltaKoin = state._deltaKoin || 0;
  if (deltaKoin <= 0 && !force) return;
  if (deltaKoin > MAX_SYNC_DELTA) deltaKoin = MAX_SYNC_DELTA;
  state._deltaKoin = 0;
  state.lastSyncTime = now;
  try {
    await apiCall('update', {
      sheet: 'Users',
      id: state.user.hp || state.user.nama,
      data: {
        koin: state.saldo.koin,
        rupiah: state.saldo.rupiah,
        kristal: state.saldo.kristal,
        level: state.level,
        exp: state.exp,
        exp_next: state.expNext,
        motor_dicuci: state.motorDicuci,
        moge_dicuci: state.mogeDicuci,
        total_tap: state.totalTap,
        total_convert: state.totalConvert,
        manajer: state.manajer,
        cabang: state.cabang,
        story_unlocked: state.storyUnlocked,
        upgrades: JSON.stringify(state.upgrades),
        manajer_list: JSON.stringify(state.manajerList)
      }
    });
  } catch(e) { /* silent */ }
}

// ==================== RIPPLE EFFECT ====================
function addRipple(e) {
  var btn = e.currentTarget;
  var rect = btn.getBoundingClientRect();
  var ripple = document.createElement('span');
  ripple.className = 'ripple';
  var size = Math.max(rect.width, rect.height);
  ripple.style.width = ripple.style.height = size + 'px';
  ripple.style.left = (e.clientX - rect.left - size/2) + 'px';
  ripple.style.top = (e.clientY - rect.top - size/2) + 'px';
  btn.style.position = 'relative';
  btn.style.overflow = 'hidden';
  btn.appendChild(ripple);
  setTimeout(function() { ripple.remove(); }, 600);
}

const UPGRADE_DEFS = [
  { key: 'semprot', name: 'Tukang Semprot', emoji: '💦', basePrice: 100, baseProd: 1, desc: '1 koin/detik' },
  { key: 'sabun', name: 'Tukang Sabun', emoji: '🧼', basePrice: 1000, baseProd: 5, desc: '5 koin/detik' },
  { key: 'bilas', name: 'Tukang Bilas', emoji: '🚿', basePrice: 10000, baseProd: 25, desc: '25 koin/detik' },
  { key: 'kering', name: 'Tukang Kering', emoji: '💨', basePrice: 100000, baseProd: 100, desc: '100 koin/detik' },
  { key: 'poles', name: 'Tukang Poles', emoji: '✨', basePrice: 1000000, baseProd: 500, desc: '500 koin/detik' },
  { key: 'kompresor', name: 'Kompresor', emoji: '🔧', basePrice: 10000000, baseProd: 2500, desc: '2.500 koin/detik' }
];

function getUpgradePrice(def, level) {
  return Math.floor(def.basePrice * Math.pow(2.5, level));
}
function getUpgradeProd(def, level) {
  return def.baseProd * Math.pow(2, level);
}

function renderTabGame(c) {
  var html = '<div class="section-label">⚡ Upgrade Produksi</div>';
  UPGRADE_DEFS.forEach(function(def) {
    var lv = state.upgrades[def.key] || 0;
    var price = getUpgradePrice(def, lv);
    var prod = getUpgradeProd(def, lv);
    var afford = state.saldo.koin >= price;
    html += '<div class="upgrade-card' + (afford ? ' affordable' : '') + '">' +
      '<div class="upgrade-emoji">' + def.emoji + '</div>' +
      '<div class="upgrade-info">' +
        '<div class="upgrade-name">' + def.name + '</div>' +
        '<div class="upgrade-desc">' + def.desc + '</div>' +
        '<div class="upgrade-level">Lv ' + lv + ' → ' + prod + ' koin/dtk</div>' +
      '</div>' +
      '<div class="upgrade-action">' +
        '<button class="btn-buy" data-upgrade="' + def.key + '"' + (afford ? '' : ' disabled') + '>' +
          formatKoin(price) +
        '</button>' +
      '</div>' +
    '</div>';
  });
  html += '<div class="section-label" style="margin-top:16px;">📊 Produksi Total</div>' +
    '<div class="upgrade-card"><div class="upgrade-emoji">⚙️</div>' +
    '<div class="upgrade-info"><div class="upgrade-name">Total Produksi</div>' +
    '<div class="upgrade-desc">' + getTotalProduksi() + ' koin/detik</div></div></div>';
  c.innerHTML = html;
  c.querySelectorAll('[data-upgrade]').forEach(function(btn) {
    btn.addEventListener('click', function(e) {
      addRipple(e);
      beliUpgrade(this.dataset.upgrade);
    });
  });
}

function getTotalProduksi() {
  var total = 0;
  UPGRADE_DEFS.forEach(function(def) {
    var lv = state.upgrades[def.key] || 0;
    total += getUpgradeProd(def, lv) * lv;
  });
  // manajer juga produksi
  var manajerDefs = [
    { key: 'budi', prod: 1 }, { key: 'siti', prod: 5 }, { key: 'andi', prod: 25 },
    { key: 'rina', prod: 100 }, { key: 'joko', prod: 500 }, { key: 'umar', prod: 2500 }
  ];
  manajerDefs.forEach(function(m) {
    if (state.manajerList[m.key]) total += m.prod;
  });
  return Math.min(total, MAX_KOIN_PER_DETIK);
}

function beliUpgrade(key) {
  var def = UPGRADE_DEFS.find(function(d) { return d.key === key; });
  if (!def) return;
  var lv = state.upgrades[key] || 0;
  var price = getUpgradePrice(def, lv);
  if (state.saldo.koin < price) { showToast('Koin tidak cukup!', 'error'); playSound('error'); return; }
  state.saldo.koin -= price;
  state.upgrades[key] = lv + 1;
  state._deltaKoin = (state._deltaKoin || 0) + 0; // sync via server
  showToast('✅ ' + def.name + ' Lv ' + (lv+1), 'success');
  playSound('levelup');
  updateHeaderSaldo();
  renderPanelContent('game');
  syncProgress(true);
  cekQuestProgress('upgrade');
  cekStoryUnlock();
}

function kirimBuktiTopup() {
  var input = document.getElementById('inputBukti');
  if (!input || !input.files || !input.files[0]) { showToast('Pilih gambar bukti dulu', 'error'); return; }
  var file = input.files[0];
  var reader = new FileReader();
  reader.onload = function(ev) {
    var img = new Image();
    img.onload = function() {
      var canvas = document.createElement('canvas');
      var maxW = 600;
      var scale = maxW / img.width;
      canvas.width = maxW;
      canvas.height = img.height * scale;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      var dataUrl = canvas.toDataURL('image/jpeg', 0.6);
      tulis('Topups', {
        user: state.user ? (state.user.hp || state.user.nama) : 'unknown',
        bukti: dataUrl,
        status: 'pending',
        waktu: new Date().toISOString()
      }).then(function() {
        showToast('✅ Bukti terkirim!', 'success');
        cekQuestProgress('topup');
      });
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

    state.saldo.koin -= 70000;
    var kode = 'MP7K-' + Math.random().toString(36).substr(2,6).toUpperCase();
    localStorage.setItem('smp7k_voucher_week', mingguIni);

function getWeekKey() {
  var d = new Date();
  var day = d.getDay();
  var diff = d.getDate() - day + (day === 0 ? -6 : 1);
  var monday = new Date(d.setDate(diff));
  return monday.toISOString().slice(0,10);
}

    if (prog >= q.target && !state.questProgress[q.id + '_claimed']) klaimable++;
  });
  state._questKlaimable = klaimable;
  renderNav();
}

function getQuestProgress(q) {
  var key = q.progressKey;
  if (key === 'motorDicuci') return state.motorDicuci;
  if (key === 'mogeDicuci') return state.mogeDicuci;
  if (key === 'totalTap') return state.totalTap;
  if (key === 'totalConvert') return state.totalConvert;
  if (key === 'manajer') return state.manajer;
  if (key === 'cabang') return state.cabang;
  if (key === 'topup') return state._topupDone ? 1 : 0;
  return 0;
}

function klaimQuest(id) {
  var q = state.questsData.find(function(d) { return String(d.id) === String(id); });
  if (!q) return;
  var prog = getQuestProgress(q);
  if (prog < q.target) { showToast('Belum selesai', 'error'); return; }
  if (state.questProgress[q.id + '_claimed']) { showToast('Sudah diklaim', 'error'); return; }
  state.questProgress[q.id + '_claimed'] = true;
  state.saldo.koin += q.reward;
  showToast('🎁 +' + formatKoin(q.reward) + ' koin!', 'gold');
  playSound('coin');
  updateHeaderSaldo();
  syncProgress(true);
  renderPanelContent('quest');
  updateQuestProgressServer(q.id);
}

function updateQuestProgressServer(qid) {
  apiCall('update', {
    sheet: 'QuestProgress',
    id: (state.user.hp || state.user.nama) + '_' + qid,
    data: { claimed: true, waktu: new Date().toISOString() }
  });
}

function cekQuestProgress(type) {
  if (type === 'topup') state._topupDone = true;
  if (state.panelAktif === 'quest') renderPanelContent('quest');
}

// ==================== GAME CANVAS & LOGIKA ====================
var canvas, ctx, cuacaCanvas, cuacaCtx;
var canvasW, canvasH;

function initCanvas() {
  canvas = document.getElementById('gameCanvas');
  ctx = canvas.getContext('2d');
  cuacaCanvas = document.getElementById('cuacaCanvas');
  cuacaCtx = cuacaCanvas.getContext('2d');
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);
  // tap detection
  canvas.addEventListener('pointerdown', onCanvasTap);
  canvas.addEventListener('click', onCanvasTap);
}

function resizeCanvas() {
  var dpr = window.devicePixelRatio || 1;
  canvasW = canvas.clientWidth;
  canvasH = canvas.clientHeight;
  canvas.width = canvasW * dpr;
  canvas.height = canvasH * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cuacaCanvas.width = canvasW * dpr;
  cuacaCanvas.height = canvasH * dpr;
  cuacaCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  initSlotParkir();
}

// ==================== SLOT PARKIR ====================
function initSlotParkir() {
  state.slotParkir = [];
  var cols = 6, rows = 3;
  var yRows = [0.42, 0.55, 0.68];
  var xStart = 0.12, xEnd = 0.88;
  var xStep = (xEnd - xStart) / (cols - 1);
  for (var r = 0; r < rows; r++) {
    for (var col = 0; col < cols; col++) {
      state.slotParkir.push({
        x: xStart + col * xStep,
        y: yRows[r],
        occupied: false,
        motorId: null
      });
    }
  }
}

// ==================== SPAWN MOTOR ====================
function spawnMotor() {
  if (state.motorList.length > 30) return;
  var isMoge = Math.random() < (1/8);
  var arah = Math.random() < 0.5 ? 1 : -1; // 1 kiri->kanan, -1 kanan->kiri
  var masukParkiran = Math.random() < 0.4;
  var parkiranPenuh = state.slotParkir.filter(function(s) { return s.occupied; }).length >= 18;
  if (parkiranPenuh) masukParkiran = false;

  var motor = {
    id: ++state.motorIdCounter,
    x: arah === 1 ? -0.1 : 1.1,
    y: 0.04,
    arah: arah,
    state: masukParkiran ? 'masuk' : 'lewat',
    level: isMoge ? 2 : 1,
    kotor: true,
    tapCount: 0,
    waktuMasuk: Date.now(),
    isMoge: isMoge,
    sudahNontonIklan: false,
    slotTarget: null,
    rotasi: 0,
    animProgress: 0,
    targetX: 0,
    targetY: 0,
    startX: 0,
    startY: 0,
    kaburTimer: null,
    emojiKabur: false,
    sparkle: isMoge
  };

  if (masukParkiran) {
    var slot = state.slotParkir.find(function(s) { return !s.occupied; });
    if (slot) {
      slot.occupied = true;
      slot.motorId = motor.id;
      motor.slotTarget = slot;
      motor.startX = motor.x;
      motor.startY = motor.y;
      motor.targetX = slot.x;
      motor.targetY = slot.y;
      motor.animProgress = 0;
      motor.state = 'masuk';
    } else {
      motor.state = 'lewat';
    }
  }
  state.motorList.push(motor);
}

// ==================== UPDATE MOTOR ====================
function updateMotors(dt) {
  var now = Date.now();
  for (var i = state.motorList.length - 1; i >= 0; i--) {
    var m = state.motorList[i];
    // Update waktu
    if (m.state === 'parkir') {
      var elapsed = (now - m.waktuMasuk) / 1000;
      if (elapsed > 8 && !m.emojiKabur) {
        // kabur
        m.emojiKabur = true;
        showToast('Pelanggan kabur!', 'error');
        playSound('error');
        // lepas slot
        if (m.slotTarget) { m.slotTarget.occupied = false; m.slotTarget.motorId = null; }
        m.state = 'keluar';
        m.startX = m.x; m.startY = m.y;
        m.targetX = m.arah === 1 ? 1.2 : -0.2;
        m.targetY = 0.04;
        m.animProgress = 0;
      } else if (elapsed > 5 && !m.emojiKabur) {
        m.showAngry = true;
      }
    }

    if (m.state === 'lewat') {
      m.x += m.arah * 0.08 * dt;
      if (m.x > 1.2 || m.x < -0.2) { state.motorList.splice(i, 1); continue; }
    } else if (m.state === 'masuk') {
      m.animProgress += dt / 1.5;
      if (m.animProgress >= 1) {
        m.animProgress = 1;
        m.x = m.targetX; m.y = m.targetY;
        m.state = 'parkir';
        m.waktuMasuk = now;
        m.rotasi = Math.PI;
      } else {
        var t = easeInOut(m.animProgress);
        m.x = m.startX + (m.targetX - m.startX) * t;
        m.y = m.startY + (m.targetY - m.startY) * t;
        m.rotasi = Math.PI * t;
      }
    } else if (m.state === 'parkir') {
      // diam, timer berjalan
    } else if (m.state === 'keluar') {
      m.animProgress += dt / 1.2;
      if (m.animProgress >= 1) {
        // lanjut lewat
        m.state = 'lewat';
        m.y = 0.04;
        if (m.arah === 1) m.x = 1.2; else m.x = -0.2;
      } else {
        var t2 = easeInOut(m.animProgress);
        m.x = m.startX + (m.targetX - m.startX) * t2;
        m.y = m.startY + (m.targetY - m.startY) * t2;
        m.rotasi = Math.PI * (1 - t2);
      }
    } else if (m.state === 'dicuci') {
      // animasi pergi setelah dibersihkan
      m.animProgress += dt / 0.8;
      if (m.animProgress >= 1) {
        state.motorList.splice(i, 1); continue;
      }
      m.x += m.arah * 0.05 * dt;
    }
  }
}

function easeInOut(t) {
  return t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2;
}

// ==================== RENDER GAME ====================
function renderGame() {
  ctx.clearRect(0, 0, canvasW, canvasH);
  // Background
  if (imageCache.bg) {
    var img = new Image();
    img.src = imageCache.bg;
    // drawImage cover
    drawCover(ctx, img, 0, 0, canvasW, canvasH);
  } else {
    // fallback gradient
    var grd = ctx.createLinearGradient(0, 0, 0, canvasH);
    grd.addColorStop(0, '#87CEEB');
    grd.addColorStop(0.08, '#555');
    grd.addColorStop(0.18, '#4a7c59');
    grd.addColorStop(0.25, '#3b82f6');
    grd.addColorStop(0.32, '#aaa');
    grd.addColorStop(0.35, '#666');
    grd.addColorStop(0.75, '#555');
    grd.addColorStop(0.85, '#8B4513');
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, canvasW, canvasH);
  }

  // Render motor
  state.motorList.forEach(function(m) {
    renderMotor(m);
  });

  // Render partikel
  renderParticles();

  // Render koin terbang
  renderKoinTerbang();
}

function drawCover(ctx, img, dx, dy, dw, dh) {
  if (!img.complete || img.naturalWidth === 0) return;
  var scale = Math.max(dw / img.naturalWidth, dh / img.naturalHeight);
  var sw = dw / scale;
  var sh = dh / scale;
  var sx = (img.naturalWidth - sw) / 2;
  var sy = (img.naturalHeight - sh) / 2;
  ctx.drawImage(img, sx, sy, sw, sh, dx, dy, dw, dh);
}

function renderMotor(m) {
  var px = m.x * canvasW;
  var py = m.y * canvasH;
  var size = m.state === 'parkir' || m.state === 'masuk' || m.state === 'keluar' ? { w: 80, h: 100 } : { w: 60, h: 80 };
  var imgKey = '';
  if (m.level === 2) {
    imgKey = m.kotor ? 'motorMogeKotor' : 'motorMogeBersih';
  } else {
    imgKey = m.kotor ? 'motorBebekKotor' : 'motorBebekBersih';
  }
  var src = imageCache[imgKey];
  ctx.save();
  ctx.translate(px, py);
  ctx.rotate(m.rotasi || 0);
  if (src) {
    var img = new Image();
    img.src = src;
    ctx.drawImage(img, -size.w/2, -size.h/2, size.w, size.h);
  } else {
    // fallback emoji
    ctx.font = '40px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(m.level === 2 ? '🏍️' : '🛵', 0, 0);
  }
  ctx.restore();

  // Emoji kabur
  if (m.showAngry) {
    ctx.font = '16px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('💢', px, py - 40);
  }
  // Sparkle Moge
  if (m.sparkle && m.isMoge) {
    ctx.font = '14px sans-serif';
    ctx.fillStyle = '#F59E0B';
    ctx.fillText('✨', px + 25, py - 30);
  }
  // Ikon iklan Moge
  if (m.isMoge && !m.sudahNontonIklan && m.state === 'parkir') {
    ctx.font = '18px sans-serif';
    ctx.fillText('🎬', px, py - 55);
  }
}

function renderParticles() {
  for (var i = state.particles.length - 1; i >= 0; i--) {
    var p = state.particles[i];
    p.life -= 0.016;
    if (p.life <= 0) { state.particles.splice(i, 1); continue; }
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.1;
  }
  ctx.globalAlpha = 1;
}

function renderKoinTerbang() {
  for (var i = state.koinTerbang.length - 1; i >= 0; i--) {
    var k = state.koinTerbang[i];
    k.t += 0.02;
    if (k.t >= 1) { state.koinTerbang.splice(i, 1); continue; }
    var x = k.x0 + (k.x1 - k.x0) * k.t;
    var y = k.y0 + (k.y1 - k.y0) * k.t - Math.sin(k.t * Math.PI) * 60;
    ctx.font = '20px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('🪙', x, y);
  }
}

// ==================== CANVAS TAP ====================
function onCanvasTap(e) {
  e.preventDefault();
  var rect = canvas.getBoundingClientRect();
  var tapX = (e.clientX - rect.left);
  var tapY = (e.clientY - rect.top);
  // Cari motor yang di-tap
  for (var i = state.motorList.length - 1; i >= 0; i--) {
    var m = state.motorList[i];
    if (m.state !== 'parkir') continue;
    var px = m.x * canvasW;
    var py = m.y * canvasH;
    if (Math.abs(tapX - px) < 50 && Math.abs(tapY - py) < 65) {
      tapMotor(m);
      return;
    }
  }
}

function tapMotor(m) {
  if (m.level === 2 && !m.sudahNontonIklan) {
    // Moge wajib iklan
    showMogeIklanModal(m);
    return;
  }
  if (!m.kotor) return;
  m.tapCount++;
  state.totalTap++;
  // Efek air
  spawnAirEffect(m.x * canvasW, m.y * canvasH);
  playSound('tap');
  if (m.tapCount >= (m.level === 2 ? 5 : 1)) {
    // Selesai dicuci
    m.kotor = false;
    m.state = 'dicuci';
    m.animProgress = 0;
    if (m.level === 2) { state.mogeDicuci++; }
    else { state.motorDicuci++; }
    // Bayar
    var bayar = m.level === 2 ? 500 : 1;
    state.saldo.koin += bayar;
    state._deltaKoin = (state._deltaKoin || 0) + bayar;
    state.exp += m.level === 2 ? 25 : 5;
    // Koin terbang
    state.koinTerbang.push({
      x0: m.x * canvasW, y0: m.y * canvasH,
      x1: 60, y1: 40, t: 0
    });
    playSound('coin');
    updateHeaderSaldo();
    updateLevel();
    if (m.slotTarget) { m.slotTarget.occupied = false; m.slotTarget.motorId = null; }
    m.arah = m.x < 0.5 ? 1 : -1;
    syncProgress(false);
    cekQuestProgress('cuci');
    cekStoryUnlock();
    // hapus langsung? Tidak, animasi pergi dulu
    // Tapi bug: motor yang sudah bayar harus dihapus dari array setelah animasi
  }
}

function spawnAirEffect(x, y) {
  for (var i = 0; i < 6; i++) {
    state.particles.push({
      x: x, y: y,
      vx: (Math.random() - 0.5) * 4,
      vy: -Math.random() * 4 - 1,
      size: Math.random() * 5 + 3,
      color: 'rgba(100,180,255,' + (Math.random() * 0.5 + 0.3) + ')',
      life: 1
    });
  }
}

function updateLevel() {
  while (state.exp >= state.expNext) {
    state.exp -= state.expNext;
    state.level++;
    state.expNext = Math.floor(state.expNext * 1.5);
    playSound('levelup');
    showToast('🎉 Level ' + state.level + '!', 'gold');
  }
  renderHeader();
}

function initCuaca() {
  gantiCuaca();
  state.cuacaInterval = setInterval(function() {
    gantiCuaca();
  }, (60 + Math.random() * 120) * 1000);
}

function gantiCuaca() {
  state.cuaca = state.cuaca === 'panas' ? 'hujan' : 'panas';
  updateHeaderSaldo();
  // Reset spawn interval
  if (state.spawnInterval) clearInterval(state.spawnInterval);
  var interval = state.cuaca === 'panas' ? 2000 : 6000;
  state.spawnInterval = setInterval(spawnMotor, interval);
  // Efek visual
  if (state.cuaca === 'hujan') {
    initHujan();
  }
}

function initHujan() {
  state.hujanDrops = [];
  for (var i = 0; i < 100; i++) {
    state.hujanDrops.push({
      x: Math.random() * canvasW,
      y: Math.random() * canvasH,
      speed: 5 + Math.random() * 8,
      len: 8 + Math.random() * 12
    });
  }
}

function renderCuaca() {
  cuacaCtx.clearRect(0, 0, canvasW, canvasH);
  if (state.cuaca === 'hujan') {
    cuacaCtx.strokeStyle = 'rgba(180,210,255,0.5)';
    cuacaCtx.lineWidth = 1.5;
    state.hujanDrops.forEach(function(d) {
      cuacaCtx.beginPath();
      cuacaCtx.moveTo(d.x, d.y);
      cuacaCtx.lineTo(d.x - 1, d.y + d.len);
      cuacaCtx.stroke();
      d.y += d.speed;
      if (d.y > canvasH) { d.y = -20; d.x = Math.random() * canvasW; }
    });
    // Ripple effect
    state.ripples.forEach(function(r) {
      cuacaCtx.strokeStyle = 'rgba(180,210,255,' + r.life + ')';
      cuacaCtx.beginPath();
      cuacaCtx.ellipse(r.x, r.y, r.radius, r.radius * 0.3, 0, 0, Math.PI * 2);
      cuacaCtx.stroke();
      r.radius += 0.5;
      r.life -= 0.02;
    });
    state.ripples = state.ripples.filter(function(r) { return r.life > 0; });
    if (Math.random() < 0.05) {
      state.ripples.push({ x: Math.random() * canvasW, y: 0.04 * canvasH + Math.random() * 0.2 * canvasH, radius: 2, life: 1 });
    }
  } else {
    // Panas: overlay kuning tipis
    cuacaCtx.fillStyle = 'rgba(255,220,100,0.08)';
    cuacaCtx.fillRect(0, 0, canvasW, canvasH);
  }
}

// ==================== GAME LOOP ====================
var lastTime = 0;
function gameLoop(timestamp) {
  if (!lastTime) lastTime = timestamp;
  var dt = Math.min((timestamp - lastTime) / 1000, 0.1);
  lastTime = timestamp;
  updateMotors(dt);
  renderGame();
  renderCuaca();
  requestAnimationFrame(gameLoop);
}

// ==================== PRODUKSI LOOP (HANYA SATU) ====================
function startProduksiLoop() {
  if (window.__produksiLoop) return;
  window.__produksiLoop = setInterval(function() {
    var total = getTotalProduksi();
    if (total > 0) {
      var prod = Math.min(total, MAX_KOIN_PER_DETIK);
      state.saldo.koin += prod;
      state._deltaKoin = (state._deltaKoin || 0) + prod;
      updateHeaderSaldo();
    }
  }, 1000);
}

      }, 800);
    }
    // Mulai spawn
    if (state.spawnInterval) clearInterval(state.spawnInterval);
    state.spawnInterval = setInterval(spawnMotor, state.cuaca === 'panas' ? 2000 : 6000);
    // Game loop
    requestAnimationFrame(gameLoop);
    // Auto sync
    state.syncInterval = setInterval(function() { syncProgress(false); }, 10000);
    // Quest badge
    renderTabQuestBadge();
    // Admin
    if (state.isAdmin) {
      var adminDiv = document.createElement('div');
      adminDiv.id = 'panelAdmin';
      document.getElementById('app').appendChild(adminDiv);
      initAdminPanel();
    }
  });
}

async function renderTabQuestBadge() {
  var res = await baca('Quests');
  if (res && res.ok && res.data) state.questsData = res.data;
  var klaimable = 0;
  state.questsData.forEach(function(q) {
    var prog = getQuestProgress(q);
    if (prog >= q.target && !state.questProgress[q.id + '_claimed']) klaimable++;
  });
  state._questKlaimable = klaimable;
  renderNav();
}

// ==================== ADMIN PANEL ====================
function initAdminPanel() {
  var panel = document.getElementById('panelAdmin');
  panel.classList.add('show');
  panel.innerHTML = '<div class="admin-header"><h2>🔧 Admin Panel</h2>' +
    '<button class="header-btn" id="adminClose" style="background:rgba(255,255,255,0.2);">✕</button></div>' +
    '<div class="admin-tabs" id="adminTabs"></div>' +
    '<div class="admin-body" id="adminBody">Pilih tab</div>';
  var tabs = ['Dashboard','Pemain','Detail Pemain','Topup','Voucher','Toko','Manajer','Cabang','Cerita','Quest','Config','Log'];
  var tabHtml = '';
  tabs.forEach(function(t, i) {
    tabHtml += '<button class="admin-tab' + (i===0?' active':'') + '" data-atab="' + t + '">' + t + '</button>';
  });
  document.getElementById('adminTabs').innerHTML = tabHtml;
  document.getElementById('adminTabs').querySelectorAll('.admin-tab').forEach(function(btn) {
    btn.onclick = function() {
      document.querySelectorAll('.admin-tab').forEach(function(b) { b.classList.remove('active'); });
      this.classList.add('active');
      loadAdminTab(this.dataset.atab);
    };
  });
  document.getElementById('adminClose').onclick = function() {
    panel.classList.remove('show');
    localStorage.removeItem('smp7k_admin');
    window.location.search = '';
  };
  loadAdminTab('Dashboard');
}

async function loadAdminTab(tab) {
  var body = document.getElementById('adminBody');
  body.innerHTML = '<div class="empty-state">Memuat...</div>';
  if (tab === 'Dashboard') {
    body.innerHTML = '<div class="row"><h3>📊 Dashboard</h3>' +
      '<p>Total Pemain: -</p><p>Total Topup: -</p><p>Total Voucher: -</p></div>';
  } else if (tab === 'Pemain') {
    var res = await baca('Users');
    if (res && res.ok && res.data) {
      var html = '<table><tr><th>Nama</th><th>HP</th><th>Koin</th><th>Level</th></tr>';
      res.data.forEach(function(u) {
        html += '<tr><td>' + (u.nama||'-') + '</td><td>' + (u.hp||'-') + '</td><td>' + formatKoin(u.koin||0) + '</td><td>' + (u.level||1) + '</td></tr>';
      });
      html += '</table>';
      body.innerHTML = html;
    } else { body.innerHTML = '<div class="empty-state">Gagal memuat</div>'; }
  } else {
    body.innerHTML = '<div class="empty-state">Fitur ' + tab + ' segera</div>';
  }
}

// ==================== START ====================
window.addEventListener('load', function() {
  init();
  // Fallback jika loadAllImages terlalu lama
  setTimeout(function() {
    if (!canvas) {
      initCanvas();
      renderHeader();
      renderNav();
      requestAnimationFrame(gameLoop);
    }
  }, 3000);
});

})();
</script>
