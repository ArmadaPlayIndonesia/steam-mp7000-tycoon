<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#C8102E">
  <title>Steam MP 7000 Tycoon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ============ RESET & GLOBAL ============ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    :root {
      --merah: #C8102E;
      --merah-gelap: #A00D25;
      --emas: #F59E0B;
      --emas-terang: #FBBF24;
      --putih: #FAFAFA;
      --abu: #F3F4F6;
      --abu-gelap: #6B7280;
      --hijau: #10B981;
      --biru: #3B82F6;
      --ungu: #8B5CF6;
      --header-h: 80px;
      --nav-h: 70px;
      --radius: 16px;
      --shadow: 0 4px 20px rgba(0,0,0,0.08);
      --shadow-lg: 0 10px 40px rgba(0,0,0,0.15);
    }

    html, body {
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #1a1a2e;
      color: #1F2937;
      overflow: hidden;
      width: 100%;
      height: 100%;
      position: fixed;
      overscroll-behavior: none;
    }

    /* ============ APP CONTAINER ============ */
    #app {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a1a2e;
    }

    /* ============ CANVAS GAME ============ */
    #gameCanvas {
      position: fixed;
      top: var(--header-h);
      bottom: var(--nav-h);
      left: 0;
      right: 0;
      z-index: 1;
      display: block;
      background: #87CEEB;
    }

    #cuacaCanvas {
      position: fixed;
      top: var(--header-h);
      bottom: var(--nav-h);
      left: 0;
      right: 0;
      z-index: 2;
      display: block;
      pointer-events: none;
    }

    /* ============ HEADER ============ */
    #appHeader {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--header-h);
      z-index: 100;
      background: linear-gradient(135deg, var(--merah) 0%, var(--merah-gelap) 100%);
      display: flex;
      align-items: center;
      padding: 0 10px;
      gap: 8px;
      box-shadow: 0 2px 15px rgba(200,16,46,0.4);
      color: white;
      overflow: hidden;
    }

    .header-logo {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--emas), var(--emas-terang));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 14px;
      color: var(--merah-gelap);
      flex-shrink: 0;
      box-shadow: 0 3px 10px rgba(0,0,0,0.2);
      border: 2px solid rgba(255,255,255,0.3);
    }

    .header-user {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .header-name {
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
    }

    .header-phone {
      font-size: 10px;
      opacity: 0.85;
      font-weight: 500;
      line-height: 1.2;
    }

    .header-level-row {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 2px;
    }

    .header-level-badge {
      font-size: 9px;
      font-weight: 700;
      background: var(--emas);
      color: var(--merah-gelap);
      padding: 1px 6px;
      border-radius: 20px;
      line-height: 1.4;
    }

    .header-progress {
      flex: 1;
      height: 6px;
      background: rgba(255,255,255,0.25);
      border-radius: 10px;
      overflow: hidden;
      max-width: 70px;
    }

    .header-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--emas), #FDE68A);
      border-radius: 10px;
      transition: width 0.5s ease;
      width: 0%;
    }

    .header-saldo {
      display: flex;
      flex-direction: column;
      gap: 2px;
      align-items: flex-end;
      flex-shrink: 0;
    }

    .saldo-item {
      display: flex;
      align-items: center;
      gap: 3px;
      font-size: 11px;
      font-weight: 700;
      background: rgba(0,0,0,0.2);
      padding: 1px 7px;
      border-radius: 20px;
      line-height: 1.5;
      backdrop-filter: blur(4px);
    }

    .saldo-item img {
      width: 14px;
      height: 14px;
      object-fit: contain;
    }

    .saldo-item .emoji-icon {
      font-size: 13px;
      line-height: 1;
    }

    .header-actions {
      display: flex;
      flex-direction: column;
      gap: 3px;
      flex-shrink: 0;
    }

    .header-btn {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      backdrop-filter: blur(4px);
    }

    .header-btn:active {
      transform: scale(0.9);
      background: rgba(255,255,255,0.35);
    }

    .header-cuaca {
      font-size: 18px;
      line-height: 1;
      padding: 2px;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
    }

    /* ============ BOTTOM NAV ============ */
    #bottomNav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: var(--nav-h);
      z-index: 100;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 2px;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.08);
      border-top: 1px solid rgba(0,0,0,0.05);
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
    }

    #bottomNav::-webkit-scrollbar { display: none; }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      min-width: 56px;
      padding: 6px 2px;
      border: none;
      background: transparent;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
      flex-shrink: 0;
      border-radius: 12px;
    }

    .nav-item:active {
      transform: scale(0.92);
    }

    .nav-item .nav-icon {
      font-size: 22px;
      line-height: 1;
      position: relative;
    }

    .nav-item .nav-label {
      font-size: 9px;
      font-weight: 600;
      color: var(--abu-gelap);
      white-space: nowrap;
    }

    .nav-item.active .nav-label {
      color: var(--merah);
    }

    .nav-item.active .nav-icon {
      transform: scale(1.15);
    }

    .nav-badge {
      position: absolute;
      top: -2px;
      right: -4px;
      background: var(--merah);
      color: white;
      font-size: 8px;
      font-weight: 700;
      min-width: 16px;
      height: 16px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
      box-shadow: 0 2px 6px rgba(200,16,46,0.5);
      animation: badgePulse 1.5s ease-in-out infinite;
    }

    @keyframes badgePulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    /* ============ PANEL SLIDE UP ============ */
    #panelSlide {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-height: 70vh;
      background: white;
      border-radius: 24px 24px 0 0;
      box-shadow: 0 -10px 40px rgba(0,0,0,0.2);
      z-index: 150;
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding-bottom: 80px;
    }

    #panelSlide.open {
      transform: translateY(0);
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px 12px;
      border-bottom: 1px solid var(--abu);
      flex-shrink: 0;
    }

    .panel-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--merah);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .panel-close {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--abu);
      border: none;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--abu-gelap);
      transition: all 0.2s;
    }

    .panel-close:active {
      transform: scale(0.9);
      background: #E5E7EB;
    }

    .panel-body {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 12px 16px;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }

    .panel-body::-webkit-scrollbar {
      width: 4px;
    }

    .panel-body::-webkit-scrollbar-thumb {
      background: var(--merah);
      border-radius: 10px;
    }

    /* ============ LIST ITEM (PANEL) ============ */
    .list-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      background: var(--putih);
      border-radius: 14px;
      margin-bottom: 8px;
      transition: all 0.2s;
      cursor: pointer;
      border: 1px solid transparent;
    }

    .list-item:active {
      background: #FEF2F2;
      transform: scale(0.98);
    }

    .list-item-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, #FEF3C7, #FDE68A);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .list-item-content {
      flex: 1;
      min-width: 0;
    }

    .list-item-title {
      font-size: 14px;
      font-weight: 700;
      color: #1F2937;
      margin-bottom: 2px;
    }

    .list-item-desc {
      font-size: 11px;
      color: var(--abu-gelap);
      line-height: 1.4;
    }

    .list-item-action {
      flex-shrink: 0;
    }

    .btn-sm {
      padding: 8px 16px;
      border-radius: 10px;
      border: none;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .btn-merah {
      background: var(--merah);
      color: white;
      box-shadow: 0 2px 8px rgba(200,16,46,0.3);
    }

    .btn-merah:active { transform: scale(0.95); }

    .btn-merah:disabled {
      background: #D1D5DB;
      box-shadow: none;
      cursor: not-allowed;
    }

    .btn-emas {
      background: linear-gradient(135deg, var(--emas), var(--emas-terang));
      color: var(--merah-gelap);
      box-shadow: 0 2px 8px rgba(245,158,11,0.3);
    }

    .btn-emas:active { transform: scale(0.95); }

    .btn-emas:disabled {
      background: #D1D5DB;
      color: #9CA3AF;
      box-shadow: none;
      cursor: not-allowed;
    }

    .btn-hijau {
      background: var(--hijau);
      color: white;
    }

    .btn-hijau:active { transform: scale(0.95); }

    .btn-outline {
      background: transparent;
      border: 1.5px solid var(--merah);
      color: var(--merah);
    }

    .btn-outline:active {
      background: #FEF2F2;
      transform: scale(0.95);
    }

    /* ============ UPGRADE CARD ============ */
    .upgrade-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      background: var(--putih);
      border-radius: 16px;
      margin-bottom: 10px;
      border: 1px solid #E5E7EB;
      transition: all 0.3s;
    }

    .upgrade-card.maxed {
      border-color: var(--emas);
      background: linear-gradient(135deg, #FFFBEB, #FEF3C7);
    }

    .upgrade-icon {
      width: 50px;
      height: 50px;
      border-radius: 14px;
      background: linear-gradient(135deg, #DBEAFE, #BFDBFE);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
    }

    .upgrade-info {
      flex: 1;
      min-width: 0;
    }

    .upgrade-name {
      font-size: 14px;
      font-weight: 700;
      color: #1F2937;
    }

    .upgrade-stats {
      display: flex;
      gap: 10px;
      margin-top: 3px;
      font-size: 11px;
      color: var(--abu-gelap);
    }

    .upgrade-stats span {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .upgrade-level {
      font-weight: 700;
      color: var(--merah);
      font-size: 12px;
      margin-top: 2px;
    }

    /* ============ TAB / SECTION ============ */
    .section-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--merah);
      margin: 16px 0 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title:first-child { margin-top: 0; }

    /* ============ TOAST ============ */
    #toastBox {
      position: fixed;
      top: 90px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
      pointer-events: none;
      width: 90%;
      max-width: 400px;
    }

    .toast {
      background: rgba(31, 41, 55, 0.95);
      color: white;
      padding: 12px 20px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 8px 30px rgba(0,0,0,0.3);
      animation: toastIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: 100%;
      text-align: center;
    }

    .toast.success { background: rgba(16, 185, 129, 0.95); }
    .toast.error { background: rgba(200, 16, 46, 0.95); }
    .toast.info { background: rgba(59, 130, 246, 0.95); }
    .toast.warning { background: rgba(245, 158, 11, 0.95); }

    @keyframes toastIn {
      from { opacity: 0; transform: translateY(-20px) scale(0.9); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ============ MODAL ============ */
    #modalOverlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      backdrop-filter: blur(4px);
    }

    #modalOverlay.open {
      display: flex;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-box {
      background: white;
      border-radius: 24px;
      padding: 24px;
      max-width: 400px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      animation: modalIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.85) translateY(20px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* ============ MODAL CERITA ============ */
    #modalCerita {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 300;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      backdrop-filter: blur(6px);
    }

    #modalCerita.open {
      display: flex;
      animation: fadeIn 0.4s ease;
    }

    .cerita-box {
      background: linear-gradient(135deg, #FFFDF5, #FFF8E7);
      border: 3px solid var(--emas);
      border-radius: 24px;
      padding: 28px 24px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(245,158,11,0.3);
      animation: modalIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      text-align: center;
      position: relative;
    }

    .cerita-box::before {
      content: '✨';
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 24px;
      animation: sparkle 2s ease-in-out infinite;
    }

    @keyframes sparkle {
      0%, 100% { transform: translateX(-50%) scale(1) rotate(0deg); }
      50% { transform: translateX(-50%) scale(1.2) rotate(15deg); }
    }

    .cerita-img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--emas);
      margin-bottom: 14px;
      box-shadow: 0 4px 15px rgba(245,158,11,0.3);
      background: #FFF8E7;
    }

    .cerita-judul {
      font-size: 18px;
      font-weight: 800;
      color: var(--merah);
      margin-bottom: 12px;
    }

    .cerita-teks {
      font-size: 13px;
      line-height: 1.7;
      color: #374151;
      margin-bottom: 20px;
      text-align: left;
      white-space: pre-line;
    }

    .cerita-btn {
      background: linear-gradient(135deg, var(--merah), var(--merah-gelap));
      color: white;
      border: none;
      padding: 14px 40px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      box-shadow: 0 4px 15px rgba(200,16,46,0.4);
      transition: all 0.2s;
    }

    .cerita-btn:active {
      transform: scale(0.95);
    }

    /* ============ LOADING ============ */
    #loadingOverlay {
      position: fixed;
      inset: 0;
      background: rgba(255,255,255,0.95);
      z-index: 500;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    #loadingOverlay.open {
      display: flex;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid var(--abu);
      border-top-color: var(--merah);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 14px;
      font-weight: 600;
      color: var(--merah);
    }

    /* ============ ADMIN PANEL ============ */
    #panelAdmin {
      position: fixed;
      inset: 0;
      background: white;
      z-index: 1000;
      display: none;
      flex-direction: column;
      overflow: hidden;
    }

    #panelAdmin.open {
      display: flex;
    }

    .admin-header {
      background: linear-gradient(135deg, var(--merah), var(--merah-gelap));
      color: white;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 15px rgba(200,16,46,0.4);
    }

    .admin-header h1 {
      font-size: 18px;
      font-weight: 800;
    }

    .admin-tabs {
      display: flex;
      overflow-x: auto;
      background: var(--abu);
      padding: 8px;
      gap: 6px;
      scrollbar-width: none;
      flex-shrink: 0;
    }

    .admin-tabs::-webkit-scrollbar { display: none; }

    .admin-tab {
      padding: 8px 16px;
      border-radius: 10px;
      border: none;
      background: white;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      font-family: inherit;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .admin-tab.active {
      background: var(--merah);
      color: white;
      box-shadow: 0 2px 8px rgba(200,16,46,0.3);
    }

    .admin-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      background: var(--putih);
    }

    .admin-card {
      background: white;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
    }

    .admin-stat-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .admin-stat {
      background: white;
      border-radius: 14px;
      padding: 16px;
      box-shadow: var(--shadow);
      text-align: center;
    }

    .admin-stat-value {
      font-size: 22px;
      font-weight: 800;
      color: var(--merah);
    }

    .admin-stat-label {
      font-size: 11px;
      color: var(--abu-gelap);
      margin-top: 4px;
      font-weight: 600;
    }

    .admin-input {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #E5E7EB;
      border-radius: 10px;
      font-size: 13px;
      font-family: inherit;
      margin-bottom: 8px;
      transition: border-color 0.2s;
    }

    .admin-input:focus {
      outline: none;
      border-color: var(--merah);
    }

    .admin-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
    }

    .admin-table th {
      text-align: left;
      padding: 8px 6px;
      background: var(--abu);
      font-weight: 700;
      color: var(--abu-gelap);
      position: sticky;
      top: 0;
    }

    .admin-table td {
      padding: 8px 6px;
      border-bottom: 1px solid #F3F4F6;
    }

    .admin-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 700;
    }

    .admin-badge.pending { background: #FEF3C7; color: #92400E; }
    .admin-badge.approved { background: #D1FAE5; color: #065F46; }
    .admin-badge.rejected { background: #FEE2E2; color: #991B1B; }
    .admin-badge.aktif { background: #D1FAE5; color: #065F46; }
    .admin-badge.terpakai { background: #E5E7EB; color: #6B7280; }

    /* ============ RIPPLE ============ */
    .ripple {
      position: relative;
      overflow: hidden;
    }

    .ripple::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle, rgba(255,255,255,0.5) 10%, transparent 10.01%);
      background-position: center;
      background-repeat: no-repeat;
      transform: scale(10);
      opacity: 0;
      transition: transform 0.5s, opacity 0.8s;
      pointer-events: none;
    }

    .ripple:active::after {
      transform: scale(0);
      opacity: 0.3;
      transition: 0s;
    }

    /* ============ GLOW BUTTON ============ */
    .glow {
      animation: glowAnim 2s ease-in-out infinite;
    }

    @keyframes glowAnim {
      0%, 100% { box-shadow: 0 0 5px rgba(245,158,11,0.5), 0 0 15px rgba(245,158,11,0.3); }
      50% { box-shadow: 0 0 15px rgba(245,158,11,0.8), 0 0 30px rgba(245,158,11,0.5); }
    }

    /* ============ RESPONSIVE ============ */
    @media (max-width: 360px) {
      .header-saldo .saldo-item { font-size: 9px; padding: 1px 5px; }
      .saldo-item img { width: 11px; height: 11px; }
      .nav-item .nav-label { font-size: 8px; }
      .nav-item { min-width: 48px; }
    }

    @media (min-width: 500px) {
      #app { max-width: 500px; margin: 0 auto; box-shadow: 0 0 50px rgba(0,0,0,0.3); }
      #appHeader, #bottomNav { max-width: 500px; left: 50%; transform: translateX(-50%); }
      #gameCanvas, #cuacaCanvas { max-width: 500px; left: 50%; transform: translateX(-50%); }
      #panelSlide { max-width: 500px; left: 50%; transform: translateX(-50%) translateY(100%); }
      #panelSlide.open { transform: translateX(-50%) translateY(0); }
    }

    /* ============ SCROLLBAR HIDE ============ */
    .hide-scroll::-webkit-scrollbar { display: none; }
    .hide-scroll { scrollbar-width: none; }

    /* ============ EMPTY STATE ============ */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--abu-gelap);
    }

    .empty-state .emoji {
      font-size: 48px;
      margin-bottom: 12px;
      display: block;
    }

    .empty-state p {
      font-size: 13px;
      line-height: 1.5;
    }

    /* ============ PROGRESS BAR ============ */
    .progress-bar {
      height: 8px;
      background: var(--abu);
      border-radius: 10px;
      overflow: hidden;
      margin-top: 6px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--merah), var(--emas));
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    /* ============ COIN FLY ANIMATION ============ */
    .coin-fly {
      position: fixed;
      z-index: 500;
      pointer-events: none;
      font-size: 20px;
      animation: coinFly 0.8s ease-out forwards;
    }

    @keyframes coinFly {
      0% { opacity: 1; transform: translate(0, 0) scale(1); }
      100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.3); }
    }
  </style>

<script>
(function() {

  // ============================================================

  function log() {

  function formatRupiah(n) {
    if (typeof n !== 'number') n = 0;

  }

  function formatAngka(n) {
    if (typeof n !== 'number') n = 0;
    n = Math.floor(n);
    if (n >= 1e12) return (n / 1e12).toFixed(1) + 'T';
    if (n >= 1e9) return (n / 1e9).toFixed(1) + 'M';
    if (n >= 1e6) return (n / 1e6).toFixed(1) + 'jt';
    if (n >= 1e3) return (n / 1e3).toFixed(1) + 'rb';
    return n.toString();
  }

  function sensorHP(hp) {

    return hp.substring(0, 4) + '****' + hp.substring(hp.length - 4);

  }

  function showLoading(text) {

  function showToast(msg, tipe) {
    var box = document.getElementById('toastBox');
    var el = document.createElement('div');
    el.className = 'toast ' + (tipe || 'info');
    var icons = { success: '✅', error: '❌', info: 'ℹ️', warning: '⚠️' };
    el.innerHTML = '<span>' + (icons[tipe] || 'ℹ️') + '</span><span>' + msg + '</span>';

    setTimeout(function() {

    }, 2500);
  }

  // ============================================================
  // ============ FETCH DENGAN TIMEOUT ============
  // ============================================================
  function fetchTimeout(url, options, ms) {
    return Promise.race([
      fetch(url, options),
      new Promise(function(_, reject) {
        setTimeout(function() { reject(new Error('Timeout')); }, ms || TIMEOUT_MS);
      })
    ]);
  }

  function callBackend(action, params) {
    var body = { action: action, token: TOKEN };
    if (params) {
      for (var k in params) {
        if (params.hasOwnProperty(k)) body[k] = params[k];
      }
    }
    log('callBackend:', action, params);
    return fetchTimeout(BACKEND_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(body),
      redirect: 'follow'
    }).then(function(r) { return r.text(); })
      .then(function(t) {
        try { return JSON.parse(t); }
        catch(e) { return { ok: false, pesan: 'Respons tidak valid' }; }
      })
      .catch(function(e) {
        if (e.message === 'Timeout') {
          return { ok: false, pesan: 'Server tidak merespons, coba lagi' };
        }
        return { ok: false, pesan: 'Gagal terhubung ke server' };
      });
  }

  // ============================================================
  // ============ SESSION & REDIRECT ============
  // ============================================================
  function redirectKeIndex() {
    if (window.__redirecting) return;
    window.__redirecting = true;

    try { window.location.replace('index.html'); } catch(e) {}

  function cekSession() {
    var raw = null;
    try { raw = localStorage.getItem('smp7k_session'); } catch(e) {}
    if (!raw) {
      log('Session tidak ditemukan');
      return false;
    }
    try {
      session = JSON.parse(raw);
    } catch(e) {
      log('Session rusak');
      return false;
    }
    if (!session || !session.token || !session.user_id) {
      log('Session tidak lengkap');
      return false;
    }
    if (session.expires_at && waktuSekarang() > Number(session.expires_at)) {
      log('Session expired');
      try { localStorage.removeItem('smp7k_session'); } catch(e) {}
      return false;
    }
    log('Session valid:', session.user_id);
    return true;
  }

  // ============================================================
  // ============ BACKGROUND REMOVER ============
  // ============================================================
  function hilangkanBackgroundPutih(imgSrc, toleransi, callback) {
    var img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = function() {
      var c = document.createElement('canvas');
      c.width = img.width;
      c.height = img.height;
      var cx = c.getContext('2d');
      cx.drawImage(img, 0, 0);
      try {
        var imageData = cx.getImageData(0, 0, c.width, c.height);
        var data = imageData.data;
        var tol = toleransi || 40;
        for (var i = 0; i < data.length; i += 4) {
          if (data[i] > 255 - tol && data[i+1] > 255 - tol && data[i+2] > 255 - tol) {
            data[i+3] = 0;
          }
        }
        cx.putImageData(imageData, 0, 0);
        callback(c.toDataURL('image/png'));
      } catch(e) {
        callback(imgSrc);
      }
    };
    img.onerror = function() { callback(null); };
    img.src = imgSrc;
  }

  function loadImage(src, toleransi, key) {
    return new Promise(function(resolve) {
      if (imageCache[key]) { resolve(imageCache[key]); return; }
      if (toleransi > 0) {
        hilangkanBackgroundPutih(src, toleransi, function(result) {
          if (result) {
            var img = new Image();
            img.onload = function() {
              imageCache[key] = img;
              resolve(img);
            };
            img.onerror = function() { resolve(null); };
            img.src = result;
          } else {
            resolve(null);
          }
        });
      } else {
        var img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = function() {
          imageCache[key] = img;
          resolve(img);
        };
        img.onerror = function() { resolve(null); };
        img.src = src;
      }
    });
  }

  async function loadSemuaGambar() {
    log('Memuat gambar...');
    var tasks = [
      loadImage('assets/steam-bg.png', 0, 'bg'),

      loadImage('assets/motor-bebek-kotor.png', 40, 'bebekKotor'),
      loadImage('assets/motor-bebek-bersih.png', 40, 'bebekBersih'),

    ];
    var results = await Promise.all(tasks);
    bgImage = results[0];
    log('Gambar selesai dimuat');
    return results;

  // ============================================================
  // ============ AUDIO ============
  // ============================================================
  function initAudio() {
    if (!audioCtx) {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      } catch(e) { audioCtx = null; }
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume().catch(function(){});
    }
  }

  function playSuaraTap() {
    if (!audioCtx) return;
    try {
      var bufferSize = audioCtx.sampleRate * 0.1;
      var buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      var data = buffer.getChannelData(0);
      for (var i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2);
      }
      var source = audioCtx.createBufferSource();
      source.buffer = buffer;
      var gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
      source.connect(gain);
      gain.connect(audioCtx.destination);
      source.start();
    } catch(e) {}
  }

  function playSuaraKoin() {
    if (!audioCtx) return;
    try {
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(800, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.08);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.25);
    } catch(e) {}
  }

  function playSuaraLevelUp() {
    if (!audioCtx) return;
    try {
      var notes = [523, 659, 784];
      notes.forEach(function(freq, i) {
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0, audioCtx.currentTime + i * 0.1);
        gain.gain.linearRampToValueAtTime(0.15, audioCtx.currentTime + i * 0.1 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.1 + 0.3);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + i * 0.1);
        osc.stop(audioCtx.currentTime + i * 0.1 + 0.3);
      });
    } catch(e) {}
  }

  function playSuaraError() {
    if (!audioCtx) return;
    try {
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(200, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.2);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.2);
    } catch(e) {}
  }

  function initMusik() {
    try {
      musikMuted = localStorage.getItem('smp7k_music') === 'off';
    } catch(e) { musikMuted = false; }
    musikLatar = new Audio('assets/musik-latar.mp3');

      }
    }
    renderHeader();
    showToast(musikMuted ? 'Musik dimatikan' : 'Musik dinyalakan', 'info');

  // ============================================================
  // ============ CANVAS SETUP ============
  // ============================================================
  function setupCanvas() {
    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d');
    cuacaCanvas = document.getElementById('cuacaCanvas');
    cuacaCtx = cuacaCanvas.getContext('2d');
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('orientationchange', function() {
      setTimeout(resizeCanvas, 300);
    });
  }

  function resizeCanvas() {
    var rect = canvas.getBoundingClientRect();
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvasW = rect.width;
    canvasH = rect.height;
    canvas.width = canvasW * dpr;
    canvas.height = canvasH * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    cuacaCanvas.width = canvasW * dpr;
    cuacaCanvas.height = canvasH * dpr;
    cuacaCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

    initParkiranSlots();
    log('Canvas resized:', canvasW, 'x', canvasH);
  }

  // ============================================================
  // ============ PARKIRAN SLOTS ============
  // ============================================================
  function initParkiranSlots() {
    parkiranSlots = [];
    var barisY = [0.42, 0.52, 0.62];
    var kolomX = [0.10, 0.24, 0.38, 0.52, 0.66, 0.80];
    for (var r = 0; r < 3; r++) {
      for (var c = 0; c < 6; c++) {
        parkiranSlots.push({
          id: r * 6 + c,
          x: kolomX[c] * canvasW,
          y: barisY[r] * canvasH,
          terisi: false,
          motorId: null
        });
      }
    }
  }

  function cariSlotKosongTerdekat(dariX) {
    var terbaik = null;
    var jarakTerbaik = Infinity;
    for (var i = 0; i < parkiranSlots.length; i++) {
      var slot = parkiranSlots[i];
      if (!slot.terisi) {
        var jarak = Math.abs(slot.x - dariX);
        if (jarak < jarakTerbaik) {
          jarakTerbaik = jarak;
          terbaik = slot;
        }
      }
    }
    return terbaik;
  }

  function hitungSlotTerisi() {
    var n = 0;
    for (var i = 0; i < parkiranSlots.length; i++) {
      if (parkiranSlots[i].terisi) n++;
    }
    return n;
  }

  // ============================================================
  // ============ MOTOR SPAWN ====================================
  // ============================================================
  function spawnMotor() {
    var terisi = hitungSlotTerisi();
    var parkiranPenuh = terisi >= 18;
    var akanMasuk = !parkiranPenuh && Math.random() < 0.4;

    var level = 1;
    if (akanMasuk && Math.random() < 1/8) {
      level = 2; // Moge VIP
    }

    var dariKiri = Math.random() < 0.5;
    var yJalan = canvasH * 0.06;

    var motor = {
      id: ++motorIdCounter,
      x: dariKiri ? -100 : canvasW + 100,
      y: yJalan,
      arah: dariKiri ? 'kiri-ke-kanan' : 'kanan-ke-kiri',
      state: akanMasuk ? 'masuk' : 'lewat',
      level: level,
      kotor: true,
      tapCount: 0,
      waktuMasuk: waktuSekarang(),
      isMoge: level === 2,
      sudahNontonIklan: false,
      slotTarget: null,
      rotasi: 0,
      animasiMasuk: akanMasuk ? 0 : -1,
      animasiMasukStart: akanMasuk ? waktuSekarang() : 0,
      mulaiX: akanMasuk ? (dariKiri ? -100 : canvasW + 100) : 0,
      targetX: 0,
      targetY: 0,
      kecepatan: 80 + Math.random() * 60,
      emojiTimer: false,
      kabur: false,
      waktuKabur: 0,
      bayar: 0,
      kilauPhase: Math.random() * Math.PI * 2
    };

    if (akanMasuk) {
      var slot = cariSlotKosongTerdekat(motor.x);
      if (slot) {
        slot.terisi = true;
        slot.motorId = motor.id;
        motor.slotTarget = slot.id;
        motor.targetX = slot.x;
        motor.targetY = slot.y;
        motor.mulaiX = motor.x;
        motor.mulaiY = motor.y;
        log('Motor parkir: slot ' + slot.id, 'level', level);
      } else {
        motor.state = 'lewat';
        motor.animasiMasuk = -1;
      }
    }

    if (motor.isMoge) {
      motor.bayar = 500;
    } else {
      motor.bayar = 1;
    }

    motors.push(motor);
    log('Motor spawn: level ' + level, motor.state);

    if (motor.isMoge) {
      showToast('🏍️ Moge VIP datang!', 'warning');
    }
  }

  // ============================================================
  // ============ UPDATE MOTOR ====================================
  // ============================================================
  function updateMotors(dt) {
    var now = waktuSekarang();

    for (var i = motors.length - 1; i >= 0; i--) {
      var m = motors[i];

      // LEwat
      if (m.state === 'lewat') {
        if (m.arah === 'kiri-ke-kanan') {
          m.x += m.kecepatan * dt;
        } else {
          m.x -= m.kecepatan * dt;
        }
        if (m.x > canvasW + 120 || m.x < -120) {
          motors.splice(i, 1);
        }
        continue;
      }

      // Masuk parkiran (animasi 1.5 detik)
      if (m.state === 'masuk') {
        var elapsed = (now - m.animasiMasukStart) / 1000;
        var t = Math.min(elapsed / 1.5, 1);
        // Ease out
        var ease = 1 - Math.pow(1 - t, 3);
        m.x = m.mulaiX + (m.targetX - m.mulaiX) * ease;
        m.y = m.mulaiY + (m.targetY - m.mulaiY) * ease;
        m.rotasi = 180 * ease;

        if (t >= 1) {
          m.state = 'parkir';
          m.waktuMasuk = now;
          m.rotasi = 180;
        }
        continue;
      }

      // Parkir
      if (m.state === 'parkir') {
        var tunggu = (now - m.waktuMasuk) / 1000;

        // Emoji marah setelah 5 detik
        if (tunggu >= 5 && !m.emojiTimer) {
          m.emojiTimer = true;
        }

        // Kabur setelah 8 detik
        if (tunggu >= 8 && !m.kabur) {
          m.kabur = true;
          m.waktuKabur = now;
          // Kosongkan slot
          if (m.slotTarget !== null && parkiranSlots[m.slotTarget]) {
            parkiranSlots[m.slotTarget].terisi = false;
            parkiranSlots[m.slotTarget].motorId = null;
          }
          // Motor kabur
          m.state = 'pergi';
          m.arah = Math.random() < 0.5 ? 'kiri-ke-kanan' : 'kanan-ke-kiri';
          m.x = m.targetX;
          m.y = m.targetY;
          showToast('💨 Pelanggan kabur!', 'warning');
          log('Motor kabur: slot ' + m.slotTarget);
        }
        continue;
      }

      // Dicuci (setelah tap cukup)
      if (m.state === 'dicuci') {
        // Animasi koin terbang sudah ditangani terpisah
        // Motor pergi setelah selesai
        m.state = 'pergi';
        m.arah = Math.random() < 0.5 ? 'kiri-ke-kanan' : 'kanan-ke-kiri';
        continue;
      }

      // Pergi
      if (m.state === 'pergi') {
        // Naik ke jalan dulu
        if (m.y > canvasH * 0.06) {
          m.y -= 200 * dt;
          m.rotasi = Math.max(0, m.rotasi - 180 * dt);
          if (m.y < canvasH * 0.06) m.y = canvasH * 0.06;
        } else {
          // Jalan horizontal
          if (m.arah === 'kiri-ke-kanan') {
            m.x += m.kecepatan * 1.5 * dt;
          } else {
            m.x -= m.kecepatan * 1.5 * dt;
          }
          m.rotasi = 0;
        }
        if (m.x > canvasW + 150 || m.x < -150) {
          motors.splice(i, 1);
        }
        continue;
      }
    }
  }

  // ============================================================
  // ============ TAP MOTOR =====================================
  // ============================================================
  function cekTapMotor(tapX, tapY) {
    // Prioritaskan motor parkir (dari atas ke bawah)
    for (var i = motors.length - 1; i >= 0; i--) {
      var m = motors[i];
      if (m.state !== 'parkir') continue;

      var ukuranW = m.isMoge ? 70 : 60;
      var ukuranH = m.isMoge ? 90 : 80;
      var halfW = ukuranW / 2;
      var halfH = ukuranH / 2;

      if (tapX >= m.x - halfW && tapX <= m.x + halfW &&
          tapY >= m.y - halfH && tapY <= m.y + halfH) {
        return m;
      }
    }
    return null;
  }

  function prosesTapMotor(motor) {
    if (!motor || motor.state !== 'parkir') return;
    if (motor.kabur) return;

    // Moge VIP: wajib nonton iklan dulu
    if (motor.isMoge && !motor.sudahNontonIklan) {
      tampilModalIklanMoge(motor);
      return;
    }

    motor.tapCount++;
    totalTap++;

    // Partikel air
    spawnPartikelAir(motor.x, motor.y);
    playSuaraTap();

    // Cek apakah sudah bersih
    var tapDibutuhkan = motor.isMoge ? 5 : 1;
    if (motor.tapCount >= tapDibutuhkan) {
      motor.kotor = false;
      bersihkanMotor(motor);
    } else {
      // Setengah bersih
      if (motor.tapCount >= Math.floor(tapDibutuhkan / 2)) {
        motor.setengahBersih = true;
      }
    }
  }

  function bersihkanMotor(motor) {
    // Tambah koin
    var bayar = motor.bayar;
    saldo.koin += bayar;
    deltaKoin += bayar;
    totalKoinPernah += bayar;
    totalMotorDicuci++;
    if (motor.isMoge) totalMogeDicuci++;

    log('Motor bersih, +' + bayar + ' koin');

    // Animasi koin terbang
    spawnKoinTerbang(motor.x, motor.y, bayar);
    playSuaraKoin();

    // Quest tracking
    trackQuestProgress('cuci_motor', 1);
    if (motor.isMoge) trackQuestProgress('cuci_moge', 1);
    trackQuestProgress('tap', totalTap);

    // Motor pergi
    motor.state = 'pergi';
    motor.arah = Math.random() < 0.5 ? 'kiri-ke-kanan' : 'kanan-ke-kiri';

    // Kosongkan slot
    if (motor.slotTarget !== null && parkiranSlots[motor.slotTarget]) {
      parkiranSlots[motor.slotTarget].terisi = false;
      parkiranSlots[motor.slotTarget].motorId = null;
    }

    // Update header
    renderHeader();
    cekStoryUnlock();
    cekQuestBadge();
  }

  // ============================================================
  // ============ PARTIKEL =======================================
  // ============================================================
  function spawnPartikelAir(x, y) {
    for (var i = 0; i < 6; i++) {
      var angle = Math.random() * Math.PI * 2;
      var speed = 30 + Math.random() * 60;
      partikel.push({
        x: x,
        y: y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        size: 5 + Math.random() * 5,
        life: 1,
        maxLife: 0.5
      });
    }
  }

  function updatePartikel(dt) {
    for (var i = partikel.length - 1; i >= 0; i--) {
      var p = partikel[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= dt / p.maxLife;
      if (p.life <= 0) partikel.splice(i, 1);
    }
  }

  function spawnKoinTerbang(x, y, jumlah) {
    koinTerbang.push({
      x: x,
      y: y,
      jumlah: jumlah,
      life: 1,
      maxLife: 0.8,
      offsetY: 0
    });
  }

  function updateKoinTerbang(dt) {
    for (var i = koinTerbang.length - 1; i >= 0; i--) {
      var k = koinTerbang[i];
      k.offsetY -= 40 * dt;
      k.life -= dt / k.maxLife;
      if (k.life <= 0) koinTerbang.splice(i, 1);
    }
  }

  // ============================================================
  // ============ RENDER GAME ====================================
  // ============================================================
  function renderGame() {
    if (!ctx || !canvasW) return;

    ctx.clearRect(0, 0, canvasW, canvasH);

    // Background
    if (bgImage) {
      ctx.drawImage(bgImage, 0, 0, canvasW, canvasH);
    } else {
      // Fallback gradient
      var grad = ctx.createLinearGradient(0, 0, 0, canvasH);
      grad.addColorStop(0, '#87CEEB');
      grad.addColorStop(0.3, '#90EE90');
      grad.addColorStop(1, '#8B7355');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvasW, canvasH);
    }

    // Gambar jalan raya
    ctx.fillStyle = 'rgba(60,60,60,0.5)';
    ctx.fillRect(0, 0, canvasW, canvasH * 0.12);
    // Marka jalan
    ctx.strokeStyle = 'rgba(255,255,0,0.6)';
    ctx.lineWidth = 2;
    ctx.setLineDash([15, 15]);
    ctx.beginPath();
    ctx.moveTo(0, canvasH * 0.06);
    ctx.lineTo(canvasW, canvasH * 0.06);
    ctx.stroke();
    ctx.setLineDash([]);

    // Grid parkiran (garis tipis)
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 1;
    for (var i = 0; i < parkiranSlots.length; i++) {
      var slot = parkiranSlots[i];
      var w = 60, h = 80;
      ctx.strokeRect(slot.x - w/2, slot.y - h/2, w, h);
    }

    // Render motor
    for (var j = 0; j < motors.length; j++) {
      var m = motors[j];
      renderMotor(ctx, m);
    }

    // Partikel air
    for (var k = 0; k < partikel.length; k++) {
      var p = partikel[k];
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(135, 206, 250, ' + (p.life * 0.8) + ')';
      ctx.fill();
    }

    // Koin terbang
    for (var l = 0; l < koinTerbang.length; l++) {
      var kf = koinTerbang[l];
      ctx.save();
      ctx.globalAlpha = kf.life;
      ctx.font = 'bold 16px Poppins, sans-serif';
      ctx.fillStyle = '#F59E0B';
      ctx.textAlign = 'center';
      ctx.fillText('+' + kf.jumlah, kf.x, kf.y + kf.offsetY);
      ctx.restore();
    }

    // Render cuaca overlay
    renderCuaca();
  }

  function renderMotor(c, m) {
    var img = null;
    var ukuranW, ukuranH;

    if (m.isMoge) {
      img = m.kotor ? imageCache['mogeKotor'] : imageCache['mogeBersih'];
      ukuranW = 70;
      ukuranH = 90;
    } else {
      img = m.kotor ? imageCache['bebekKotor'] : imageCache['bebekBersih'];
      ukuranW = 60;
      ukuranH = 80;
    }

    // Di jalan, ukuran lebih kecil
    if (m.state === 'lewat' || m.state === 'pergi') {
      ukuranW = 50;
      ukuranH = 70;
    }

    c.save();
    c.translate(m.x, m.y);
    c.rotate((m.rotasi || 0) * Math.PI / 180);

    // Kilau emas untuk Moge
    if (m.isMoge) {
      var phase = waktuSekarang() / 500 + m.kilauPhase;
      var glowSize = 50 + Math.sin(phase) * 10;
      var glowGrad = c.createRadialGradient(0, 0, 5, 0, 0, glowSize);
      glowGrad.addColorStop(0, m.kotor ? 'rgba(245,158,11,0.4)' : 'rgba(255,215,0,0.7)');
      glowGrad.addColorStop(1, 'rgba(245,158,11,0)');
      c.fillStyle = glowGrad;
      c.beginPath();
      c.arc(0, 0, glowSize, 0, Math.PI * 2);
      c.fill();

      // Sparkle
      if (m.kotor || !m.kotor) {
        c.font = '12px sans-serif';
        c.fillText('✨', 20 * Math.cos(phase), 20 * Math.sin(phase));
      }
    }

    if (img) {
      c.drawImage(img, -ukuranW/2, -ukuranH/2, ukuranW, ukuranH);
    } else {
      // Fallback emoji
      c.font = (ukuranW * 0.8) + 'px sans-serif';
      c.textAlign = 'center';
      c.textBaseline = 'middle';
      c.fillText(m.isMoge ? '🏍️' : '🛵', 0, 0);
    }

    c.restore();

    // Emoji marah 💢
    if (m.emojiTimer && m.state === 'parkir' && !m.kabur) {
      c.font = '20px sans-serif';
      c.textAlign = 'center';
      c.fillText('💢', m.x + 20, m.y - 30);
    }

    // Ikon film untuk Moge yang belum nonton
    if (m.isMoge && m.state === 'parkir' && !m.sudahNontonIklan) {
      c.font = '18px sans-serif';
      c.textAlign = 'center';
      c.fillText('🎬', m.x, m.y - 40);
    }
  }

  // ============================================================
  // ============ CUACA ==========================================
  // ============================================================
  function gantiCuaca() {
    var baru = Math.random() < 0.6 ? 'panas' : 'hujan';
    cuacaSekarang = baru;
    cuacaOverlayAlpha = 0;
    if (baru === 'hujan') {
      initHujan();
    }
    renderHeader();
    log('Cuaca berganti:', baru);
  }

  function initHujan() {
    hujanArray = [];
    for (var i = 0; i < 80; i++) {
      hujanArray.push({
        x: Math.random() * canvasW,
        y: Math.random() * canvasH,
        speed: 300 + Math.random() * 300,
        length: 10 + Math.random() * 10
      });
    }
  }

  function updateCuaca(dt) {
    if (cuacaOverlayAlpha < 1) {
      cuacaOverlayAlpha += dt * 0.5;
      if (cuacaOverlayAlpha > 1) cuacaOverlayAlpha = 1;
    }
    if (cuacaSekarang === 'hujan') {
      for (var i = 0; i < hujanArray.length; i++) {
        var h = hujanArray[i];
        h.y += h.speed * dt;
        if (h.y > canvasH) {
          h.y = -10;
          h.x = Math.random() * canvasW;
        }
      }
    }
  }

  function renderCuaca() {
    if (!cuacaCtx) return;
    cuacaCtx.clearRect(0, 0, canvasW, canvasH);

    if (cuacaSekarang === 'panas') {
      cuacaCtx.fillStyle = 'rgba(255, 200, 0, ' + (0.08 * cuacaOverlayAlpha) + ')';
      cuacaCtx.fillRect(0, 0, canvasW, canvasH);
    } else if (cuacaSekarang === 'hujan') {
      cuacaCtx.fillStyle = 'rgba(100, 150, 200, ' + (0.15 * cuacaOverlayAlpha) + ')';
      cuacaCtx.fillRect(0, 0, canvasW, canvasH);

      cuacaCtx.strokeStyle = 'rgba(174, 194, 224, 0.6)';
      cuacaCtx.lineWidth = 1.5;
      for (var i = 0; i < hujanArray.length; i++) {
        var h = hujanArray[i];
        cuacaCtx.beginPath();
        cuacaCtx.moveTo(h.x, h.y);
        cuacaCtx.lineTo(h.x - 2, h.y + h.length);
        cuacaCtx.stroke();
      }
    }
  }

  // ============================================================
  // ============ GAME LOOP ======================================
  // ============================================================
  var lastFrameTime = 0;

  function gameLoop(timestamp) {
    if (!gameLoopRunning) return;

    var dt = lastFrameTime ? (timestamp - lastFrameTime) / 1000 : 0.016;
    lastFrameTime = timestamp;
    if (dt > 0.1) dt = 0.1;

    updateMotors(dt);
    updatePartikel(dt);
    updateKoinTerbang(dt);
    updateCuaca(dt);
    renderGame();

    requestAnimationFrame(gameLoop);
  }

  function startGameLoop() {
    if (gameLoopRunning) return;
    gameLoopRunning = true;
    lastFrameTime = 0;
    requestAnimationFrame(gameLoop);
    log('Game loop dimulai');
  }

  // ============================================================
  // ============ PRODUKSI OTOMATIS ==============================
  // ============================================================
  function hitungProduksiPerDetik() {
    var total = 0;
    // Upgrades
    var upgradeProduksi = [1, 5, 25, 100, 500, 2500];
    for (var i = 0; i < 6; i++) {
      if (upgradeLevels[i] > 0) {
        total += upgradeProduksi[i] * Math.pow(2, upgradeLevels[i] - 1);
      }
    }
    // Manajer
    var manajerProduksi = {
      'Pak Budi': 1,
      'Bu Siti': 5,
      'Pak Andi': 25,
      'Bu Rina': 100,
      'Pak Joko': 500,
      'Teknisi Umar': 2500
    };
    for (var j = 0; j < manajerDisewa.length; j++) {
      var nama = manajerDisewa[j].nama;
      if (manajerProduksi[nama]) {
        total += manajerProduksi[nama];
      }
    }
    // Batas maksimal
    if (total > MAX_PRODUKSI_PER_DETIK) total = MAX_PRODUKSI_PER_DETIK;
    return total;
  }

  function startProduksiLoop() {
    if (produksiLoopRunning) return;
    produksiLoopRunning = true;

    setInterval(function() {
      if (!produksiLoopRunning) return;
      var produksi = hitungProduksiPerDetik();
      if (produksi > 0) {
        saldo.koin += produksi;
        deltaKoin += produksi;
        totalKoinPernah += produksi;
        renderHeader();
      }
    }, 1000);

    log('Produksi loop dimulai');
  }

  // ============================================================
  // ============ SYNC PROGRESS ==================================
  // ============================================================
  function syncProgress() {
    if (!session || !session.user_id) return;
    if (deltaKoin === 0) return;

    var delta = deltaKoin;
    if (delta > MAX_DELTA_SYNC) delta = MAX_DELTA_SYNC;
    deltaKoin = 0;

    log('syncProgress: delta ' + delta);

    callBackend('syncProgress', {
      user_id: session.user_id,
      delta_koin: delta,
      total_koin: saldo.koin,
      total_motor: totalMotorDicuci,
      total_moge: totalMogeDicuci,
      total_tap: totalTap,
      level: userData ? userData.level : 1,
      upgrade_levels: JSON.stringify(upgradeLevels),
      manajer_disewa: JSON.stringify(manajerDisewa),
      cabang_aktif: cabangAktif,
      story_unlocked: storyUnlocked
    }).then(function(res) {
      if (res && res.ok) {
        log('syncProgress sukses');
        if (res.data) {
          // Update dari server jika ada
          if (typeof res.data.koin === 'number') {
            saldoServer.koin = res.data.koin;
          }
        }
      } else {
        log('syncProgress gagal:', res.pesan);
        deltaKoin += delta; // Kembalikan delta jika gagal
      }
    });
  }

  function startSyncLoop() {
    if (syncLoopRunning) return;
    syncLoopRunning = true;
    setInterval(function() {
      if (!syncLoopRunning) return;
      syncProgress();
    }, SYNC_INTERVAL);
    log('Sync loop dimulai');
  }

  function cekStoryUnlock() {

    if (unlocked < 2 && totalMotorDicuci >= 5) { unlocked = 2; }
    if (unlocked < 3 && totalKoinPernah >= 10000) { unlocked = 3; }
    if (unlocked < 4 && manajerDisewa.length >= 1) { unlocked = 4; }
    if (unlocked < 5 && totalKoinPernah >= 1000000) { unlocked = 5; }
    if (unlocked < 6 && manajerDisewa.length >= 3) { unlocked = 6; }
    if (unlocked < 7 && totalKoinPernah >= 1000000000) { unlocked = 7; }

    if (unlocked > storyUnlocked) {
      storyUnlocked = unlocked;
      updateStoryUnlocked(storyUnlocked);
      renderBottomNav();
    }
  }

  async function loadQuestProgress() {
    if (!session || !session.user_id) return;
    var res = await callBackend('baca', { sheet: 'QuestProgress' });
    if (res && res.ok && res.data) {
      questProgress = res.data.filter(function(q) {
        return String(q.user_id) === String(session.user_id);
      });
    }
  }

  function getQuestProgress(questId) {
    for (var i = 0; i < questProgress.length; i++) {
      if (String(questProgress[i].id_quest) === String(questId)) {
        return questProgress[i];
      }
    }
    return null;
  }

  function trackQuestProgress(tipe, nilai) {
    // Update progress lokal
    for (var i = 0; i < questsData.length; i++) {
      var q = questsData[i];
      var qp = getQuestProgress(q.id_quest);
      if (!qp) {
        // Buat progress baru
        qp = { user_id: session.user_id, id_quest: q.id_quest, progress: 0, target: q.target, status: 'belum' };
        questProgress.push(qp);
      }
      // Cek apakah quest ini relevan
      var relevan = false;
      if (tipe === 'cuci_motor' && (q.judul.indexOf('Cuci') >= 0 || q.id_quest === 'h1' || q.id_quest === 'h4' || q.id_quest === 'm1')) relevan = true;
      if (tipe === 'cuci_moge' && (q.id_quest === 'h3' || q.id_quest === 'm2')) relevan = true;
      if (tipe === 'tap' && q.id_quest === 'h2') relevan = true;
      if (tipe === 'convert' && (q.id_quest === 'h5' || q.id_quest === 's1')) relevan = true;
      if (tipe === 'sewa_manajer' && (q.id_quest === 'm3' || q.id_quest === 's2')) relevan = true;
      if (tipe === 'buka_cabang' && (q.id_quest === 's3' || q.id_quest === 's5')) relevan = true;
      if (tipe === 'topup' && q.id_quest === 's4') relevan = true;

      if (relevan && qp.status !== 'diklaim') {
        if (tipe === 'tap' || tipe === 'convert') {
          qp.progress = Math.max(qp.progress, nilai);
        } else {
          qp.progress = (qp.progress || 0) + nilai;
        }
        if (qp.progress >= q.target) {
          qp.status = 'selesai';
        }
        // Sync ke server
        syncQuestProgress(qp);
      }
    }
    cekQuestBadge();
  }

  function syncQuestProgress(qp) {
    if (qp._row) {
      callBackend('update', {
        sheet: 'QuestProgress',
        row: qp._row,
        data: { progress: qp.progress, status: qp.status }
      });
    } else {
      callBackend('tulis', {
        sheet: 'QuestProgress',
        data: {
          user_id: session.user_id,
          id_quest: qp.id_quest,
          progress: qp.progress,
          target: qp.target,
          status: qp.status
        }
      }).then(function(res) {
        if (res && res.ok && res.data && res.data._row) {
          qp._row = res.data._row;
        }
      });
    }
  }

  function klaimQuest(questId) {
    var q = null;
    for (var i = 0; i < questsData.length; i++) {
      if (questsData[i].id_quest === questId) { q = questsData[i]; break; }
    }
    if (!q) return;
    var qp = getQuestProgress(questId);
    if (!qp || qp.status !== 'selesai') return;

    // Tambah reward
    if (q.reward_koin) {
      saldo.koin += Number(q.reward_koin);
      deltaKoin += Number(q.reward_koin);
      totalKoinPernah += Number(q.reward_koin);
    }
    if (q.reward_kristal) {
      saldo.kristal += Number(q.reward_kristal);
    }

    qp.status = 'diklaim';
    qp.progress = q.target;

    callBackend('update', {
      sheet: 'QuestProgress',
      row: qp._row,
      data: { status: 'diklaim', progress: q.target }
    });

    renderHeader();
    renderBottomNav();
    cekQuestBadge();
    showToast('🎉 Quest selesai! +' + formatAngka(q.reward_koin || 0) + ' koin', 'success');
    playSuaraLevelUp();
  }

  function cekQuestBadge() {
    var adaKlaim = false;
    for (var i = 0; i < questsData.length; i++) {
      var qp = getQuestProgress(questsData[i].id_quest);
      if (qp && qp.status === 'selesai') { adaKlaim = true; break; }
    }
    var badge = document.getElementById('questBadge');
    if (badge) {
      badge.style.display = adaKlaim ? 'flex' : 'none';
    }
  }

  function beliUpgrade(idx) {
    var upgrades = [
      { harga: 100, produksi: 1 },
      { harga: 1000, produksi: 5 },
      { harga: 10000, produksi: 25 },
      { harga: 100000, produksi: 100 },
      { harga: 1000000, produksi: 500 },
      { harga: 10000000, produksi: 2500 }
    ];
    if (idx < 0 || idx >= upgrades.length) return;
    var u = upgrades[idx];
    var lvl = upgradeLevels[idx] || 0;
    var hargaSekarang = Math.floor(u.harga * Math.pow(2.5, lvl));

    if (saldo.koin < hargaSekarang) {
      showToast('Koin tidak cukup!', 'error');
      playSuaraError();
      return;
    }

    saldo.koin -= hargaSekarang;
    deltaKoin -= hargaSekarang;
    upgradeLevels[idx] = lvl + 1;

    // Sync ke server
    callBackend('update', {
      sheet: 'Users',
      row: session.user_row || userData._row,
      data: {
        upgrade_levels: JSON.stringify(upgradeLevels),
        koin: saldo.koin
      }
    });

    renderHeader();
    bukaPanel('game');
    showToast('✅ Upgrade berhasil! Lv ' + upgradeLevels[idx], 'success');
    playSuaraLevelUp();
  }

  function beliToko(idx) {
    var items = [
      { nama: 'Skin Merah Metalik', hargaKoin: 50000 },
      { nama: 'Tema Steam Mewah', hargaKoin: 100000 },
      { nama: 'Badge Juara', hargaKoin: 20000 },
      { nama: 'Boost Produksi 1 Jam', hargaKoin: 200000 },
      { nama: 'Unlock Manajer Cepat', hargaKoin: 500000 },
      { nama: 'Voucher Cuci Motor', hargaKoin: 70000 },
      { nama: 'Manajer Legendaris', hargaKristal: 50 },
      { nama: 'Skin Emas Premium', hargaKristal: 30 }
    ];
    if (idx < 0 || idx >= items.length) return;
    var it = items[idx];

    if (it.hargaKoin && saldo.koin < it.hargaKoin) {
      showToast('Koin tidak cukup!', 'error');
      playSuaraError();
      return;
    }
    if (it.hargaKristal && saldo.kristal < it.hargaKristal) {
      showToast('Kristal tidak cukup!', 'error');
      playSuaraError();
      return;
    }

    if (it.hargaKoin) {
      saldo.koin -= it.hargaKoin;
      deltaKoin -= it.hargaKoin;
    }
    if (it.hargaKristal) {
      saldo.kristal -= it.hargaKristal;
    }

    renderHeader();
    bukaPanel('toko');
    showToast('🛒 ' + it.nama + ' berhasil dibeli!', 'success');

  function lakukanConvert(jumlah, mode) {
    if (jumlah < 10000) {
      showToast('Minimal 10.000 koin!', 'warning');
      return;
    }
    if (saldo.koin < jumlah) {
      showToast('Koin tidak cukup!', 'error');
      playSuaraError();
      return;
    }

    var rupiah = jumlah / 10;
    if (mode === 'potong') {
      rupiah = rupiah * 0.9;
    }

    saldo.koin -= jumlah;
    deltaKoin -= jumlah;
    saldo.rupiah += rupiah;
    totalConvert += jumlah;

    callBackend('update', {
      sheet: 'Users',
      row: session.user_row || userData._row,
      data: { koin: saldo.koin, rupiah: saldo.rupiah }
    });

    trackQuestProgress('convert', jumlah);
    renderHeader();
    bukaPanel('convert');
    showToast('💱 Convert berhasil! +' + formatRupiah(rupiah), 'success');
    playSuaraKoin();
  }

  async function uploadBuktiTopup() {
    var fileInput = document.getElementById('topupBukti');
    if (!fileInput || !fileInput.files || !fileInput.files[0]) {
      showToast('Pilih file bukti dulu!', 'warning');
      return;
    }

    var file = fileInput.files[0];
    var reader = new FileReader();
    reader.onload = function(e) {
      var img = new Image();
      img.onload = function() {
        // Kompres
        var c = document.createElement('canvas');
        var maxW = 800;
        var scale = Math.min(1, maxW / img.width);
        c.width = img.width * scale;
        c.height = img.height * scale;
        var cx = c.getContext('2d');
        cx.drawImage(img, 0, 0, c.width, c.height);

        var quality = 0.7;
        var base64 = c.toDataURL('image/jpeg', quality);
        // Target 500KB
        while (base64.length > 500000 && quality > 0.2) {
          quality -= 0.1;
          base64 = c.toDataURL('image/jpeg', quality);
        }

        callBackend('tulis', {
          sheet: 'Topups',
          data: {
            user_id: session.user_id,
            nama: userData ? userData.nama : '',
            bukti: base64,
            status: 'pending',
            tanggal: new Date().toISOString()
          }
        }).then(function(res) {
          if (res && res.ok) {
            trackQuestProgress('topup', 1);
            showToast('📤 Bukti terkirim! Menunggu verifikasi admin.', 'success');
            loadRiwayatTopup();
          } else {
            showToast('Gagal upload: ' + (res.pesan || 'Error'), 'error');
          }
        });
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  async function tukarVoucher() {
    // Konfirmasi nomor HP
    var nomor = prompt('Masukkan nomor HP kamu untuk konfirmasi:');
    if (!nomor) return;
    if (nomor !== (userData ? userData.nomor : '')) {
      showToast('Nomor HP tidak cocok!', 'error');
      playSuaraError();
      return;
    }

    // Cek biaya
    if (saldo.koin < 70000 && saldo.rupiah < 7000) {
      showToast('Saldo tidak cukup! Butuh 70.000 koin atau Rp 7.000', 'error');
      playSuaraError();
      return;
    }

    // Cek max 1 per minggu
    var res = await callBackend('baca', { sheet: 'Vouchers' });
    if (res && res.ok && res.data) {
      var mingguIni = new Date();
      mingguIni.setDate(mingguIni.getDate() - 7);
      var sudahAda = false;
      for (var i = 0; i < res.data.length; i++) {
        var v = res.data[i];
        if (String(v.user_id) === String(session.user_id)) {
          var tgl = new Date(v.tanggal);
          if (tgl > mingguIni) { sudahAda = true; break; }
        }
      }
      if (sudahAda) {
        showToast('Kamu sudah menukar voucher minggu ini!', 'warning');
        return;
      }
    }

    // Potong saldo
    if (saldo.koin >= 70000) {
      saldo.koin -= 70000;
      deltaKoin -= 70000;
    } else {
      saldo.rupiah -= 7000;
    }

    // Generate kode
    var kode = 'MP7K-' + Math.random().toString(36).substring(2, 8).toUpperCase();

    callBackend('tulis', {
      sheet: 'Vouchers',
      data: {
        user_id: session.user_id,
        kode: kode,
        status: 'aktif',
        tanggal: new Date().toISOString()
      }
    });

    callBackend('update', {
      sheet: 'Users',
      row: session.user_row || userData._row,
      data: { koin: saldo.koin, rupiah: saldo.rupiah }
    });

    renderHeader();
    var hasil = document.getElementById('voucherHasil');
    if (hasil) {
      hasil.innerHTML = '<div style="background:#D1FAE5;border-radius:14px;padding:16px;text-align:center;">' +
        '<div style="font-size:12px;color:#065F46;">Kode Voucher Kamu:</div>' +
        '<div style="font-size:22px;font-weight:800;color:#065F46;letter-spacing:2px;margin:8px 0;">' + kode + '</div>' +
        '<div style="font-size:11px;color:#065F46;">Tunjukkan kode ini ke kasir</div>' +
      '</div>';
    }
    showToast('🎫 Voucher berhasil ditukar!', 'success');
    playSuaraLevelUp();
  }

    log('Dashboard: mulai load');

    // Cek admin mode
    if (cekAdminMode()) {
      initAdminPanel();
      return;
    }

    // Cek session
    if (!cekSession()) {
      showToast('Silakan login dulu', 'warning');

      return;

    try {

      // Load gambar

      await loadStory();

      if (!ok) {
        showToast('Gagal memuat data pemain. Coba lagi.', 'error');

        return;

      // Load quest progress
      await loadQuestProgress();

      // Cek banned

          '</div>';
        hideLoading();
        return;
      }

      // Render UI
      renderHeader();
      renderBottomNav();

      // Start loops
      startGameLoop();
      startProduksiLoop();

      // Spawn motor
      setInterval(function() {
        if (!session) return;
        var interval = cuacaSekarang === 'panas' ? 2000 : 6000;
        // Spawn berdasarkan interval
        if (Math.random() < 0.8) {
          spawnMotor();

      }, cuacaSekarang === 'panas' ? 2000 : 6000);

      // Ganti cuaca random 1-3 menit
      setInterval(function() {

      // Init cuaca
      gantiCuaca();

      // Init musik
      initMusik();

      // Init audio
      initAudio();

      // Setup canvas tap
      canvas.addEventListener('touchstart', function(e) {
        e.preventDefault();
        initAudio();
        var rect = canvas.getBoundingClientRect();
        var touch = e.touches[0];
        var tapX = touch.clientX - rect.left;
        var tapY = touch.clientY - rect.top;
        var motor = cekTapMotor(tapX, tapY);
        if (motor) {
          prosesTapMotor(motor);

          prosesTapMotor(motor);
        }
      });

      // Cek Bab 1 wajib
      if (storyUnlocked === 0) {
        setTimeout(function() {
          tampilModalCerita(1);
        }, 1000);
      }

      hideLoading();
      log('Dashboard: render selesai');

      // Cek level up
      setInterval(function() {

        var levelBaru = Math.floor(totalKoinPernah / 10000) + 1;
        if (levelBaru > (userData.level || 1)) {
          userData.level = levelBaru;
          callBackend('update', {
            sheet: 'Users',

            data: { level: levelBaru }
          });
          renderHeader();
          showToast('🎉 Level up! Level ' + levelBaru, 'success');
          playSuaraLevelUp();
        }
      }, 5000);

    } catch(e) {
      log('Error init:', e);
      showToast('Gagal: ' + e.message, 'error');
    } finally {
      hideLoading();
    }
  }
