<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Steam MP 7000 Tycoon</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      font-family: 'Poppins', sans-serif;
      background: #1a0a0a;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      color: #FAFAFA;
      position: fixed;
      touch-action: pan-y;
    }
    /* HEADER */
    #header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 80px;
      background: linear-gradient(135deg, #8B0000 0%, #C8102E 50%, #8B0000 100%);
      z-index: 100;
      display: flex;
      align-items: center;
      padding: 0 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      border-bottom: 2px solid #F59E0B;
      gap: 6px;
      flex-wrap: nowrap;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
    }
    #header::-webkit-scrollbar { display: none; }
    .header-logo {
      width: 40px;
      height: 40px;
      background: #F59E0B;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      color: #8B0000;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(245,158,11,0.5);
    }
    .header-info {
      display: flex;
      flex-direction: column;
      gap: 1px;
      flex-shrink: 0;
      min-width: 70px;
    }
    .header-name {
      font-size: 11px;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 80px;
    }
    .header-nomor {
      font-size: 9px;
      color: #F59E0B;
    }
    .header-saldo {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }
    .saldo-item {
      background: rgba(0,0,0,0.3);
      border-radius: 8px;
      padding: 2px 6px;
      display: flex;
      align-items: center;
      gap: 3px;
      font-size: 10px;
      font-weight: 600;
      white-space: nowrap;
    }
    .saldo-item img {
      width: 16px;
      height: 16px;
      object-fit: contain;
    }
    .header-level {
      display: flex;
      flex-direction: column;
      gap: 1px;
      flex-shrink: 0;
      min-width: 50px;
    }
    .level-text {
      font-size: 9px;
      color: #F59E0B;
    }
    .level-bar {
      width: 50px;
      height: 5px;
      background: rgba(0,0,0,0.4);
      border-radius: 3px;
      overflow: hidden;
    }
    .level-fill {
      height: 100%;
      background: linear-gradient(90deg, #F59E0B, #FFD700);
      border-radius: 3px;
      transition: width 0.3s;
      width: 0%;
    }
    .header-btns {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
      margin-left: auto;
    }
    .header-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(245,158,11,0.5);
      color: #fff;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .header-btn:active { transform: scale(0.9); background: rgba(245,158,11,0.3); }
    .weather-icon {
      font-size: 16px;
    }
    /* CANVAS */
    #gameCanvas {
      position: fixed;
      top: 80px;
      left: 0;
      width: 100vw;
      height: calc(100vh - 150px);
      z-index: 1;
      display: block;
      background: #2a0a0a;
    }
    /* BOTTOM NAV */
    #bottomNav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 70px;
      background: linear-gradient(180deg, #1a0505 0%, #2a0a0a 100%);
      border-top: 2px solid #F59E0B;
      z-index: 100;
      display: flex;
      align-items: center;
      padding: 0 4px;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
      gap: 2px;
    }
    #bottomNav::-webkit-scrollbar { display: none; }
    .nav-item {
      flex: 0 0 auto;
      min-width: 52px;
      height: 56px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
      padding: 2px 4px;
      color: #aaa;
      font-size: 8px;
      font-weight: 600;
    }
    .nav-item .nav-icon { font-size: 18px; line-height: 1; }
    .nav-item.active {
      background: rgba(245,158,11,0.2);
      color: #F59E0B;
      box-shadow: 0 0 10px rgba(245,158,11,0.3);
    }
    .nav-item:active { transform: scale(0.92); }
    /* BOTTOM PANEL */
    #bottomPanel {
      position: fixed;
      bottom: 70px;
      left: 0;
      width: 100%;
      max-height: 70vh;
      background: linear-gradient(180deg, #1a0505 0%, #2a0a0a 100%);
      border-top: 2px solid #F59E0B;
      border-radius: 18px 18px 0 0;
      z-index: 99;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 12px 10px 80px 10px;
      display: none;
      box-shadow: 0 -8px 30px rgba(0,0,0,0.7);
      animation: slideUp 0.3s ease;
      scrollbar-width: thin;
      scrollbar-color: #F59E0B #1a0505;
    }
    #bottomPanel::-webkit-scrollbar { width: 4px; }
    #bottomPanel::-webkit-scrollbar-thumb { background: #F59E0B; border-radius: 4px; }
    #bottomPanel.show { display: block; }
    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .panel-title {
      font-size: 15px;
      font-weight: 700;
      color: #F59E0B;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .panel-close {
      margin-left: auto;
      background: rgba(200,16,46,0.5);
      border: none;
      color: #fff;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* CARDS */
    .upgrade-card {
      background: linear-gradient(135deg, #2a0a0a, #3a1010);
      border: 1px solid rgba(245,158,11,0.3);
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.2s;
    }
    .upgrade-card:active { transform: scale(0.98); }
    .upgrade-icon {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: rgba(245,158,11,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }
    .upgrade-info { flex: 1; min-width: 0; }
    .upgrade-name { font-size: 12px; font-weight: 600; color: #fff; }
    .upgrade-detail { font-size: 10px; color: #aaa; margin-top: 2px; }
    .upgrade-detail span { color: #F59E0B; font-weight: 600; }
    .upgrade-buy {
      background: linear-gradient(135deg, #C8102E, #8B0000);
      border: 1px solid #F59E0B;
      color: #fff;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
      font-family: 'Poppins', sans-serif;
    }
    .upgrade-buy:active { transform: scale(0.93); }
    .upgrade-buy:disabled { opacity: 0.4; cursor: not-allowed; }
    .upgrade-lv {
      background: #F59E0B;
      color: #1a0505;
      font-size: 9px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 6px;
      display: inline-block;
      margin-left: 4px;
    }
    /* STORY MODAL */
    .story-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: fadeIn 0.3s;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .story-box {
      background: #FAFAFA;
      color: #1a0505;
      border-radius: 18px;
      padding: 24px 20px;
      max-width: 340px;
      width: 100%;
      border: 3px solid #F59E0B;
      box-shadow: 0 0 40px rgba(245,158,11,0.5);
      text-align: center;
      animation: bounceIn 0.4s;
      max-height: 80vh;
      overflow-y: auto;
    }
    @keyframes bounceIn {
      0% { transform: scale(0.7); opacity: 0; }
      60% { transform: scale(1.05); }
      100% { transform: scale(1); opacity: 1; }
    }
    .story-box img {
      width: 80px;
      height: 80px;
      object-fit: contain;
      margin-bottom: 10px;
    }
    .story-box h2 {
      font-size: 18px;
      color: #C8102E;
      margin-bottom: 8px;
      font-weight: 700;
    }
    .story-box p {
      font-size: 13px;
      line-height: 1.6;
      color: #333;
      margin-bottom: 16px;
      text-align: left;
    }
    .story-btn {
      background: linear-gradient(135deg, #C8102E, #8B0000);
      color: #fff;
      border: none;
      padding: 10px 28px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Poppins', sans-serif;
      border: 2px solid #F59E0B;
      transition: all 0.2s;
    }
    .story-btn:active { transform: scale(0.95); }
    /* TOAST */
    #toastContainer {
      position: fixed;
      top: 90px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 6px;
      pointer-events: none;
      width: 90%;
      max-width: 320px;
    }
    .toast {
      background: rgba(26,5,5,0.95);
      border: 1px solid #F59E0B;
      color: #fff;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      animation: toastIn 0.3s ease;
    }
    @keyframes toastIn {
      from { transform: translateY(-20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    /* LOADING */
    #loadingScreen {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #1a0505, #2a0a0a);
      z-index: 2000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(245,158,11,0.2);
      border-top-color: #F59E0B;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: #F59E0B; font-size: 14px; font-weight: 600; }
    /* LOGIN PROMPT */
    #loginPrompt {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #1a0505, #2a0a0a);
      z-index: 1500;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 30px;
      text-align: center;
    }
    #loginPrompt.show { display: flex; }
    #loginPrompt h2 { color: #F59E0B; font-size: 20px; }
    #loginPrompt p { color: #ccc; font-size: 14px; }
    #loginPrompt button {
      background: linear-gradient(135deg, #C8102E, #8B0000);
      color: #fff;
      border: 2px solid #F59E0B;
      padding: 12px 32px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Poppins', sans-serif;
    }
    /* MISC */
    .section-label {
      font-size: 11px;
      font-weight: 700;
      color: #F59E0B;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 12px 0 6px 0;
    }
    .empty-msg {
      text-align: center;
      color: #666;
      font-size: 12px;
      padding: 20px;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid rgba(245,158,11,0.15);
      font-size: 12px;
    }
    .stat-label { color: #aaa; }
    .stat-value { color: #F59E0B; font-weight: 600; }
    .btn-primary {
      background: linear-gradient(135deg, #C8102E, #8B0000);
      color: #fff;
      border: 2px solid #F59E0B;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Poppins', sans-serif;
      width: 100%;
      transition: all 0.2s;
    }
    .btn-primary:active { transform: scale(0.97); }
    .btn-primary:disabled { opacity: 0.5; }
    .btn-secondary {
      background: rgba(245,158,11,0.15);
      color: #F59E0B;
      border: 1px solid #F59E0B;
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Poppins', sans-serif;
    }
    /* SPARKLE ANIMATION */
    @keyframes sparkle {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.3); }
    }
    /* RESPONSIVE */
    @media (max-width: 360px) {
      .header-name { max-width: 60px; font-size: 10px; }
      .saldo-item { font-size: 9px; padding: 2px 4px; }
      .nav-item { min-width: 46px; font-size: 7px; }
      .nav-item .nav-icon { font-size: 16px; }
    }
  </style>
</head>
<body>

<!-- LOADING -->
<div id="loadingScreen">
  <div class="loading-spinner"></div>
  <div class="loading-text">Memuat Steam MP 7000...</div>
</div>

<!-- LOGIN PROMPT -->
<div id="loginPrompt">
  <div style="font-size:48px">🔐</div>
  <h2>Silakan Login Dulu</h2>
  <p>Kamu belum login. Silakan ke halaman login untuk mulai bermain.</p>
  <button onclick="window.location.href='login.html'">Ke Halaman Login</button>
</div>

<!-- HEADER -->
<header id="header">
  <div class="header-logo">MP</div>
  <div class="header-info">
    <div class="header-name" id="headerName">Memuat...</div>
    <div class="header-nomor" id="headerNomor">****</div>
  </div>
  <div class="header-saldo">
    <div class="saldo-item"><span>🪙</span><span id="headerKoin">0</span></div>
    <div class="saldo-item"><span>💎</span><span id="headerKristal">0</span></div>
    <div class="saldo-item"><span>💰</span><span id="headerRupiah">Rp 0</span></div>
  </div>
  <div class="header-level">
    <div class="level-text">Lv <span id="headerLevel">1</span></div>
    <div class="level-bar"><div class="level-fill" id="levelFill"></div></div>
  </div>
  <div class="header-btns">
    <div class="header-btn weather-icon" id="weatherBtn">☀️</div>
    <div class="header-btn" id="musicBtn">🎵</div>
    <div class="header-btn" id="menuBtn">☰</div>
  </div>
</header>

<!-- CANVAS -->
<canvas id="gameCanvas"></canvas>

<!-- BOTTOM PANEL -->
<div id="bottomPanel"></div>

<!-- BOTTOM NAV -->
<nav id="bottomNav">
  <div class="nav-item active" data-tab="game"><span class="nav-icon">🎮</span>Game</div>
  <div class="nav-item" data-tab="manajer"><span class="nav-icon">👔</span>Manajer</div>
  <div class="nav-item" data-tab="cabang"><span class="nav-icon">🏢</span>Cabang</div>
  <div class="nav-item" data-tab="toko"><span class="nav-icon">🛒</span>Toko</div>
  <div class="nav-item" data-tab="convert"><span class="nav-icon">🔄</span>Convert</div>
  <div class="nav-item" data-tab="topup"><span class="nav-icon">💳</span>Topup</div>
  <div class="nav-item" data-tab="voucher"><span class="nav-icon">🎫</span>Voucher</div>
  <div class="nav-item" data-tab="cerita"><span class="nav-icon">📖</span>Cerita</div>
  <div class="nav-item" data-tab="quest"><span class="nav-icon">📋</span>Quest</div>
  <div class="nav-item" data-tab="profil"><span class="nav-icon">👤</span>Profil</div>
</nav>

<!-- TOAST -->
<div id="toastContainer"></div>

<script>
// ============================================================
// KONFIGURASI
// ============================================================
var API_URL = 'https://script.google.com/macros/s/AKfycbysHvNR2JwLFuNu6poci5wIleJBnc8IGNMq-ULxUV1NyMxoorEcBj0c8oBh4b8JiL3m/exec';
var TOKEN = 'steam-mp-7000-2026';
var LS_USER = 'smp7k_user';
var LS_EXTRA = 'smp7k_extra';
var LS_MUSIC = 'smp7k_music';
var LS_ADMIN = 'smp7k_admin';

// ============================================================
// STATE GLOBAL
// ============================================================
var state = {
  user: null,
  koin: 0,
  rupiah: 0,
  kristal: 0,
  level: 1,
  exp: 0,
  productionRate: 0,
  pendingProduction: 0,
  motorList: [],
  slotTerpakai: 0,
  cuaca: 'panas',
  weatherTimer: 0,
  lastMotorSpawn: 0,
  motorSpawnInterval: 2000,
  tabAktif: 'game',
  panelTerbuka: false,
  storyRead: {},
  questProgress: {},
  manajer: [],
  cabang: 1,
  totalCuci: 0,
  upgrades: {},
  tokoItems: [],
  frameCount: 0,
  lastProductionTick: Date.now(),
  musicOn: false,
  adminMode: false,
  adminData: {},
  storyBab: [],
  quests: [],
  tokoData: [],
  managersData: [],
  branchesData: [],
  motorImages: {},
  bgImage: null,
  pakAldiImg: null,
  koinImg: null,
  kristalImg: null,
  rupiahImg: null,
  qrisImg: null,
  canvasW: 0,
  canvasH: 0,
  deviceId: '',
};

// ============================================================
// UTILITAS
// ============================================================
function log(msg) {
  console.log('[SMP7K] ' + msg);
}

function formatRupiah(n) {
  return 'Rp ' + (n || 0).toLocaleString('id-ID');
}

function formatAngka(n) {
  if (n >= 1e9) return (n/1e9).toFixed(1) + 'M';
  if (n >= 1e6) return (n/1e6).toFixed(1) + 'jt';
  if (n >= 1e3) return (n/1e3).toFixed(0) + 'rb';
  return '' + Math.floor(n);
}

function generateDeviceId() {
  var id = localStorage.getItem('smp7k_device');
  if (!id) {
    id = 'dev-' + Math.random().toString(36).substr(2, 9) + Date.now().toString(36);
    localStorage.setItem('smp7k_device', id);
  }
  return id;
}

function fetchTimeout(url, options, ms) {
  return Promise.race([
    fetch(url, options),
    new Promise(function(_, reject) { setTimeout(function() { reject(new Error('Timeout')); }, ms || 15000); })
  ]);
}

function apiCall(action, payload) {
  var body = {
    token: TOKEN,
    action: action
  };
  for (var k in payload) { body[k] = payload[k]; }
  return fetchTimeout(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify(body)
  }, 15000).then(function(r) { return r.json(); });
}

function toast(msg, durasi) {
  var c = document.getElementById('toastContainer');
  var t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(function() {
    t.style.opacity = '0';
    t.style.transition = 'opacity 0.3s';
    setTimeout(function() { t.remove(); }, 300);
  }, durasi || 2500);
}

// ============================================================
// AUDIO (Web Audio API)
// ============================================================
var audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

function playSyuush() {
  initAudio();
  if (!audioCtx) return;
  var o = audioCtx.createOscillator();
  var g = audioCtx.createGain();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(800, audioCtx.currentTime);
  o.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.3);
  g.gain.setValueAtTime(0.15, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime + 0.3);
}

function playTing() {
  initAudio();
  if (!audioCtx) return;
  var o = audioCtx.createOscillator();
  var g = audioCtx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(1200, audioCtx.currentTime);
  o.frequency.exponentialRampToValueAtTime(1800, audioCtx.currentTime + 0.1);
  g.gain.setValueAtTime(0.12, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime + 0.2);
}

function playChime() {
  initAudio();
  if (!audioCtx) return;
  [523, 659, 784].forEach(function(f, i) {
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = 'sine';
    o.frequency.value = f;
    g.gain.setValueAtTime(0, audioCtx.currentTime + i*0.1);
    g.gain.linearRampToValueAtTime(0.1, audioCtx.currentTime + i*0.1 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + i*0.1 + 0.4);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(audioCtx.currentTime + i*0.1);
    o.stop(audioCtx.currentTime + i*0.1 + 0.4);
  });
}

function playBuzz() {
  initAudio();
  if (!audioCtx) return;
  var o = audioCtx.createOscillator();
  var g = audioCtx.createGain();
  o.type = 'square';
  o.frequency.value = 150;
  g.gain.setValueAtTime(0.1, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime + 0.15);
}

// ============================================================
// HAPUS BACKGROUND PUTIH
// ============================================================
function hilangkanBackgroundPutih(imgSrc, toleransi, callback) {
  var img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = function() {
    var c = document.createElement('canvas');
    c.width = img.width; c.height = img.height;
    var cx = c.getContext('2d');
    cx.drawImage(img, 0, 0);
    try {
      var d = cx.getImageData(0, 0, c.width, c.height);
      var p = d.data;
      var tol = toleransi || 40;
      for (var i = 0; i < p.length; i += 4) {
        if (p[i] > 255 - tol && p[i+1] > 255 - tol && p[i+2] > 255 - tol) p[i+3] = 0;
      }
      cx.putImageData(d, 0, 0);
      callback(c.toDataURL('image/png'));
    } catch(e) { callback(imgSrc); }
  };
  img.onerror = function() { callback(null); };
  img.src = imgSrc;
}

function spawnMotor() {
  if (state.motorList.length >= 18) return;
  var isMoge = Math.random() < (1/8);
  var jenis = isMoge ? 'moge' : 'bebek';
  var masukParkiran = Math.random() < 0.4;
  
  if (!masukParkiran && state.motorList.length >= 12) {
    // Lewat saja kalau parkiran hampir penuh
    state.motorList.push({
      id: Date.now() + Math.random(),
      jenis: jenis,
      status: 'lewat',
      x: -100,
      y: state.canvasH * 0.05,
      slotTarget: -1,
      tapCount: 0,
      sudahNontonIklan: false,
      kaburTimer: 0,
      spawnTime: Date.now(),
    });
    log('Spawn motor ke-' + state.motorList.length + ' (lewat)');
    return;
  }
  
  // Cari slot kosong
  var usedSlots = {};
  state.motorList.forEach(function(m) { if (m.slotTarget >= 0) usedSlots[m.slotTarget] = true; });
  var slot = -1;
  for (var i = 0; i < 18; i++) {
    if (!usedSlots[i]) { slot = i; break; }
  }
  if (slot === -1) {
    // Parkiran penuh, lewat saja
    state.motorList.push({
      id: Date.now() + Math.random(),
      jenis: jenis,
      status: 'lewat',
      x: -100,
      y: state.canvasH * 0.05,
      slotTarget: -1,
      tapCount: 0,
      sudahNontonIklan: false,
      kaburTimer: 0,
      spawnTime: Date.now(),
    });
    return;
  }
  
  state.motorList.push({
    id: Date.now() + Math.random(),
    jenis: jenis,
    status: 'parkir',
    x: 0, y: 0,
    slotTarget: slot,
    tapCount: 0,
    sudahNontonIklan: false,
    kaburTimer: 0,
    spawnTime: Date.now(),
    targetX: 0, targetY: 0,
    currentX: state.canvasW + 100, currentY: state.canvasH * 0.05,
  });
  log('Spawn motor ke-' + state.motorList.length + ' (parkir slot ' + slot + ')');
}

// ============================================================
// RENDER
// ============================================================
function render() {
  var W = state.canvasW;
  var H = state.canvasH;
  
  // Background COVER
  if (state.bgImage && state.bgImage.complete && state.bgImage.naturalWidth > 0) {
    var img = state.bgImage;
    var scale = Math.max(W / img.width, H / img.height);
    var dw = img.width * scale;
    var dh = img.height * scale;
    var dx = (W - dw) / 2;
    var dy = (H - dh) / 2;
    ctx.drawImage(img, dx, dy, dw, dh);
  } else {
    // Gradient merah putih
    var grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#C8102E');
    grad.addColorStop(1, '#FAFAFA');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
  }
  
  // Render motor
  state.motorList.forEach(function(m) {
    renderMotor(m);
  });
  
  state.frameCount++;
  if (state.frameCount % 60 === 0) log('Render frame: ' + state.frameCount);
}

function renderMotor(m) {
  var W = state.canvasW;
  var H = state.canvasH;
  
  var imgKey = 'motor-' + m.jenis + '-' + (m.status === 'bersih' ? 'bersih' : 'kotor');
  var img = state.motorImages[imgKey];
  
  var drawX, drawY;
  
  if (m.status === 'lewat') {
    m.x += 2;
    drawX = m.x;
    drawY = H * 0.05 - 40;
    if (m.x > W + 100) {
      // Hapus
      var idx = state.motorList.indexOf(m);
      if (idx >= 0) state.motorList.splice(idx, 1);
      return;
    }
  } else if (m.status === 'parkir' || m.status === 'bersih') {
    var baris = Math.floor(m.slotTarget / 6);
    var kolom = m.slotTarget % 6;
    var xPos = [0.12, 0.25, 0.38, 0.51, 0.64, 0.77][kolom];
    var yPos = [0.35, 0.45, 0.55][baris];
    var targetX = W * xPos - 30;
    var targetY = H * yPos - 40;
    
    // Smooth movement
    if (!m.currentX) m.currentX = W + 100;
    if (!m.currentY) m.currentY = H * 0.05;
    m.currentX += (targetX - m.currentX) * 0.08;
    m.currentY += (targetY - m.currentY) * 0.08;
    drawX = m.currentX;
    drawY = m.currentY;
  } else {
    drawX = m.x || 0;
    drawY = m.y || 0;
  }
  
  // Gambar motor
  if (img && img.complete && img.naturalWidth > 0) {
    ctx.save();
    ctx.translate(drawX + 30, drawY + 40);
    ctx.rotate(Math.PI);
    // Kilau emas untuk moge
    if (m.jenis === 'moge' && m.status !== 'bersih') {
      ctx.shadowColor = '#F59E0B';
      ctx.shadowBlur = 15;
    }
    ctx.drawImage(img, -30, -40, 60, 80);
    ctx.restore();
  } else {
    // Fallback emoji
    ctx.save();
    ctx.font = '40px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(m.jenis === 'moge' ? '🏍️' : '🛵', drawX + 30, drawY + 40);
    ctx.restore();
  }
  
  // Sparkle untuk moge
  if (m.jenis === 'moge' && m.status !== 'bersih' && !m.sudahNontonIklan) {
    ctx.font = '16px serif';
    ctx.fillText('✨', drawX + 50, drawY + 10);
  }
  
  // Indikator kabur
  if (m.status === 'parkir' && m.jenis === 'bebek' && m.tapCount === 0) {
    var elapsed = (Date.now() - m.spawnTime) / 1000;
    if (elapsed > 5) {
      ctx.font = '20px serif';
      ctx.fillText('💢', drawX + 60, drawY);
    }
  }
}

  state.productionRate = hitungProduksiTotal();
  
  if (state.productionRate > 0) {
    state.pendingProduction = Math.min(1000000, state.pendingProduction + state.productionRate * dt);

  updateHeader();
}

// ============================================================
// TAP HANDLER
// ============================================================
canvas.addEventListener('click', function(e) {
  var rect = canvas.getBoundingClientRect();
  var tapX = e.clientX - rect.left;
  var tapY = e.clientY - rect.top;
  
  for (var i = state.motorList.length - 1; i >= 0; i--) {
    var m = state.motorList[i];
    if (m.status !== 'parkir') continue;
    
    var baris = Math.floor(m.slotTarget / 6);
    var kolom = m.slotTarget % 6;
    var xPos = [0.12, 0.25, 0.38, 0.51, 0.64, 0.77][kolom];
    var yPos = [0.35, 0.45, 0.55][baris];
    var mx = state.canvasW * xPos - 30;
    var my = state.canvasH * yPos - 40;
    
    if (tapX >= mx && tapX <= mx + 60 && tapY >= my && tapY <= my + 80) {
      handleTap(m);
      return;
    }
  }
});

function handleTap(m) {
  log('Tap motor: ' + m.id);
  playSyuush();
  
  if (m.jenis === 'moge') {
    // MOGE: wajib iklan
    if (!m.sudahNontonIklan) {
      // Langsung buka iklan
      var win = window.open('https://www.profitableratecpmnetwork.com/q9qnyhdf9c?key=56f60182ff2837aef7d8e65616a77746', '_blank');
      if (!win) {
        window.open('https://omg10.com/4/11785165', '_blank');
      }
      m.sudahNontonIklan = true;
      toast('Iklan dibuka! Setelah selesai, tap moge 5x untuk cuci. 🏍️');
      log('Moge: iklan dibuka');
      return;
    }
    m.tapCount++;
    if (m.tapCount >= 5) {
      cuciSelesai(m, 500);
    } else {
      toast('Tap lagi! (' + m.tapCount + '/5) 💪');
    }
  } else {
    // BEBEK: 1 tap
    if (state.koin < 1 && state.pendingProduction < 1) {
      toast('Koin tidak cukup! 🪙');
      return;
    }
    state.koin -= 1;
    cuciSelesai(m, 1);
  }
}

function cuciSelesai(m, bayar) {
  m.status = 'bersih';
  m.tapCount = 0;
  state.totalCuci++;
  state.exp += 5;
  state.koin += bayar;
  
  // Level up
  var expNeed = state.level * 100;
  if (state.exp >= expNeed) {
    state.level++;
    state.exp = 0;
    toast('Level Up! 🎉 Lv ' + state.level);
    playChime();
  }
  
  playTing();
  toast('+' + bayar + ' koin! 🪙');
  saveExtra();
  saveUser();
  
  // Hapus setelah 1 detik
  setTimeout(function() {
    var idx = state.motorList.indexOf(m);
    if (idx >= 0) state.motorList.splice(idx, 1);
  }, 1000);
  
  // Sync
  syncSaldo();
}

      html += '<div class="upgrade-detail">Produksi: <span>' + m.produksi + '/dtk</span></div>';
      html += '</div>';
      html += '<button class="upgrade-buy" onclick="beliManajer(\'' + m.key + '\')" ' + (owned || state.koin < m.harga ? 'disabled' : '') + '>' + (owned ? '✅' : '🪙 ' + formatAngka(m.harga)) + '</button>';
      html += '</div>';
    });
  } else if (tab === 'cabang') {
    html += '<div class="panel-title">🏢 Cabang <span class="panel-close" onclick="closePanel()">✕</span></div>';
    var cabangHarga = [0, 0, 1000000, 50000000, 2500000000, 100000000000];
    for (var i = 2; i <= 5; i++) {
      var owned = state.cabang >= i;
      html += '<div class="upgrade-card">';
      html += '<div class="upgrade-icon">🏪</div>';
      html += '<div class="upgrade-info">';
      html += '<div class="upgrade-name">Cabang ' + i + '</div>';
      html += '<div class="upgrade-detail">Multiplier: <span>x' + i + '</span></div>';
      html += '</div>';
      html += '<button class="upgrade-buy" onclick="beliCabang(' + i + ')" ' + (owned || state.koin < cabangHarga[i] ? 'disabled' : '') + '>' + (owned ? '✅' : '🪙 ' + formatAngka(cabangHarga[i])) + '</button>';
      html += '</div>';
    }
  } else if (tab === 'toko') {
    html += '<div class="panel-title">🛒 Toko <span class="panel-close" onclick="closePanel()">✕</span></div>';
    if (state.tokoData.length === 0) {
      html += '<div class="empty-msg">Memuat item toko...</div>';
    } else {
      state.tokoData.forEach(function(item) {
        html += '<div class="upgrade-card">';
        html += '<div class="upgrade-icon">🛍️</div>';
        html += '<div class="upgrade-info">';
        html += '<div class="upgrade-name">' + (item.nama || item.name || 'Item') + '</div>';
        html += '<div class="upgrade-detail">' + (item.deskripsi || item.desc || '') + '</div>';
        html += '</div>';
        html += '<button class="upgrade-buy" onclick="beliToko(\'' + (item.id || item.kode) + '\')">🪙 ' + formatAngka(item.harga || 0) + '</button>';
        html += '</div>';
      });
    }
  } else if (tab === 'convert') {
    html += '<div class="panel-title">🔄 Convert Koin <span class="panel-close" onclick="closePanel()">✕</span></div>';
    html += '<div class="stat-row"><span class="stat-label">Koin kamu</span><span class="stat-value">' + state.koin + '</span></div>';
    html += '<div class="stat-row"><span class="stat-label">Rate</span><span class="stat-value">1000 koin = Rp 100</span></div>';
    html += '<div class="stat-row"><span class="stat-label">Min. convert</span><span class="stat-value">10.000 koin</span></div>';
    html += '<div style="margin:12px 0"><input type="number" id="convertAmount" placeholder="Jumlah koin" style="width:100%;padding:10px;border-radius:10px;border:1px solid #F59E0B;background:#1a0505;color:#fff;font-family:Poppins;font-size:14px"></div>';
    html += '<button class="btn-primary" onclick="doConvert(false)">Convert (potong 10%)</button>';
    html += '<button class="btn-primary" style="margin-top:8px;background:linear-gradient(135deg,#F59E0B,#D97706);color:#1a0505" onclick="doConvert(true)">Nonton Iklan (tanpa potong)</button>';
  } else if (tab === 'topup') {
    html += '<div class="panel-title">💳 Topup <span class="panel-close" onclick="closePanel()">✕</span></div>';
    html += '<div class="section-label">Koin</div>';
    var koinPkgs = [{r:5000,k:100000},{r:10000,k:250000},{r:25000,k:700000},{r:50000,k:1500000},{r:100000,k:3500000}];
    koinPkgs.forEach(function(p) {
      html += '<div class="upgrade-card"><div class="upgrade-icon">🪙</div><div class="upgrade-info"><div class="upgrade-name">' + formatAngka(p.k) + ' Koin</div><div class="upgrade-detail">' + formatRupiah(p.r) + '</div></div><button class="upgrade-buy" onclick="topup(\'koin\',' + p.r + ')">Beli</button></div>';
    });
    html += '<div class="section-label">Rupiah</div>';
    var rpPkgs = [{r:5000,k:5500},{r:10000,k:12000},{r:25000,k:32500},{r:50000,k:70000},{r:100000,k:150000}];
    rpPkgs.forEach(function(p) {
      html += '<div class="upgrade-card"><div class="upgrade-icon">💰</div><div class="upgrade-info"><div class="upgrade-name">' + formatRupiah(p.k) + '</div><div class="upgrade-detail">' + formatRupiah(p.r) + '</div></div><button class="upgrade-buy" onclick="topup(\'rupiah\',' + p.r + ')">Beli</button></div>';
    });
    html += '<div class="section-label">Kristal</div>';
    var krPkgs = [{r:5000,k:10},{r:10000,k:25},{r:25000,k:70},{r:50000,k:160},{r:100000,k:350}];
    krPkgs.forEach(function(p) {
      html += '<div class="upgrade-card"><div class="upgrade-icon">💎</div><div class="upgrade-info"><div class="upgrade-name">' + p.k + ' Kristal</div><div class="upgrade-detail">' + formatRupiah(p.r) + '</div></div><button class="upgrade-buy" onclick="topup(\'kristal\',' + p.r + ')">Beli</button></div>';
    });
    html += '<div style="text-align:center;margin-top:12px"><img src="assets/qris.png" style="width:200px;border-radius:12px;border:2px solid #F59E0B" onerror="this.style.display=\'none\'"><p style="font-size:11px;color:#aaa;margin-top:6px">Scan QRIS untuk bayar</p></div>';
    html += '<input type="file" id="buktiUpload" accept="image/*" style="margin-top:8px;font-size:11px"><button class="btn-primary" style="margin-top:6px" onclick="uploadBukti()">Upload Bukti</button>';
  } else if (tab === 'voucher') {
    html += '<div class="panel-title">🎫 Voucher <span class="panel-close" onclick="closePanel()">✕</span></div>';
    html += '<div class="upgrade-card"><div class="upgrade-icon">🎫</div><div class="upgrade-info"><div class="upgrade-name">Voucher Cuci Gratis</div><div class="upgrade-detail">70.000 koin atau Rp 7.000</div></div><button class="upgrade-buy" onclick="beliVoucher()">Beli</button></div>';
    html += '<div style="font-size:11px;color:#aaa;margin-top:8px">Max 1 voucher per minggu. Konfirmasi nomor HP diperlukan.</div>';
  } else if (tab === 'cerita') {
    html += '<div class="panel-title">📖 Cerita <span class="panel-close" onclick="closePanel()">✕</span></div>';
    if (state.storyBab.length === 0) {
      html += '<div class="empty-msg">Memuat cerita...</div>';
    } else {
      state.storyBab.forEach(function(bab, idx) {
        var unlocked = state.storyRead['bab' + (idx+1)] || idx === 0;
        html += '<div class="upgrade-card" onclick="bukaCerita(' + idx + ')" style="' + (unlocked ? '' : 'opacity:0.5') + '">';
        html += '<div class="upgrade-icon">' + (unlocked ? '📖' : '🔒') + '</div>';
        html += '<div class="upgrade-info"><div class="upgrade-name">Bab ' + (idx+1) + '</div><div class="upgrade-detail">' + (bab.judul || bab.title || '') + '</div></div>';
        html += '</div>';
      });
    }
  } else if (tab === 'quest') {
    html += '<div class="panel-title">📋 Quest <span class="panel-close" onclick="closePanel()">✕</span></div>';
    if (state.quests.length === 0) {
      html += '<div class="empty-msg">Memuat quest...</div>';
    } else {
      ['Harian', 'Mingguan', 'Spesial'].forEach(function(kat) {
        html += '<div class="section-label">' + kat + '</div>';
        state.quests.filter(function(q) { return (q.kategori || q.category || '').toLowerCase() === kat.toLowerCase(); }).forEach(function(q) {
          var prog = state.questProgress[q.id] || 0;
          var target = q.target || 1;
          var pct = Math.min(100, prog / target * 100);
          html += '<div class="upgrade-card"><div class="upgrade-icon">📋</div><div class="upgrade-info"><div class="upgrade-name">' + (q.nama || q.name || 'Quest') + '</div>';
          html += '<div class="upgrade-detail">Progress: ' + prog + '/' + target + ' | Reward: ' + (q.reward || 0) + ' koin</div>';
          html += '<div style="height:5px;background:#1a0505;border-radius:3px;margin-top:4px;overflow:hidden"><div style="height:100%;width:' + pct + '%;background:#F59E0B;border-radius:3px"></div></div>';
          html += '</div>';
          html += '<button class="upgrade-buy" onclick="klaimQuest(\'' + q.id + '\')" ' + (prog >= target ? '' : 'disabled') + '>Klaim</button></div>';
        });
      });
    }
  } else if (tab === 'profil') {
    html += '<div class="panel-title">👤 Profil <span class="panel-close" onclick="closePanel()">✕</span></div>';
    if (state.user) {
      html += '<div class="stat-row"><span class="stat-label">Nama</span><span class="stat-value">' + (state.user.nama || '-') + '</span></div>';
      html += '<div class="stat-row"><span class="stat-label">Nomor</span><span class="stat-value">' + (state.user.nomor || '-') + '</span></div>';
      html += '<div class="stat-row"><span class="stat-label">Level</span><span class="stat-value">' + state.level + '</span></div>';
      html += '<div class="stat-row"><span class="stat-label">Koin</span><span class="stat-value">' + state.koin + '</span></div>';
      html += '<div class="stat-row"><span class="stat-label">Rupiah</span><span class="stat-value">' + formatRupiah(state.rupiah) + '</span></div>';
      html += '<div class="stat-row"><span class="stat-label">Kristal</span><span class="stat-value">' + state.kristal + '</span></div>';
      html += '<div class="stat-row"><span class="stat-label">Total Cuci</span><span class="stat-value">' + state.totalCuci + '</span></div>';
      html += '<div class="stat-row"><span class="stat-label">Cabang</span><span class="stat-value">' + state.cabang + '</span></div>';
      html += '<button class="btn-primary" style="margin-top:16px;background:linear-gradient(135deg,#333,#111)" onclick="logout()">🚪 Keluar</button>';
    }
  } else if (tab === 'admin') {
    renderAdminPanel(html);
    return;
  }
  
  panel.innerHTML = html;
  panel.classList.add('show');
  state.panelTerbuka = true;
  state.tabAktif = tab;
}

function closePanel() {
  document.getElementById('bottomPanel').classList.remove('show');
  state.panelTerbuka = false;
  document.querySelectorAll('.nav-item').forEach(function(n) { n.classList.remove('active'); });
  document.querySelector('.nav-item[data-tab="game"]').classList.add('active');
}

// ============================================================
// NAV HANDLER
// ============================================================
document.querySelectorAll('.nav-item').forEach(function(item) {
  item.addEventListener('click', function() {
    var tab = this.getAttribute('data-tab');
    log('Nav klik: ' + tab);
    
    if (state.panelTerbuka && state.tabAktif === tab) {
      closePanel();
      return;
    }
    
    document.querySelectorAll('.nav-item').forEach(function(n) { n.classList.remove('active'); });
    this.classList.add('active');
    
    if (tab === 'game') {
      closePanel();
      return;
    }
    
    renderPanel(tab);
  });
});

// ============================================================
// UPGRADE / MANAJER / CABANG
// ============================================================
function beliUpgrade(key) {
  var upgDefs = getUpgradeDefs();
  var u = upgDefs.find(function(x) { return x.key === key; });
  if (!u) return;
  var lv = state.upgrades[key] || 0;
  var harga = Math.floor(u.harga * Math.pow(2.5, lv));
  if (state.koin < harga) { toast('Koin tidak cukup! 🪙'); return; }
  state.koin -= harga;
  state.upgrades[key] = lv + 1;
  playChime();
  toast('Upgrade ' + u.nama + ' Lv ' + (lv+1) + '! 🎉');
  saveExtra(); saveUser();
  renderPanel('game');
}

function beliManajer(key) {
  var manDefs = getManajerDefs();
  var m = manDefs.find(function(x) { return x.key === key; });
  if (!m) return;
  if (state.manajer.some(function(x) { return x.key === key; })) return;
  if (state.koin < m.harga) { toast('Koin tidak cukup! 🪙'); return; }
  state.koin -= m.harga;
  state.manajer.push({ key: key, nama: m.nama, produksi: m.produksi });
  playChime();
  toast('Manajer ' + m.nama + ' direkrut! 👔');
  saveExtra(); saveUser();
  renderPanel('manajer');
}

function beliCabang(n) {
  var harga = [0, 0, 1000000, 50000000, 2500000000, 100000000000][n];
  if (state.cabang >= n) return;
  if (state.koin < harga) { toast('Koin tidak cukup! 🪙'); return; }
  state.koin -= harga;
  state.cabang = n;
  playChime();
  toast('Cabang ' + n + ' dibuka! 🏢');
  saveExtra(); saveUser();
  renderPanel('cabang');
}

// ============================================================
// TOKO / CONVERT / TOPUP / VOUCHER
// ============================================================
function beliToko(id) {
  toast('Fitur toko segera hadir! 🛒');
}

function doConvert(pakaiIklan) {
  var input = document.getElementById('convertAmount');
  var amount = parseInt(input.value) || 0;
  if (amount < 10000) { toast('Minimal 10.000 koin!'); return; }
  if (amount > state.koin) { toast('Koin tidak cukup!'); return; }
  var rupiah = Math.floor(amount / 1000 * 100);
  if (!pakaiIklan) rupiah = Math.floor(rupiah * 0.9);
  state.koin -= amount;
  state.rupiah += rupiah;
  playChime();
  toast('Convert berhasil! +' + formatRupiah(rupiah));
  saveUser(); syncSaldo();
  renderPanel('convert');
}

function topup(jenis, nominal) {
  toast('Topup ' + formatRupiah(nominal) + ' - hubungi admin untuk konfirmasi');
}

function uploadBukti() {
  toast('Bukti diupload! Menunggu verifikasi admin. 📸');
}

function beliVoucher() {
  if (state.koin >= 70000) {
    state.koin -= 70000;
    var kode = 'MP7K-' + Math.random().toString(36).substr(2, 6).toUpperCase();
    toast('Voucher: ' + kode + ' 🎫');
    saveUser(); syncSaldo();
  } else {
    toast('Koin tidak cukup! Butuh 70.000 koin.');
  }
}

// ============================================================
// CERITA
// ============================================================
function bukaCerita(idx) {
  var bab = state.storyBab[idx];
  if (!bab) return;
  
  // Cek unlock
  if (idx === 0 && !state.storyRead['bab1']) {
    // Wajib modal bab 1
    tampilkanStoryModal(bab, idx);
    return;
  }
  
  tampilkanStoryModal(bab, idx);
}

function tampilkanStoryModal(bab, idx) {
  var overlay = document.createElement('div');
  overlay.className = 'story-overlay';
  var imgSrc = state.motorImages['pak-aldi'] ? state.motorImages['pak-aldi'].src : '';
  overlay.innerHTML = '<div class="story-box">' +
    (imgSrc ? '<img src="' + imgSrc + '" alt="Pak Aldi">' : '<div style="font-size:60px">👨</div>') +
    '<h2>Bab ' + (idx+1) + ': ' + (bab.judul || bab.title || '') + '</h2>' +
    '<p>' + (bab.isi || bab.content || 'Cerita belum tersedia.') + '</p>' +
    '<button class="story-btn" onclick="tutupStoryModal(this,' + idx + ')">Lanjut</button>' +
    '</div>';
  document.body.appendChild(overlay);
  state.storyRead['bab' + (idx+1)] = true;
  saveExtra();
  playChime();
}

function tutupStoryModal(btn, idx) {
  btn.closest('.story-overlay').remove();
  if (idx === 0) {
    toast('Bab 1 selesai! Cerita selanjutnya terbuka. 📖');
  }
}

// ============================================================
// QUEST
// ============================================================
function klaimQuest(id) {
  var q = state.quests.find(function(x) { return x.id === id; });
  if (!q) return;
  var prog = state.questProgress[id] || 0;
  if (prog < (q.target || 1)) return;
  state.koin += (q.reward || 0);
  state.questProgress[id] = 0;
  playChime();
  toast('Quest selesai! +' + (q.reward || 0) + ' koin 🎉');
  saveExtra(); saveUser();
  renderPanel('quest');
}

// ============================================================
// ADMIN PANEL
// ============================================================
function renderAdminPanel(html) {
  var panel = document.getElementById('bottomPanel');
  if (!state.adminMode) {
    panel.innerHTML = '<div class="panel-title">🔐 Admin <span class="panel-close" onclick="closePanel()">✕</span></div><div class="empty-msg">Akses ditolak. Gunakan ?admin=1</div>';
    panel.classList.add('show');
    return;
  }
  var tabs = ['Dashboard','Pemain','Detail','Topup','Voucher','Toko','Manajer','Cabang','Cerita','Quest','Config','Log'];
  html += '<div class="panel-title">🛠️ Admin Panel <span class="panel-close" onclick="closePanel()">✕</span></div>';
  html += '<div style="display:flex;gap:4px;overflow-x:auto;margin-bottom:10px;padding-bottom:4px">';
  tabs.forEach(function(t) {
    html += '<button class="btn-secondary" style="font-size:10px;padding:4px 10px;white-space:nowrap" onclick="adminTab(\'' + t + '\')">' + t + '</button>';
  });
  html += '</div>';
  html += '<div id="adminContent"><div class="empty-msg">Pilih tab admin</div></div>';
  panel.innerHTML = html;
  panel.classList.add('show');
  state.panelTerbuka = true;
}

function adminTab(tab) {
  var c = document.getElementById('adminContent');
  if (!c) return;
  if (tab === 'Dashboard') {
    c.innerHTML = '<div class="stat-row"><span class="stat-label">Total Pemain</span><span class="stat-value">-</span></div>' +
      '<div class="stat-row"><span class="stat-label">Total Koin</span><span class="stat-value">-</span></div>' +
      '<div class="stat-row"><span class="stat-label">Status Server</span><span class="stat-value">🟢 Online</span></div>';
  } else {
    c.innerHTML = '<div class="empty-msg">Fitur ' + tab + ' segera hadir</div>';
  }
}

// ============================================================
// LOGOUT
// ============================================================
function logout() {
  localStorage.removeItem(LS_USER);
  window.location.href = 'login.html';
}

// ============================================================
// INIT
// ============================================================
function init() {
  log('Dashboard: load');
  
  // Device ID
  state.deviceId = generateDeviceId();
  
  // Admin mode
  if (window.location.search.includes('admin=1') && localStorage.getItem(LS_ADMIN)) {
    state.adminMode = true;
    log('Admin mode aktif');
  }
  
  // Load extra
  loadExtra();
  
  // Resize canvas
  resizeCanvas();
  
  // Cek user
  var adaUser = loadUser();
  if (!adaUser) {
    document.getElementById('loginPrompt').classList.add('show');
    document.getElementById('loadingScreen').style.display = 'none';
    return;
  }
  
  // Setup header nama langsung
  if (state.user) {
    document.getElementById('headerName').textContent = state.user.nama || 'Pemain';
  }
  
  // Fetch user dari server di background (max 3 detik)
  apiCall('bacaSatu', { sheet: 'Users', kolom: 'nomor', nilai: state.user.nomor }).then(function(res) {
    if (res && res.ok && res.data) {
      var u = Array.isArray(res.data) ? res.data[0] : res.data;
      if (u) {
        state.user._row = u.row || u._row;
        state.user.nama = u.nama || state.user.nama;
        state.koin = u.saldo_koin || state.koin;
        state.rupiah = u.saldo_rupiah || state.rupiah;
        state.kristal = u.kristal || state.kristal;
        state.level = u.level || state.level;
        saveUser();
        updateHeader();
        log('User: ' + u.nama + ' (dari server)');
      }
    }
  }).catch(function(e) {
    log('Gagal fetch user: ' + e.message);
  });
  
  // Load assets
  loadAssets();
  
  // Musik
  state.musicOn = localStorage.getItem(LS_MUSIC) === '1';
  document.getElementById('musicBtn').textContent = state.musicOn ? '🎵' : '🔇';
  if (state.musicOn) {
    setTimeout(function() {
      bgMusic = new Audio('assets/musik-latar.mp3');
      bgMusic.loop = true;
      bgMusic.volume = 0.3;
      bgMusic.play().catch(function(){});
    }, 1000);
  }
  
  // Fetch cerita & quest
  apiCall('baca', { sheet: 'Story' }).then(function(res) {
    if (res && res.ok && res.data) state.storyBab = res.data;
  }).catch(function(){});
  
  apiCall('baca', { sheet: 'Quests' }).then(function(res) {
    if (res && res.ok && res.data) state.quests = res.data;
  }).catch(function(){});
  
  apiCall('baca', { sheet: 'Toko' }).then(function(res) {
    if (res && res.ok && res.data) state.tokoData = res.data;
  }).catch(function(){});
  
  // Hide loading
  document.getElementById('loadingScreen').style.display = 'none';
  
  // Start loops
  setInterval(productionLoop, 1000);
  setInterval(motorSpawnLoop, 500);
  setInterval(weatherLoop, 1000);
  setInterval(syncSaldo, 30000);
  
  // Game loop
  gameLoop();
  
  // Weather init
  state.weatherTimer = 60 + Math.floor(Math.random() * 120);
  
  // Cek story unlocked
  if (!state.storyRead['bab1']) {
    setTimeout(function() {
      if (state.storyBab.length > 0) {
        bukaCerita(0);
      }
    }, 1500);
  }
  
  log('User: ' + (state.user ? state.user.nama : 'unknown'));
}

// Start
window.addEventListener('load', init);

// Prevent double tap zoom
document.addEventListener('dblclick', function(e) { e.preventDefault(); }, { passive: false });

// Header music button
document.getElementById('musicBtn').addEventListener('click', toggleMusic);

// Header menu button
document.getElementById('menuBtn').addEventListener('click', function() {
  if (state.panelTerbuka) {
    closePanel();
  } else {
    renderPanel('profil');
  }
});

// Weather button (refresh)
document.getElementById('weatherBtn').addEventListener('click', function() {
  state.weatherTimer = 0;
  weatherLoop();
  toast('Cuaca: ' + (state.cuaca === 'panas' ? '☀️ Panas' : '🌧️ Hujan'));
});
</script>
