<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Steam MP 7000 Tycoon — Dashboard</title>
<style>
  /* ===== RESET & DASAR ===== */
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(160deg, #7a0000 0%, #c00 50%, #ff4d4d 100%);
    color:#fff; position:relative; user-select:none;
  }

  /* ===== BACKGROUND AWAN ===== */
  .bg-awan { position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:0; }
  .awan {
    position:absolute; width:120px; height:40px; background:rgba(255,255,255,.13);
    border-radius:50px; filter:blur(6px); animation:gerakAwan linear infinite;
  }
  .awan::before, .awan::after { content:""; position:absolute; background:rgba(255,255,255,.13); border-radius:50%; }
  .awan::before { width:60px; height:60px; top:-25px; left:15px; }
  .awan::after  { width:45px; height:45px; top:-18px; left:55px; }
  .awan.a1 { top:10%; animation-duration:30s; }
  .awan.a2 { top:35%; animation-duration:42s; animation-delay:-10s; transform:scale(.8); }
  .awan.a3 { top:70%; animation-duration:50s; animation-delay:-25s; transform:scale(1.2); }
  @keyframes gerakAwan { from{left:-160px} to{left:110%} }

  /* ===== HEADER ===== */
  .header {
    position:relative; z-index:10;
    display:flex; align-items:center; gap:8px;
    padding:8px 10px;
    background:rgba(0,0,0,.35); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    border-bottom:1px solid rgba(255,255,255,.15);
    flex-wrap:wrap;
  }
  .header .nama { font-weight:800; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:90px; }
  .stat { display:flex; align-items:center; gap:3px; font-size:12px; font-weight:700; background:rgba(255,255,255,.12); padding:4px 7px; border-radius:8px; }
  .stat .ikon { font-size:13px; }
  .header-spacer { flex:1; }
  .btn-header {
    background:rgba(255,255,255,.15); border:none; color:#fff; width:34px; height:34px;
    border-radius:10px; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:.2s;
  }
  .btn-header:active { transform:scale(.92); background:rgba(255,255,255,.3); }

  /* Level bar di header */
  .level-bar-wrap { width:100%; display:flex; align-items:center; gap:6px; margin-top:2px; }
  .level-bar { flex:1; height:6px; background:rgba(0,0,0,.35); border-radius:6px; overflow:hidden; }
  .level-bar-fill { height:100%; width:0%; background:linear-gradient(90deg,#ffd700,#ff8c00); border-radius:6px; transition:width .4s; }
  .level-txt { font-size:10px; font-weight:700; opacity:.9; }

  /* ===== AREA GAME (TAP) ===== */
  .area-game {
    position:absolute; inset:0; z-index:1;
    display:flex; align-items:center; justify-content:center;
    touch-action:manipulation;
  }
  .motor-visual {
    font-size:110px; filter:drop-shadow(0 8px 20px rgba(0,0,0,.4));
    animation:goyang 2.5s ease-in-out infinite; pointer-events:none;
  }
  @keyframes goyang { 0%,100%{transform:translateY(0) rotate(-2deg)} 50%{transform:translateY(-10px) rotate(2deg)} }

  /* Efek tap "+1" */
  .efek-tap {
    position:absolute; font-size:22px; font-weight:900; color:#ffd700;
    text-shadow:0 2px 6px rgba(0,0,0,.5); pointer-events:none; z-index:50;
    animation:naikHilang 0.8s ease-out forwards;
  }
  @keyframes naikHilang {
    0%   { transform:translate(-50%,-50%) scale(.6); opacity:1; }
    100% { transform:translate(-50%,-160%) scale(1.3); opacity:0; }
  }
  /* Partikel busa */
  .partikel {
    position:absolute; width:10px; height:10px; background:rgba(255,255,255,.85);
    border-radius:50%; pointer-events:none; z-index:49;
    animation:pecah 0.7s ease-out forwards;
  }
  @keyframes pecah {
    0%   { transform:translate(-50%,-50%) scale(.3); opacity:1; }
    100% { transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.4); opacity:0; }
  }

  /* ===== MENU SLIDE DARI KIRI ===== */
  .overlay {
    position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:100;
    opacity:0; pointer-events:none; transition:.3s;
  }
  .overlay.aktif { opacity:1; pointer-events:auto; }
  .menu-slide {
    position:fixed; top:0; left:0; bottom:0; width:78%; max-width:320px;
    background:linear-gradient(180deg,#a30000,#7a0000); z-index:101;
    transform:translateX(-105%); transition:.3s cubic-bezier(.4,0,.2,1);
    display:flex; flex-direction:column; box-shadow:6px 0 24px rgba(0,0,0,.5);
  }
  .menu-slide.aktif { transform:translateX(0); }
  .menu-header { padding:16px; border-bottom:1px solid rgba(255,255,255,.15); display:flex; justify-content:space-between; align-items:center; }
  .menu-header h2 { font-size:16px; font-weight:800; }
  .menu-list { flex:1; overflow-y:auto; padding:8px; }
  .menu-item {
    display:flex; align-items:center; gap:12px; padding:13px 14px; border-radius:12px;
    background:rgba(255,255,255,.08); margin-bottom:6px; cursor:pointer; transition:.2s;
    font-weight:600; font-size:14px;
  }
  .menu-item:active, .menu-item.aktif { background:rgba(255,255,255,.25); transform:translateX(4px); }
  .menu-item .ikon { font-size:20px; width:26px; text-align:center; }

  /* ===== PANEL KONTEN (tab) ===== */
  .panel {
    position:fixed; inset:0; top:0; z-index:90;
    background:linear-gradient(160deg,#8a0000,#c00 50%,#ff4d4d);
    transform:translateY(100%); transition:.32s cubic-bezier(.4,0,.2,1);
    display:flex; flex-direction:column; padding-top:0;
  }
  .panel.aktif { transform:translateY(0); }
  .panel-head {
    display:flex; align-items:center; gap:10px; padding:12px 14px;
    background:rgba(0,0,0,.3); border-bottom:1px solid rgba(255,255,255,.15);
  }
  .panel-head h3 { font-size:16px; font-weight:800; flex:1; }
  .panel-body { flex:1; overflow-y:auto; padding:14px; -webkit-overflow-scrolling:touch; }

  /* Kartu umum */
  .kartu {
    background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.18);
    border-radius:14px; padding:12px 14px; margin-bottom:10px;
  }
  .kartu h4 { font-size:14px; margin-bottom:4px; }
  .kartu .sub { font-size:11px; opacity:.8; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .row + .row { margin-top:6px; }
  .btn {
    padding:8px 14px; border:none; border-radius:9px; font-weight:700; font-size:12px;
    cursor:pointer; transition:.2s;
  }
  .btn:active { transform:scale(.95); }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  .btn-merah { background:linear-gradient(135deg,#fff,#ffe0e0); color:#c00; }
  .btn-hijau { background:linear-gradient(135deg,#4caf50,#2e7d32); color:#fff; }
  .btn-biru  { background:linear-gradient(135deg,#2196f3,#1565c0); color:#fff; }
  .btn-abu   { background:rgba(255,255,255,.15); color:#fff; }
  .btn-kuning{ background:linear-gradient(135deg,#ffd700,#ff8c00); color:#5a3000; }

  .input-biasa {
    width:100%; padding:11px 13px; border-radius:10px; border:1px solid rgba(255,255,255,.3);
    background:rgba(255,255,255,.12); color:#fff; font-size:14px; outline:none;
  }
  .input-biasa::placeholder { color:rgba(255,255,255,.5); }

  .badge { display:inline-block; padding:2px 8px; border-radius:20px; font-size:10px; font-weight:700; }
  .badge-aktif { background:#4caf50; }
  .badge-lock  { background:rgba(0,0,0,.4); }

  /* ===== TOAST ===== */
  .toast {
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(120%);
    background:rgba(0,0,0,.85); color:#fff; padding:11px 20px; border-radius:30px;
    font-size:13px; font-weight:600; z-index:999; transition:.3s; max-width:88%; text-align:center;
    box-shadow:0 8px 24px rgba(0,0,0,.4);
  }
  .toast.tampil { transform:translateX(-50%) translateY(0); }
  .toast.sukses { background:rgba(46,125,50,.95); }
  .toast.error  { background:rgba(183,28,28,.95); }

  /* ===== LOADING ===== */
  .loading-overlay {
    position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:900;
    display:none; align-items:center; justify-content:center;
  }
  .loading-overlay.aktif { display:flex; }
  .spinner {
    width:44px; height:44px; border:4px solid rgba(255,255,255,.25);
    border-top-color:#fff; border-radius:50%; animation:spin .8s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* ===== PANEL ADMIN ===== */
  .admin-overlay {
    position:fixed; inset:0; background:rgba(0,0,0,.85); z-index:950;
    display:none; align-items:center; justify-content:center; padding:20px;
  }
  .admin-overlay.aktif { display:flex; }
  .admin-login-card {
    width:100%; max-width:340px; background:#1a1a1a; border:1px solid #333;
    border-radius:16px; padding:20px; color:#fff;
  }
  .admin-login-card h3 { text-align:center; margin-bottom:14px; color:#ff5252; }
  .admin-panel {
    position:fixed; inset:0; background:#111; z-index:960; display:none;
    flex-direction:column; color:#eee;
  }
  .admin-panel.aktif { display:flex; }
  .admin-head { background:#1a1a1a; padding:10px; display:flex; align-items:center; gap:8px; border-bottom:1px solid #333; }
  .admin-head h3 { flex:1; font-size:15px; color:#ff5252; }
  .admin-tabs { display:flex; overflow-x:auto; background:#1a1a1a; border-bottom:1px solid #333; padding:6px; gap:4px; }
  .admin-tabs button {
    padding:7px 12px; border:none; background:#222; color:#aaa; border-radius:8px;
    font-size:11px; font-weight:700; white-space:nowrap; cursor:pointer;
  }
  .admin-tabs button.aktif { background:#ff5252; color:#fff; }
  .admin-body { flex:1; overflow-y:auto; padding:12px; }
  .admin-body .kartu { background:#1a1a1a; border-color:#333; }
  .admin-body h4 { color:#ff5252; }
  .admin-input {
    width:100%; padding:9px 11px; border-radius:8px; border:1px solid #333;
    background:#222; color:#fff; font-size:13px; outline:none; margin-bottom:6px;
  }
  .tabel-admin { width:100%; border-collapse:collapse; font-size:11px; }
  .tabel-admin th, .tabel-admin td { padding:6px 4px; border-bottom:1px solid #2a2a2a; text-align:left; }
  .tabel-admin th { color:#ff5252; }

  /* Slot iklan */
  .slot-iklan {
    background:rgba(0,0,0,.3); border:1px dashed rgba(255,255,255,.3);
    border-radius:10px; padding:14px; text-align:center; font-size:11px;
    opacity:.7; margin-bottom:10px;
  }

  /* Scrollbar halus */
  ::-webkit-scrollbar { width:5px; }
  ::-webkit-scrollbar-thumb { background:rgba(255,255,255,.3); border-radius:5px; }
</style>
</head>
<body>

<!-- Background awan -->
<div class="bg-awan">
  <div class="awan a1"></div>
  <div class="awan a2"></div>
  <div class="awan a3"></div>
</div>

<!-- ===== AREA GAME (tap) ===== -->
<div class="area-game" id="areaGame">
  <div class="motor-visual" id="motorVisual">🏍️</div>
</div>

<!-- ===== HEADER ===== -->
<div class="header" style="position:fixed;top:0;left:0;right:0;">
  <div class="nama" id="hdrNama" onclick="tapLogo()">🏍️ Pak Aldi</div>
  <div class="stat"><span class="ikon">🪙</span><span id="hdrKoin">0</span></div>
  <div class="stat"><span class="ikon">💵</span><span id="hdrRupiah">0</span></div>
  <div class="stat"><span class="ikon">💎</span><span id="hdrKristal">0</span></div>
  <div class="header-spacer"></div>
  <button class="btn-header" id="btnMusik" onclick="toggleMusik()">🔊</button>
  <button class="btn-header" onclick="bukaMenu()">☰</button>
  <div class="level-bar-wrap">
    <span class="level-txt">Lv <span id="hdrLevel">1</span></span>
    <div class="level-bar"><div class="level-bar-fill" id="hdrLevelFill"></div></div>
  </div>
</div>

<!-- ===== MENU SLIDE ===== -->
<div class="overlay" id="overlayMenu" onclick="tutupMenu()"></div>
<div class="menu-slide" id="menuSlide">
  <div class="menu-header">
    <h2>🏍️ Menu</h2>
    <button class="btn-header" onclick="tutupMenu()">✕</button>
  </div>
  <div class="menu-list" id="menuList"></div>
</div>

<!-- ===== PANEL KONTEN ===== -->
<div class="panel" id="panel">
  <div class="panel-head">
    <button class="btn-header" onclick="tutupPanel()">←</button>
    <h3 id="panelJudul">Game</h3>
  </div>
  <div class="panel-body" id="panelBody"></div>
</div>

<!-- ===== TOAST & LOADING ===== -->
<div class="toast" id="toast"></div>
<div class="loading-overlay" id="loadingOverlay"><div class="spinner"></div></div>

<!-- ===== ADMIN LOGIN OVERLAY ===== -->
<div class="admin-overlay" id="adminLoginOverlay">
  <div class="admin-login-card">
    <h3>🔐 Admin Login</h3>
    <input class="admin-input" type="text" id="adminId" placeholder="Admin ID" value="1001">
    <input class="admin-input" type="password" id="adminPass" placeholder="Password" value="123456">
    <button class="btn btn-merah" style="width:100%;padding:11px;margin-top:6px" onclick="adminLogin()">Masuk</button>
    <button class="btn btn-abu" style="width:100%;padding:9px;margin-top:6px" onclick="tutupAdminLogin()">Batal</button>
  </div>
</div>

<!-- ===== ADMIN PANEL ===== -->
<div class="admin-panel" id="adminPanel">
  <div class="admin-head">
    <h3>⚙️ Admin Panel</h3>
    <button class="btn-header" onclick="tutupAdminPanel()">✕</button>
  </div>
  <div class="admin-tabs" id="adminTabs"></div>
  <div class="admin-body" id="adminBody"></div>
</div>

<!-- ===== AUDIO MUSIK ===== -->
<audio id="musikLatar" loop preload="none">
  <source src="assets/musik-latar.mp3" type="audio/mpeg">
</audio>

<script>
/* =========================================================
   KONFIGURASI — SAMA PERSIS DENGAN index.html
   ========================================================= */
const API_URL = "https://script.google.com/macros/s/AKfycbyp04EZaT8vhi5gDmTeSw1ovDVDVh-cF-EkdcQohxu2ys3MwGrJm8yZg6A02qrPHujO6g/exec";
const API_KEY = "smp7k_ganti_ini_nanti";

/* =========================================================
   CEK TOKEN — kalau tidak ada, tendang ke index
   ========================================================= */
let TOKEN = localStorage.getItem("smp7k_token");
if (!TOKEN) { window.location.href = "index.html"; }

/* =========================================================
   STATE LOKAL
   ========================================================= */
let state = {
  profil: null,          // data dari getProfile
  koin: 0,
  rupiah: 0,
  kristal: 0,
  level: 1,
  produksiPerDetik: 0,
  totalKoin: 0,
  upgrade: {},           // bagian -> level
  manajer: {},           // bagian -> {level, stamina, ...}
  cabang: [],
  cabangAktif: 1,
  toko: [],
  itemDimiliki: {},
  ceritaTerbuka: [],
  logTerakhirSync: 0,
  deviceId: localStorage.getItem("smp7k_device_id") || (() => {
    const id = "dev_" + Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-6);
    localStorage.setItem("smp7k_device_id", id); return id;
  })(),
  adminToken: localStorage.getItem("smp7k_admin_token") || null,
  adminTabAktif: "dashboard"
};

/* =========================================================
   FUNGSI API TERPUSAT
   ========================================================= */
async function panggilApi(action, data = null, token = null) {
  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        api_key: API_KEY,
        action: action,
        token: token,
        data: data
      })
    });

    if (!res.ok) return { ok:false, message:"Server tidak merespons dengan benar ("+res.status+")" };

    let json;
    try { json = await res.json(); }
    catch { return { ok:false, message:"Server tidak merespons dengan benar" }; }

    // Sesi habis → tendang
    if (json.ok === false && json.message && json.message.toLowerCase().includes("sesi")) {
      localStorage.removeItem("smp7k_token");
      window.location.href = "index.html";
      return json;
    }
    return json;
  } catch (err) {
    return { ok:false, message:"Koneksi bermasalah. Cek internet." };
  }
}

/* =========================================================
   UI HELPER
   ========================================================= */
function toast(msg, tipe = "") {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast tampil " + tipe;
  clearTimeout(t._tm);
  t._tm = setTimeout(() => { t.className = "toast " + tipe; }, 2200);
}
function loading(aktif) {
  document.getElementById("loadingOverlay").classList.toggle("aktif", aktif);
}
function formatAngka(n) {
  n = Math.floor(n || 0);
  if (n >= 1e12) return (n/1e12).toFixed(1) + "T";
  if (n >= 1e9)  return (n/1e9).toFixed(1) + "M";
  if (n >= 1e6)  return (n/1e6).toFixed(1) + "jt";
  if (n >= 1e3)  return (n/1e3).toFixed(1) + "rb";
  return n.toString();
}
function sensorNomor(nomor) {
  if (!nomor || nomor.length < 6) return nomor || "-";
  return nomor.slice(0,4) + "****" + nomor.slice(-2);
}

/* =========================================================
   EFEK SUARA (Web Audio API)
   ========================================================= */
let audioCtx = null;
function ctxAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function suaraTap() {
  try {
    const c = ctxAudio(), o = c.createOscillator(), g = c.createGain();
    o.type = "sine"; o.frequency.setValueAtTime(900, c.currentTime);
    o.frequency.exponentialRampToValueAtTime(400, c.currentTime + 0.08);
    g.gain.setValueAtTime(0.06, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.1);
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime + 0.1);
  } catch(e){}
}
function suaraKoin() {
  try {
    const c = ctxAudio(), o = c.createOscillator(), g = c.createGain();
    o.type = "triangle"; o.frequency.setValueAtTime(1200, c.currentTime);
    o.frequency.setValueAtTime(1600, c.currentTime + 0.04);
    g.gain.setValueAtTime(0.07, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.18);
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime + 0.18);
  } catch(e){}
}
function suaraLevel() {
  try {
    const c = ctxAudio();
    [523,659,784,1047].forEach((f,i) => {
      const o = c.createOscillator(), g = c.createGain();
      o.type = "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0.001, c.currentTime + i*0.09);
      g.gain.exponentialRampToValueAtTime(0.08, c.currentTime + i*0.09 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + i*0.09 + 0.2);
      o.connect(g); g.connect(c.destination);
      o.start(c.currentTime + i*0.09); o.stop(c.currentTime + i*0.09 + 0.22);
    });
  } catch(e){}
}
function suaraError() {
  try {
    const c = ctxAudio(), o = c.createOscillator(), g = c.createGain();
    o.type = "sawtooth"; o.frequency.setValueAtTime(160, c.currentTime);
    g.gain.setValueAtTime(0.07, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.25);
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime + 0.25);
  } catch(e){}
}

/* =========================================================
   MUSIK LATAR
   ========================================================= */
const elMusik = document.getElementById("musikLatar");
let musikAktif = localStorage.getItem("smp7k_musik") !== "off";
elMusik.volume = 0.35;
function terapkanMusik() {
  document.getElementById("btnMusik").textContent = musikAktif ? "🔊" : "🔇";
  if (musikAktif) {
    elMusik.play().catch(() => {
      // Autoplay diblokir → tunggu interaksi pertama
      const mulai = () => { elMusik.play().catch(()=>{}); document.removeEventListener("touchstart", mulai); document.removeEventListener("click", mulai); };
      document.addEventListener("touchstart", mulai);
      document.addEventListener("click", mulai);
    });
  } else {
    elMusik.pause();
  }
}
function toggleMusik() {
  musikAktif = !musikAktif;
  localStorage.setItem("smp7k_musik", musikAktif ? "on" : "off");
  terapkanMusik();
  toast(musikAktif ? "Musik dinyalakan" : "Musik dimatikan");
}
terapkanMusik();

/* =========================================================
   TAP GAME
   ========================================================= */
const areaGame = document.getElementById("areaGame");
areaGame.addEventListener("touchstart", (e) => {
  // Cegah multitouch berlebihan
  if (e.touches.length > 3) return;
  for (let i = 0; i < e.touches.length; i++) {
    prosesTap(e.touches[i].clientX, e.touches[i].clientY);
  }
}, { passive: true });
areaGame.addEventListener("mousedown", (e) => prosesTap(e.clientX, e.clientY));

function prosesTap(x, y) {
  state.koin += 1;
  state.totalKoin += 1;
  perbaruiHeader();
  suaraTap();
  buatEfekTap(x, y);
}

function buatEfekTap(x, y) {
  // +1
  const plus = document.createElement("div");
  plus.className = "efek-tap";

/* =========================================================
   SYNC PROGRESS KE SERVER tiap 10 detik
   ========================================================= */
async function syncProgress() {
  if (!state.profil) return;
  const tambahan = Math.floor(state.koin - (state.koinTersimpan || 0));
  if (tambahan <= 0 && state.produksiPerDetik <= 0) return;

  const resp = await panggilApi("syncProgress", {
    koin_tambahan: tambahan,
    produksi_per_detik: state.produksiPerDetik,
    total_koin_pernah: Math.floor(state.totalKoin),
    device_id: state.deviceId
  }, TOKEN);

  if (resp.ok && resp.data) {
    state.koinTersimpan = Math.floor(state.koin);
    // Server bisa mengoreksi
    if (typeof resp.data.koin === "number") state.koin = resp.data.koin;
    if (typeof resp.data.rupiah === "number") state.rupiah = resp.data.rupiah;
    if (typeof resp.data.kristal === "number") state.kristal = resp.data.kristal;
    if (typeof resp.data.level === "number") state.level = resp.data.level;
    perbaruiHeader();
  }
}
setInterval(syncProgress, 10000);

/* Sync terakhir saat keluar */
window.addEventListener("beforeunload", () => {
  if (!state.profil) return;
  const tambahan = Math.floor(state.koin - (state.koinTersimpan || 0));
  if (tambahan <= 0 && state.produksiPerDetik <= 0) return;
  // Pakai sendBeacon kalau ada, fallback fetch keepalive
  const payload = JSON.stringify({
    api_key: API_KEY, action: "syncProgress", token: TOKEN,
    data: {
      koin_tambahan: tambahan,
      produksi_per_detik: state.produksiPerDetik,
      total_koin_pernah: Math.floor(state.totalKoin),
      device_id: state.deviceId
    }
  });
  if (navigator.sendBeacon) {
    navigator.sendBeacon(API_URL, new Blob([payload], { type: "application/json" }));
  } else {
    fetch(API_URL, { method:"POST", headers:{"Content-Type":"application/json"}, body: payload, keepalive:true }).catch(()=>{});
  }
});

  if (!file) { suaraError(); toast("Pilih gambar bukti dulu", "error"); return; }
  loading(true);
  const base64 = await kompresGambar(file);
  const resp = await panggilApi("ajukanTopup", {
    jenis: jenis,
    paket: paket.rp,
    jumlah_bayar: paket.rp,
    bukti_base64: base64

  else { suaraError(); toast(resp.message || "Gagal kirim topup", "error"); }

function kompresGambar(file) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement("canvas");
        let { width, height } = img;
        const maks = 800;
        if (width > maks) { height = height * maks / width; width = maks; }
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        let kualitas = 0.7, dataUrl = canvas.toDataURL("image/jpeg", kualitas);
        // turunkan kualitas kalau masih > 500KB
        while (dataUrl.length * 0.75 > 500 * 1024 && kualitas > 0.3) {
          kualitas -= 0.1;
          dataUrl = canvas.toDataURL("image/jpeg", kualitas);
        }
        resolve(dataUrl);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

/* =========================================================
   TERAPKAN DATA PROFIL DARI SERVER
   ========================================================= */
function terapkanDataProfil(d) {
  if (!d) return;
  if (typeof d.koin === "number")   state.koin = d.koin;
  if (typeof d.rupiah === "number") state.rupiah = d.rupiah;
  if (typeof d.kristal === "number")state.kristal = d.kristal;
  if (typeof d.level === "number")  state.level = d.level;
  if (typeof d.produksi_per_detik === "number") state.produksiPerDetik = d.produksi_per_detik;
  if (typeof d.total_koin_pernah === "number") state.totalKoin = d.total_koin_pernah;
  if (d.upgrade) state.upgrade = d.upgrade;
  if (d.manajer) state.manajer = d.manajer;
  if (d.cabang) state.cabang = d.cabang;
  if (typeof d.cabang_aktif !== "undefined") state.cabangAktif = d.cabang_aktif;
  if (d.toko) state.toko = d.toko;
  if (d.cerita_terbuka) state.ceritaTerbuka = d.cerita_terbuka;
  if (d.profil) state.profil = d.profil;
  if (d.user) state.profil = d.user;
  state.koinTersimpan = state.koin;
  perbaruiHeader();
  // hitung ulang produksi dari upgrade + manajer
  hitungProduksi();
}
function hitungProduksi() {
  let total = 0;
  DAFTAR_UPGRADE.forEach(u => {
    const lv = state.upgrade[u.bagian] || 0;
    total += u.produksi * (lv + 1) * (lv > 0 ? 1 : 0);
  });
  Object.keys(state.manajer).forEach(b => {
    const m = state.manajer[b];
    if (m) total += (m.produksi || DAFTAR_MANAJER.find(x => x.bagian === b)?.produksi || 0);
  });
  state.produksiPerDetik = total;
}

  { id:"kasihItem", nama:"Kasih Item" },{ id:"kasihManajer", nama:"Kasih Manajer" },

  { id:"voucher", nama:"Voucher" },{ id:"toko", nama:"Toko" },
  { id:"manajer", nama:"Manajer" },{ id:"cabang", nama:"Cabang" },
  { id:"cerita", nama:"Cerita" },{ id:"config", nama:"Config" },
  { id:"pesan", nama:"Pesan" },{ id:"log", nama:"Log" },{ id:"export", nama:"Export CSV" }
];
function bangunTabAdmin() {
  const w = document.getElementById("adminTabs");
  w.innerHTML = "";

    const b = document.createElement("button");
    b.textContent = t.nama;
    b.className = t.id === state.adminTabAktif ? "aktif" : "";

    w.appendChild(b);
  });

async function renderAdminTab(id) {
  const body = document.getElementById("adminBody");
  body.innerHTML = "<div style='text-align:center;padding:20px'>Memuat...</div>";
  if (!state.adminToken) { body.innerHTML = "<div style='text-align:center;padding:20px;color:#f66'>Sesi admin habis. Login ulang.</div>"; return; }

  if (id === "dashboard") {
    const resp = await panggilApi("adminGetAll", null, state.adminToken);
    if (resp.ok) {
      body.innerHTML = `<div class="kartu"><h4>Ringkasan</h4><pre style="font-size:11px;white-space:pre-wrap">${JSON.stringify(resp.data, null, 1)}</pre></div>`;
    } else body.innerHTML = `<div style="color:#f66">${resp.message}</div>`;
    return;
  }

  if (id === "pemain") {
    const resp = await panggilApi("adminGetAll", null, state.adminToken);
    if (!resp.ok) { body.innerHTML = `<div style="color:#f66">${resp.message}</div>`; return; }
    const pemain = resp.data?.pemain || resp.data || [];
    body.innerHTML = `<input class="admin-input" id="cariPemain" placeholder="Cari pemain...">
      <div id="daftarPemain"></div>`;
    const render = (q = "") => {
      const d = document.getElementById("daftarPemain");
      d.innerHTML = "";
      pemain.filter(p => !q || (p.nama || "").toLowerCase().includes(q.toLowerCase()) || (p.nomor || "").includes(q)).forEach(p => {
        const c = document.createElement("div");
        c.className = "kartu";
        c.innerHTML = `<div class="row"><b>${p.nama || "-"}</b><span class="sub">${p.nomor || ""}</span></div>
          <div class="sub">Lv ${p.level || 1} • 🪙 ${formatAngka(p.koin)} • 💵 ${formatAngka(p.rupiah)} • 💎 ${formatAngka(p.kristal)}</div>
          <button class="btn btn-biru" style="margin-top:6px">Detail</button>`;
        c.querySelector("button").onclick = () => detailPemain(p.user_id || p.id);
        d.appendChild(c);
      });
    };
    render();
    document.getElementById("cariPemain").oninput = (e) => render(e.target.value);
    return;
  }

  if (id === "topup") {
    const resp = await panggilApi("adminGetAll", null, state.adminToken);
    const daftar = resp.data?.topup || [];
    body.innerHTML = "";
    daftar.forEach(t => {
      const c = document.createElement("div");
      c.className = "kartu";
      c.innerHTML = `<div class="row"><b>${t.user_id || t.nama || "-"}</b><span class="sub">${t.status || "pending"}</span></div>
        <div class="sub">${t.jenis} • Rp ${formatAngka(t.jumlah_bayar)}</div>
        <div class="row" style="margin-top:6px"><button class="btn btn-hijau">Approve</button><button class="btn btn-merah">Reject</button></div>`;
      c.querySelectorAll("button")[0].onclick = () => adminApproveTopup(t.topup_id || t.id);
      c.querySelectorAll("button")[1].onclick = () => adminRejectTopup(t.topup_id || t.id);
      body.appendChild(c);
    });
    return;
  }

  if (id === "kasihItem" || id === "kasihManajer" || id === "kasihVoucher") {
    body.innerHTML = `<div class="kartu"><h4>${TAB_ADMIN.find(x=>x.id===id).nama}</h4>
      <input class="admin-input" id="userIdAdmin" placeholder="User ID">
      <input class="admin-input" id="itemIdAdmin" placeholder="Item ID / Bagian / (kosong)">
      <button class="btn btn-hijau" style="width:100%" id="btnKirimAdmin">Kirim</button></div>`;
    document.getElementById("btnKirimAdmin").onclick = async () => {
      const uid = document.getElementById("userIdAdmin").value.trim();
      const item = document.getElementById("itemIdAdmin").value.trim();
      let action = id === "kasihItem" ? "adminKasihItem" : id === "kasihManajer" ? "adminKasihManajer" : "adminKasihVoucher";
      let data = id === "kasihItem" ? { user_id: uid, item_id: item } : id === "kasihManajer" ? { user_id: uid, bagian: item } : { user_id: uid };
      const r = await panggilApi(action, data, state.adminToken);
      toast(r.message || (r.ok ? "Sukses" : "Gagal"), r.ok ? "sukses" : "error");
    };
    return;
  }

  if (id === "log") {
    const resp = await panggilApi("adminLog", { limit: 50 }, state.adminToken);
    body.innerHTML = `<pre style="font-size:11px;white-space:pre-wrap">${JSON.stringify(resp.data || resp, null, 1)}</pre>`;
    return;
  }

  if (id === "config" || id === "toko" || id === "manajer" || id === "cabang" || id === "cerita") {
    const actionMap = { config:"adminKelolaConfig", toko:"adminKelolaToko", manajer:"adminKelolaManajer", cabang:"adminKelolaCabang", cerita:"adminKelolaCerita" };
    body.innerHTML = `<div class="kartu"><h4>Kelola ${id}</h4>
      <input class="admin-input" id="opAdmin" placeholder="operasi (tambah/edit/hapus)">
      <textarea class="admin-input" id="dataAdmin" placeholder="Data JSON" rows="4"></textarea>
      <button class="btn btn-hijau" style="width:100%" id="btnKelola">Kirim</button></div>`;
    document.getElementById("btnKelola").onclick = async () => {
      try {
        const op = document.getElementById("opAdmin").value.trim();
        const data = JSON.parse(document.getElementById("dataAdmin").value || "{}");
        const r = await panggilApi(actionMap[id], { operasi: op, [id]: data }, state.adminToken);
        toast(r.message || (r.ok ? "Sukses" : "Gagal"), r.ok ? "sukses" : "error");
      } catch(e) { toast("JSON tidak valid", "error"); }
    };
    return;
  }

  if (id === "export") {
    body.innerHTML = `<div class="kartu"><h4>Export CSV</h4>
      <input class="admin-input" id="sheetExport" placeholder="Nama sheet (pemain/topup/voucher...)">
      <button class="btn btn-hijau" style="width:100%" id="btnExport">Export</button></div>`;
    document.getElementById("btnExport").onclick = async () => {
      const sheet = document.getElementById("sheetExport").value.trim();
      const r = await panggilApi("adminExportCSV", { sheet }, state.adminToken);
      if (r.ok && r.data?.csv) {
        const blob = new Blob([r.data.csv], { type:"text/csv" });
        const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = sheet + ".csv"; a.click();
      } else toast(r.message || "Gagal export", "error");
    };
    return;
  }

  // Fallback untuk tab lain
  body.innerHTML = `<div class="kartu"><h4>${TAB_ADMIN.find(x=>x.id===id)?.nama || id}</h4><div class="sub">Fitur ini tersedia via API. Gunakan form di bawah.</div>
    <input class="admin-input" id="genericAction" placeholder="action" value="${id}">
    <textarea class="admin-input" id="genericData" placeholder='data JSON' rows="3">null</textarea>
    <button class="btn btn-hijau" style="width:100%" id="btnGeneric">Kirim</button></div>`;
  document.getElementById("btnGeneric").onclick = async () => {
    const action = document.getElementById("genericAction").value.trim();
    let data; try { data = JSON.parse(document.getElementById("genericData").value || "null"); } catch { data = null; }
    const r = await panggilApi(action, data, state.adminToken);
    toast(r.message || (r.ok ? "Sukses" : "Gagal"), r.ok ? "sukses" : "error");
  };
}
