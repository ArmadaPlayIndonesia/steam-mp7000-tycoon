    canvas.width = img.width;
    canvas.height = img.height;
    var ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0);
    try {
      var imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      var data = imageData.data;
      var tol = toleransi || 40;
      for (var i = 0; i < data.length; i += 4) {
        if (data[i] > 255 - tol && data[i+1] > 255 - tol && data[i+2] > 255 - tol) {
          data[i+3] = 0;
        }
      }
      ctx.putImageData(imageData, 0, 0);
      callback(canvas.toDataURL('image/png'));
    } catch(e) {
      callback(imgSrc);
    }
  };
  img.onerror = function() { callback(null); };
  img.src = imgSrc;
}

// ==================== BACKEND FETCH ====================
function apiCall(action, params) {
  var body = { action: action, token: TOKEN };
  if (params) { for (var k in params) { if (params.hasOwnProperty(k)) body[k] = params[k]; } }
  return fetch(BACKEND_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify(body),
    redirect: 'follow'
  })
  .then(function(r) { return r.text(); })
  .then(function(t) {
    try { return JSON.parse(t); }
    catch(e) { return { ok: false, pesan: 'Respons tidak valid' }; }
  })
  .catch(function(e) { return { ok: false, pesan: 'Gagal terhubung ke server' }; });
}

  if (params.get('admin') === '1' && localStorage.getItem('smp7k_admin')) {

  return true;

// ==================== LOAD ASSETS ====================
function loadAsset(key, src, fallbackEmoji) {
  if (assetCache[key]) return assetCache[key];
  // For koin, rupiah, kristal use hilangkanBackgroundPutih
  if (key === 'koin' || key === 'rupiah' || key === 'kristal') {
    hilangkanBackgroundPutih(src, 40, function(result) {
      if (result) { assetCache[key] = result; }
      else { assetCache[key] = fallbackEmoji; }
      renderHeader();
    });
    return fallbackEmoji;
  }
  var img = new Image();
  img.onload = function() { assetCache[key] = src; renderHeader(); };
  img.onerror = function() { assetCache[key] = fallbackEmoji; renderHeader(); };
  img.src = src;
  assetCache[key] = fallbackEmoji;
  return fallbackEmoji;
}

// ==================== GAME CANVAS ====================
function initGame() {
  canvas = document.getElementById('gameCanvas');
  ctx = canvas.getContext('2d');
  cuacaCanvas = document.getElementById('cuacaCanvas');
  cuacaCtx = cuacaCanvas.getContext('2d');
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  // Init parkiran slots (16 slots)
  var slotW = 50, slotH = 70;
  var startX = 40, startY = 120;
  var cols = 4, rows = 4;
  for (var i = 0; i < 16; i++) {
    parkiranSlots.push({
      x: startX + (i % cols) * (slotW + 12),
      y: startY + Math.floor(i / cols) * (slotH + 16),
      w: slotW, h: slotH, occupied: false, motorId: null
    });
  }

  // Load background
  var bg = new Image();
  bg.onload = function() { assetCache['bg'] = bg; };
  bg.onerror = function() { assetCache['bg'] = null; };
  bg.src = 'assets/steam-bg.png';

  // Load music
  bgMusic = new Audio('assets/musik-latar.mp3');
  bgMusic.loop = true;
  bgMusic.volume = 0.3;
  if (localStorage.getItem('smp7k_music') === '0') musicOn = false;
  if (musicOn) bgMusic.play().catch(function(){});

  // Start game loop
  if (!gameLoopRunning) {
    gameLoopRunning = true;
    requestAnimationFrame(gameLoop);
  }

  // Start spawn
  lastSpawnTime = Date.now();

  // Cuaca timer
  setInterval(function() {
    if (cuaca === 'panas') { cuaca = 'hujan'; spawnInterval = 6000; }
    else { cuaca = 'panas'; spawnInterval = 2000; }
    toast(cuaca === 'panas' ? '☀️ Cuaca panas, parkiran ramai!' : '🌧️ Cuaca hujan, parkiran sepi...');
    renderHeader();
  }, 60000 + Math.random() * 120000);
}

function resizeCanvas() {
  if (!canvas) return;
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  if (cuacaCanvas) {
    cuacaCanvas.width = window.innerWidth;
    cuacaCanvas.height = window.innerHeight;
  }
}

// ==================== SPAWN MOTOR ====================
function spawnMotor() {
  var now = Date.now();
  if (now - lastSpawnTime < spawnInterval) return;
  lastSpawnTime = now;

  var isMoge = Math.random() < 0.125; // 1 in 8
  var level = isMoge ? 2 : 1;
  var bayar = isMoge ? 500 : 1;
  var tapNeed = isMoge ? 5 : 1;

  // 40% parkir, 60% lewat
  var mauParkir = Math.random() < 0.4;
  var slotKosong = parkiranSlots.filter(function(s) { return !s.occupied; });
  if (mauParkir && slotKosong.length > 0 && motorList.length < 16) {
    // Parkir
    var slot = slotKosong[0];
    slot.occupied = true;
    var motor = {
      id: 'm' + Date.now() + Math.random(),
      x: slot.x, y: slot.y,
      w: slot.w, h: slot.h,
      arah: Math.random() < 0.5 ? 'kiri-ke-kanan' : 'kanan-ke-kiri',
      state: 'parkir',
      level: level,
      isMoge: isMoge,
      kotor: true,
      tapCount: 0,
      tapNeed: tapNeed,
      bayar: bayar,
      waktuMasuk: Date.now(),
      sudahNontonIklan: false,
      slotIndex: parkiranSlots.indexOf(slot),
      kabur: false,
      pergi: false
    };
    slot.motorId = motor.id;
    motorList.push(motor);
  } else {
    // Lewat
    var dariKiri = Math.random() < 0.5;
    var motor = {
      id: 'm' + Date.now() + Math.random(),
      x: dariKiri ? -60 : canvas.width + 60,
      y: canvas.height * 0.65 + Math.random() * 60,
      w: 50, h: 40,
      arah: dariKiri ? 'kiri-ke-kanan' : 'kanan-ke-kiri',
      state: 'lewat',
      level: level,
      isMoge: isMoge,
      kotor: true,
      tapCount: 0,
      tapNeed: tapNeed,
      bayar: bayar,
      waktuMasuk: Date.now(),
      sudahNontonIklan: false,
      slotIndex: -1,
      kabur: false,
      pergi: false
    };
    motorList.push(motor);
  }
}

// ==================== GAME LOOP ====================
function gameLoop() {
  requestAnimationFrame(gameLoop);
  if (isAdmin) return;

  var now = Date.now();

  // Spawn
  spawnMotor();

  // Update motor
  updateMotors(now);

  // Render
  renderGame();

  // Cuaca
  renderCuaca();
}

function updateMotors(now) {
  for (var i = motorList.length - 1; i >= 0; i--) {
    var m = motorList[i];
    if (m.state === 'lewat') {
      if (m.arah === 'kiri-ke-kanan') {
        m.x += 2;
        if (m.x > canvas.width + 60) { motorList.splice(i, 1); continue; }
      } else {
        m.x -= 2;
        if (m.x < -60) { motorList.splice(i, 1); continue; }
      }
    } else if (m.state === 'parkir') {
      var elapsed = (now - m.waktuMasuk) / 1000;
      if (m.isMoge && !m.sudahNontonIklan && elapsed > 10) {
        // Moge kabur
        motorList.splice(i, 1);
        if (m.slotIndex >= 0) { parkiranSlots[m.slotIndex].occupied = false; parkiranSlots[m.slotIndex].motorId = null; }
        toast('💨 Moge VIP kabur karena tidak ditonton iklannya!');
        continue;
      }
      if (elapsed > 8 && !m.kabur) {
        // Kabur
        m.kabur = true;
        m.state = 'pergi';
        motorList.splice(i, 1);
        if (m.slotIndex >= 0) { parkiranSlots[m.slotIndex].occupied = false; parkiranSlots[m.slotIndex].motorId = null; }
        toast('💨 Pelanggan kabur!');
        continue;
      }
    } else if (m.state === 'pergi') {
      // handled
    }
  }
}

function renderGame() {
  if (!ctx) return;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Background
  if (assetCache['bg']) {
    ctx.drawImage(assetCache['bg'], 0, 0, canvas.width, canvas.height);
  } else {
    var grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    grad.addColorStop(0, '#C8102E');
    grad.addColorStop(1, '#8b0a1f');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  // Parkiran slots outline
  parkiranSlots.forEach(function(s, idx) {
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 4]);
    ctx.strokeRect(s.x, s.y, s.w, s.h);
    ctx.setLineDash([]);
  });

  // Motor
  motorList.forEach(function(m) {
    var imgKey, emojiFallback;
    if (m.level === 1) {
      imgKey = m.kotor ? 'assets/motor-bebek-kotor.png' : 'assets/motor-bebek-bersih.png';
      emojiFallback = '🛵';
    } else {
      imgKey = m.kotor ? 'assets/motor-moge-kotor.png' : 'assets/motor-moge-bersih.png';
      emojiFallback = '🏍️';
    }
    var img = assetCache[imgKey];
    if (img && img !== emojiFallback && img !== null) {
      ctx.drawImage(img, m.x, m.y, m.w, m.h);
    } else {
      ctx.font = '32px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(emojiFallback, m.x + m.w/2, m.y + m.h/2);
    }

    // Kilau emas untuk moge
    if (m.isMoge && !m.kabur) {
      var t = Date.now() / 1000;
      ctx.save();
      ctx.globalAlpha = 0.3 + 0.15 * Math.sin(t * 3);
      ctx.beginPath();
      ctx.arc(m.x + m.w/2, m.y + m.h/2, m.w * 0.8, 0, Math.PI * 2);
      var goldGrad = ctx.createConicGradient ? ctx.createConicGradient(t, m.x + m.w/2, m.y + m.h/2) : null;
      if (goldGrad) {
        goldGrad.addColorStop(0, '#F59E0B');
        goldGrad.addColorStop(0.5, '#fbbf24');
        goldGrad.addColorStop(1, '#F59E0B');
        ctx.fillStyle = goldGrad;
      } else {
        ctx.fillStyle = 'rgba(245,158,11,0.3)';
      }
      ctx.fill();
      ctx.restore();
    }

    // Timer emoji 💢
    if (m.state === 'parkir') {
      var elapsed = (Date.now() - m.waktuMasuk) / 1000;
      if (elapsed > 5 && !m.kabur) {
        ctx.font = '20px sans-serif';
        ctx.fillText('💢', m.x + m.w/2, m.y - 10);
      }
    }

    // Ikon 🎬 untuk moge yang belum nonton iklan
    if (m.isMoge && !m.sudahNontonIklan && m.state === 'parkir') {
      ctx.font = '18px sans-serif';
      ctx.fillText('🎬', m.x + m.w/2, m.y - 28);
    }
  });

  // Partikel air
  particles.forEach(function(p, i) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(100,180,255,' + p.alpha + ')';
    ctx.fill();
    p.x += p.vx;
    p.y += p.vy;
    p.alpha -= 0.02;
    if (p.alpha <= 0) particles.splice(i, 1);
  });

  // Floating text
  floatingTexts.forEach(function(ft, i) {
    ctx.font = 'bold 16px Poppins, sans-serif';
    ctx.fillStyle = 'rgba(245,158,11,' + ft.alpha + ')';
    ctx.textAlign = 'center';
    ctx.fillText(ft.text, ft.x, ft.y);
    ft.y -= 1;
    ft.alpha -= 0.02;
    if (ft.alpha <= 0) floatingTexts.splice(i, 1);
  });
}

function renderCuaca() {
  if (!cuacaCtx) return;
  cuacaCtx.clearRect(0, 0, cuacaCanvas.width, cuacaCanvas.height);
  if (cuaca === 'panas') {
    cuacaCtx.fillStyle = 'rgba(255,220,100,0.08)';
    cuacaCtx.fillRect(0, 0, cuacaCanvas.width, cuacaCanvas.height);
    cuacaCtx.font = '40px sans-serif';
    cuacaCtx.fillText('☀️', cuacaCanvas.width - 70, 70);
  } else {
    cuacaCtx.fillStyle = 'rgba(50,70,100,0.25)';
    cuacaCtx.fillRect(0, 0, cuacaCanvas.width, cuacaCanvas.height);
    // Hujan
    for (var i = 0; i < 80; i++) {
      if (!hujanDrops[i]) hujanDrops[i] = { x: Math.random() * cuacaCanvas.width, y: Math.random() * cuacaCanvas.height, speed: 3 + Math.random() * 4 };
      var d = hujanDrops[i];
      cuacaCtx.strokeStyle = 'rgba(180,200,255,0.4)';
      cuacaCtx.lineWidth = 1;
      cuacaCtx.beginPath();
      cuacaCtx.moveTo(d.x, d.y);
      cuacaCtx.lineTo(d.x - 2, d.y + 10);
      cuacaCtx.stroke();
      d.y += d.speed;
      if (d.y > cuacaCanvas.height) { d.y = -10; d.x = Math.random() * cuacaCanvas.width; }
    }
    cuacaCtx.font = '40px sans-serif';
    cuacaCtx.fillText('🌧️', cuacaCanvas.width - 70, 70);
  }
}

// ==================== TAP DETECTION ====================
document.getElementById('gameCanvas').addEventListener('click', function(e) {
  if (isAdmin) return;
  var rect = canvas.getBoundingClientRect();
  var tapX = e.clientX - rect.left;
  var tapY = e.clientY - rect.top;

  for (var i = motorList.length - 1; i >= 0; i--) {
    var m = motorList[i];
    if (m.state !== 'parkir') continue;
    if (tapX >= m.x && tapX <= m.x + m.w && tapY >= m.y && tapY <= m.y + m.h) {
      if (m.isMoge && !m.sudahNontonIklan) {
        showIklanModal(m);
        return;
      }
      tapMotor(m);
      return;
    }
  }
});

function tapMotor(m) {
  m.tapCount++;
  // Partikel air
  for (var i = 0; i < 8; i++) {
    particles.push({
      x: m.x + m.w/2, y: m.y + m.h/2,
      vx: (Math.random() - 0.5) * 6,
      vy: (Math.random() - 0.5) * 6,
      r: 3 + Math.random() * 7,
      alpha: 0.8
    });
  }
  playSound('tap');

  if (m.tapCount >= m.tapNeed) {
    m.kotor = false;
    // Bayar
    user.koin = (user.koin || 0) + m.bayar;
    user.totalKoin = (user.totalKoin || 0) + m.bayar;
    saveUser();
    playSound('koin');
    // Floating text
    floatingTexts.push({ x: m.x + m.w/2, y: m.y - 10, text: '+' + m.bayar, alpha: 1 });
    // Motor pergi
    m.state = 'pergi';
    motorList.splice(motorList.indexOf(m), 1);
    if (m.slotIndex >= 0) {
      parkiranSlots[m.slotIndex].occupied = false;
      parkiranSlots[m.slotIndex].motorId = null;
    }
    renderHeader();
  }
  renderGamePanel();
}

// ==================== PRODUKSI LOOP (FIXED BUG) ====================
function startProduksiLoop() {
  if (window.__produksiLoop) return; // ONLY ONE
  window.__produksiLoop = setInterval(function() {
    if (isAdmin) return;
    if (produksiPerDetik > 0) {
      var tambah = Math.min(produksiPerDetik, MAX_PRODUKSI);
      user.koin = (user.koin || 0) + tambah;
      user.totalKoin = (user.totalKoin || 0) + tambah;
      syncDelta += tambah;
      saveUser();
      renderHeader();
    }
    // Sync tiap 10 detik
    var now = Date.now();
    if (now - lastSyncTime > SYNC_INTERVAL) {
      syncProgress();
      lastSyncTime = now;
    }
  }, 1000);
}

function syncProgress() {
  if (syncDelta <= 0) return;
  var delta = Math.min(syncDelta, MAX_DELTA);
  apiCall('update', { sheet: 'Users', row: user._row, data: { koin: user.koin, totalKoin: user.totalKoin } });
  syncDelta -= delta;
  if (syncDelta < 0) syncDelta = 0;
}

window.addEventListener('beforeunload', function() {
  if (syncDelta > 0) { syncProgress(); }
});

function adminTab(tab, btn) {

  var content = document.getElementById('adminContent');
  content.innerHTML = '<div style="text-align:center;padding:30px"><div class="loading-spinner"></div></div>';
  apiCall('baca', { sheet: 'Users' }).then(function(res) {
    var users = (res.ok && res.data) ? res.data : [];
    if (tab === 'dashboard') {
      content.innerHTML = '<h3>Dashboard</h3>' +
        '<p>Total Pemain: <strong>' + users.length + '</strong></p>' +
        '<p>Total Koin Beredar: <strong>' + formatAngka(users.reduce(function(a, u) { return a + (parseInt(u.koin) || 0); }, 0)) + '</strong></p>';
    } else if (tab === 'pemain') {
      var html = '<h3>Daftar Pemain</h3><table class="admin-table"><tr><th>Nama</th><th>Nomor</th><th>Koin</th><th>Level</th><th>Aksi</th></tr>';
      users.forEach(function(u, i) {
        html += '<tr><td>' + (u.nama || '-') + '</td><td>' + (u.nomor || '-') + '</td><td>' + formatAngka(u.koin) + '</td><td>' + (u.level || 1) + '</td>' +
          '<td><button class="admin-btn blue" onclick="alert(\'Detail: ' + (u.nama || '') + '\')">Detail</button></td></tr>';
      });
      html += '</table>';
      content.innerHTML = html;
    } else {
      content.innerHTML = '<h3>' + tab.charAt(0).toUpperCase() + tab.slice(1) + '</h3><p style="color:#888;font-size:12px">Data dari sheet ' + tab + '</p>';
      apiCall('baca', { sheet: tab.charAt(0).toUpperCase() + tab.slice(1) + 's' }).then(function(r2) {
        if (r2.ok && r2.data && r2.data.length) {
          var h = '<table class="admin-table"><tr>';
          var keys = Object.keys(r2.data[0]).filter(function(k) { return k !== '_row'; });
          keys.forEach(function(k) { h += '<th>' + k + '</th>'; });
          h += '<th>Aksi</th></tr>';
          r2.data.forEach(function(row) {
            h += '<tr>';
            keys.forEach(function(k) { h += '<td>' + (row[k] || '-') + '</td>'; });
            h += '<td><button class="admin-btn gold">Edit</button></td></tr>';
          });
          h += '</table>';
          content.innerHTML = h;
        } else {
          content.innerHTML = '<p style="color:#888;text-align:center;padding:20px">Tidak ada data</p>';
        }
      });
    }
  });
}

  loadAsset('kristal', 'assets/kristal.png', '💎');

    return;

  document.getElementById('app').style.display = 'block';

  // Ambil data user dari server (untuk saldo koin terbaru)
  apiCall('bacaSatu', { sheet: 'Users', kolom: 'nomor', nilai: user.nomor }).then(function(res) {
    if (res.ok && res.data) {
      user = Object.assign(user, res.data);
      saveUser();
      renderHeader();
    }
    renderHeader();
    renderBottomNav();

    // Init game
    initGame();
    startProduksiLoop();
    hitungProduksi();

    // Muat upgrade level dari localStorage
    try {
      var savedUpgrades = localStorage.getItem('smp7k_upgrades');
      if (savedUpgrades) { upgradeLevels = JSON.parse(savedUpgrades); hitungProduksi(); }
    } catch(e) {}
  });

  // Tutup panel kalau tap di luar
  document.getElementById('app').addEventListener('click', function(e) {
    var panel = document.getElementById('panelSlide');
    if (panel.classList.contains('open')) {
      if (!panel.contains(e.target) && !e.target.closest('#bottomNav') && !e.target.closest('#appHeader')) {
        closePanel();
      }
    }
  });
}

window.addEventListener('load', init);
</script>
</body>
</html>
