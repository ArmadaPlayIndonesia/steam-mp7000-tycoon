<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Steam MP 7000 Tycoon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ============ RESET & BASE ============ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #1a1a1a;
      color: #FAFAFA;
      touch-action: manipulation;
      position: fixed;
    }

    :root {
      --merah: #C8102E;
      --merah-gelap: #9a0c23;
      --emas: #F59E0B;
      --emas-terang: #fbbf24;
      --putih: #FAFAFA;
      --abu: #2a2a2a;
      --abu-terang: #3a3a3a;
      --hijau: #22c55e;
      --biru: #3b82f6;
      --ungu: #8b5cf6;
      --header-h: 80px;
      --nav-h: 70px;
    }

    /* ============ HEADER ============ */
    #header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--header-h);
      background: linear-gradient(135deg, var(--merah) 0%, var(--merah-gelap) 100%);
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 4px 10px;
      box-shadow: 0 4px 20px rgba(200, 16, 46, 0.5);
      border-bottom: 2px solid var(--emas);
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      flex: 1;
    }

    .logo-mp {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--emas), #d97706);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 13px;
      color: var(--merah-gelap);
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    .header-info {
      min-width: 0;
      flex: 1;
    }

    .header-name {
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
      color: #fff;
    }

    .header-phone {
      font-size: 9px;
      opacity: 0.85;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .hbtn {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: rgba(255,255,255,0.15);
      border: none;
      color: #fff;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      backdrop-filter: blur(4px);
    }

    .hbtn:active {
      transform: scale(0.9);
      background: rgba(255,255,255,0.3);
    }

    .header-currencies {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      margin-top: 3px;
      font-size: 10px;
      font-weight: 600;
    }

    .currency-item {
      display: flex;
      align-items: center;
      gap: 3px;
      background: rgba(0,0,0,0.25);
      padding: 2px 7px;
      border-radius: 10px;
      white-space: nowrap;
      backdrop-filter: blur(4px);
    }

    .currency-item .icon {
      font-size: 12px;
      line-height: 1;
    }

    .currency-item .val {
      color: var(--emas-terang);
      font-weight: 700;
    }

    .header-level {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 3px;
    }

    .level-badge {
      background: linear-gradient(135deg, var(--emas), #d97706);
      color: var(--merah-gelap);
      font-size: 9px;
      font-weight: 800;
      padding: 1px 7px;
      border-radius: 8px;
      white-space: nowrap;
    }

    .level-bar {
      flex: 1;
      height: 5px;
      background: rgba(0,0,0,0.3);
      border-radius: 3px;
      overflow: hidden;
    }

    .level-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--emas), var(--emas-terang));
      border-radius: 3px;
      transition: width 0.5s ease;
      width: 0%;
    }

    /* ============ CANVAS ============ */
    #gameCanvas {
      position: fixed;
      top: var(--header-h);
      bottom: var(--nav-h);
      left: 0;
      right: 0;
      width: 100%;
      height: calc(100% - var(--header-h) - var(--nav-h));
      z-index: 1;
      display: block;
      background: #1a1a1a;
    }

    /* ============ BOTTOM NAV ============ */
    #bottomNav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: var(--nav-h);
      background: linear-gradient(180deg, #1f1f1f 0%, #141414 100%);
      border-top: 2px solid var(--emas);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 4px;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.5);
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      flex: 1;
      height: 100%;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
      border-radius: 8px;
      padding: 4px 0;
    }

    .nav-item .nav-icon {
      font-size: 20px;
      line-height: 1;
      transition: transform 0.2s;
    }

    .nav-item .nav-label {
      font-size: 9px;
      font-weight: 600;
      color: #aaa;
      transition: color 0.2s;
      white-space: nowrap;
    }

    .nav-item.active .nav-icon {
      transform: scale(1.15);
    }

    .nav-item.active .nav-label {
      color: var(--emas);
    }

    .nav-item.active::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 50%;
      transform: translateX(-50%);
      width: 20px;
      height: 3px;
      background: var(--emas);
      border-radius: 2px;
    }

    .nav-item:active {
      background: rgba(245, 158, 11, 0.1);
    }

    /* ============ PANEL SLIDE-UP ============ */
    #panelOverlay {
      position: fixed;
      top: var(--header-h);
      left: 0;
      right: 0;
      bottom: var(--nav-h);
      background: rgba(0,0,0,0.5);
      z-index: 89;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    #panelOverlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    #panel {
      position: fixed;
      bottom: var(--nav-h);
      left: 0;
      right: 0;
      max-height: 70vh;
      background: linear-gradient(180deg, #1f1f1f, #141414);
      border-top: 3px solid var(--emas);
      border-radius: 20px 20px 0 0;
      z-index: 90;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 16px 14px 90px 14px;
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 -8px 40px rgba(0,0,0,0.6);
      -webkit-overflow-scrolling: touch;
    }

    #panel.show {
      transform: translateY(0);
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(245, 158, 11, 0.3);
    }

    .panel-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--emas);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .panel-close {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(200, 16, 46, 0.8);
      border: none;
      color: #fff;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .panel-close:active {
      transform: scale(0.9) rotate(90deg);
    }

    /* ============ LIST ITEMS ============ */
    .list-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
      margin-bottom: 8px;
      border: 1px solid rgba(255,255,255,0.08);
      transition: all 0.2s;
    }

    .list-item:active {
      background: rgba(245, 158, 11, 0.1);
      transform: scale(0.98);
    }

    .list-item .li-icon {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: linear-gradient(135deg, rgba(200,16,46,0.3), rgba(245,158,11,0.3));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .list-item .li-info {
      flex: 1;
      min-width: 0;
    }

    .list-item .li-title {
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 2px;
    }

    .list-item .li-desc {
      font-size: 10px;
      color: #aaa;
      line-height: 1.3;
    }

    .list-item .li-cost {
      font-size: 10px;
      font-weight: 700;
      color: var(--emas);
      margin-top: 2px;
    }

    .list-item .li-btn {
      padding: 8px 14px;
      border-radius: 10px;
      border: none;
      font-family: 'Poppins', sans-serif;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
      white-space: nowrap;
    }

    .li-btn.buy {
      background: linear-gradient(135deg, var(--emas), #d97706);
      color: var(--merah-gelap);
    }

    .li-btn.buy:active {
      transform: scale(0.93);
    }

    .li-btn.buy:disabled {
      background: #444;
      color: #888;
      cursor: not-allowed;
    }

    .li-btn.claim {
      background: linear-gradient(135deg, var(--hijau), #16a34a);
      color: #fff;
    }

    .li-btn.claim:disabled {
      background: #444;
      color: #888;
    }

    .li-btn.done {
      background: #444;
      color: #888;
    }

    /* ============ PROGRESS BAR ============ */
    .progress-bar {
      width: 100%;
      height: 6px;
      background: rgba(0,0,0,0.4);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 4px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--emas), var(--emas-terang));
      border-radius: 3px;
      transition: width 0.5s ease;
    }

    /* ============ TOAST ============ */
    #toastContainer {
      position: fixed;
      top: 90px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 200;
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: center;
      pointer-events: none;
      width: 90%;
      max-width: 340px;
    }

    .toast {
      background: rgba(30, 30, 30, 0.95);
      color: #fff;
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid var(--emas);
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      animation: toastIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      backdrop-filter: blur(10px);
      text-align: center;
      width: 100%;
    }

    .toast.success { border-color: var(--hijau); }
    .toast.error { border-color: var(--merah); }
    .toast.info { border-color: var(--biru); }

    @keyframes toastIn {
      from { opacity: 0; transform: translateY(-20px) scale(0.9); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ============ MODAL ============ */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      z-index: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      backdrop-filter: blur(4px);
    }

    .modal-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-box {
      background: linear-gradient(180deg, #1f1f1f, #141414);
      border: 3px solid var(--emas);
      border-radius: 20px;
      padding: 20px;
      max-width: 340px;
      width: 100%;
      text-align: center;
      animation: modalIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 0 60px rgba(245, 158, 11, 0.4);
      max-height: 80vh;
      overflow-y: auto;
    }

    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.8) translateY(20px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .modal-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 3px solid var(--emas);
      margin: 0 auto 12px;
      object-fit: cover;
      background: rgba(245, 158, 11, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      overflow: hidden;
    }

    .modal-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--emas);
      margin-bottom: 8px;
    }

    .modal-text {
      font-size: 12px;
      color: #ccc;
      line-height: 1.6;
      margin-bottom: 16px;
    }

    .modal-btn {
      padding: 12px 24px;
      border-radius: 12px;
      border: none;
      font-family: 'Poppins', sans-serif;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      background: linear-gradient(135deg, var(--emas), #d97706);
      color: var(--merah-gelap);
      width: 100%;
      margin-top: 6px;
    }

    .modal-btn:active {
      transform: scale(0.95);
    }

    .modal-btn.secondary {
      background: rgba(255,255,255,0.1);
      color: #fff;
    }

    /* ============ LOADING ============ */
    #loadingOverlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 400;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      backdrop-filter: blur(4px);
    }

    #loadingOverlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(245, 158, 11, 0.2);
      border-top-color: var(--emas);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 12px;
      color: var(--emas);
      font-weight: 600;
    }

    /* ============ LAINNYA PANEL ============ */
    .more-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .more-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 16px 8px;
      background: rgba(255,255,255,0.05);
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.1);
      cursor: pointer;
      transition: all 0.2s;
    }

    .more-btn:active {
      background: rgba(245, 158, 11, 0.15);
      transform: scale(0.96);
    }

    .more-btn .mb-icon {
      font-size: 28px;
    }

    .more-btn .mb-label {
      font-size: 11px;
      font-weight: 700;
      color: #ddd;
    }

    /* ============ SECTION TITLE ============ */
    .section-title {
      font-size: 12px;
      font-weight: 800;
      color: var(--emas);
      margin: 14px 0 8px;
      padding-left: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* ============ EMPTY STATE ============ */
    .empty-state {
      text-align: center;
      padding: 30px 20px;
      color: #777;
      font-size: 12px;
    }

    .empty-state .emoji {
      font-size: 40px;
      margin-bottom: 8px;
    }

    /* ============ SCROLLBAR ============ */
    #panel::-webkit-scrollbar {
      width: 4px;
    }

    #panel::-webkit-scrollbar-track {
      background: transparent;
    }

    #panel::-webkit-scrollbar-thumb {
      background: var(--emas);
      border-radius: 2px;
    }

    /* ============ RESPONSIVE ============ */
    @media (min-width: 500px) {
      #header, #bottomNav, #panel, #panelOverlay {
        max-width: 480px;
        left: 50%;
        transform: translateX(-50%);
      }
      #gameCanvas {
        max-width: 480px;
        left: 50%;
        transform: translateX(-50%);
      }
    }

    /* ============ ANIMASI ============ */
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    @keyframes glow {
      0%, 100% { box-shadow: 0 0 10px rgba(245, 158, 11, 0.3); }
      50% { box-shadow: 0 0 25px rgba(245, 158, 11, 0.7); }
    }

    .glow-effect {
      animation: glow 2s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    .float-effect {
      animation: float 2s ease-in-out infinite;
    }

    /* ============ BADGE ============ */
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 8px;
      font-size: 9px;
      font-weight: 700;
    }

    .badge.harian { background: rgba(34, 197, 94, 0.2); color: #22c55e; }
    .badge.mingguan { background: rgba(59, 130, 246, 0.2); color: #3b82f6; }
    .badge.spesial { background: rgba(139, 92, 246, 0.2); color: #8b5cf6; }
  </style>
</head>
<body>

  <!-- ============ HEADER ============ -->
  <header id="header">
    <div class="header-top">
      <div class="header-left">
        <div class="logo-mp">MP</div>
        <div class="header-info">
          <div class="header-name" id="headerName">Memuat...</div>
          <div class="header-phone" id="headerPhone">-</div>
        </div>
      </div>
      <div class="header-actions">
        <button class="hbtn" id="btnWeather" title="Cuaca">☀️</button>
        <button class="hbtn" id="btnMusic" title="Musik">🔊</button>
        <button class="hbtn" id="btnMenu" title="Menu">☰</button>
        <button class="hbtn" id="btnLogout" title="Keluar">🚪</button>
      </div>
    </div>
    <div class="header-currencies">
      <div class="currency-item">
        <span class="icon">🪙</span>
        <span class="val" id="headerKoin">0</span>
      </div>
      <div class="currency-item">
        <span class="icon">💵</span>
        <span class="val" id="headerRupiah">Rp 0</span>
      </div>
      <div class="currency-item">
        <span class="icon">💎</span>
        <span class="val" id="headerKristal">0</span>
      </div>
    </div>
    <div class="header-level">
      <span class="level-badge" id="headerLevel">Lv.1</span>
      <div class="level-bar">
        <div class="level-fill" id="headerLevelFill"></div>
      </div>
    </div>
  </header>

  <!-- ============ CANVAS ============ -->
  <canvas id="gameCanvas"></canvas>

  <!-- ============ BOTTOM NAV ============ -->
  <nav id="bottomNav">
    <div class="nav-item active" data-tab="game">
      <span class="nav-icon">🎮</span>
      <span class="nav-label">Game</span>
    </div>
    <div class="nav-item" data-tab="manajer">
      <span class="nav-icon">👔</span>
      <span class="nav-label">Manajer</span>
    </div>
    <div class="nav-item" data-tab="toko">
      <span class="nav-icon">🛒</span>
      <span class="nav-label">Toko</span>
    </div>
    <div class="nav-item" data-tab="quest">
      <span class="nav-icon">📋</span>
      <span class="nav-label">Quest</span>
    </div>
    <div class="nav-item" data-tab="profil">
      <span class="nav-icon">👤</span>
      <span class="nav-label">Profil</span>
    </div>
    <div class="nav-item" data-tab="lainnya">
      <span class="nav-icon">⋯</span>
      <span class="nav-label">Lainnya</span>
    </div>
  </nav>

  <!-- ============ PANEL OVERLAY ============ -->
  <div id="panelOverlay"></div>

  <!-- ============ PANEL ============ -->
  <div id="panel">
    <div class="panel-header">
      <div class="panel-title" id="panelTitle">🎮 Game</div>
      <button class="panel-close" id="panelClose">✕</button>
    </div>
    <div id="panelContent"></div>
  </div>

  <!-- ============ TOAST ============ -->
  <div id="toastContainer"></div>

  <!-- ============ MODAL ============ -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box" id="modalBox"></div>
  </div>

  <!-- ============ LOADING ============ -->
  <div id="loadingOverlay">
    <div class="spinner"></div>
    <div class="loading-text" id="loadingText">Memuat...</div>
  </div>

  <script>
  (function() {
    'use strict';

    // ============================================================
    // KONFIGURASI

    var BACKEND_URL = 'https://script.google.com/macros/s/AKfycbysHvNR2JwLFuNu6poci5wIleJBnc8IGNMq-ULxUV1NyMxoorEcBj0c8oBh4b8JiL3m/exec';
    var TOKEN = 'steam-mp-7000-2026';
    var SHEET_USERS = 'Users';

    // ============================================================
    // FETCH TIMEOUT
    // ============================================================
    function fetchTimeout(url, options, ms) {
      return Promise.race([
        fetch(url, options),
        new Promise(function(_, reject) {
          setTimeout(function() { reject(new Error('Timeout')); }, ms || 15000);
        })
      ]);
    }

    // ============================================================
    // API CALL
    // ============================================================
    function apiCall(action, payload) {
      var body = { action: action, token: TOKEN };
      if (payload) {
        for (var k in payload) {
          if (payload.hasOwnProperty(k)) body[k] = payload[k];
        }
      }
      return fetchTimeout(BACKEND_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(body)
      }, 15000).then(function(res) {
        return res.json();
      });
    }

    // ============================================================
    // HAPUS BACKGROUND PUTIH
    // ============================================================
    function hilangkanBackgroundPutih(imgSrc, toleransi, callback) {
      var img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = function() {
        var c = document.createElement('canvas');
        c.width = img.width;
        c.height = img.height;
        var cx = c.getContext('2d');
        cx.drawImage(img, 0, 0);
        try {
          var d = cx.getImageData(0, 0, c.width, c.height);
          var p = d.data;
          var tol = toleransi || 40;
          for (var i = 0; i < p.length; i += 4) {
            if (p[i] > 255 - tol && p[i+1] > 255 - tol && p[i+2] > 255 - tol) {
              p[i+3] = 0;
            }
          }
          cx.putImageData(d, 0, 0);
          callback(c.toDataURL('image/png'));
        } catch(e) {
          callback(imgSrc);
        }
      };
      img.onerror = function() { callback(null); };
      img.src = imgSrc;
    }

    // ============================================================
    // STATE

    var state = {

    // ============================================================
    // LOCAL STORAGE

    function saveUser(u) {

    function loadUser() {

    // ============================================================
    // FORMAT RUPIAH
    // ============================================================
    function formatRupiah(n) {
      n = Math.floor(n || 0);
      return 'Rp ' + n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    }

    function formatNumber(n) {
      n = Math.floor(n || 0);
      if (n >= 1000000000) return (n/1000000000).toFixed(1) + 'M';
      if (n >= 1000000) return (n/1000000).toFixed(1) + 'jt';
      if (n >= 1000) return (n/1000).toFixed(1) + 'rb';
      return n.toString();
    }

    // ============================================================
    // TOAST
    // ============================================================
    function showToast(msg, type) {
      var container = document.getElementById('toastContainer');
      var toast = document.createElement('div');
      toast.className = 'toast ' + (type || 'info');
      toast.textContent = msg;
      container.appendChild(toast);
      setTimeout(function() {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(-20px)';

        setTimeout(function() { toast.remove(); }, 300);

    // ============================================================
    // LOADING
    // ============================================================
    function showLoading(text) {
      document.getElementById('loadingText').textContent = text || 'Memuat...';

    // ============================================================

    function showModal(html) {

      document.getElementById('modalOverlay').classList.add('show');

    window.closeModal = closeModal;

    // ============================================================
    // AUDIO (Web Audio API)
    // ============================================================
    var audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        try {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        } catch(e) {}
      }
    }

    function playSound(type) {
      if (!audioCtx) return;
      try {
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        var now = audioCtx.currentTime;
        if (type === 'syuush') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(800, now);
          osc.frequency.exponentialRampToValueAtTime(200, now + 0.3);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
          osc.start(now);
          osc.stop(now + 0.3);
        } else if (type === 'ting') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(1200, now);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
          osc.start(now);
          osc.stop(now + 0.2);
        } else if (type === 'chime') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(600, now);
          osc.frequency.setValueAtTime(900, now + 0.1);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
          osc.start(now);
          osc.stop(now + 0.4);
        } else if (type === 'buzz') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(150, now);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
          osc.start(now);
          osc.stop(now + 0.3);
        }
      } catch(e) {}
    }

    // ============================================================
    // CANVAS
    // ============================================================
    var canvas = document.getElementById('gameCanvas');
    var ctx = canvas.getContext('2d');

    function resizeCanvas() {
      var w = canvas.clientWidth;
      var h = canvas.clientHeight;
      canvas.width = w;
      canvas.height = h;
      console.log('Canvas: ' + w + 'x' + h);
    }

    window.addEventListener('resize', function() {
      resizeCanvas();
    });

    // ============================================================
    // IMAGE LOADING
    // ============================================================
    function loadImage(key, src, tolerance, useHilangkan) {
      if (state.imageCache[key]) return;
      if (useHilangkan) {
        hilangkanBackgroundPutih(src, tolerance, function(result) {
          if (result) {
            var img = new Image();
            img.onload = function() {
              state.imageCache[key] = img;
            };
            img.src = result;
          } else {
            var img = new Image();
            img.onload = function() { state.imageCache[key] = img; };
            img.onerror = function() { state.imageCache[key] = null; };
            img.src = src;
          }
        });
      } else {
        var img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = function() {
          state.imageCache[key] = img;
          console.log(key + ': loaded ' + img.width + 'x' + img.height);
        };
        img.onerror = function() {
          state.imageCache[key] = null;
          console.log(key + ': 404');
        };
        img.src = src;
      }
    }

    function getImage(key) {
      return state.imageCache[key] || null;
    }

    // ============================================================
    // WEATHER
    // ============================================================
    function updateWeather() {
      var now = Date.now();
      if (now - state.weatherTimer > 60000) {
        state.weatherTimer = now;
        if (Math.random() < 0.5) {
          state.weather = state.weather === 'panas' ? 'hujan' : 'panas';
          document.getElementById('btnWeather').textContent = state.weather === 'panas' ? '☀️' : '🌧️';
          showToast(state.weather === 'panas' ? '☀️ Cuaca panas!' : '🌧️ Cuaca hujan!', 'info');
        }
      }
    }

    // ============================================================
    // MOTOR
    // ============================================================
    function spawnMotor() {
      var maxParkir = 12;
      var parkirCount = 0;
      for (var i = 0; i < state.motors.length; i++) {
        if (state.motors[i].parked) parkirCount++;
      }
      if (parkirCount >= maxParkir) return;

      var isMoge = Math.random() < 0.125;
      var isBebek = !isMoge && Math.random() < 0.333;

      var motor = {
        id: ++state.motorIdCounter,
        level: isMoge ? 2 : 1,
        type: isMoge ? 'moge' : (isBebek ? 'bebek' : 'biasa'),
        x: -80,
        y: 0,
        parked: false,
        slot: -1,
        row: -1,
        col: -1,
        tapCount: 0,
        maxTap: isMoge ? 5 : 1,
        pay: isMoge ? 500 : (isBebek ? 1 : 1),
        dirty: true,
        kaburTimer: 0,
        kabur: false,
        sparkle: isMoge,
        adsWatched: false,
        adsTimer: 0
      };

      if (parkirCount < maxParkir) {
        motor.parked = true;
        var row = Math.floor(parkirCount / 6);
        var col = parkirCount % 6;
        motor.row = row;
        motor.col = col;
        motor.slot = parkirCount;
        motor.y = canvas.height * (row === 0 ? 0.55 : 0.70);
        motor.x = canvas.width * (0.10 + col * 0.14);
      } else {
        motor.y = canvas.height * 0.06;
      }

      state.motors.push(motor);
      console.log('Spawn motor: level ' + motor.level + ', slot ' + motor.slot + ', x=' + Math.round(motor.x) + ', y=' + Math.round(motor.y));
    }

    // ============================================================
    // UPDATE MOTOR
    // ============================================================
    function updateMotors(dt) {
      for (var i = state.motors.length - 1; i >= 0; i--) {
        var m = state.motors[i];
        if (!m.parked) {
          m.x += 80 * dt;
          if (m.x > canvas.width + 100) {
            state.motors.splice(i, 1);
          }
        }
        if (m.parked && !m.kabur) {
          m.kaburTimer += dt;
          if (m.kaburTimer > 8) {
            m.kabur = true;
            showToast('Pelanggan kabur! 💢', 'error');
            state.motors.splice(i, 1);
          }
        }
      }
    }

    // ============================================================
    // DRAW
    // ============================================================
    function draw(timestamp) {
      var w = canvas.width;
      var h = canvas.height;
      ctx.clearRect(0, 0, w, h);

      // Background
      var bgImg = getImage('steam-bg');
      if (bgImg) {
        var scale = h / bgImg.height;
        var bw = bgImg.width * scale;
        var bx = (w - bw) / 2;
        ctx.drawImage(bgImg, bx, 0, bw, h);
        // Gradient kiri-kanan
        var gradL = ctx.createLinearGradient(0, 0, bx, 0);
        gradL.addColorStop(0, '#C8102E');
        gradL.addColorStop(1, 'rgba(200,16,46,0)');
        ctx.fillStyle = gradL;
        ctx.fillRect(0, 0, bx, h);
        var gradR = ctx.createLinearGradient(bx + bw, 0, w, 0);
        gradR.addColorStop(0, 'rgba(200,16,46,0)');
        gradR.addColorStop(1, '#C8102E');
        ctx.fillStyle = gradR;
        ctx.fillRect(bx + bw, 0, w - bx - bw, h);
      } else {
        // Fallback gradient
        var grad = ctx.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0, '#C8102E');
        grad.addColorStop(0.5, '#9a0c23');
        grad.addColorStop(1, '#1a1a1a');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
      }

      // Overlay cuaca
      if (state.weather === 'panas') {
        ctx.fillStyle = 'rgba(255, 200, 50, 0.05)';
        ctx.fillRect(0, 0, w, h);
        // Matahari
        ctx.font = '30px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('☀️', w - 50, 50);
      } else {
        ctx.fillStyle = 'rgba(50, 50, 100, 0.15)';
        ctx.fillRect(0, 0, w, h);
        // Hujan
        ctx.strokeStyle = 'rgba(150, 200, 255, 0.4)';
        ctx.lineWidth = 1;
        for (var i = 0; i < 50; i++) {
          var rx = (i * 37 + timestamp * 0.1) % w;
          var ry = (i * 53 + timestamp * 0.5) % h;
          ctx.beginPath();
          ctx.moveTo(rx, ry);
          ctx.lineTo(rx - 5, ry + 15);
          ctx.stroke();
        }
        // Genangan
        ctx.fillStyle = 'rgba(100, 150, 255, 0.1)';
        ctx.fillRect(0, h * 0.85, w, h * 0.15);
      }

      // Gambar motor
      for (var i = 0; i < state.motors.length; i++) {
        var m = state.motors[i];
        var imgKey = '';
        if (m.type === 'moge') {
          imgKey = m.dirty ? 'motor-moge-kotor' : 'motor-moge-bersih';
        } else if (m.type === 'bebek') {
          imgKey = m.dirty ? 'motor-bebek-kotor' : 'motor-bebek-bersih';
        }
        var img = getImage(imgKey);
        var mw = 60;
        var mh = 80;
        var mx = m.x - mw / 2;
        var my = m.y - mh / 2;

        ctx.save();
        ctx.translate(m.x, m.y);
        ctx.rotate(Math.PI);
        if (img) {
          ctx.drawImage(img, -mw/2, -mh/2, mw, mh);
        } else {
          ctx.font = '40px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(m.type === 'moge' ? '🏍️' : '🛵', 0, 0);
        }
        ctx.restore();

        // Efek moge VIP
        if (m.type === 'moge' && m.parked && !m.dirty) {
          ctx.save();
          ctx.translate(m.x, m.y);
          var gradient = ctx.createConicGradient(timestamp * 0.002, 0, 0);
          gradient.addColorStop(0, 'rgba(245, 158, 11, 0.6)');
          gradient.addColorStop(0.5, 'rgba(255, 215, 0, 0.2)');
          gradient.addColorStop(1, 'rgba(245, 158, 11, 0.6)');
          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(0, 0, 35, 0, Math.PI * 2);
          ctx.fill();
          ctx.font = '20px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('✨', 0, -20);
          ctx.restore();
        }

        // Indikator tap
        if (m.parked && m.dirty && !m.kabur) {
          ctx.font = '16px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('💧', m.x, m.y - 45);
        }

        // Kabur
        if (m.parked && m.kaburTimer > 5 && !m.kabur) {
          ctx.font = '20px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('💢', m.x + 20, m.y - 30);
        }
      }

      // Partikel efek tap
      for (var i = state.particles ? state.particles.length - 1 : -1; i >= 0; i--) {
        var p = state.particles[i];
        p.life -= 0.016;
        p.y -= 20 * 0.016;
        if (p.life <= 0) {
          state.particles.splice(i, 1);
          continue;
        }
        ctx.globalAlpha = p.life;
        ctx.fillStyle = '#60a5fa';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      // Koin terbang
      for (var i = state.coinFly ? state.coinFly.length - 1 : -1; i >= 0; i--) {
        var c = state.coinFly[i];
        c.t += 0.02;
        c.x += (c.tx - c.x) * 0.08;
        c.y += (c.ty - c.y) * 0.08;
        if (c.t > 1) {
          state.coinFly.splice(i, 1);
          continue;
        }
        ctx.font = '20px sans-serif';
        ctx.textAlign = 'center';
        ctx.globalAlpha = 1 - c.t;
        ctx.fillText('🪙', c.x, c.y);
      }
      ctx.globalAlpha = 1;
    }

    // ============================================================
    // GAME LOOP
    // ============================================================
    var lastTime = 0;
    var spawnTimer = 0;

    function gameLoop(timestamp) {
      var dt = (timestamp - lastTime) / 1000;
      lastTime = timestamp;

      if (dt > 0.1) dt = 0.1;

      // Spawn motor
      spawnTimer += dt;
      var interval = state.weather === 'panas' ? 2 : 6;
      if (spawnTimer > interval) {
        spawnTimer = 0;
        spawnMotor();
      }

      updateMotors(dt);
      updateWeather();

      // Produksi manajer/upgrade
      if (state.pendingProduction < 1000000) {
        var prod = getProductionRate();
        state.pendingProduction += prod * dt;
        if (state.pendingProduction > 1000000) state.pendingProduction = 1000000;
      }

      draw(timestamp);
      requestAnimationFrame(gameLoop);
    }

    // ============================================================
    // PRODUKSI
    // ============================================================
    function getProductionRate() {
      var total = 0;
      var upgrades = state.upgrades || {};
      var keys = ['tukang_semprot', 'tukang_sabun', 'tukang_bilas', 'tukang_kering', 'tukang_poles', 'kompresor'];
      var baseRates = [1, 5, 25, 100, 500, 2500];
      for (var i = 0; i < keys.length; i++) {
        var lvl = upgrades[keys[i]] || 0;
        if (lvl > 0) {
          total += baseRates[i] * Math.pow(2, lvl - 1);
        }
      }
      var managers = state.managers || [];
      for (var i = 0; i < managers.length; i++) {
        if (managers[i].aktif) {
          total += managers[i].rate || 0;
        }
      }
      return total;
    }

    // ============================================================
    // TAP MOTOR
    // ============================================================
    function tapMotor(x, y) {
      for (var i = state.motors.length - 1; i >= 0; i--) {
        var m = state.motors[i];
        if (!m.parked || m.kabur) continue;
        var dist = Math.sqrt((x - m.x) * (x - m.x) + (y - m.y) * (y - m.y));
        if (dist < 50) {
          m.tapCount++;
          console.log('Tap motor: ' + m.id + ', tapCount ' + m.tapCount);

          if (m.type === 'moge' && !m.adsWatched) {
            showMogeModal(m);
            return;
          }

          // Efek air
          if (!state.particles) state.particles = [];
          for (var j = 0; j < 8; j++) {
            state.particles.push({
              x: m.x + (Math.random() - 0.5) * 40,
              y: m.y + (Math.random() - 0.5) * 40,
              size: 5 + Math.random() * 5,
              life: 0.5
            });
          }
          playSound('syuush');

          if (m.tapCount >= m.maxTap) {
            m.dirty = false;
            state.koin += m.pay;
            state.totalCuci++;
            updateHeader();
            showToast('+' + m.pay + ' koin! 🪙', 'success');
            playSound('ting');

            // Koin terbang
            if (!state.coinFly) state.coinFly = [];
            state.coinFly.push({ x: m.x, y: m.y, tx: 40, ty: 40, t: 0 });

            // Hapus motor setelah 1 detik
            setTimeout(function() {
              for (var k = state.motors.length - 1; k >= 0; k--) {
                if (state.motors[k].id === m.id) {
                  state.motors.splice(k, 1);
                  break;
                }
              }
            }, 1000);
          } else {
            updateHeader();
          }
          return;
        }
      }
    }

    // ============================================================
    // MOGE MODAL
    // ============================================================
    function showMogeModal(m) {
      showModal(
        '<div class="modal-avatar">🏍️</div>' +
        '<div class="modal-title">Moge VIP!</div>' +
        '<div class="modal-text">Tonton iklan untuk mencuci moge ini dan dapatkan 500 koin!</div>' +
        '<button class="modal-btn" onclick="window.tontonIklan(' + m.id + ')">🎬 Tonton Iklan</button>' +
        '<button class="modal-btn secondary" onclick="window.closeModal()">Nanti</button>'
      );
    }

    window.tontonIklan = function(motorId) {
      closeModal();
      window.open('https://www.profitableratecpmnetwork.com/q9qnyhdf9c?key=56f60182ff2837aef7d8e65616a77746', '_blank');
      setTimeout(function() {
        window.open('https://omg10.com/4/11785165', '_blank');
      }, 1000);

      var motor = null;
      for (var i = 0; i < state.motors.length; i++) {
        if (state.motors[i].id === motorId) {
          motor = state.motors[i];
          break;
        }
      }
      if (!motor) return;

      showToast('Tonton iklan 30 detik...', 'info');
      var timer = 30;
      var interval = setInterval(function() {

        if (timer <= 0) {
          clearInterval(interval);
          motor.adsWatched = true;
          motor.dirty = false;
          state.koin += 500;
          updateHeader();
          showToast('+500 koin! 🪙', 'success');
          playSound('chime');
        }
      }, 1000);

      setTimeout(function() {
        if (!motor.adsWatched) {
          showToast('Moge VIP kabur! 💢', 'error');
          for (var i = state.motors.length - 1; i >= 0; i--) {
            if (state.motors[i].id === motorId) {
              state.motors.splice(i, 1);
              break;
            }
          }
        }
      }, 10000);
    };

    // ============================================================
    // UPDATE HEADER
    // ============================================================
    function updateHeader() {
      var u = state.user;
      if (!u) return;

    // ============================================================
    // SYNC
    // ============================================================
    function syncToServer() {
      if (!state.user) return;
      var u = state.user;
      var payload = {
        sheet: SHEET_USERS,
        row: u._row,
        data: {
          id: u.id,
          nama: u.nama,
          nomor: u.nomor,
          password: u.password,
          device_id: u.device_id,
          saldo_koin: state.koin,
          saldo_rupiah: state.rupiah,
          kristal: state.kristal,
          level: state.level,
          cabang_aktif: state.branches,
          status: u.status,
          last_login: u.last_login,
          last_sync: new Date().toISOString(),
          tanggal_daftar: u.tanggal_daftar,
          story_unlocked: state.storyUnlocked
        }
      };

      console.log('Sync: kirim=' + state.koin + ', pending=' + state.pendingProduction);

      apiCall('update', payload).then(function(res) {
        if (res && res.ok) {
          state.koin = payload.data.saldo_koin;
          state.pendingProduction = 0;
          state.lastSync = Date.now();
          updateHeader();
          saveUser(state.user);
        }
      }).catch(function(err) {
        console.log('Sync gagal:', err.message);
      });
    }

    // ============================================================
    // LOAD USER
    // ============================================================
    function loadUserData() {
      var u = loadUser();
      if (!u) {
        showLoginPrompt();
        return;
      }

      state.user = u;
      state.koin = u.saldo_koin || 0;
      state.rupiah = u.saldo_rupiah || 0;
      state.kristal = u.kristal || 0;
      state.level = u.level || 1;
      state.branches = u.cabang_aktif || 1;
      state.storyUnlocked = u.story_unlocked || 0;

      var extra = loadExtra();
      state.exp = extra.exp || 0;
      state.managers = extra.managers || [];
      state.upgrades = extra.upgrades || {};
      state.totalCuci = extra.totalCuci || 0;
      state.tokoItems = extra.tokoItems || [];

      updateHeader();
      console.log('User: ' + u.nama);

      // Fetch update background
      setTimeout(function() {
        apiCall('bacaSatu', { sheet: SHEET_USERS, kolom: 'nomor', nilai: u.nomor }).then(function(res) {
          if (res && res.ok && res.data && res.data.length > 0) {
            var fresh = res.data[0];
            state.user = fresh;
            state.koin = fresh.saldo_koin || 0;
            state.rupiah = fresh.saldo_rupiah || 0;
            state.kristal = fresh.kristal || 0;
            state.level = fresh.level || 1;
            state.storyUnlocked = fresh.story_unlocked || 0;
            updateHeader();
            saveUser(fresh);
          }
        }).catch(function() {});
      }, 500);
    }

      state.koin -= cost;
      state.branches = lvl;
      updateHeader();
      showToast('Cabang ' + lvl + ' dibuka! 🏢', 'success');
      playSound('chime');
      openPanel('cabang');
    };

    function renderConvertPanel(container) {
      var html = '<div class="list-item">' +
        '<div class="li-icon">💱</div>' +
        '<div class="li-info">' +
          '<div class="li-title">Convert Koin ke Rupiah</div>' +
          '<div class="li-desc">1000 koin = Rp 100. Min. 10.000 koin</div>' +
        '</div>' +
      '</div>';
      html += '<div class="list-item">' +
        '<div class="li-icon">🪙</div>' +
        '<div class="li-info">' +
          '<div class="li-title">Koin tersedia: ' + formatNumber(state.koin) + '</div>' +
        '</div>' +
      '</div>';
      html += '<div style="padding:12px 0;"><input type="number" id="convertAmount" placeholder="Jumlah koin" style="width:100%;padding:12px;border-radius:10px;border:1px solid #444;background:#1a1a1a;color:#fff;font-family:Poppins;font-size:14px;" min="10000" step="1000"></div>';
      html += '<button class="modal-btn" onclick="window.doConvert()">Convert</button>';
      container.innerHTML = html;
    }

    window.doConvert = function() {
      var input = document.getElementById('convertAmount');
      var amount = parseInt(input.value) || 0;
      if (amount < 10000) { showToast('Minimal 10.000 koin!', 'error'); playSound('buzz'); return; }
      if (amount > state.koin) { showToast('Koin tidak cukup!', 'error'); playSound('buzz'); return; }
      var rupiah = Math.floor(amount / 1000) * 100;
      state.koin -= amount;
      state.rupiah += rupiah;
      updateHeader();
      showToast('Convert berhasil! +' + formatRupiah(rupiah), 'success');
      playSound('chime');
      openPanel('convert');
    };

    function renderTopupPanel(container) {
      var html = '<div class="section-title">🪙 Koin</div>';
      var koinPackages = [
        { label: '5rb', price: 5000, koin: 100000 },
        { label: '10rb', price: 10000, koin: 250000 },
        { label: '25rb', price: 25000, koin: 700000 },
        { label: '50rb', price: 50000, koin: 1500000 },
        { label: '100rb', price: 100000, koin: 3500000 }
      ];
      for (var i = 0; i < koinPackages.length; i++) {
        var p = koinPackages[i];
        html += '<div class="list-item">' +
          '<div class="li-icon">🪙</div>' +
          '<div class="li-info">' +
            '<div class="li-title">' + formatNumber(p.koin) + ' Koin</div>' +
            '<div class="li-cost">' + formatRupiah(p.price) + '</div>' +
          '</div>' +
          '<button class="li-btn buy" onclick="window.topupItem(\'' + p.label + '\')">Beli</button>' +
        '</div>';
      }
      html += '<div class="section-title">💵 Rupiah</div>';
      var rupiahPackages = [
        { label: '5rb', price: 5000, rupiah: 5500 },
        { label: '10rb', price: 10000, rupiah: 12000 },
        { label: '25rb', price: 25000, rupiah: 32500 },
        { label: '50rb', price: 50000, rupiah: 70000 },
        { label: '100rb', price: 100000, rupiah: 150000 }
      ];
      for (var i = 0; i < rupiahPackages.length; i++) {
        var p = rupiahPackages[i];
        html += '<div class="list-item">' +
          '<div class="li-icon">💵</div>' +
          '<div class="li-info">' +
            '<div class="li-title">' + formatRupiah(p.rupiah) + '</div>' +
            '<div class="li-cost">' + formatRupiah(p.price) + '</div>' +
          '</div>' +
          '<button class="li-btn buy" onclick="window.topupItem(\'' + p.label + '\')">Beli</button>' +
        '</div>';
      }
      html += '<div class="section-title">💎 Kristal</div>';
      var kristalPackages = [
        { label: '5rb', price: 5000, kristal: 10 },
        { label: '10rb', price: 10000, kristal: 25 },
        { label: '25rb', price: 25000, kristal: 70 },
        { label: '50rb', price: 50000, kristal: 160 },
        { label: '100rb', price: 100000, kristal: 350 }
      ];
      for (var i = 0; i < kristalPackages.length; i++) {
        var p = kristalPackages[i];
        html += '<div class="list-item">' +
          '<div class="li-icon">💎</div>' +
          '<div class="li-info">' +
            '<div class="li-title">' + p.kristal + ' Kristal</div>' +
            '<div class="li-cost">' + formatRupiah(p.price) + '</div>' +
          '</div>' +
          '<button class="li-btn buy" onclick="window.topupItem(\'' + p.label + '\')">Beli</button>' +
        '</div>';
      }
      container.innerHTML = html;
    }

    window.topupItem = function(label) {
      showToast('Topup ' + label + ' — hubungi admin untuk pembayaran', 'info');
    };

    function renderVoucherPanel(container) {
      var html = '<div class="list-item">' +
        '<div class="li-icon">🎫</div>' +
        '<div class="li-info">' +
          '<div class="li-title">Voucher Cuci</div>' +
          '<div class="li-desc">70.000 koin atau Rp 7.000. Maks 1/minggu</div>' +
        '</div>' +
      '</div>';
      html += '<div class="list-item">' +
        '<div class="li-icon">📱</div>' +
        '<div class="li-info">' +
          '<div class="li-title">Konfirmasi Nomor HP</div>' +
          '<div class="li-desc">' + (state.user ? state.user.nomor : '-') + '</div>' +
        '</div>' +
      '</div>';
      html += '<button class="modal-btn" onclick="window.beliVoucher()">Beli Voucher</button>';
      container.innerHTML = html;
    }

    window.beliVoucher = function() {
      if (state.koin < 70000 && state.rupiah < 7000) {
        showToast('Koin/Rupiah tidak cukup!', 'error');
        playSound('buzz');
        return;
      }
      var kode = 'MP7K-' + Math.random().toString(36).substring(2, 8).toUpperCase();
      if (state.koin >= 70000) state.koin -= 70000;
      else state.rupiah -= 7000;
      updateHeader();
      showToast('Voucher: ' + kode, 'success');
      playSound('chime');
    };

    function renderCeritaPanel(container) {
      var chapters = [
        { id: 1, title: 'Bab 1: Awal Mula', unlocked: true },
        { id: 2, title: 'Bab 2: Pelanggan Pertama', unlocked: state.totalCuci >= 5 },
        { id: 3, title: 'Bab 3: Koin Pertama', unlocked: state.koin >= 10000 },
        { id: 4, title: 'Bab 4: Manajer Pertama', unlocked: (state.managers || []).length >= 1 },
        { id: 5, title: 'Bab 5: Jutawan', unlocked: state.koin >= 1000000 },
        { id: 6, title: 'Bab 6: Tim Solid', unlocked: (state.managers || []).length >= 3 },
        { id: 7, title: 'Bab 7: Raja Steam', unlocked: state.koin >= 1000000000 }
      ];
      var html = '';
      for (var i = 0; i < chapters.length; i++) {
        var c = chapters[i];
        html += '<div class="list-item" onclick="window.bukaCerita(' + c.id + ')">' +
          '<div class="li-icon">' + (c.unlocked ? '📖' : '🔒') + '</div>' +
          '<div class="li-info">' +
            '<div class="li-title">' + c.title + '</div>' +
            '<div class="li-desc">' + (c.unlocked ? 'Terbuka' : 'Terkunci') + '</div>' +
          '</div>' +
        '</div>';
      }
      container.innerHTML = html;

      if (state.storyUnlocked === 0) {
        setTimeout(function() { bukaCerita(1); }, 500);
      }
    }

    window.bukaCerita = function(id) {
      var chapters = {
        1: { title: 'Bab 1: Awal Mula', text: 'Pak Aldi membuka usaha cuci motor "Steam MP 7000". Mulailah petualanganmu!' },
        2: { title: 'Bab 2: Pelanggan Pertama', text: 'Motor pertama datang! Cuci dengan baik dan dapatkan koin.' },
        3: { title: 'Bab 3: Koin Pertama', text: 'Koin mulai mengalir. Waktunya upgrade peralatan!' },
        4: { title: 'Bab 4: Manajer Pertama', text: 'Rekrut manajer untuk membantu produksi koin.' },
        5: { title: 'Bab 5: Jutawan', text: 'Kamu sudah mengumpulkan 1 juta koin! Luar biasa!' },
        6: { title: 'Bab 6: Tim Solid', text: 'Dengan 3 manajer, usahamu semakin besar.' },
        7: { title: 'Bab 7: Raja Steam', text: '1 miliar koin! Kamu adalah Raja Steam MP 7000!' }
      };
      var c = chapters[id];
      if (!c) return;
      var img = getImage('pak-aldi');
      var avatar = img ? '<img src="' + img.src + '" alt="Pak Aldi">' : '👨‍🔧';
      showModal(
        '<div class="modal-avatar">' + avatar + '</div>' +
        '<div class="modal-title">' + c.title + '</div>' +
        '<div class="modal-text">' + c.text + '</div>' +
        '<button class="modal-btn" onclick="window.closeModal();window.afterStory(' + id + ')">Lanjut</button>'
      );
    };

    window.afterStory = function(id) {
      if (id > state.storyUnlocked) {
        state.storyUnlocked = id;
        if (state.user) {
          state.user.story_unlocked = id;
          saveUser(state.user);
        }
      }
    };

    // ============================================================
    // INIT
    // ============================================================
    function init() {
      console.log('Dashboard: load');

      // Cek admin
      var params = new URLSearchParams(window.location.search);
      if (params.get('admin') === '1' && localStorage.getItem('smp7k_admin')) {
        state.adminMode = true;
      }

      // Resize canvas
      resizeCanvas();

      // Load images
      loadImage('steam-bg', 'assets/steam-bg.png', 0, false);
      loadImage('motor-bebek-kotor', 'assets/motor-bebek-kotor.png', 40, true);
      loadImage('motor-bebek-bersih', 'assets/motor-bebek-bersih.png', 40, true);
      loadImage('motor-moge-kotor', 'assets/motor-moge-kotor.png', 40, true);
      loadImage('motor-moge-bersih', 'assets/motor-moge-bersih.png', 40, true);
      loadImage('koin', 'assets/koin.png', 30, true);
      loadImage('kristal', 'assets/kristal.png', 20, true);
      loadImage('rupiah', 'assets/rupiah.png', 25, true);
      loadImage('pak-aldi', 'assets/pak-aldi.png', 40, true);
      loadImage('qris', 'assets/qris.png', 0, false);

      // Load user
      loadUserData();

      // Setup nav
      var navItems = document.querySelectorAll('.nav-item');
      for (var i = 0; i < navItems.length; i++) {
        (function(item) {
          item.addEventListener('click', function() {
            var tab = item.getAttribute('data-tab');
            if (tab === 'lainnya') {
              openPanel('lainnya');
            } else {
              openPanel(tab);
            }
          });
        })(navItems[i]);
      }

      // Panel close
      document.getElementById('panelClose').addEventListener('click', closePanel);
      document.getElementById('panelOverlay').addEventListener('click', closePanel);

      // Header buttons
      document.getElementById('btnWeather').addEventListener('click', function() {
        state.weather = state.weather === 'panas' ? 'hujan' : 'panas';
        this.textContent = state.weather === 'panas' ? '☀️' : '🌧️';
        showToast(state.weather === 'panas' ? '☀️ Cuaca panas!' : '🌧️ Cuaca hujan!', 'info');
      });

      document.getElementById('btnMusic').addEventListener('click', function() {
        state.musikOn = !state.musikOn;
        var audio = document.getElementById('bgMusic');
        if (state.musikOn) {
          audio.play().catch(function() {});
          this.textContent = '🔊';
        } else {
          audio.pause();
          this.textContent = '🔇';
        }
      });

      document.getElementById('btnMenu').addEventListener('click', function() {
        openPanel('lainnya');
      });

      document.getElementById('btnLogout').addEventListener('click', function() {
        showModal(
          '<div class="modal-title">Keluar?</div>' +
          '<div class="modal-text">Yakin ingin keluar dari game?</div>' +
          '<button class="modal-btn" onclick="window.logout()">Ya, Keluar</button>' +
          '<button class="modal-btn secondary" onclick="window.closeModal()">Batal</button>'
        );
      });

      // Canvas tap
      canvas.addEventListener('click', function(e) {
        var rect = canvas.getBoundingClientRect();
        var x = e.clientX - rect.left;
        var y = e.clientY - rect.top;
        tapMotor(x, y);
      });

      // Touch
      canvas.addEventListener('touchstart', function(e) {
        e.preventDefault();
        var touch = e.touches[0];
        var rect = canvas.getBoundingClientRect();
        var x = touch.clientX - rect.left;
        var y = touch.clientY - rect.top;
        tapMotor(x, y);
      }, { passive: false });

      // Start game loop
      requestAnimationFrame(gameLoop);

      // Sync setiap 10 detik
      setInterval(function() {
        if (state.user) syncToServer();
      }, 10000);

      // Update produksi
      setInterval(function() {
        updateHeader();
      }, 1000);

      // Init audio on first interaction
      document.addEventListener('touchstart', function() {
        initAudio();
        var audio = document.getElementById('bgMusic');
        if (state.musikOn && audio.paused) {
          audio.play().catch(function() {});
        }
      }, { once: true });

      document.addEventListener('click', function() {
        initAudio();
      }, { once: true });

      // Tampilkan panel game pertama kali
      setTimeout(function() {
        openPanel('game');
      }, 1000);
    }

    // ============================================================
    // START
    // ============================================================
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }

  })();
  </script>
</body>
</html>
