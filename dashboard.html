<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Steam MP 7000 Tycoon</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  body { background: #1a0505; color: #FAFAFA; position: relative; user-select: none; }

  #rainCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
  .overlay-bg {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;
    background: radial-gradient(ellipse at 50% 20%, rgba(183,28,28,0.10) 0%, rgba(10,2,2,0.65) 60%, rgba(5,1,1,0.9) 100%);
    pointer-events: none;
  }

  .app {
    position: relative; z-index: 10; width: 100%; height: 100%;
    display: flex; flex-direction: column;
  }

  /* HEADER */
  .header {
    flex-shrink: 0;
    background: rgba(20,6,6,0.85);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(212,175,55,0.2);
    padding: 10px 12px;
  }
  .header-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .player-info { display: flex; flex-direction: column; min-width: 0; }
  .player-name { font-size: 14px; font-weight: 800; color: #FAFAFA; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 130px; }
  .player-level { font-size: 10px; color: #D4AF37; font-weight: 600; }
  .header-actions { display: flex; gap: 6px; }
  .icon-btn {
    width: 34px; height: 34px; border-radius: 10px; border: 1px solid rgba(212,175,55,0.25);
    background: rgba(0,0,0,0.3); color: #FAFAFA; font-size: 15px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: all 0.2s;
  }
  .icon-btn:active { transform: scale(0.9); background: rgba(183,28,28,0.4); }

  .balances { display: flex; gap: 6px; margin-top: 8px; }
  .bal-item {
    flex: 1; background: rgba(0,0,0,0.35); border: 1px solid rgba(212,175,55,0.15);
    border-radius: 10px; padding: 6px 8px; text-align: center;
  }
  .bal-label { font-size: 9px; color: #D4AF37; letter-spacing: 0.5px; }
  .bal-value { font-size: 13px; font-weight: 800; color: #FAFAFA; margin-top: 1px; }

  .progress-wrap { margin-top: 8px; }
  .progress-bar { height: 6px; background: rgba(0,0,0,0.5); border-radius: 4px; overflow: hidden; }
  .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #B71C1C, #D4AF37); border-radius: 4px; transition: width 0.4s ease; }
  .progress-text { font-size: 9px; color: #aaa; margin-top: 3px; display: flex; justify-content: space-between; }

  /* TAP AREA */
  .tap-area {
    flex: 1; position: relative; display: flex; align-items: center; justify-content: center;
    overflow: hidden; cursor: pointer;
  }
  .tap-inner { text-align: center; pointer-events: none; }
  .tap-icon { font-size: 64px; filter: drop-shadow(0 0 20px rgba(183,28,28,0.6)); animation: float 3s ease-in-out infinite; }
  .tap-text { font-size: 15px; color: #D4AF37; font-weight: 700; letter-spacing: 2px; margin-top: 10px; }
  .tap-hint { font-size: 11px; color: #888; margin-top: 4px; }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

  .float-coin {
    position: absolute; font-size: 18px; font-weight: 900; color: #D4AF37;
    pointer-events: none; z-index: 20; text-shadow: 0 0 10px rgba(212,175,55,0.8);
    animation: floatUp 0.9s ease-out forwards;
  }
  @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-70px) scale(1.4); } }

  .particle {
    position: absolute; width: 6px; height: 6px; border-radius: 50%;
    background: rgba(180,200,230,0.8); pointer-events: none; z-index: 19;
    animation: particleAnim 0.7s ease-out forwards;
  }
  @keyframes particleAnim { 0% { opacity: 0.9; transform: translate(0,0) scale(1); } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.2); } }

  /* TAB MENU BAWAH */
  .tab-menu {
    flex-shrink: 0;
    background: rgba(20,6,6,0.92);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-top: 1px solid rgba(212,175,55,0.2);
    display: flex; overflow-x: auto; scrollbar-width: none; padding: 6px 4px;
  }
  .tab-menu::-webkit-scrollbar { display: none; }
  .menu-btn {
    flex: 0 0 auto; min-width: 62px; padding: 7px 4px; margin: 0 2px;
    background: transparent; border: none; border-radius: 10px;
    color: #999; font-size: 9px; font-weight: 700; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 3px; transition: all 0.2s;
  }
  .menu-btn .ic { font-size: 17px; }
  .menu-btn.active { background: linear-gradient(135deg, rgba(183,28,28,0.8), rgba(139,0,0,0.8)); color: #FAFAFA; box-shadow: 0 3px 12px rgba(183,28,28,0.4); }

  /* PANEL KONTEN */
  .content-panel {
    position: fixed; left: 0; right: 0; bottom: 0; top: 0; z-index: 40;
    background: rgba(10,3,3,0.97);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    transform: translateY(100%);
    transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
    display: flex; flex-direction: column;
    padding-top: env(safe-area-inset-top);
  }
  .content-panel.open { transform: translateY(0); }
  .panel-header {
    flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; border-bottom: 1px solid rgba(212,175,55,0.2);
  }
  .panel-title { font-size: 16px; font-weight: 800; color: #FAFAFA; letter-spacing: 1px; }
  .panel-close {
    width: 32px; height: 32px; border-radius: 50%; border: 1px solid rgba(212,175,55,0.3);
    background: rgba(0,0,0,0.4); color: #FAFAFA; font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .panel-body { flex: 1; overflow-y: auto; padding: 14px 16px 30px; -webkit-overflow-scrolling: touch; }

  .section-title { font-size: 13px; color: #D4AF37; font-weight: 700; letter-spacing: 1px; margin: 16px 0 8px; text-transform: uppercase; }
  .section-title:first-child { margin-top: 0; }

  .item-card {
    background: rgba(20,8,8,0.7); border: 1px solid rgba(212,175,55,0.18);
    border-radius: 14px; padding: 12px 14px; margin-bottom: 10px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .item-left { flex: 1; min-width: 0; }
  .item-name { font-size: 13.5px; font-weight: 700; color: #FAFAFA; }
  .item-desc { font-size: 11px; color: #aaa; margin-top: 2px; }
  .item-price { font-size: 11.5px; color: #D4AF37; font-weight: 700; margin-top: 3px; }
  .item-btn {
    flex-shrink: 0; padding: 9px 14px; border-radius: 10px; border: none;
    background: linear-gradient(135deg, #B71C1C, #7f0e0e); color: #FAFAFA;
    font-size: 12px; font-weight: 800; cursor: pointer; transition: all 0.2s;
    box-shadow: 0 3px 10px rgba(183,28,28,0.35); white-space: nowrap;
  }
  .item-btn:active { transform: scale(0.94); }
  .item-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .item-btn.gold { background: linear-gradient(135deg, #D4AF37, #a8851f); color: #1a0505; }

  .input-field {
    width: 100%; padding: 12px 14px; background: rgba(0,0,0,0.4);
    border: 1px solid rgba(212,175,55,0.2); border-radius: 11px;
    color: #FAFAFA; font-size: 14px; outline: none; margin-bottom: 10px;
  }
  .input-field:focus { border-color: #B71C1C; }

  .btn-block {
    width: 100%; padding: 13px; border-radius: 12px; border: none;
    background: linear-gradient(135deg, #B71C1C, #7f0e0e); color: #FAFAFA;
    font-size: 14px; font-weight: 800; letter-spacing: 0.5px; cursor: pointer;
    box-shadow: 0 5px 16px rgba(183,28,28,0.4); transition: all 0.2s; margin-bottom: 8px;
  }
  .btn-block:active { transform: scale(0.97); }
  .btn-block.gold { background: linear-gradient(135deg, #D4AF37, #a8851f); color: #1a0505; }
  .btn-block.ghost { background: rgba(0,0,0,0.3); border: 1px solid rgba(212,175,55,0.3); box-shadow: none; }

  .qris-box {
    background: rgba(0,0,0,0.4); border: 1px dashed rgba(212,175,55,0.4);
    border-radius: 12px; padding: 20px; text-align: center; margin: 10px 0;
  }
  .qris-box img { max-width: 100%; border-radius: 8px; }
  .qris-placeholder { font-size: 12px; color: #D4AF37; }

  .voucher-code {
    font-size: 20px; font-weight: 900; color: #D4AF37; letter-spacing: 3px;
    text-align: center; padding: 14px; background: rgba(0,0,0,0.5);
    border: 1px solid rgba(212,175,55,0.5); border-radius: 12px; margin: 10px 0;
    text-shadow: 0 0 12px rgba(212,175,55,0.6);
  }

  .story-chapter { margin-bottom: 14px; }
  .story-title { font-size: 14px; font-weight: 800; color: #D4AF37; margin-bottom: 6px; }
  .story-text { font-size: 13px; line-height: 1.6; color: #ddd; }

  .toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px);
    background: rgba(20,6,6,0.96); border: 1px solid rgba(212,175,55,0.4);
    color: #FAFAFA; padding: 13px 20px; border-radius: 12px; font-size: 13.5px;
    z-index: 200; transition: transform 0.4s cubic-bezier(0.68,-0.55,0.27,1.55);
    max-width: 88%; text-align: center; box-shadow: 0 8px 30px rgba(0,0,0,0.6);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.err { border-color: rgba(255,80,80,0.6); }
  .toast.ok { border-color: rgba(80,200,120,0.6); }

  .loading-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 300;
    background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center;
  }
  .loading-overlay.show { display: flex; }
  .loader {
    width: 40px; height: 40px; border: 3px solid rgba(212,175,55,0.3);
    border-top-color: #D4AF37; border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .admin-badge {
    position: fixed; top: 8px; left: 50%; transform: translateX(-50%);
    background: linear-gradient(135deg, #D4AF37, #a8851f); color: #1a0505;
    font-size: 10px; font-weight: 900; padding: 4px 14px; border-radius: 20px;
    z-index: 150; letter-spacing: 2px; display: none;
  }
  .admin-badge.show { display: block; }

  .admin-tab-bar {
    flex-shrink: 0; display: flex; overflow-x: auto; scrollbar-width: none;
    background: rgba(0,0,0,0.5); padding: 8px 6px; border-bottom: 1px solid rgba(212,175,55,0.2);
  }
  .admin-tab-bar::-webkit-scrollbar { display: none; }
  .admin-tab {
    flex: 0 0 auto; padding: 7px 12px; margin: 0 3px; border-radius: 8px;
    background: transparent; border: 1px solid rgba(212,175,55,0.2);
    color: #ccc; font-size: 11px; font-weight: 700; cursor: pointer; white-space: nowrap;
  }
  .admin-tab.active { background: linear-gradient(135deg, #B71C1C, #8B0000); color: #FAFAFA; border-color: transparent; }

  .admin-panel {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 100;
    background: rgba(8,2,2,0.99); display: none; flex-direction: column;
    padding-top: env(safe-area-inset-top);
  }
  .admin-panel.show { display: flex; }
  .admin-header {
    flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; border-bottom: 1px solid rgba(212,175,55,0.3);
    background: rgba(20,6,6,0.95);
  }
  .admin-header h2 { font-size: 15px; color: #D4AF37; letter-spacing: 1px; }
  .admin-content { flex: 1; overflow-y: auto; padding: 14px 16px 30px; }

  .stat-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .stat-box {
    flex: 1; background: rgba(20,8,8,0.7); border: 1px solid rgba(212,175,55,0.15);
    border-radius: 12px; padding: 10px; text-align: center;
  }
  .stat-box .lbl { font-size: 9px; color: #D4AF37; }
  .stat-box .val { font-size: 16px; font-weight: 800; color: #FAFAFA; margin-top: 2px; }

  .hidden { display: none !important; }
</style>
</head>

/* ================= UTIL ================= */
function getDeviceId() {
  let d = localStorage.getItem(DEVICE_KEY);
  if (!d) { d = "dev_" + Math.random().toString(36).substring(2, 12) + Date.now().toString(36); localStorage.setItem(DEVICE_KEY, d); }
  return d;
}
function fmt(n) {
  n = Number(n) || 0;
  if (n >= 1e12) return (n/1e12).toFixed(1) + "T";
  if (n >= 1e9) return (n/1e9).toFixed(1) + "M";
  if (n >= 1e6) return (n/1e6).toFixed(1) + "jt";
  if (n >= 1e3) return (n/1e3).toFixed(1) + "rb";
  return Math.floor(n).toString();
}
function fmtRp(n) { return "Rp " + (Number(n)||0).toLocaleString("id-ID"); }
function sensorNomor(n) { if (!n || n.length < 6) return n; return n.substring(0,4) + "****" + n.substring(n.length-3); }
function esc(s) { return String(s||"").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function todayStr() { const d = new Date(); return d.getDate().toString().padStart(2,'0') + "/" + (d.getMonth()+1).toString().padStart(2,'0') + "/" + d.getFullYear(); }

/* ================= API CALL ================= */
async function apiCall(action, data, useToken) {
  try {
    const body = { action, token: (useToken !== false && TOKEN) ? TOKEN : null, data: data || {} };
    const res = await fetch(API_URL, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    let json;
    try { json = await res.json(); }
    catch (e) { throw new Error("Server tidak merespons"); }
    if (json && json.ok === false && json.message && /token/i.test(json.message) && /expired|invalid|kadaluarsa/i.test(json.message)) {
      localStorage.removeItem(TOKEN_KEY);
      toast("Sesi habis, silakan login ulang", "err");
      setTimeout(() => { window.location.href = "index.html"; }, 1500);
    }
    return json;
  } catch (err) {
    return { ok: false, message: err.message === "Server tidak merespons" ? "Server tidak merespons" : "Gagal terhubung ke server" };
  }
}

/* ================= AUDIO ================= */
let audioCtx = null;
function initAudio() { if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} } if (audioCtx && audioCtx.state === "suspended") audioCtx.resume(); }

function sfxTap() {
  initAudio(); if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.15, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/d.length, 3);
  const src = audioCtx.createBufferSource(); src.buffer = buf;
  const flt = audioCtx.createBiquadFilter(); flt.type = "bandpass"; flt.frequency.value = 2500; flt.Q.value = 0.7;
  const g = audioCtx.createGain(); g.gain.setValueAtTime(0.12, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.15);
  src.connect(flt); flt.connect(g); g.connect(audioCtx.destination); src.start(t);
}
function sfxCoin() {
  initAudio(); if (!audioCtx) return;
  const t = audioCtx.currentTime;
  [880, 1320].forEach((f, i) => {
    const o = audioCtx.createOscillator(); o.type = "sine"; o.frequency.value = f;
    const g = audioCtx.createGain(); g.gain.setValueAtTime(0.08, t+i*0.06); g.gain.exponentialRampToValueAtTime(0.001, t+i*0.06+0.12);
    o.connect(g); g.connect(audioCtx.destination); o.start(t+i*0.06); o.stop(t+i*0.06+0.12);
  });
}
function sfxLevelUp() {
  initAudio(); if (!audioCtx) return;
  const t = audioCtx.currentTime;
  [523, 659, 784, 1047].forEach((f, i) => {
    const o = audioCtx.createOscillator(); o.type = "triangle"; o.frequency.value = f;
    const g = audioCtx.createGain(); g.gain.setValueAtTime(0.09, t+i*0.1); g.gain.exponentialRampToValueAtTime(0.001, t+i*0.1+0.25);
    o.connect(g); g.connect(audioCtx.destination); o.start(t+i*0.1); o.stop(t+i*0.1+0.25);
  });
}
function sfxError() {
  initAudio(); if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator(); o.type = "sawtooth"; o.frequency.setValueAtTime(180, t); o.frequency.exponentialRampToValueAtTime(80, t+0.25);
  const g = audioCtx.createGain(); g.gain.setValueAtTime(0.1, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.25);
  o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t+0.25);
}

/* ================= TAP GAME ================= */
let tapCooldown = 0;
function setupTap() {
  const area = document.getElementById("tapArea");
  area.addEventListener("pointerdown", (e) => {
    const now = Date.now();
    if (now - tapCooldown < 50) return;
    tapCooldown = now;
    const rect = area.getBoundingClientRect();
    const x = e.clientX - rect.left, y = e.clientY - rect.top;

    if (PROFILE) { PROFILE.koin = (Number(PROFILE.koin)||0) + 1; TOTAL_KOIN_PERNAH++; updateHeader(); }

    sfxTap(); sfxCoin();

    const coin = document.createElement("div");
    coin.className = "float-coin"; coin.textContent = "+1";
    coin.style.left = x + "px"; coin.style.top = y + "px";
    area.appendChild(coin); setTimeout(() => coin.remove(), 900);

    for (let i = 0; i < 5; i++) {
      const p = document.createElement("div"); p.className = "particle";
      p.style.left = x + "px"; p.style.top = y + "px";
      p.style.setProperty("--dx", (Math.random()*80-40)+"px");
      p.style.setProperty("--dy", (Math.random()*80-40)+"px");
      area.appendChild(p); setTimeout(() => p.remove(), 700);
    }
  });
}

function compressImage(file, maxKB) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement("canvas");
        let w = img.width, h = img.height;
        const maxDim = 800;
        if (w > maxDim) { h = h * maxDim / w; w = maxDim; }
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        let q = 0.8, data = canvas.toDataURL("image/jpeg", q);
        while (data.length / 1024 > maxKB && q > 0.2) { q -= 0.1; data = canvas.toDataURL("image/jpeg", q); }
        resolve(data);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

      x: Math.random()*W, y: Math.random()*H,
      len: 10+Math.random()*18, speed: 1.6+Math.random()*2.2,
      opacity: 0.10+Math.random()*0.22, thickness: 0.6+Math.random()*0.8
    });
    clouds = [];
    for (let i = 0; i < 5; i++) clouds.push({
      x: Math.random()*W, y: Math.random()*H*0.35,
      r: 90+Math.random()*150, speed: 0.07+Math.random()*0.16,
      alpha: 0.04+Math.random()*0.06
    });
  }
  resize(); window.addEventListener("resize", resize);

  function draw() {
    ctx.clearRect(0,0,W,H);
    for (const c of clouds) {
      c.x += c.speed; if (c.x - c.r > W) c.x = -c.r;
      const g = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, c.r);
      g.addColorStop(0, "rgba(30,10,10,"+c.alpha+")"); g.addColorStop(1, "rgba(30,10,10,0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(c.x,c.y,c.r,0,Math.PI*2); ctx.fill();
    }
    const now = Date.now();
    if (now - lastLightning > 14000 && Math.random() < 0.002) { lastLightning = now; lightningAlpha = 0.35+Math.random()*0.25; }
    if (lightningAlpha > 0) { ctx.fillStyle = "rgba(255,230,230,"+lightningAlpha+")"; ctx.fillRect(0,0,W,H); lightningAlpha -= 0.018; if (lightningAlpha < 0) lightningAlpha = 0; }

    ctx.lineCap = "round";
    for (const d of drops) {
      d.y += d.speed; d.x += d.speed * 0.08;
      if (d.y > H) {
        ripples.push({ x: d.x, y: H - Math.random()*6, r: 1, maxR: 10+Math.random()*12, alpha: 0.3, speed: 0.5 });
        if (ripples.length > 30) ripples.shift();
        d.y = -d.len; d.x = Math.random()*W;
      }
      if (d.x > W) d.x = 0;
      const grad = ctx.createLinearGradient(d.x, d.y, d.x, d.y+d.len);
      grad.addColorStop(0, "rgba(200,220,255,0)"); grad.addColorStop(1, "rgba(200,220,255,"+d.opacity+")");
      ctx.strokeStyle = grad; ctx.lineWidth = d.thickness;
      ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.lineTo(d.x, d.y+d.len); ctx.stroke();
    }
    for (let i = ripples.length-1; i >= 0; i--) {
      const rp = ripples[i]; rp.r += rp.speed; rp.alpha -= 0.006;
      if (rp.alpha <= 0 || rp.r > rp.maxR) { ripples.splice(i,1); continue; }
      ctx.strokeStyle = "rgba(180,200,230,"+rp.alpha+")"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.ellipse(rp.x, rp.y, rp.r, rp.r*0.35, 0, 0, Math.PI*2); ctx.stroke();
    }
    requestAnimationFrame(draw);
  }
  draw();
})();

/* ================= INIT UTAMA ================= */
(async function init() {
  getDeviceId();
  initMusik();
  if (musikOn && musikEl) { document.addEventListener("click", () => { if (musikEl && musikOn) musikEl.play().catch(()=>{}); }, { once: true }); }

  if (!TOKEN) { window.location.href = "index.html"; return; }

  if (IS_ADMIN) {
    const res = await apiCall("getProfile", {}, true);
    if (res && res.ok && res.data && (res.data.admin === true || res.data.role === "admin")) {
      initAdmin();
    } else {
      const check = await apiCall("adminGetAll", {});
      if (check && check.ok) { initAdmin(); }
      else { localStorage.removeItem(TOKEN_KEY); window.location.href = "index.html"; }
    }
    return;
  }

  const ok = await loadProfile();
  if (!ok) { window.location.href = "index.html"; return; }
  updateHeader();
  setupTap();
  setInterval(async () => { await loadProfile(); }, 30000);
})();
</script>
