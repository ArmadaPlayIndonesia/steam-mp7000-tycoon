<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Steam MP 7000 Tycoon - Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* === RESET & BASE === */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      height: 100%;
      font-family: 'Rajdhani', sans-serif;
      background: #0a0a0a;
      color: #eee;
      overflow-x: hidden;
    }
    body {
      background: radial-gradient(circle at 50% 20%, #1a1a1a 0%, #0a0a0a 70%);
      min-height: 100vh;
      position: relative;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: 
        radial-gradient(circle at 20% 80%, rgba(255,215,0,0.03) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(52,152,219,0.03) 0%, transparent 50%),
        repeating-linear-gradient(45deg, transparent, transparent 2px, rgba(255,255,255,0.01) 2px, rgba(255,255,255,0.01) 4px);
      pointer-events: none;
      z-index: 0;
    }
    /* === LOADING SCREEN === */
    .loading-screen {
      position: fixed;
      inset: 0;
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      gap: 20px;
    }
    .loading-screen .spinner-lg {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255,215,0,0.15);
      border-top-color: #FFD700;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .loading-screen p {
      font-family: 'Orbitron', sans-serif;
      font-size: 14px;
      color: #FFD700;
      letter-spacing: 2px;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }

    /* === APP CONTAINER === */
    .app {
      display: none;
      flex-direction: column;
      min-height: 100vh;
      position: relative;
      z-index: 1;
      max-width: 480px;
      margin: 0 auto;
      padding-bottom: 20px;
    }
    .app.show { display: flex; }

    /* === HEADER === */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(10,10,10,0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,215,0,0.1);
      padding: 10px 12px;
    }
    .header-row1 {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .player-info {
      display: flex;
      flex-direction: column;
    }
    .player-name {
      font-family: 'Orbitron', sans-serif;
      font-size: 14px;
      font-weight: 700;
      color: #FFD700;
      letter-spacing: 0.5px;
    }
    .player-level {
      font-size: 11px;
      color: #888;
      font-weight: 600;
    }
    .btn-logout {
      width: 36px;
      height: 36px;
      border: 1px solid rgba(231,76,60,0.4);
      background: rgba(231,76,60,0.1);
      border-radius: 10px;
      color: #e74c3c;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .btn-logout:hover {
      background: rgba(231,76,60,0.3);
    }
    .header-row2 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
      margin-bottom: 6px;
    }
    .saldo-card {
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 6px 8px;
      text-align: center;
    }
    .saldo-label {
      font-size: 9px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }
    .saldo-value {
      font-family: 'Orbitron', sans-serif;
      font-size: 13px;
      font-weight: 700;
      margin-top: 2px;
    }
    .saldo-koin .saldo-value { color: #FFD700; }
    .saldo-rupiah .saldo-value { color: #2ecc71; }
    .saldo-kristal .saldo-value { color: #3498db; }
    .header-row3 {
      text-align: center;
      font-size: 12px;
      color: #aaa;
      font-weight: 600;
    }
    .header-row3 span { color: #FFD700; }

    /* === TAB ADMIN === */
    .main-tabs {
      display: none;
      gap: 4px;
      padding: 8px 12px;
      background: rgba(0,0,0,0.3);
    }
    .main-tabs.show { display: flex; }
    .main-tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: #888;
      font-family: 'Orbitron', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.3s;
    }
    .main-tab-btn.active {
      background: #FFD700;
      color: #0a0a0a;
    }

    /* === AREA TAP === */
    .tap-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px 16px;
      position: relative;
      user-select: none;
      -webkit-user-select: none;
    }
    .tap-circle {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 35%, #2a2a2a, #111);
      border: 3px solid rgba(255,215,0,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 72px;
      cursor: pointer;
      transition: transform 0.08s, box-shadow 0.2s;
      box-shadow: 0 0 40px rgba(255,215,0,0.1), inset 0 0 30px rgba(0,0,0,0.5);
      position: relative;
      overflow: hidden;
    }
    .tap-circle:active {
      transform: scale(0.92);
      box-shadow: 0 0 60px rgba(255,215,0,0.3);
    }
    .tap-ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,215,0,0.3);
      transform: scale(0);
      animation: ripple 0.6s ease-out;
      pointer-events: none;
    }
    @keyframes ripple {
      to { transform: scale(4); opacity: 0; }
    }
    .float-text {
      position: absolute;
      font-family: 'Orbitron', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: #FFD700;
      pointer-events: none;
      animation: floatUp 0.8s ease-out forwards;
      text-shadow: 0 0 10px rgba(255,215,0,0.6);
    }
    @keyframes floatUp {
      to { transform: translateY(-80px); opacity: 0; }
    }
    .tap-stats {
      margin-top: 16px;
      display: flex;
      gap: 20px;
      font-size: 13px;
      color: #aaa;
    }
    .tap-stats b { color: #FFD700; }

    /* === MENU GRID === */
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      padding: 12px;
    }
    .menu-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 10px 4px;
      background: rgba(26,26,26,0.8);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      color: #ccc;
      font-family: 'Rajdhani', sans-serif;
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
      min-height: 64px;
    }
    .menu-btn:hover {
      background: rgba(255,215,0,0.1);
      border-color: rgba(255,215,0,0.3);
      color: #FFD700;
    }
    .menu-btn .icon { font-size: 20px; }

    /* === MODAL === */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(4px);
      z-index: 1000;
      display: none;
      justify-content: center;
      align-items: flex-end;
      padding: 0;
      animation: fadeIn 0.2s ease-out;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      width: 100%;
      max-width: 480px;
      max-height: 85vh;
      background: #1a1a1a;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      padding: 20px;
      overflow-y: auto;
      position: relative;
      animation: slideUp 0.3s ease-out;
      border: 1px solid rgba(255,215,0,0.15);
      border-bottom: none;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .modal-close {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 32px;
      height: 32px;
      border: none;
      background: rgba(255,255,255,0.05);
      border-radius: 8px;
      color: #888;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-close:hover { background: rgba(231,76,60,0.2); color: #e74c3c; }
    .modal h3 {
      font-family: 'Orbitron', sans-serif;
      font-size: 15px;
      color: #FFD700;
      margin-bottom: 16px;
      text-align: center;
      letter-spacing: 1px;
    }
    .modal-list { display: flex; flex-direction: column; gap: 8px; }
    .modal-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 10px;
      gap: 8px;
    }
    .modal-item-info { flex: 1; min-width: 0; }
    .modal-item-title {
      font-weight: 700;
      font-size: 14px;
      color: #eee;
    }
    .modal-item-sub {
      font-size: 11px;
      color: #888;
      margin-top: 2px;
    }
    .modal-item-sub b { color: #FFD700; }
    .badge-aktif {
      font-size: 10px;
      background: rgba(46,204,113,0.2);
      color: #2ecc71;
      padding: 3px 8px;
      border-radius: 20px;
      font-weight: 700;
      border: 1px solid rgba(46,204,113,0.3);
    }
    .btn-sm {
      padding: 8px 14px;
      border: none;
      border-radius: 8px;
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }
    .btn-yellow { background: #FFD700; color: #0a0a0a; }
    .btn-yellow:hover:not(:disabled) { background: #e6c200; }
    .btn-yellow:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-red { background: #e74c3c; color: #fff; }
    .btn-red:hover:not(:disabled) { background: #c0392b; }
    .btn-green { background: #2ecc71; color: #fff; }
    .btn-green:hover:not(:disabled) { background: #27ae60; }
    .btn-blue { background: #3498db; color: #fff; }
    .btn-blue:hover:not(:disabled) { background: #2980b9; }
    .btn-full { width: 100%; padding: 12px; font-size: 13px; }
    .btn-row { display: flex; gap: 8px; margin-top: 12px; }

    .form-group { margin-bottom: 12px; }
    .form-group label {
      display: block;
      font-size: 11px;
      color: #aaa;
      margin-bottom: 5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 10px 12px;
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      color: #eee;
      font-family: 'Rajdhani', sans-serif;
      font-size: 15px;
      font-weight: 500;
      outline: none;
    }
    .form-group input:focus, .form-group select:focus {
      border-color: #FFD700;
      box-shadow: 0 0 0 2px rgba(255,215,0,0.15);
    }
    .form-group select { cursor: pointer; }
    .form-group select option { background: #1a1a1a; }

    /* === TOAST === */
    .toast-container {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 90%;
      max-width: 380px;
      pointer-events: none;
    }
    .toast {
      padding: 12px 18px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      text-align: center;
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
      animation: toastIn 0.35s ease-out;
      pointer-events: auto;
    }
    .toast.success {
      background: linear-gradient(135deg, #27ae60, #1e8449);
      border: 1px solid rgba(46,204,113,0.4);
    }
    .toast.error {
      background: linear-gradient(135deg, #e74c3c, #c0392b);
      border: 1px solid rgba(231,76,60,0.4);
    }
    @keyframes toastIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .toast.hide { animation: toastOut 0.3s ease-in forwards; }
    @keyframes toastOut { to { opacity: 0; transform: translateY(-20px); } }

    /* === ADMIN PANEL === */
    .admin-panel { display: none; padding: 12px; }
    .admin-panel.show { display: block; }
    .sub-tabs {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 12px;
      scrollbar-width: none;
    }
    .sub-tabs::-webkit-scrollbar { display: none; }
    .sub-tab-btn {
      padding: 7px 12px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      background: transparent;
      color: #888;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .sub-tab-btn.active {
      background: #FFD700;
      color: #0a0a0a;
      border-color: #FFD700;
    }
    .admin-content { display: none; }
    .admin-content.show { display: block; }
    .admin-table {
      width: 100%;
      font-size: 12px;
      border-collapse: collapse;
    }
    .admin-table th {
      text-align: left;
      padding: 6px 8px;
      color: #FFD700;
      font-size: 10px;
      text-transform: uppercase;
      border-bottom: 1px solid rgba(255,215,0,0.2);
    }
    .admin-table td {
      padding: 6px 8px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      color: #ccc;
    }
    .admin-table tr:hover td { background: rgba(255,215,0,0.03); }
    .admin-actions { display: flex; gap: 4px; flex-wrap: wrap; }
    .admin-actions button {
      padding: 4px 8px;
      border: none;
      border-radius: 5px;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
    }
    .admin-log {
      font-family: monospace;
      font-size: 11px;
      color: #aaa;
      background: rgba(0,0,0,0.4);
      padding: 10px;
      border-radius: 8px;
      max-height: 300px;
      overflow-y: auto;
      line-height: 1.6;
    }

    /* === QRIS === */
    .qris-box {
      text-align: center;
      padding: 12px;
      background: rgba(0,0,0,0.3);
      border-radius: 10px;
      margin-bottom: 12px;
    }
    .qris-box img {
      max-width: 200px;
      width: 100%;
      border-radius: 8px;
    }
    .qris-fallback {
      display: none;
      padding: 12px;
      background: rgba(255,215,0,0.05);
      border: 1px dashed rgba(255,215,0,0.3);
      border-radius: 8px;
      font-size: 12px;
      color: #FFD700;
      line-height: 1.6;
    }

    /* === VOUCHER CODE === */
    .voucher-code {
      font-family: 'Orbitron', sans-serif;
      font-size: 22px;
      font-weight: 900;
      color: #FFD700;
      text-align: center;
      padding: 16px;
      background: rgba(255,215,0,0.05);
      border: 2px dashed rgba(255,215,0,0.4);
      border-radius: 12px;
      letter-spacing: 2px;
      margin: 12px 0;
      word-break: break-all;
    }

    /* === RESPONSIF === */
    @media (max-width: 360px) {
      .tap-circle { width: 150px; height: 150px; font-size: 60px; }
      .menu-grid { grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 8px; }
      .menu-btn { font-size: 9px; min-height: 58px; padding: 6px 2px; }
      .menu-btn .icon { font-size: 18px; }
    }
    @media (min-width: 768px) {
      .app { max-width: 480px; border-left: 1px solid rgba(255,215,0,0.05); border-right: 1px solid rgba(255,215,0,0.05); }
    }
  </style>
</head>
<body>
  <!-- Loading Screen -->
  <div class="loading-screen" id="loadingScreen">
    <div class="spinner-lg"></div>
    <p>MEMUAT...</p>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- App -->
  <div class="app" id="app">
    <!-- Header -->
    <div class="header">
      <div class="header-row1">
        <div class="player-info">
          <div class="player-name" id="playerName">-</div>
          <div class="player-level" id="playerLevel">Level 1</div>
        </div>
        <button class="btn-logout" onclick="handleLogout()" title="Logout">⏻</button>
      </div>
      <div class="header-row2">
        <div class="saldo-card saldo-koin">
          <div class="saldo-label">🪙 Koin</div>
          <div class="saldo-value" id="saldoKoin">0</div>
        </div>
        <div class="saldo-card saldo-rupiah">
          <div class="saldo-label">💵 Rupiah</div>
          <div class="saldo-value" id="saldoRupiah">0</div>
        </div>
        <div class="saldo-card saldo-kristal">
          <div class="saldo-label">💎 Kristal</div>
          <div class="saldo-value" id="saldoKristal">0</div>
        </div>
      </div>
      <div class="header-row3">
        Cabang Aktif: <span id="cabangAktif">Cabang #1</span>
      </div>
    </div>

    <!-- Main Tabs (Admin) -->
    <div class="main-tabs" id="mainTabs">
      <button class="main-tab-btn active" onclick="switchMainTab('game')">GAME</button>
      <button class="main-tab-btn" onclick="switchMainTab('admin')">ADMIN</button>
    </div>

    <!-- Game Panel -->
    <div id="gamePanel" style="flex:1; display:flex; flex-direction:column;">
      <!-- Tap Area -->
      <div class="tap-area" id="tapArea">
        <div class="tap-circle" id="tapCircle">🚗</div>
        <div class="tap-stats">
          <span>Tap: <b id="tapCountDisplay">0</b></span>
          <span>Koin/detik: <b id="koinPerDetikDisplay">0</b></span>
        </div>
      </div>

      <!-- Menu Grid -->
      <div class="menu-grid">
        <button class="menu-btn" onclick="openModal('sewaManajer')"><span class="icon">👨‍🔧</span>Sewa Manajer</button>
        <button class="menu-btn" onclick="openModal('upgrade')"><span class="icon">⬆️</span>Upgrade</button>
        <button class="menu-btn" onclick="openModal('bukaCabang')"><span class="icon">🏪</span>Buka Cabang</button>
        <button class="menu-btn" onclick="openModal('pindahCabang')"><span class="icon">🔄</span>Pindah Cabang</button>
        <button class="menu-btn" onclick="openModal('convert')"><span class="icon">💱</span>Convert</button>
        <button class="menu-btn" onclick="openModal('toko')"><span class="icon">🛒</span>Toko</button>
        <button class="menu-btn" onclick="openModal('voucher')"><span class="icon">🎫</span>Voucher</button>
        <button class="menu-btn" onclick="openModal('topup')"><span class="icon">📱</span>Topup</button>
        <button class="menu-btn" onclick="openModal('cerita')"><span class="icon">📖</span>Cerita</button>
        <button class="menu-btn" onclick="openModal('pengaturan')"><span class="icon">⚙️</span>Pengaturan</button>
        <button class="menu-btn" onclick="openModal('bantuan')"><span class="icon">❓</span>Bantuan</button>
        <button class="menu-btn" onclick="handleLogout()"><span class="icon">🚪</span>Logout</button>
      </div>
    </div>

    <!-- Admin Panel -->
    <div class="admin-panel" id="adminPanel">
      <div class="sub-tabs">
        <button class="sub-tab-btn active" onclick="switchSubTab('pemain')">PEMAIN</button>
        <button class="sub-tab-btn" onclick="switchSubTab('topup')">TOPUP</button>
        <button class="sub-tab-btn" onclick="switchSubTab('voucher')">VOUCHER</button>
        <button class="sub-tab-btn" onclick="switchSubTab('toko')">TOKO</button>
        <button class="sub-tab-btn" onclick="switchSubTab('manajer')">MANAJER</button>
        <button class="sub-tab-btn" onclick="switchSubTab('cabang')">CABANG</button>
        <button class="sub-tab-btn" onclick="switchSubTab('cerita')">CERITA</button>
        <button class="sub-tab-btn" onclick="switchSubTab('config')">CONFIG</button>
        <button class="sub-tab-btn" onclick="switchSubTab('hadiah')">HADIAH</button>
        <button class="sub-tab-btn" onclick="switchSubTab('log')">LOG</button>
        <button class="sub-tab-btn" onclick="switchSubTab('export')">EXPORT</button>
      </div>
      <div id="adminContent"></div>
    </div>
  </div>

  <script>
    // =============================================
    // KONFIGURASI
    // =============================================
    const BACKEND_URL = 'https://script.google.com/macros/s/AKfycby_7Mner3wVatE3cji6OTrZuRLR_zfvbBRpU_CAnM51gSa1e5JXTWbvUMg4O0-vt8PY/exec';
    let token = localStorage.getItem('mp7000_token');
    let isAdmin = localStorage.getItem('mp7000_is_admin') === 'true';
    let user = JSON.parse(localStorage.getItem('mp7000_user') || '{}');

    // Game state
    let saldoKoin = 0, saldoRupiah = 0, saldoKristal = 0;
    let koinPerDetik = 0;
    let totalProduksiManajer = 0;
    let koinTambahSinceSync = 0;
    let totalKoinPernah = 0;
    let lastSyncTime = Date.now();
    let tapCount = 0;
    let tapTimestamps = [];
    let cabangAktif = 1;
    let manajerAktif = [];
    let bagianLevel = {};
    let syncInterval = null;
    let produksiInterval = null;

    // =============================================
    // DEVICE ID
    // =============================================
    function getDeviceId() {
      let id = localStorage.getItem('mp7000_device_id');
      if (id) return id;
      const raw = navigator.userAgent + screen.width + screen.height + Intl.DateTimeFormat().resolvedOptions().timeZone + Math.random().toString(36).slice(2, 18);
      let hash = 0;
      for (let i = 0; i < raw.length; i++) {
        const chr = raw.charCodeAt(i);
        hash = ((hash << 5) - hash) + chr;
        hash |= 0;
      }
      const hex = Math.abs(hash).toString(16).padStart(16, '0');
      const rand = Math.random().toString(36).slice(2, 10);
      id = (hex + rand).slice(0, 24);
      localStorage.setItem('mp7000_device_id', id);
      return id;
    }

    // =============================================
    // API CALL
    // =============================================
    async function apiCall(action, data = {}, tok = null) {
      try {
        const res = await fetch(BACKEND_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action, token: tok || token, data })
        });
        const text = await res.text();
        try {
          const json = JSON.parse(text);
          if (!json.ok && json.message && json.message.toLowerCase().includes('sesi habis')) {
            handleSessionExpired();
            return json;
          }
          return json;
        } catch (e) {
          return { ok: false, message: 'Server sedang sibuk, coba lagi' };
        }
      } catch (err) {
        return { ok: false, message: 'Koneksi gagal, coba lagi' };
      }
    }

    function handleSessionExpired() {
      localStorage.removeItem('mp7000_token');
      localStorage.removeItem('mp7000_user');
      localStorage.removeItem('mp7000_is_admin');
      window.location.href = 'index.html';
    }

    // =============================================
    // TOAST & FORMAT
    // =============================================
    function toast(msg, type = 'success') {
      const container = document.getElementById('toastContainer');
      const el = document.createElement('div');
      el.className = 'toast ' + type;
      el.textContent = msg;
      container.appendChild(el);
      setTimeout(() => {
        el.classList.add('hide');
        setTimeout(() => el.remove(), 300);
      }, 3000);
    }
    function formatNumber(n) {
      return new Intl.NumberFormat('id-ID').format(Math.floor(n));
    }
    function formatRupiah(n) {
      return 'Rp ' + new Intl.NumberFormat('id-ID').format(Math.floor(n));
    }

    // =============================================
    // AUDIO SYSTEM
    // =============================================
    const AudioPool = (() => {
      const pools = {};
      const POOL_SIZE = 6;
      function createPool(src) {
        const pool = [];
        for (let i = 0; i < POOL_SIZE; i++) {
          const audio = new Audio(src);
          audio.preload = 'auto';
          audio.volume = 0.5;
          pool.push(audio);
        }
        return pool;
      }
      function getPool(name) {
        if (!pools[name]) {
          pools[name] = createPool('asset/' + name + '.mp3');
        }
        return pools[name];
      }
      let idx = {};
      function play(name) {
        if (!isSfxOn()) return;
        try {
          const pool = getPool(name);
          if (!idx[name]) idx[name] = 0;
          const audio = pool[idx[name] % POOL_SIZE];
          idx[name]++;
          audio.currentTime = 0;
          audio.play().catch(() => {});
        } catch (e) {}
      }
      return { play };
    })();

    let bgmAudio = null;
    let bgmStarted = false;

    function isBgmOn() { return localStorage.getItem('mp7000_bgm') !== 'off'; }
    function isSfxOn() { return localStorage.getItem('mp7000_sfx') !== 'off'; }
    function playBgm() {
      if (!isBgmOn()) return;
      if (!bgmAudio) {
        try {
          bgmAudio = new Audio('asset/bgm.mp3');
          bgmAudio.loop = true;
          bgmAudio.volume = 0.3;
        } catch (e) { return; }
      }
      bgmAudio.play().catch(() => {});
      bgmStarted = true;
    }
    function stopBgm() {
      if (bgmAudio) { bgmAudio.pause(); bgmStarted = false; }
    }
    function playSfx(name) { AudioPool.play(name); }

    document.addEventListener('click', function initAudio() {
      if (!bgmStarted) playBgm();
    }, { once: false });
    document.addEventListener('touchstart', function initAudio() {
      if (!bgmStarted) playBgm();
    }, { once: false });

    // =============================================
    // INISIALISASI
    // =============================================
    async function init() {
      if (!token) {
        window.location.href = 'index.html';
        return;
      }
      const res = await apiCall('getProfile');
      if (!res.ok) {
        if (res.message && res.message.toLowerCase().includes('sesi habis')) {
          handleSessionExpired();
        } else {
          toast(res.message || 'Gagal memuat profil', 'error');
          playSfx('error');
          document.getElementById('loadingScreen').innerHTML =
            '<p style="color:#e74c3c">Gagal memuat. <a href="index.html" style="color:#FFD700">Kembali</a></p>';
        }
        return;
      }
      const p = res.data;
      user = p.user || user;
      localStorage.setItem('mp7000_user', JSON.stringify(user));
      saldoKoin = p.saldo_koin || 0;
      saldoRupiah = p.saldo_rupiah || 0;
      saldoKristal = p.saldo_kristal || 0;
      cabangAktif = p.cabang_aktif || 1;
      manajerAktif = p.manajer || [];
      bagianLevel = p.bagian_level || {};
      totalProduksiManajer = p.produksi_per_detik || 0;
      totalKoinPernah = p.total_koin_pernah || 0;

      // Hitung produksi dari manajer
      hitungProduksi();

      document.getElementById('loadingScreen').style.display = 'none';
      document.getElementById('app').classList.add('show');
      if (isAdmin) {
        document.getElementById('mainTabs').classList.add('show');
      }
      updateUI();
      startLoops();
    }

    function hitungProduksi() {
      totalProduksiManajer = 0;
      manajerAktif.forEach(m => {
        totalProduksiManajer += (m.produksi_per_detik || 0);
      });
      koinPerDetik = totalProduksiManajer;
      document.getElementById('koinPerDetikDisplay').textContent = formatNumber(koinPerDetik);
    }

    function updateUI() {
      document.getElementById('playerName').textContent = user.nama || 'Pemain';
      document.getElementById('playerLevel').textContent = 'Level ' + (user.level || 1);
      document.getElementById('saldoKoin').textContent = formatNumber(saldoKoin);
      document.getElementById('saldoRupiah').textContent = formatNumber(saldoRupiah);
      document.getElementById('saldoKristal').textContent = formatNumber(saldoKristal);
      document.getElementById('cabangAktif').textContent = 'Cabang #' + cabangAktif;
    }

    // =============================================
    // GAME LOOPS
    // =============================================
    function startLoops() {
      if (produksiInterval) clearInterval(produksiInterval);
      produksiInterval = setInterval(() => {
        if (totalProduksiManajer > 0) {
          saldoKoin += totalProduksiManajer;
          koinTambahSinceSync += totalProduksiManajer;
          totalKoinPernah += totalProduksiManajer;
          document.getElementById('saldoKoin').textContent = formatNumber(saldoKoin);
        }
      }, 1000);

      if (syncInterval) clearInterval(syncInterval);
      syncInterval = setInterval(syncProgress, 10000);
      window.addEventListener('beforeunload', syncProgress);
    }

    async function syncProgress() {
      const tambahan = koinTambahSinceSync;
      if (tambahan <= 0 && totalProduksiManajer <= 0) return;
      const res = await apiCall('syncProgress', {
        koin_tambahan: tambahan,
        produksi_per_detik: totalProduksiManajer,
        total_koin_pernah: totalKoinPernah,
        device_id: getDeviceId()
      });
      if (res.ok && res.data) {
        if (res.data.saldo_koin !== undefined) saldoKoin = res.data.saldo_koin;
        if (res.data.saldo_rupiah !== undefined) saldoRupiah = res.data.saldo_rupiah;
        if (res.data.saldo_kristal !== undefined) saldoKristal = res.data.saldo_kristal;
        document.getElementById('saldoKoin').textContent = formatNumber(saldoKoin);
        document.getElementById('saldoRupiah').textContent = formatNumber(saldoRupiah);
        document.getElementById('saldoKristal').textContent = formatNumber(saldoKristal);
      }
      koinTambahSinceSync = 0;
    }

    // =============================================
    // TAP SYSTEM
    // =============================================
    let lastTapSfx = 0;
    let lastTapTime = 0;
    document.getElementById('tapCircle').addEventListener('click', (e) => {
      const now = Date.now();
      // Anti-bot: max 15 tap/detik
      tapTimestamps = tapTimestamps.filter(t => now - t < 1000);
      if (tapTimestamps.length >= 15) {
        toast('Pelan dulu bro', 'error');
        playSfx('error');
        return;
      }
      // Jeda minimal 100ms
      if (now - lastTapTime < 100) return;
      lastTapTime = now;
      tapTimestamps.push(now);

      // Tambah koin
      saldoKoin += 1;
      koinTambahSinceSync += 1;
      totalKoinPernah += 1;
      tapCount++;
      document.getElementById('saldoKoin').textContent = formatNumber(saldoKoin);
      document.getElementById('tapCountDisplay').textContent = formatNumber(tapCount);

      // Ripple effect
      const rect = e.currentTarget.getBoundingClientRect();
      const ripple = document.createElement('div');
      ripple.className = 'tap-ripple';
      const size = Math.max(rect.width, rect.height);
      ripple.style.width = ripple.style.height = size + 'px';
      ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
      ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
      e.currentTarget.appendChild(ripple);
      setTimeout(() => ripple.remove(), 600);

      // Float text
      const float = document.createElement('div');
      float.className = 'float-text';
      float.textContent = '+1';
      float.style.left = (e.clientX - rect.left) + 'px';
      float.style.top = (e.clientY - rect.top - 20) + 'px';
      e.currentTarget.appendChild(float);
      setTimeout(() => float.remove(), 800);

      // SFX throttle 80ms
      if (now - lastTapSfx > 80) {
        playSfx('tap');
        lastTapSfx = now;
      }
    });

    // =============================================
    // MODAL SYSTEM
    // =============================================
    let activeModal = null;

    function openModal(name) {
      closeAllModals();
      activeModal = name;
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.id = 'modal-' + name;
      overlay.innerHTML = getModalContent(name);
      document.body.appendChild(overlay);
      requestAnimationFrame(() => overlay.classList.add('show'));
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) closeModal(name);
      });
      loadModalData(name);
    }

    function closeModal(name) {
      const overlay = document.getElementById('modal-' + name);
      if (overlay) {
        overlay.classList.remove('show');
        setTimeout(() => overlay.remove(), 300);
      }
      activeModal = null;
    }

    function closeAllModals() {
      document.querySelectorAll('.modal-overlay').forEach(el => el.remove());
      activeModal = null;
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && activeModal) closeModal(activeModal);
    });

    function getModalContent(name) {
      const templates = {
        sewaManajer: `<div class="modal"><button class="modal-close" onclick="closeModal('sewaManajer')">✕</button><h3>SEWA MANAJER</h3><div id="sewaManajerContent" class="modal-list"></div></div>`,
        upgrade: `<div class="modal"><button class="modal-close" onclick="closeModal('upgrade')">✕</button><h3>UPGRADE BAGIAN</h3><div id="upgradeContent" class="modal-list"></div></div>`,
        bukaCabang: `<div class="modal"><button class="modal-close" onclick="closeModal('bukaCabang')">✕</button><h3>BUKA CABANG</h3><div id="bukaCabangContent" class="modal-list"></div></div>`,
        pindahCabang: `<div class="modal"><button class="modal-close" onclick="closeModal('pindahCabang')">✕</button><h3>PINDAH CABANG</h3><div id="pindahCabangContent" class="modal-list"></div></div>`,
        convert: `<div class="modal"><button class="modal-close" onclick="closeModal('convert')">✕</button><h3>CONVERT KOIN</h3><div id="convertContent"></div></div>`,
        toko: `<div class="modal"><button class="modal-close" onclick="closeModal('toko')">✕</button><h3>TOKO</h3><div id="tokoContent" class="modal-list"></div></div>`,
        voucher: `<div class="modal"><button class="modal-close" onclick="closeModal('voucher')">✕</button><h3>TUKAR VOUCHER</h3><div id="voucherContent"></div></div>`,
        topup: `<div class="modal"><button class="modal-close" onclick="closeModal('topup')">✕</button><h3>TOPUP</h3><div id="topupContent"></div></div>`,
        cerita: `<div class="modal"><button class="modal-close" onclick="closeModal('cerita')">✕</button><h3>CERITA</h3><div id="ceritaContent" class="modal-list"></div></div>`,
        pengaturan: `<div class="modal"><button class="modal-close" onclick="closeModal('pengaturan')">✕</button><h3>PENGATURAN</h3><div id="pengaturanContent"></div></div>`,
        bantuan: `<div class="modal"><button class="modal-close" onclick="closeModal('bantuan')">✕</button><h3>BANTUAN</h3><div style="font-size:14px;line-height:1.7;color:#ccc"><ol style="padding-left:20px"><li>Tap area mobil untuk dapat koin.</li><li>Sewa manajer untuk produksi otomatis.</li><li>Upgrade bagian untuk meningkatkan produksi.</li><li>Buka cabang baru untuk memperluas bisnis.</li><li>Convert koin ke rupiah, beli item, dan tukar voucher.</li><li>Sinkron otomatis setiap 10 detik.</li></ol></div></div>`
      };
      return templates[name] || '';
    }

    async function loadModalData(name) {
      switch (name) {
        case 'sewaManajer': await loadSewaManajer(); break;
        case 'upgrade': await loadUpgrade(); break;
        case 'bukaCabang': await loadBukaCabang(); break;
        case 'pindahCabang': await loadPindahCabang(); break;
        case 'convert': renderConvert(); break;
        case 'toko': await loadToko(); break;
        case 'voucher': renderVoucher(); break;
        case 'topup': renderTopup(); break;
        case 'cerita': await loadCerita(); break;
        case 'pengaturan': renderPengaturan(); break;
      }
    }

    // =============================================
    // MODAL: SEWA MANAJER
    // =============================================
    const MANAJER_LIST = [
      { bagian: 'Semprot', nama: 'Pak Budi', harga: 500, produksi: 1 },
      { bagian: 'Sabun', nama: 'Bu Siti', harga: 5000, produksi: 5 },
      { bagian: 'Bilas', nama: 'Pak Andi', harga: 50000, produksi: 25 },
      { bagian: 'Kering', nama: 'Bu Rina', harga: 500000, produksi: 100 },
      { bagian: 'Poles', nama: 'Pak Joko', harga: 5000000, produksi: 500 },
      { bagian: 'Kompresor', nama: 'Teknisi Umar', harga: 50000000, produksi: 2500 }
    ];

    async function loadSewaManajer() {
      const el = document.getElementById('sewaManajerContent');
      el.innerHTML = '<p style="text-align:center;color:#888">Memuat...</p>';
      const res = await apiCall('getProfile');
      const aktif = res.ok ? (res.data.manajer || []).map(m => m.bagian) : manajerAktif.map(m => m.bagian);
      el.innerHTML = MANAJER_LIST.map(m => {
        const isAktif = aktif.includes(m.bagian);
        return `<div class="modal-item">
          <div class="modal-item-info">
            <div class="modal-item-title">${m.bagian} — ${m.nama}</div>
            <div class="modal-item-sub">Harga: <b>${formatNumber(m.harga)} koin</b> • Produksi: <b>${m.produksi}/dtk</b></div>
          </div>
          ${isAktif ? '<span class="badge-aktif">AKTIF</span>' : `<button class="btn-sm btn-yellow" onclick="sewaManajer('${m.bagian}')">SEWA</button>`}
        </div>`;
      }).join('');
    }

    async function sewaManajer(bagian) {
      const btn = event.target;
      btn.disabled = true;
      const res = await apiCall('sewaManajer', { bagian });
      btn.disabled = false;
      if (res.ok) {
        playSfx('upgrade');
        toast('Manajer berhasil disewa!', 'success');
        if (res.data) {
          if (res.data.saldo_koin !== undefined) saldoKoin = res.data.saldo_koin;
          if (res.data.manajer) manajerAktif = res.data.manajer;
          hitungProduksi();
          updateUI();
        }
        closeModal('sewaManajer');
        openModal('sewaManajer');
      } else {
        playSfx('error');
        toast(res.message || 'Gagal menyewa', 'error');
      }
    }

    // =============================================
    // MODAL: UPGRADE
    // =============================================
    const BAGIAN_LIST = ['Semprot', 'Sabun', 'Bilas', 'Kering', 'Poles', 'Kompresor'];
    const BAGIAN_DASAR = { Semprot: 1, Sabun: 5, Bilas: 25, Kering: 100, Poles: 500, Kompresor: 2500 };
    const BAGIAN_HARGA_DASAR = { Semprot: 200, Sabun: 2000, Bilas: 20000, Kering: 200000, Poles: 2000000, Kompresor: 20000000 };

    async function loadUpgrade() {
      const el = document.getElementById('upgradeContent');
      el.innerHTML = '<p style="text-align:center;color:#888">Memuat...</p>';
      const res = await apiCall('getProfile');
      const levels = res.ok ? (res.data.bagian_level || {}) : bagianLevel;
      el.innerHTML = BAGIAN_LIST.map(b => {
        const lv = levels[b] || 0;
        const hargaNext = Math.floor(BAGIAN_HARGA_DASAR[b] * Math.pow(2.5, lv));
        const produksi = BAGIAN_DASAR[b] * Math.pow(2, lv);
        return `<div class="modal-item">
          <div class="modal-item-info">
            <div class="modal-item-title">${b}</div>
            <div class="modal-item-sub">Level <b>${lv}</b> • Produksi: <b>${formatNumber(produksi)}/dtk</b><br>Upgrade: <b>${formatNumber(hargaNext)} koin</b></div>
          </div>
          <button class="btn-sm btn-yellow" onclick="upgradeBagian('${b}')">UPGRADE</button>
        </div>`;
      }).join('');
    }

    async function upgradeBagian(bagian) {
      const btn = event.target;
      btn.disabled = true;
      const res = await apiCall('upgradeBagian', { bagian });
      btn.disabled = false;
      if (res.ok) {
        playSfx('upgrade');
        toast('Upgrade berhasil!', 'success');
        if (res.data) {
          if (res.data.saldo_koin !== undefined) saldoKoin = res.data.saldo_koin;
          if (res.data.bagian_level) bagianLevel = res.data.bagian_level;
          hitungProduksi();
          updateUI();
        }
        closeModal('upgrade');
        openModal('upgrade');
      } else {
        playSfx('error');
        toast(res.message || 'Upgrade gagal', 'error');
      }
    }

    // =============================================
    // MODAL: BUKA CABANG
    // =============================================
    async function loadBukaCabang() {
      const el = document.getElementById('bukaCabangContent');
      el.innerHTML = '<p style="text-align:center;color:#888">Memuat...</p>';
      const res = await apiCall('getProfile');
      const cabang = res.ok ? (res.data.cabang || [1]) : [1];
      const nextCabang = Math.max(...cabang) + 1;
      el.innerHTML = cabang.map(c => `
        <div class="modal-item">
          <div class="modal-item-info">
            <div class="modal-item-title">Cabang #${c}</div>

          </div>

        <button class="btn-sm btn-green btn-full" style="margin-top:12px" onclick="bukaCabang(${nextCabang})">BUKA CABANG BARU (#${nextCabang})</button>
      `;

          if (res.data.cabang_aktif) cabangAktif = res.data.cabang_aktif;
          updateUI();

        closeModal('bukaCabang');

      } else {
        playSfx('error');
        toast(res.message || 'Gagal buka cabang', 'error');
      }

      const el = document.getElementById('pindahCabangContent');
      el.innerHTML = '<p style="text-align:center;color:#888">Memuat...</p>';
      const res = await apiCall('getProfile');
      const cabang = res.ok ? (res.data.cabang || [1]) : [1];
      el.innerHTML = cabang.map(c => `
        <div class="modal-item" onclick="pindahCabang(${c})" style="cursor:pointer">

          </div>
          ${c === cabangAktif ? '<span class="badge-aktif">AKTIF</span>' : ''}

      const res = await apiCall('pindahCabang', { nomor_cabang: nomor });

        playSfx('coin');
        toast('Berhasil pindah ke Cabang #' + nomor, 'success');
        cabangAktif = nomor;
        if (res.data && res.data.saldo_koin !== undefined) saldoKoin = res.data.saldo_koin;
        updateUI();
        closeModal('pindahCabang');
      } else {
        playSfx('error');
        toast(res.message || 'Gagal pindah', 'error');
      }
    }

    // =============================================
    // MODAL: CONVERT
    // =============================================
    function renderConvert() {
      const el = document.getElementById('convertContent');
      el.innerHTML = `
        <div class="form-group">
          <label>Jumlah Koin (min 10.000)</label>
          <input type="number" id="convertJumlah" placeholder="10000" min="10000" oninput="updateConvertPreview()">
        </div>
        <div class="form-group">
          <label>Metode Biaya</label>
          <select id="convertMetode" onchange="updateConvertPreview()">
            <option value="potong">Potong 10%</option>

    let compressedBase64 = '';

    function compressImage(input) {
      const file = input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let w = img.width, h = img.height;
          const maxW = 1280;
          if (w > maxW) { h = h * maxW / w; w = maxW; }
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          let quality = 0.8;
          let dataUrl = canvas.toDataURL('image/jpeg', quality);
          while (dataUrl.length > 1.3e6 && quality > 0.3) {
            quality -= 0.1;
            dataUrl = canvas.toDataURL('image/jpeg', quality);
          }
          compressedBase64 = dataUrl;
          document.getElementById('topupPreview').innerHTML =
            `<img src="${dataUrl}" style="max-width:100%;max-height:150px;border-radius:8px;border:1px solid rgba(255,215,0,0.3)">`;
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function ajukanTopup() {
      const jenis = document.getElementById('topupJenis').value;
      const paket = parseInt(document.getElementById('topupPaket').value);
      if (!compressedBase64) {
        playSfx('error');
        toast('Upload bukti pembayaran dulu', 'error');
        return;

      const btn = event.target;
      btn.disabled = true;
      const res = await apiCall('ajukanTopup', {
        jenis, paket, jumlah_bayar: paket, bukti_base64: compressedBase64
      });
      btn.disabled = false;
      if (res.ok) {

        closeModal('topup');

      }
    }

      const res = await apiCall('adminKirimHadiahMassal', { koin, pesan });
      if (res.ok) { playSfx('coin'); toast('Hadiah terkirim', 'success'); }
      else { playSfx('error'); toast(res.message || 'Gagal', 'error'); }
    }

    async function exportCSV() {
      const res = await apiCall('adminExportCSV');
      if (res.ok && res.data.csv) {
        const blob = new Blob([res.data.csv], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'mp7000_export.csv';
        a.click();
        URL.revokeObjectURL(url);
        playSfx('coin');
        toast('Export berhasil', 'success');
      } else {
        playSfx('error');
        toast(res.message || 'Gagal export', 'error');
      }
    }

    // =============================================
    // START
    // =============================================
    init();
  </script>
</body>
</html>
